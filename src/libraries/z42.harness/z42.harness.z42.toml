# z42.harness — 测试 / bench 的**执行器**：加载编好的测试产物、按 TIDX 发现并执行、出报告。
# 只被执行方依赖（z42b 的 test / bench 动词、设备端 test-agent）；写测试的工程依赖 z42.test，不依赖本包。
[project]
name    = "z42.harness"
version = "0.1.0"
kind    = "lib"

[dependencies]
"z42.core" = "0.1.0"   # Std.Runtime.ModuleLoader.Invoke / Platform 能力门
"z42.io"   = "0.1.0"   # Console（pretty 输出）
"z42.test" = "0.1.0"   # TestIO（捕获 bench 输出）/ BenchStats（解析 bench 摘要行）
