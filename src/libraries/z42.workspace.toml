# z42 标准库 workspace
#
# 每个成员的产物和缓存位于 artifacts/build/libraries/<member>/<profile>/。
# xtask build stdlib 先自建当前 z42c，再用显式图的单进程执行方式编译标准库。
# default_members 选择默认目标，并为相互独立的成员提供稳定顺序。
# 成员之间的直接包依赖声明在 [workspace.build.graph]。
#
# 🔴 **本 workspace 只放用户 stdlib（`Std.*`）**。工具链/编译器域的包（`z42c.core` / `z42c.syntax` /
# `z42.package` / `z42.project` / `z42.build` / `z42.scripting`）已挪去 `src/compiler/`
# （relocate-compiler-domain-libs，2026-09-27）——**物理位置就是「这是编译器域」的声明**，
# 普通工程的解析域只有 shipped `libs/`，结构上就看不到它们；要用得在 `[dependencies]` 里显式引用。
# 挪动不改包名/命名空间 ⇒ zpkg 文件名不变 ⇒ 不涉及种子纪律。
[workspace]
members = ["*"]
default_members = [
    "z42.core",
    "z42.collections",
    "z42.encoding",
    "z42.text",
    "z42.io",
    "z42.toml",
    "z42.diagnostics", # core / io
    "z42.threading",
    "z42.uri",
    "z42.regex",
    "z42.cli",
    "z42.json",
    "z42.random",
    "z42.numerics",
    "z42.crypto",
    "z42.compression", # core / io
    "z42.yaml",
    "z42.net",
    "z42.harness",
]

[workspace.build]
# 产物按 build profile 分级：
# 例：artifacts/build/libraries/z42.core/release/dist/z42.core.zpkg
#     artifacts/build/libraries/z42.core/release/cache/<file>.zbc
# package.sh 把 <member>/<profile>/dist/<name>.zpkg 复制到 packages/<pkg>/libs/。
# restructure-build-output-dirs (2026-06-06): three independent dir fields;
# output_dir set explicitly so cache/dist 都派生自同一前缀，且 dist 加上
# 额外的 "dist" 后缀维持旧布局（${output_dir}/dist 是默认 — 故省略
# dist_dir 等同于显式 ${output_dir}/dist）。output_dir 是 workspace-root-relative；
# cache_dir 由 CentralizedBuildLayout 相对 output_dir 解析，故必须用 ${output_dir}
# 模板 —— 重写完整前缀会双重叠加成 .../libraries/artifacts/build/libraries/...。
output_dir = "../../artifacts/build/libraries/${project_name}/${profile}"
cache_dir  = "${output_dir}/cache"

[workspace.build.graph]
"z42.cli" = ["z42.core", "z42.text"]
"z42.collections" = ["z42.core"]
"z42.compression" = ["z42.core", "z42.io"]
"z42.core" = []
"z42.crypto" = ["z42.core", "z42.encoding", "z42.numerics"]
"z42.diagnostics" = ["z42.core", "z42.io"]
"z42.encoding" = ["z42.core"]
"z42.harness" = ["z42.core"]
"z42.io" = ["z42.core", "z42.text", "z42.encoding"]
"z42.json" = ["z42.core", "z42.text", "z42.io"]
"z42.net" = ["z42.core", "z42.text", "z42.io", "z42.encoding", "z42.crypto", "z42.compression", "z42.threading", "z42.random"]
"z42.numerics" = ["z42.core", "z42.random"]
"z42.random" = ["z42.core"]
"z42.regex" = ["z42.core"]
"z42.text" = ["z42.core"]
"z42.threading" = ["z42.core"]
"z42.toml" = ["z42.core", "z42.text", "z42.io"]
"z42.uri" = ["z42.core", "z42.text"]
"z42.yaml" = ["z42.core", "z42.text", "z42.io"]
