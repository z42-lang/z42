# z42 标准库 workspace
#
# 6 个 stdlib 包作为 workspace member 集中编译；产物与 cache 落到
# artifacts/build/libraries/<member>/<profile>/{dist,cache}/，按 build profile 分级。
#
# 使用：
#   cd src/libraries && z42c build --workspace --release
#   产物：artifacts/build/libraries/z42.core/release/dist/z42.core.zpkg
#   cache：artifacts/build/libraries/z42.core/release/cache/<file>.zbc
#
# stdlib 互相依赖（z42.collections → z42.core 等）通过编译器的 libsDirs
# 自动发现：BuildLibsDirs 在 artifacts/build/libraries/ 下搜索每个 member
# 的 dist 子目录，stdlib 编译时各 member 能找到先前编译的产物。
#
# 🔴 成员清单**不再声明**同 workspace 依赖（retire-member-dep-decls）：解析靠上面的 dist 自动发现，
# 声明了只剩冗余——`z42c build --workspace` 与 z42b 会按 WS032 逐条提示删除。于是
# **`default_members` 的声明序就是构建顺序**：某个成员 import 了谁，谁就必须排在它前面；
# 排错了不是静默错序，而是当场「找不到依赖/命名空间」的硬错误。调整依赖结构时同步改这份序。
#   约束（源码可见性之外仅此一条环约束）：z42.random 不得 import z42.crypto——
#   crypto → numerics → random 成环；FromEntropy() 种子留待熵原语就位（random-future-seed-from-entropy-residual）。
# 🔴 **本 workspace 只放用户 stdlib（`Std.*`）**。工具链/编译器域的包（`z42c.core` / `z42c.syntax` /
# `z42.package` / `z42.project` / `z42.build` / `z42.scripting`）已挪去 `src/compiler/`
# （relocate-compiler-domain-libs，2026-09-27）——**物理位置就是「这是编译器域」的声明**，
# 普通工程的解析域只有 shipped `libs/`，结构上就看不到它们；要用得在 `[dependencies]` 里显式引用。
# 挪动不改包名/命名空间 ⇒ zpkg 文件名不变 ⇒ 不涉及种子纪律。
[workspace]
members = ["*"]
default_members = [
    "z42.core",        # ← 一切的地基；Std.Time / Std.Text 的时间与文本基元都在这
    "z42.collections",
    "z42.encoding",
    "z42.text",
    "z42.io",          # core / encoding / text
    "z42.toml",        # core / io
    "z42.diagnostics", # core / io
    "z42.threading",   # core / diagnostics
    "z42.uri",         # core / text
    "z42.regex",       # core
    "z42.cli",         # core / text / io
    "z42.json",        # core / text / io
    "z42.random",      # core
    "z42.numerics",    # core / random
    "z42.crypto",      # core / encoding / numerics
    "z42.compression", # core / io
    "z42.yaml",        # core / io
    "z42.net",         # core / io / encoding / random / crypto / threading / compression
    "z42.harness",     # core / io
]

[workspace.build]
# 产物按 build profile 分级：
# 例：artifacts/build/libraries/z42.core/release/dist/z42.core.zpkg
#     artifacts/build/libraries/z42.core/release/cache/<file>.zbc
# package.sh 把 <member>/<profile>/dist/<name>.zpkg 复制到 packages/<pkg>/libs/。
# restructure-build-output-dirs (2026-06-06): three independent dir fields;
# output_dir set explicitly so cache/dist 都派生自同一前缀，且 dist 加上
# 额外的 "dist" 后缀维持旧布局（${output_dir}/dist 是默认 — 故省略
# dist_dir 等同于显式 ${output_dir}/dist）。output_dir 是 workspace-root-relative；
# cache_dir 由 CentralizedBuildLayout 相对 output_dir 解析，故必须用 ${output_dir}
# 模板 —— 重写完整前缀会双重叠加成 .../libraries/artifacts/build/libraries/...。
output_dir = "../../artifacts/build/libraries/${project_name}/${profile}"
cache_dir  = "${output_dir}/cache"
