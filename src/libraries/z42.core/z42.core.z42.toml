[project]
name    = "z42.core"
version = "0.1.0"
kind    = "lib"

# z42.core is the implicit prelude of every z42 program.
# It is loaded automatically at VM startup — user projects must NOT declare
# it as a dependency. The compiler and VM inject it unconditionally.
[lints]
# 内建行数 lint（style.*，默认关；见 compile-time-extensions.md「内建规则」）。硬限升 error =
# 拦编译；软限不动。豁免走源内抑制：方法级 [Suppress]、文件顶部 #suppress。
"style.fnLinesHard" = "error"

