# z42c.emission —— 代码生成：绑定树 → IR（IrGen / 各 Emitter / 降级合成），以及把「前端 + 代码生成」
# 串成单文件 / 包编译的编排（IrDump / CuCompile）。只处理通过检查的程序：有错误就不进代码生成。
# 分层：z42.package ← z42c.optimization ← z42c.semantics ← z42c.emission ← z42c.pipeline。
[project]
name    = "z42c.emission"
version = "0.1.0"
kind    = "lib"

[lints]
# 内建行数 lint（style.*，默认关；见 compile-time-extensions.md「内建规则」）。硬限升 error =
# 拦编译；软限不动。豁免走源内抑制：方法级 [Suppress]、文件顶部 #suppress。
"style.fnLinesHard" = "error"

