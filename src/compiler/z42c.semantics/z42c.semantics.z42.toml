# z42c.semantics — 镜像 C# z42.Semantics（SymbolCollector / TypeCheck / Bound 节点 / Codegen）。
# B0 骨架：占位类型，依赖 z42c.core + z42c.syntax + z42c.ir（与 C# 一致）。
# 首个硬子系统（0.3.5–0.3.6 dogfood 高发段）。
[project]
name    = "z42c.semantics"
version = "0.1.0"
kind    = "lib"

[dependencies]
"z42c.core"   = "0.1.0"
"z42c.syntax" = "0.1.0"
"z42.ir"      = "0.1.0"   # IR 模型 + zbc/zpkg 格式（converge-z42c-ir-metadata-onto-stdlib：取代 z42c.ir）
"z42.io"      = "0.1.0"   # File —— AnalyzerDriver `--fix` 就地重写源（PR7-wire；z42.io 已经 z42.ir 传递引入）
