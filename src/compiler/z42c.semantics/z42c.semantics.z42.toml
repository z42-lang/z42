# z42c.semantics — 镜像 C# z42.Semantics（SymbolCollector / TypeCheck / Bound 节点 / Codegen）。
# B0 骨架：占位类型，依赖 z42c.core + z42c.syntax + z42c.ir（与 C# 一致）。
# 首个硬子系统（0.3.5–0.3.6 dogfood 高发段）。
[project]
name    = "z42c.semantics"
version = "0.1.0"
kind    = "lib"

[lints]
# 内建行数 lint（style.*，默认关；见 compile-time-extensions.md「内建规则」）。硬限升 error =
# 拦编译；软限不动。豁免走源内抑制：方法级 [Suppress]、文件顶部 #suppress。
"style.fnLinesHard" = "error"

