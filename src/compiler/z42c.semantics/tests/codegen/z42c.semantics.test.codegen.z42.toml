# z42c.semantics codegen 单测（port-z42c-codegen CG-1A）。
[project]
name    = "z42c.semantics.test.codegen"
version = "0.1.0"
kind    = "lib"

[sources]
include = ["**/*.z42"]

[dependencies]
"z42c.semantics" = "0.1.0"
"z42c.syntax"    = "0.1.0"
"z42c.core"      = "0.1.0"
"z42.ir"         = "0.1.0"   # fix-primtype-static-init-order：prim_model_tag_tests 比对 IrType 标签

[build]
# Build output → artifacts mirror (mirror-build-output-per-component, 2026-06-16):
# src/compiler/z42c.semantics/tests/codegen → artifacts/build/compiler/z42c.semantics/tests/codegen (no src pollution).
output_dir = "../../../../../artifacts/build/compiler/z42c.semantics/tests/codegen"
