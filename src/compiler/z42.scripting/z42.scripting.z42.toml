# z42.scripting — REPL 编译+执行层（scripting-charter Form B）。
# sink-repl-compile-facade：编译期 **stdlib-only**——编译走 z42.build 的 `IReplCompiler` 门面
# （实现 Z42cReplCompiler 住 z42c.pipeline，运行期经 ModuleLoader 反射注入，见 ReplCompilerHost）；
# 前端 z42c.core/syntax 已是 stdlib（PR-A）。不再静态依赖 z42c.semantics/z42c.pipeline（编译器后端）
# → apphost 不再静态链编译器，运行期动态加载 z42c.pipeline 组件。
# add-package-roles 批 0：`z42.package` 依赖已断——它此前**只**为 `Script.FormatVersion()` 拼一句
# 版本串（ZbcVersion + ZpkgWriterZ 两个编译期常量）而存在，是本库对编译器域最没有分量的一条依赖。
# `.version` 是 REPL 前端的展示职责，已迁 z42i（interactive_main._formatVersion）。终局是让 VM 自报
# 格式版本（VM 才是「能加载什么」的权威），需新 builtin，见 add-package-roles design 批 0 注。
[project]
name    = "z42.scripting"
version = "0.1.0"
kind    = "lib"

[dependencies]
"z42.build"     = "0.1.0"   # IReplCompiler 门面（编译经此；实现运行期注入）——sink-repl-compile-facade
"z42c.core"     = "0.1.0"   # Z42.Core.Span（前端已 stdlib，PR-A）
"z42c.syntax"   = "0.1.0"   # Lexer / Token / Parser / CompilationUnit（前端已 stdlib，PR-A）

# tests/repl/ 是一个**目录单元**：共用助手 repl_kit.z42（`_step` / 补全探针）+ 每个用例一个文件，必须一起编。
# 默认发现只认 `tests/*.z42`（一文件一单元），目录单元显式配。
[tests]
include = ["tests/*.z42", "tests/repl/**/*.z42"]
