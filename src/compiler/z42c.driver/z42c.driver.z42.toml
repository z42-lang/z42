# z42c.driver — 镜像 C# z42.Driver（CLI 入口；命令路由）。唯一 exe 子包。
# 用户入口 z42c = z42c.driver.zpkg。绝不 fallback 到 dotnet z42c.dll。
# 命令逐子版本解锁：lex/parse（--dump-tokens/--dump-ast，incr 6e-1）已实现；build 待后端。
[project]
name    = "z42c.driver"
version = "0.1.0"
kind    = "exe"
# entry 省略 —— z42c 自动检测唯一 Main()（Z42.Driver.Main）。
pack    = true

[dependencies]
"z42c.syntax"    = "0.1.0"
"z42c.semantics" = "0.1.0"
"z42c.core"      = "0.1.0"
"z42.ir"         = "0.1.0"   # IR 模型 + zbc/zpkg 后端（Writer/Reader/Builder）（converge-z42c-ir-metadata：取代 z42c.ir + z42c.project）
"z42.project"    = "0.1.0"   # 组合式 manifest 模型（converge：取代 z42c.project 自带 model）
"z42.io"         = "0.1.0"
"z42.toml"       = "0.1.0"   # 侧车序列化（TomlValue.Stringify）——add-app-properties
"z42.crypto"     = "0.1.0"   # Blake3 —— indexed 散装 zbc 内容 hash（add-indexed-zpkg-min-patch）
"z42c.pipeline"  = "0.1.0"   # DepScan + CacheStore（converge：CacheStore 迁入 pipeline）；镜像 C# driver→pipeline 边

# apphost-as-config: this binary publishes a native desktop apphost.
#   apphost = true  → gate（无此则 `z42 publish` 不产 apphost）。
#   publish_dir 缺省 = ${output_dir}/publish（经 workspace [workspace.build]
#   继承 → artifacts/build/compiler/z42c.driver/release/publish；仅输出位置，非 gate）。
#   bin/payload（add-package-layout-config）：镜像现状布局；6 个 workspace 兄弟库
#   （见上 [dependencies]）由 publish 自动依赖打包，与本 payload 同目录。
[platform.desktop]
apphost = true
bin     = "bin/z42c"
payload = "programs/z42c/z42c.driver.zpkg"
