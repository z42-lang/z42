# z42c.driver — 镜像 C# z42.Driver（CLI 入口；命令路由）。唯一 exe 子包。
# 用户入口 z42c = z42c.driver.zpkg。绝不 fallback 到 dotnet z42c.dll。
# 命令逐子版本解锁：lex/parse（--dump-tokens/--dump-ast，incr 6e-1）已实现；build 待后端。
[project]
name    = "z42c.driver"
version = "0.1.0"
kind    = "exe"
pack    = true

[lints]
# 内建行数 lint（style.*，默认关；见 compile-time-extensions.md「内建规则」）。硬限升 error =
# 拦编译；软限不动。豁免走源内抑制：方法级 [Suppress]、文件顶部 #suppress。
"style.fnLinesHard" = "error"

[platform.desktop]
apphost = true
bin     = "bin/z42c"
payload = "programs/z42c/z42c.driver.zpkg"
