desc = "[plugins] 的 .zpkg path 条目已删除（deps-plugin-routing 收官）：构建硬错并指路 [dependencies]（同一产物自动分流；指纹覆盖 zpkg 字节的语义活在 deps 侧——见 deps-plugin-zpkg）（见 README）"

# ① 先编出插件产物（条目虽已删除，产物仍构建得出——错误只出在消费方清单层）
[[step]]
args = ["build", "plug/e2e.pgen.z42.toml", "--release"]
exit = 0

# ② 消费方 [plugins] 里写 .zpkg path ⇒ 清单层硬错
[[step]]
args = ["build", "app/e2e.papp.z42.toml", "--release"]
exit = "nonzero"
stderr_contains = [".zpkg path 条目已删除", "[dependencies]"]
