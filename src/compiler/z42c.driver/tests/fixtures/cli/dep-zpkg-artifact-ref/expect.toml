desc = "[dependencies] 的 path 指向已构建的 .zpkg（像 C# 引用 DLL）：不代建、编译期解析得到、随产物进 dist 并能跑；文件不存在 / 包名与 key 不一致 / 指向无 manifest 的目录各自干净地报错（见 README）"
outside_repo = true

# 被引用的产物放进一个不是 libs/ 的 vendor/ 目录
[[step]]
tool = "copy"
from = "{stdlib}/*.zpkg"
to = "libs/"

[[step]]
args = ["build", "vendorsrc/zrefvendor.z42.toml", "--release"]
libs = "libs"
exit = 0

[[step]]
tool = "copy"
from = "vendorsrc/dist/zrefvendor.zpkg"
to = "vendor/"

# ① 引用得到 + 自动复制进 dist + 跑得起来
[[step]]
args = ["build", "app/zrefapp.z42.toml", "--release"]
libs = "libs"
exit = 0
exists = ["app/dist/zrefvendor.zpkg"]

[[step]]
tool = "run"
target = "app/dist/zrefapp.zpkg"
libs = "libs"
exit = 0
stdout_equals = "vendored"

# ② 文件不存在 ⇒ 明确说「不存在」
[[step]]
tool = "copy"
from = "variants/missing-file.z42.toml"
to = "app/zrefapp.z42.toml"

[[step]]
args = ["build", "app/zrefapp.z42.toml", "--release"]
libs = "libs"
exit = "nonzero"
stderr_contains = ["不存在"]

# ③ zpkg 里的包名与清单 key 不一致 ⇒ 拒绝（指错文件最容易犯）
[[step]]
tool = "copy"
from = "variants/name-mismatch.z42.toml"
to = "app/zrefapp.z42.toml"

[[step]]
args = ["build", "app/zrefapp.z42.toml", "--release"]
libs = "libs"
exit = "nonzero"
stderr_contains = ["须一致"]

# ④ 指向没有 manifest 的目录 ⇒ 干净的错误退出、说清缺什么，不得是未捕获异常
[[step]]
tool = "copy"
from = "variants/no-manifest-dir.z42.toml"
to = "app/zrefapp.z42.toml"

[[step]]
args = ["build", "app/zrefapp.z42.toml", "--release"]
libs = "libs"
exit = "nonzero"
output_contains = ["z42.toml"]
output_not_contains = ["uncaught exception"]
