[project]
name    = "e2e.tapp"
version = "0.1.0"
kind    = "exe"

# include 是 **/*.z42 —— igen/igen.z42 会被它匹配到，靠「源集条目显式分区」挡住
#（include 模式自动排除出本工程源发现：模式圈中的文件归插件，不被扫进 app 产物）。
# 这正是 xtask.hooks 的现行形态（`{ include = ["xtask_hooks.z42"] }`，scripts/ 根下）。
[sources]
include = ["**/*.z42"]

[plugins]
"e2e.igen" = { include = ["igen/igen.z42"] }
