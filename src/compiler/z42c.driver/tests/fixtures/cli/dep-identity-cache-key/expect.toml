desc = "依赖注释改动保留产物，函数体改动复用文件 IR 并重新部署，签名删除必须使缓存失效"

[[step]]
args = ["build", "depid.bar.z42.toml", "--release"]
cwd = "bar"
exit = 0

[[step]]
tool = "copy"
from = "variants/foo.comment.z42"
to = "foo/foo.z42"

[[step]]
args = ["build", "depid.bar.z42.toml", "--release"]
cwd = "bar"
exit = 0
stdout_contains = ["no changes"]

[[step]]
tool = "copy"
from = "variants/foo.body.z42"
to = "foo/foo.z42"

[[step]]
args = ["build", "depid.bar.z42.toml", "--release"]
cwd = "bar"
exit = 0
stderr_contains = ["cached: 8/8 files"]
stdout_count = [["no changes; preserved", "0"]]

[[step]]
tool = "run"
target = "bar/dist/depid.bar.zpkg"
exit = 0
stdout_equals = "43"

[[step]]
args = ["build", "depid.bar.z42.toml", "--release"]
cwd = "bar"
exit = 0
stdout_count = [["no changes; preserved", "2"]]

[[step]]
tool = "copy"
from = "foo/dist/depid.foo.zpkg"
to = "bar/dist/depid.bar.zpkg"

[[step]]
args = ["build", "depid.bar.z42.toml", "--release"]
cwd = "bar"
exit = 0
stderr_contains = ["cached: 8/8 files"]
stdout_count = [["no changes; preserved", "1"]]

[[step]]
tool = "run"
target = "bar/dist/depid.bar.zpkg"
exit = 0
stdout_equals = "43"

[[step]]
tool = "copy"
from = "variants/foo.renamed.z42"
to = "foo/foo.z42"

[[step]]
args = ["build", "depid.bar.z42.toml", "--release"]
cwd = "bar"
exit = "nonzero"
