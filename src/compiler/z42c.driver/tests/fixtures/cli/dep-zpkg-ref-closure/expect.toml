desc = "按名 / 产物引用的传递闭包：app 只引用 vendor/ncmid.zpkg，mid 按名依赖的 leaf 也必须随产物进 dist，且产物只能从 dist 解析到 leaf 时照样能跑（见 README）"
outside_repo = true

# leaf 建好后临时放进 libs/（mid 编译期按名解析它）
[[step]]
tool = "copy"
from = "{stdlib}/*.zpkg"
to = "libs/"

[[step]]
args = ["build", "leafsrc/ncleaf.z42.toml", "--release"]
libs = "libs"
exit = 0

[[step]]
tool = "copy"
from = "leafsrc/dist/ncleaf.zpkg"
to = "libs/"

[[step]]
args = ["build", "midsrc/ncmid.z42.toml", "--release"]
libs = "libs"
exit = 0

# 两个都挪进 vendor/（离开 libs/）⇒ 它们是非框架依赖，该随产物走
[[step]]
tool = "copy"
from = "midsrc/dist/ncmid.zpkg"
to = "vendor/"

[[step]]
tool = "copy"
from = "libs/ncleaf.zpkg"
to = "vendor/"

[[step]]
tool = "remove"
paths = ["libs/ncleaf.zpkg"]

# app 只声明 mid —— leaf 是间接依赖，用户不该被要求声明它
[[step]]
args = ["build", "app/ncapp.z42.toml", "--release"]
libs = "libs"
exit = 0
exists = ["app/dist/ncmid.zpkg", "app/dist/ncleaf.zpkg"]

# 对照：产物真能跑（leaf 已不在 libs/，只能从 dist 解析到）
[[step]]
tool = "run"
target = "app/dist/ncapp.zpkg"
libs = "libs"
exit = 0
stdout_equals = "leaf"

# Source path members bring their own vendored dependency domain to deployment.
[[step]]
args = ["build", "source-app/z42.toml", "--release"]
libs = "libs"
exit = 0
exists = ["source-app/dist/nested-vendor.mid.zpkg", "source-app/dist/ncmid.zpkg", "source-app/dist/ncleaf.zpkg"]

[[step]]
tool = "run"
target = "source-app/dist/nested-vendor.app.zpkg"
libs = "libs"
exit = 0
stdout_equals = "leaf"

[[step]]
tool = "remove"
paths = ["source-app/dist/ncmid.zpkg", "source-app/dist/ncleaf.zpkg"]

[[step]]
args = ["build", "source-app/z42.toml", "--release"]
libs = "libs"
exit = 0
stdout_contains = ["no changes; preserved"]
stdout_not_contains = ["wrote ->"]
exists = ["source-app/dist/ncmid.zpkg", "source-app/dist/ncleaf.zpkg"]

# Two source domains cannot put different origins for one name in the same dist.
[[step]]
tool = "copy"
from = "variants/collision.toml"
to = "source-app/z42.toml"

[[step]]
args = ["build", "source-app/z42.toml", "--release"]
libs = "libs"
exit = 1
stderr_contains = ["conflicting runtime sources for ncleaf.zpkg"]

[[step]]
tool = "remove"
paths = ["source-app/dist/ncmid.zpkg", "source-app/dist/ncleaf.zpkg"]

[[step]]
tool = "copy"
from = "variants/root.toml"
to = "source-app/z42.toml"

[[step]]
tool = "copy"
from = "variants/shared.toml"
to = "source-mid/z42.toml"

[[step]]
args = ["build", "source-app/z42.toml", "--release"]
libs = "libs"
exit = 0
absent = ["source-app/dist/ncmid.zpkg", "source-app/dist/ncleaf.zpkg"]
