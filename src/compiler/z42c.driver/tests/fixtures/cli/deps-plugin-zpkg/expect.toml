desc = "deps-plugin-routing：[dependencies] 的 .zpkg path 指向插件产物 ⇒ 读头分流进编译器，generator 产的符号可用；只换产物内容（源没动）消费方必须重编出新值（指纹覆盖 zpkg 字节）（见 README）"

# ① 先编出插件产物
[[step]]
args = ["build", "plug/e2e.pgen.z42.toml", "--release"]
exit = 0

# ② 消费方把**同一个产物**写成普通依赖 ⇒ 分流：加载进编译器，generator 产符号可用、不链入产物
[[step]]
args = ["build", "app/e2e.papp.z42.toml", "--release"]
exit = 0

[[step]]
tool = "run"
target = "app/dist/e2e.papp.zpkg"
exit = 0
stdout_equals = "42"

# ③ 只改 generator 源（42 → 7）重编插件产物；消费方源码不动、引用路径不动 ⇒ 仍必须重编出新值
[[step]]
tool = "copy"
from = "variants/gen.7.z42"
to = "plug/gen.z42"

[[step]]
args = ["build", "plug/e2e.pgen.z42.toml", "--release"]
exit = 0

[[step]]
args = ["build", "app/e2e.papp.z42.toml", "--release"]
exit = 0

[[step]]
tool = "run"
target = "app/dist/e2e.papp.zpkg"
exit = 0
stdout_equals = "7"
