desc = "Indexed workspace dependencies include their loose bytecode, and a rebuild retires unused copies"

[[step]]
args = ["build", "--workspace"]
exit = 0
exists = ["artifacts/biapp/debug/dist/bilib.zpkg", "artifacts/biapp/debug/dist/l.zbc"]

[[step]]
tool = "run"
target = "artifacts/biapp/debug/dist/biapp.zpkg"
exit = 0
stdout_equals = "11"

[[step]]
tool = "copy"
from = "variants/no-dependency.z42"
to = "app/main.z42"

[[step]]
tool = "copy"
from = "artifacts/biapp/debug/dist/l.zbc"
to = "artifacts/biapp/debug/dist/unowned.zbc"

[[step]]
args = ["build", "--workspace"]
exit = 0

[[step]]
tool = "check"
absent = ["artifacts/biapp/debug/dist/bilib.zpkg", "artifacts/biapp/debug/dist/l.zbc"]
exists = ["artifacts/biapp/debug/dist/unowned.zbc"]

[[step]]
tool = "run"
target = "artifacts/biapp/debug/dist/biapp.zpkg"
exit = 0
stdout_equals = "12"
