desc = "path 依赖（mid）自己依赖一个只在 Z42_LIBS 里的包（pdbase）：代建与消费方都用调用方已决议的外部档（Z42_LIBS），不能在代建时另读一份"

# full/ = Z42_LIBS（stdlib + pdbase）
[[step]]
tool = "copy"
from = "{stdlib}/*.zpkg"
to = "full/"

[[step]]
args = ["build", "base/pdbase.z42.toml", "--release"]
libs = "full"
exit = 0

[[step]]
tool = "copy"
from = "base/dist/pdbase.zpkg"
to = "full/"

[[step]]
args = ["build", "top/pdtop.z42.toml", "--release"]
libs = "full"
exit = 0
