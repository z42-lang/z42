desc = "[plugins] 的按名条目已删除（deps-plugin-routing 收官）：清单层硬错、指路 [dependencies]（按名的插件目录解析语义活在 deps 侧——见 deps-plugin-by-name）（见 README）"
outside_repo = true

[[step]]
tool = "copy"
from = "{stdlib}/*.zpkg"
to = "libs/"

[[step]]
args = ["build", "app/e2e.bapp.z42.toml", "--release"]
libs = "libs"
exit = "nonzero"
stderr_contains = ["按名条目已删除", "[dependencies]"]
