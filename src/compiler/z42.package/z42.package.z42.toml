# z42.package — 编译栈基础库：IR 模型 + zbc 单模块字节码格式 + zpkg 包格式后端 + 类型导出/依赖索引。
# converge-z42c-ir-metadata-onto-stdlib：从 z42c.ir + z42c.project(zpkg 后端) 下沉，让 z42c /
# z42b / REPL / 分析工具共享同一份「emit IR → zbc/zpkg 读写」实现（沿用 z42.project 收敛范式）。
# namespace: Z42.IR / Z42.IR.BinaryFormat / Z42.Package（纯 MOVE 保持，调用点零改）。
# CacheStore（增量构建缓存）不在此——构建工具策略，留 z42c.pipeline。
[project]
name    = "z42.package"
version = "0.1.0"
kind    = "lib"
[sources]
include = ["src/**/*.z42"]
