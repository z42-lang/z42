# z42c.analyzers — 编译期 analyzer：契约（Analyzer / DiagRule / DiagSink / SyntaxKind / FixSink）+ 外部 zpkg 加载
# + AST 遍历驱动 + [lints] severity 决策。只读 AST、只产诊断，不依赖语义层（semantics / emission）。
# 写 analyzer 的工程依赖本包（+ z42c.syntax 拿 AST 节点类型）；编译器侧由 z42c.pipeline 的前置线 ④ 调用。
[project]
name    = "z42c.analyzers"
version = "0.1.0"
kind    = "lib"

[dependencies]
"z42c.core"   = "0.1.0"   # Span / Diagnostic / DiagnosticBag
"z42c.syntax" = "0.1.0"   # AST 节点 / CompilationUnit / SuppressionSet
"z42.io"      = "0.1.0"   # File —— `--fix` 就地重写源
