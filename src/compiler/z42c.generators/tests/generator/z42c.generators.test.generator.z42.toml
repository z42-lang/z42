# z42c.generators 引擎集成测试：测试注入 generator 实例 → parse fixture → provisional CollectAll →
# GeneratorDriver（applied / module / 多轮拓扑；Add/Replace/Augment + ordering fixup）→ merged CollectAll →
# TypeChecker.Infer，断言合并结果 + 合并后 typecheck 通过。外部 zpkg 加载端到端在 z42c.pipeline/tests/pkgcompile。
[project]
name    = "z42c.generators.test.generator"
version = "0.1.0"
kind    = "lib"

[sources]
include = ["**/*.z42"]

[dependencies]
"z42c.generators" = "0.1.0"
"z42c.semantics"  = "0.1.0"
"z42c.syntax"     = "0.1.0"
"z42c.core"       = "0.1.0"

[build]
# Build output → artifacts mirror (mirror-build-output-per-component)。
output_dir = "../../../../../artifacts/build/compiler/z42c.generators/${profile}/tests/generator"
