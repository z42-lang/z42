# z42c.generators — 编译期 generator：契约（Generator / ModuleGenerator / GenSink / GenTarget / GenContext）
# + 外部 zpkg 加载 + 多轮引擎（provisional 绑定 → consumes/produces 拓扑分层 → Add/Replace/Augment → union CU）
# + 语言内建的 `[Forward]`。改写的是**源码结构**，在 pipeline 前置线 ③（真绑定之前）运行，产出的 CU 照常
# 走 收集 → 类型检查 → 代码生成 → 优化。依赖语义层：GenTarget / GenContext 暴露解析后的符号。
[project]
name    = "z42c.generators"
version = "0.1.0"
kind    = "lib"

[dependencies]
"z42c.core"      = "0.1.0"   # Span / DiagnosticBag / DiagnosticCodes
"z42c.syntax"    = "0.1.0"   # Parser / CompilationUnit / AST
"z42c.semantics" = "0.1.0"   # SymbolCollector / SymbolTable / Z42ClassType / ImportedSymbols / HandlerRegistry
