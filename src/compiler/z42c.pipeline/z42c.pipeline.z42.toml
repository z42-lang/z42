# z42c.pipeline — 镜像 C# z42.Pipeline（单文件 + 包级编译编排）。
# B0 骨架：占位类型，依赖 z42c.core + syntax + semantics + ir + project（与 C# 一致）。
# 编排上述全部 → 端到端 build（0.3.9 实做）。
[project]
name    = "z42c.pipeline"
version = "0.1.0"
kind    = "lib"

[lints]
# 内建行数 lint（style.*，默认关；见 compile-time-extensions.md「内建规则」）。硬限升 error =
# 拦编译；软限不动。豁免走源内抑制：方法级 [Suppress]、文件顶部 #suppress。
"style.fnLinesHard" = "error"

