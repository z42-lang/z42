# z42c.pipeline using 立门单测（using-csharp-rules PR-2）。
[project]
name    = "z42c.pipeline.test.usinggate"
version = "0.1.0"
kind    = "lib"

[sources]
include = ["**/*.z42"]

[dependencies]
"z42c.emission"  = "0.1.0"   # IrDump / CompiledModuleZ（整包编译取诊断）
"z42c.pipeline"  = "0.1.0"
"z42.package"        = "0.1.0"   # converge-z42c-ir-metadata: IR+zbc+zpkg 后端
"z42c.semantics" = "0.1.0"
"z42c.core"      = "0.1.0"

[build]
# Build output → artifacts mirror (mirror-build-output-per-component):
# src/compiler/z42c.pipeline/tests/usinggate → artifacts/build/compiler/z42c.pipeline/${profile}/tests/usinggate
output_dir = "../../../../../artifacts/build/compiler/z42c.pipeline/${profile}/tests/usinggate"
