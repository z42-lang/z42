# z42c.pipeline BuildSession 单测（add-build-session）：清单驱动的一次包编译。
[project]
name    = "z42c.pipeline.test.buildsession"
version = "0.1.0"
kind    = "lib"

[sources]
include = ["**/*.z42"]

[dependencies]
"z42c.pipeline"  = "0.1.0"
"z42.build"      = "0.1.0"
"z42.project"    = "0.1.0"   # add-build-session：ProjectManifest / ManifestLoader
"z42.package"        = "0.1.0"   # converge-z42c-ir-metadata: IR+zbc+zpkg 后端
"z42c.semantics" = "0.1.0"
"z42c.core"      = "0.1.0"
"z42.io"         = "0.1.0"

[build]
# Build output → artifacts mirror (mirror-build-output-per-component):
# src/compiler/z42c.pipeline/tests/buildsession → artifacts/build/compiler/z42c.pipeline/tests/buildsession
output_dir = "../../../../../artifacts/build/compiler/z42c.pipeline/tests/buildsession"
