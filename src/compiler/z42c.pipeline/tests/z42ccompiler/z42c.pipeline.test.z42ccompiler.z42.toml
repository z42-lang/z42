# z42c.pipeline Z42cCompiler 端到端单测（wire-z42b D2）。
[project]
name    = "z42c.pipeline.test.z42ccompiler"
version = "0.1.0"
kind    = "lib"

[sources]
include = ["**/*.z42"]

[dependencies]
"z42c.pipeline"  = "0.1.0"
"z42.build"      = "0.1.0"
"z42c.project"   = "0.1.0"
"z42c.semantics" = "0.1.0"
"z42c.ir"        = "0.1.0"
"z42c.core"      = "0.1.0"
"z42.io"         = "0.1.0"

[build]
# Build output → artifacts mirror (mirror-build-output-per-component):
# src/compiler/z42c.pipeline/tests/z42ccompiler → artifacts/build/compiler/z42c.pipeline/tests/z42ccompiler
output_dir = "../../../../../artifacts/build/compiler/z42c.pipeline/tests/z42ccompiler"
