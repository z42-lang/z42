# z42c.core — 镜像 C# z42.Core（Span / Diagnostic / DiagnosticBag / LanguageFeatures）。
# B0 骨架：占位类型，无兄弟依赖（与 C# 一致：core 是无依赖叶子）。
[project]
name    = "z42c.core"
version = "0.1.0"
kind    = "lib"

[lints]
# 内建行数 lint（style.*，默认关；见 compile-time-extensions.md「内建规则」）。硬限升 error =
# 拦编译；软限不动。豁免走源内抑制：方法级 [Suppress]、文件顶部 #suppress。
"style.fnLinesHard" = "error"

