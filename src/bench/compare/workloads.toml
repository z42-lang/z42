# Cross-language comparison workloads — the single table `xtask bench compare` reads.
#
# Each [[workload]] names a directory next to this file holding the same algorithm in
# main.z42 / main.py / main.js / main.rb / Main.cs / Main.java. A missing file means that
# runtime has no idiomatic standard facility for the workload (`note` says why).
#
#   category  startup | cpu | calls | strings | collections | json | memory | gc | concurrency
#   metric    time     — whole-process wall time (startup included), median of the runs
#             startup  — same measurement; reported with peak RSS as the headline
#             density  — bytes per unit = (peak RSS(N) − peak RSS(0)) / N, N = args[0]
#   args / checksum              full run: every program must print `RESULT <checksum>`
#   quick_args / quick_checksum  `--quick` smoke run (same verification, seconds total)
#   z42_stw   also run z42 under `--set gc-mode=stw` (memory / GC workloads)
#   unit      density only: what N counts

[[workload]]
name = "hello"
category = "startup"
metric = "startup"
args = []
checksum = "42"
quick_args = []
quick_checksum = "42"

