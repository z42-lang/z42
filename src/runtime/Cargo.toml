[workspace]
members = [".", "crates/z42-abi", "crates/z42-rs", "crates/z42-macros", "crates/z42-compression", "crates/z42-repl", "crates/z42-host"]
# fix-default-members-include-compression (2026-05-29): z42-compression is a
# cdylib loaded via dlopen at z42vm runtime — not a transitive dep of the
# main `z42` crate (only pulled in compile-time via `bundled-compression`
# feature, used on wasm). Without listing it as a default-member, the bare
# `cargo build --manifest-path src/runtime/Cargo.toml` invocations in
# `just build-runtime` and `z42 xtask.zpkg test lib` only built the root
# package; tests that touched Std.Compression hit "unknown builtin
# `__brotli_compress`" because no libz42_compression.{dylib,so,dll} was
# present in the search path. Listing it here makes every default build
# co-produce the cdylib without per-script explicit invocations.
default-members = [".", "crates/z42-compression"]

[workspace.package]
# mirror of versions.toml [project].version — drift enforced by `z42 xtask.zpkg deps check`
version = "0.5.0"

[package]
name = "z42"
version.workspace = true
edition = "2021"
description = "z42 virtual machine — interpreter, JIT, and AOT backends"

[[bin]]
name = "z42vm"
path = "src/main.rs"

[lib]
name = "z42"
path = "src/lib.rs"
# 默认 rlib only —— Rust 内 path 依赖（z42-host crate 引用）。
# C 嵌入用的 cdylib / staticlib 在分发 package 步骤通过额外的 cargo build 命令产出
# （package.sh），避免主 build 流程出现 cdylib/staticlib/rlib 三套 metadata 冲突。
# 来自 redesign-artifact-layout (2026-05-12)

[build-dependencies]
cc = "1"

[dependencies]
# Faster global allocator. z42c self-compile is malloc-bound (~31% in the
# system allocator, profiled): mimalloc cuts z42c compile ~40% and alloc-heavy
# workloads (string-building) ~3×. Optional + default-on so the `mimalloc-alloc`
# feature ships in the desktop z42vm binary, while the wasm/ios/android presets
# (built `--no-default-features`) omit it — mimalloc's C build doesn't belong in
# the wasm sandbox / size-sensitive mobile staticlibs. Wired via
# `#[global_allocator]` in main.rs (binary only; embedded lib uses host alloc).
mimalloc = { version = "0.1", optional = true }
# Heap profiler (script-profiling P0, `xtask profile --heap`). Optional + off by
# default; the `dhat-heap` feature swaps it in as `#[global_allocator]` (mutually
# exclusive with mimalloc) and emits `dhat-heap.json` per run. `xtask profile`
# builds it on demand into a throwaway target-dir — never the shipped binary.
dhat = { version = "0.3", optional = true }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"   # JSON interchange format (legacy .z42ir.json)
toml = "0.8"       # z42.toml project manifest format
bincode = "1"      # compact binary format (.zbc)

# Error handling
anyhow = "1"
thiserror = "1"

# Bitflags (used by metadata::test_index for TestFlags; spec R1)
bitflags = "2"

# Fast non-cryptographic hasher (FxHash) for VM-internal symbol tables.
# z42c self-compile spends ~14% in HashMap symbol resolution (function/type
# name → decl), profiled as SipHash write + memcmp, driven mainly by
# megamorphic VCall IC misses hashing FQ name strings. These tables are
# internal (never hash-flood-adversarial), so a fast non-DoS-resistant hasher
# is safe and ~5–10× cheaper on short-string keys. FxHash also gives a
# deterministic iteration order (std SipHash randomises per-run), which is
# strictly friendlier to the load-order-determinism rule (common-pitfalls §1).
rustc-hash = "2"

# Mutex / RwLock — used for VmCore shared state across threads (add-multithreading-foundation, 2026-05-19).
# parking_lot vs std::sync: ~2-5x faster uncontended; no poisoning (VM contexts don't benefit from poison-on-panic).
parking_lot = "0.12"

# BLAKE3 hash for zbc/zpkg build_id (split-debug-symbols, 1.2/0.3+)
blake3 = "1"

# OS-CSPRNG (Std.Crypto.SecureRandom) — add-csprng-to-crypto (2026-05-26).
# Wraps Linux getrandom(2) / macOS getentropy / Windows BCryptGenRandom.
# wasm32 excluded: getrandom requires `js` feature for wasm32-unknown-unknown
# but we cfg-gate crypto.rs to throw NotSupported there instead.
# (wasm bridge is add-csprng-wasm-bridge follow-up).

# Compression cdylib — add-z42-compression (2026-05-22).
# Optional dep, enabled by the `bundled-compression` feature (wasm-only by
# default; non-wasm targets dlopen the cdylib via native::ext at startup).
z42-compression = { path = "crates/z42-compression", optional = true }

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
# `env-filter` enables Z42_LOG=... directive parsing in main.rs
# (docs/review.md Part 4 D2, 2026-05-25).
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# NOTE: POSIX signal handling crate `signal-hook-registry` is declared
# in the existing `[target.'cfg(unix)'.dependencies]` block below
# (next to `libc`) — single unix-deps section per Cargo.toml.

# Native interop — Tier 1 ABI runtime (spec C2)
#
# 2026-05-12 add-platform-wasm Stage 0: gated behind `native-interop` feature
#   so wasm builds (no dlopen / no libffi support) deselect it cleanly.
# 2026-05-10 vendored-libffi-upgrade: bumped to libffi 5.1 (libffi-sys 4.1)
#   to pick up the fixed bundled libffi 3.4.7 sources. Earlier libffi-sys 2.3
#   shipped a snapshot whose `sysv.S` failed to assemble under new Apple
#   clang (`CFI advance_loc out of range`); 5.1's bundle compiles cleanly on
#   desktop macOS/Linux, aarch64-apple-ios, and aarch64-linux-android. No
#   `system` feature — bundled build keeps the toolchain identical across
#   host and cross-compile targets at the cost of a one-time first build.
libffi     = { version = "5.1", optional = true }
libloading = { version = "0.8", optional = true }
z42-abi    = { path = "crates/z42-abi" }

# JIT backend — Cranelift (optional; enabled via `jit` feature)
cranelift-codegen = { version = "0.115", features = ["unwind"], optional = true }
cranelift-frontend = { version = "0.115", optional = true }
cranelift-jit      = { version = "0.115", optional = true }
cranelift-module   = { version = "0.115", optional = true }
cranelift-native   = { version = "0.115", optional = true }

[features]
# 2026-05-07 add-runtime-feature-flags (P4.1):
# - default = ["jit", "native-interop"] keeps `cargo build` behavior unchanged
# - `jit` enables the Cranelift JIT backend (desktop x64/aarch64 only)
# - `native-interop` enables Tier 1 native-extension ABI (dlopen + libffi).
#   2026-05-12 add-platform-wasm Stage 0 split this out so wasm builds can
#   deselect it (no dlopen / no libffi support inside the wasm sandbox).
# - `aot` is a placeholder for future AOT compilation (M9; no impl yet)
# - `interp-only` is intent-only (no extra deps); used by platform presets
# - platform presets are convenience combos for `--no-default-features --features <preset>`
default              = ["jit", "native-interop", "mimalloc-alloc"]
# mimalloc-alloc: route the z42vm binary's global allocator through mimalloc
# (default-on desktop; omitted by the --no-default-features wasm/ios/android presets).
mimalloc-alloc       = ["dep:mimalloc"]
# dhat-heap: heap-allocation profiling (script-profiling P0). Swaps the global
# allocator to dhat (overrides mimalloc via a cfg gate in main.rs) and writes
# dhat-heap.json per run. Dev/profiling only — never in a release/platform preset.
dhat-heap            = ["dep:dhat"]
# profile-contention: user-lock (Std.Threading.Mutex/RwLock) contention probes
# (script-profiling P1b). Wraps each blocking acquire with a try_lock + timing
# so contended acquires bump `lock_contentions` / `lock_wait_us`. OFF by default
# — the probe code is #[cfg]-compiled out so the default build's lock path stays
# the plain `arc.lock()` (zero cost). `xtask profile` builds a throwaway VM with
# this feature when contention data is requested. No extra deps.
profile-contention   = []
# z42-test-fixtures: build.rs 用 z42vm + z42c 把两个 .z42 测试 fixture 编成 .zbc，
# 并 emit `--cfg z42_have_z42c` / `z42_have_embedding_hello` 供对应 Rust 测试开关。
# 默认 **OFF**：开启它会让 build.rs `rerun-if-changed` 到 z42c.driver.zpkg —— 而那个
# 文件被 `xtask build compiler` 每轮重写，于是下一次 cargo 判定 build script 陈旧、
# 整个 crate graph 全量重编（release 实测 62s/次；CI 的 ci-bootstrap 每 run 踩 7 次）。
# 一个纯测试便利设施不该挂在所有人的构建关键路径上，故改为按需开启：
# `xtask test runtime`（= CI 的 Rust 单测步骤）显式带上它，测试覆盖面不变。
# 详见 build.rs 同名注释。
z42-test-fixtures    = []
jit                  = ["dep:cranelift-codegen", "dep:cranelift-frontend", "dep:cranelift-jit", "dep:cranelift-module", "dep:cranelift-native"]
native-interop       = ["dep:libffi", "dep:libloading"]
aot                  = []
interp-only          = []
# bundled-compression: statically link z42-compression instead of dlopen'ing it.
# Required on wasm (no dlopen); optional everywhere else.
bundled-compression  = ["dep:z42-compression"]
wasm                 = ["interp-only", "bundled-compression"]
# Mobile presets bundle compression too — these platforms either disallow
# dlopen (iOS App Store) or strongly prefer single-binary integration
# (Android JNI side-load convention). The separately-shipped
# libz42_compression.a in SDK packages is left as a belt-and-suspenders
# option for integrators who want manual linking control.
ios                  = ["interp-only", "aot", "native-interop", "bundled-compression"]
android              = ["interp-only", "aot", "native-interop", "bundled-compression"]

# Platform / system info (Std.Platform / Std.OperatingSystem stdlib, 2026-05-14).
# Only needed on unix-like for gethostname / uname; windows uses winapi via direct
# FFI binding (no extra crate); wasm falls through to graceful "" returns.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# getrandom excluded from wasm32: requires the `js` feature for
# wasm32-unknown-unknown; our crypto.rs cfg-gates that path to throw
# NotSupportedException instead (add-csprng-wasm-bridge follow-up).
getrandom = "0.2"
# add-net-socket-options-extended (2026-05-30): cross-platform setsockopt
# for SO_REUSEADDR / SO_KEEPALIVE. Rust networking working group crate;
# only deps libc on Unix; ships Winsock bindings on Windows.
socket2 = { version = "0.5", features = ["all"] }
# add-z42-net-tls (2026-06-03): pure-Rust TLS for Std.Net (HTTPS in
# HttpClient + raw TlsClient). rustls with the `ring` crypto backend
# (no OpenSSL / no aws-lc-rs C-toolchain dependency → identical build
# across host + cross-compile targets, same rationale as bundled libffi).
# webpki-roots bundles the Mozilla CA root set so cert verification works
# with zero host trust-store wiring. tls12 enabled for broad endpoint
# compatibility.
rustls       = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
# REPL line editor: rustyline was extracted into the host-only cdylib
# `crates/z42-repl` (libz42_repl), dlopen'd lazily by `corelib::repl_native`.
# The core z42vm crate no longer links rustyline (or its ~19 transitive crates);
# it keeps only the VM-side builtins + re-entrancy trampolines. wasm/no-native-
# interop builds keep the plain-stdin fallback. (extract-repl-native-cdylib)

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# POSIX signal handling — low-level register API (no monitor thread).
# Used by signal_handler.rs to install async-signal-safe handlers for
# SIGSEGV / SIGABRT / SIGFPE / SIGILL / SIGBUS (add-os-signal-handler
# spec, 2026-05-25). Windows builds skip via `#[cfg(unix)]` gate.
signal-hook-registry = "1.4"

[dev-dependencies]
jsonschema = { version = "0.20", default-features = false }
z42-rs     = { path = "crates/z42-rs" }
# html_reports pulls the whole plotters subtree (SVG/area/line series); CI bench
# jobs read the numeric output, never the HTML — drop it to lighten bench builds.
criterion  = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

# loom: deterministic interleaving model checker for the concurrent-GC handshake.
# Only compiled under `--cfg loom` (RUSTFLAGS='--cfg loom' cargo test --test
# gc_registration_race_loom). Used by investigate-concurrent-gc-stale-mark-race
# phase 3 to reproduce + verify a fix for a race that hardware can't reproduce
# locally (see docs/spec/changes/investigate-concurrent-gc-stale-mark-race).
[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

# Declare the custom `loom` cfg so check-cfg (Rust 1.80+) doesn't warn on the
# `#![cfg(loom)]` model file in normal builds.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

# add-repl-rbrace-floor (2026-08-29): patch rustyline so `edit_insert_text` advances
# the cursor past inserted text. `[patch.crates-io]` only takes effect at the workspace
# root, so it lives here even though the sole rustyline consumer is now the host-only
# `crates/z42-repl` cdylib (the core VM dropped rustyline in extract-repl-native-cdylib).
# The patched behavior is needed by the `Cmd::Replace(WholeLine, ..)` path that the REPL's
# `}` auto-dedent + Backspace-floor use for a variable-width delete+insert on the current
# line; unpatched, the cursor homes to column 0 after the replace (breaking `} else {`).
# One-commit fork of kkawakam/rustyline v14.0.0; also filed upstream — drop this patch once
# it merges. See docs/spec/changes/add-repl-rbrace-floor/design.md Decision 2.
[patch.crates-io]
rustyline = { git = "https://github.com/z42-lang/rustyline", branch = "z42-edit-insert-text-cursor" }

[[bench]]
name = "smoke_bench"
harness = false

[[bench]]
name = "gc_cycle_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# lighten-criterion-ab (2026-09-05)：criterion bench 二进制不跟 release 用 fat LTO。
#
# `[profile.bench]` 默认继承上面的 release 设置，于是每次 `cargo bench` 都要对整个
# z42 crate 做一次 fat-LTO + codegen-units=1 的链接。CI 的 criterion A/B 要**base 和
# pr 各编一次**，实测这一段（最后一个 Compiling → 第一条 Benchmarking）单侧 73s，
# 两侧 146s —— 占 criterion 步骤 531s 的 27%。本机同一棵树实测（改一行 lib.rs 后重链）：
#
#   lto=true  cgu=1  （原设置）      68s
#   lto=true  cgu=16                 60s   ← fat LTO 的链接本身是串行大头，cgu 救不动
#   lto="thin" cgu=16                20s
#   lto=false cgu=16                 10s
#
# 取 thin：保留跨 crate 内联（不像 lto=false 那样彻底放弃），链接成本降到 1/3。
# **这只作用于 bench 二进制，出货的 z42vm 仍走上面的 release profile（fat LTO）。**
# 对判红的影响：A/B 两侧用同一个 profile 编译，比值仍然对称有效；实测同源码下
# thin 与 fat 的绝对值差 1.8~4.9%（三条 GC bench），与跑间漂移同量级。
# 详见 docs/book/src/dev/benchmarking.md「criterion 成本分解」。
[profile.bench]
lto = "thin"
codegen-units = 16
