[workspace]
members = [".", "tests/data/component", "crates/z42-interp", "crates/z42-jit", "crates/z42-zpkg", "crates/z42-abi", "crates/z42-rs", "crates/z42-macros", "crates/z42-compression", "crates/z42-repl", "src/host"]
# fix-default-members-include-compression (2026-05-29): z42-compression is a
# cdylib loaded via dlopen at z42vm runtime — not a transitive dep of the
# main `z42` crate (only pulled in compile-time via `bundled-compression`
# feature, used on wasm). Without listing it as a default-member, the bare
# `cargo build --manifest-path src/runtime/Cargo.toml` invocations in
# `just build-runtime` and `z42 xtask.zpkg test lib` only built the root
# package; tests that touched Std.Compression hit "unknown builtin
# `__brotli_compress`" because no libz42_compression.{dylib,so,dll} was
# present in the search path. Listing it here makes every default build
# co-produce the cdylib without per-script explicit invocations.
default-members = [".", "src/host", "crates/z42-zpkg", "crates/z42-compression"]

[workspace.package]
# mirror of versions.toml [project].version — drift enforced by `xtask check versions`
version = "0.7.0"

[package]
name = "z42-runtime"
version.workspace = true
edition = "2021"
description = "z42 runtime: VM, object, GC, PAL and component contracts"
autobins = false
autotests = false
autoexamples = false
autobenches = false
[lib]
name = "z42_runtime"
path = "src/lib.rs"
crate-type = ["rlib", "dylib"]
test = false
[dependencies]
z42-zpkg = { path = "crates/z42-zpkg" }
anyhow = "1"
rustc-hash = "2"
parking_lot = "0.12"
smallvec = "1"
blake3 = "1"
tracing = "0.1"
mimalloc = { version = "0.1", optional = true }
libloading = { version = "0.9", optional = true }
socket2 = { version = "0.6", features = ["all"], optional = true }
[features]
default = []
jit = []
profile-contention = []
mimalloc-alloc = ["dep:mimalloc"]
native-interop = []
component-loading = ["dep:libloading"]
net = ["dep:socket2"]
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.4"
[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook-registry = "1.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(z42_test_facade)", "cfg(loom)"] }

[build-dependencies]
blake3 = "1"

[patch.crates-io]
rustyline = { git = "https://github.com/z42-lang/rustyline", branch = "z42-edit-insert-text-cursor-v18" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
