[package]
name = "z42-interp"
version.workspace = true
edition = "2021"
[lib]
crate-type = ["rlib", "cdylib"]
test = false
[dependencies]
z42 = { default-features = false, path = "../.." }
anyhow = "1"
smallvec = "1"
rustc-hash = "2"
[features]
# 桌面动态图在 interp 上需要的转发特性聚合（xtask 传 z42-interp/dynamic）。
dynamic = ["shared-core", "jit", "native-interop"]
default = []
shared-core = ["z42/shared-core"]
jit = ["z42/jit"]
native-interop = ["z42/native-interop"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(z42_test_facade)", "cfg(loom)"] }
