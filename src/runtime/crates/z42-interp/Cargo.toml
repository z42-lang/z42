[package]
name = "z42-interp"
version.workspace = true
edition = "2021"
[lib]
crate-type = ["rlib", "cdylib"]
test = false
[dependencies]
z42-runtime-core = { path = "../z42-runtime-core" }
z42-runtime-shared = { path = "../z42-runtime-shared", optional = true }
z42-component-api = { path = "../z42-component-api" }
anyhow = "1"
smallvec = "1"
tracing = "0.1"
parking_lot = "0.12"
rustc-hash = "2"
[features]
default = []
shared-core = ["dep:z42-runtime-shared", "jit"]
jit = ["z42-runtime-core/jit"]
native-interop = ["z42-runtime-core/native-interop"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(z42_test_facade)", "cfg(loom)"] }
