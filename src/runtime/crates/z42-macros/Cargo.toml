[package]
name = "z42-macros"
version.workspace = true
edition = "2024"
description = "z42 proc macros — Z42Type derive, methods attr, module! (skeleton)"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"
proc-macro = true

[dependencies]
proc-macro2  = "1"
quote        = "1"
syn          = { version = "3", features = ["full"] }
convert_case = "0.12"

[dev-dependencies]
trybuild = "1"
