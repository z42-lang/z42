[package]
name = "z42-jit"
version.workspace = true
edition = "2021"
[lib]
crate-type = ["rlib", "cdylib"]
test = false
[dependencies]
z42 = { default-features = false, path = "../.." }
anyhow = "1"
rustc-hash = "2"
[features]
default = ["jit"]
shared-core = ["jit", "z42/shared-core"]
jit = ["z42/jit", "dep:cranelift-codegen", "dep:cranelift-frontend", "dep:cranelift-jit", "dep:cranelift-module", "dep:cranelift-native"]

[target.'cfg(all(any(target_arch = "x86_64", target_arch = "aarch64"), any(target_os = "linux", target_os = "macos", target_os = "windows", target_os = "android", all(target_os = "ios", target_abi = "sim"))))'.dependencies]
cranelift-codegen = { version = "0.135", features = ["unwind"], optional = true }
cranelift-frontend = { version = "0.135", optional = true }
cranelift-jit = { version = "0.135", optional = true }
cranelift-module = { version = "0.135", optional = true }
cranelift-native = { version = "0.135", optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(z42_test_facade)", "cfg(loom)"] }
