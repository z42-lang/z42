[package]
name = "z42-jit"
version.workspace = true
edition = "2021"
[lib]
crate-type = ["rlib", "cdylib"]
[dependencies]
z42 = { default-features = false, path = "../.." }
anyhow = "1"
rustc-hash = "2"
[features]
# 桌面动态图在 jit 上需要的转发特性聚合（xtask 传 z42-jit/dynamic）。
dynamic = ["shared-core"]
default = ["jit"]
shared-core = ["jit", "z42/shared-core"]
jit = ["z42/jit", "dep:cranelift-codegen", "dep:cranelift-frontend", "dep:cranelift-jit", "dep:cranelift-module", "dep:cranelift-native"]

[target.'cfg(all(any(target_arch = "x86_64", target_arch = "aarch64"), any(target_os = "linux", target_os = "macos", target_os = "windows", target_os = "android", all(target_os = "ios", target_abi = "sim"))))'.dependencies]
cranelift-codegen = { version = "0.137", features = ["unwind"], optional = true }
cranelift-frontend = { version = "0.137", optional = true }
cranelift-jit = { version = "0.137", optional = true }
cranelift-module = { version = "0.137", optional = true }
cranelift-native = { version = "0.137", optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(z42_test_facade)", "cfg(loom)"] }

[dev-dependencies]
z42 = { path = "../..", default-features = false, features = ["jit-test-support"] }
z42-test-engines = { path = "../../tests/data/engine-fixtures" }
z42-abi = { path = "../z42-abi" }
z42-rs = { path = "../z42-rs" }
