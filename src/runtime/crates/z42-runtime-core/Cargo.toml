[package]
name = "z42-runtime-core"
version.workspace = true
edition = "2021"
description = "Shared VM, object, GC and platform mechanisms"
[lib]
test = false
[dependencies]
z42-component-api = { path = "../z42-component-api" }
z42-zpkg = { path = "../z42-zpkg" }
anyhow = "1"
rustc-hash = "2"
parking_lot = "0.12"
smallvec = "1"
blake3 = "1"
tracing = "0.1"
mimalloc = { version = "0.1", optional = true }
libloading = { version = "0.9", optional = true }
socket2 = { version = "0.6", features = ["all"], optional = true }
[features]
default = []
jit = []
profile-contention = []
mimalloc-alloc = ["dep:mimalloc"]
native-interop = []
component-loading = ["dep:libloading"]
net = ["dep:socket2"]
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.4"
[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook-registry = "1.4"
