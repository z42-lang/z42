[package]
name = "z42-runtime-host"
version.workspace = true
edition = "2021"
[lib]
crate-type = ["cdylib"]
test = false
[features]
default = []
dynamic-component = ["dep:runtime"]
[dependencies]
runtime = { package = "z42", path = "../..", optional = true, default-features = false, features = ["shared-core", "native-interop", "net", "tls"] }
