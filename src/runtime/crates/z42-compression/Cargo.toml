[package]
name        = "z42-compression"
version     = "0.1.0"
edition     = "2024"
description = "z42 stdlib native extension — compression (gzip / zlib / deflate / zstd). Built as cdylib + rlib. z42vm loads the cdylib via dlopen on desktop; wasm / iOS / Android statically link the rlib via the bundled-compression feature. Pure C ABI surface — no z42-type dependency, so this crate has no cycle with the z42 main crate."
publish     = false

[lib]
# - cdylib:    libz42_compression.{so,dylib,dll} — dlopened by z42vm
# - rlib:      z42 main crate `path =` dep for the bundled-compression feature
#              (wasm / ios / android presets link it into libz42 itself)
# No staticlib: nothing could use one. Desktop z42vm has no static registration
# path (it only dlopens), and the mobile presets already carry compression inside
# libz42.a — a second Rust staticlib next to it would also bring a second copy of
# std (duplicate symbols). It used to be built and shipped anyway (P0-17).
name       = "z42_compression"
path       = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Default = miniz_oxide (pure Rust) — works on every target including wasm;
# non-wasm targets override to zlib-ng below (SIMD-optimised vendored C,
# 2-3× the perf of stock zlib).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
anyhow = "1"
# add-z42-compression-brotli (2026-05-27): pure-Rust brotli (no C deps),
# works on every target including wasm. RFC 7932.
brotli = { version = "9", default-features = false, features = ["std"] }
# add-z42-compression-lz4 (2026-05-27): pure-Rust LZ4 (no C deps),
# works on every target including wasm. Block format LZ4 (the most
# common; frame format is a wrapper).
lz4_flex = { version = "0.14", default-features = false, features = ["std", "frame"] }

# Non-wasm-only deps:
#   * zlib-ng feature: vendored C, needs system clang (works on every
#     non-wasm target through cc-rs)
#   * zstd: libzstd is C; cc-rs can't easily target wasm32-unknown-unknown
#     without WASI SDK / emscripten clang. Excluded on wasm — Std.Compression
#     .Zstd.* entries on wasm return CompressionException("zstd not supported
#     on wasm32 — see Deferred: compression-future-wasm-zstd").
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flate2 = { version = "1", default-features = false, features = ["zlib-ng"] }
zstd   = { version = "0.14", default-features = false }

# Profile lives at workspace root (src/runtime/Cargo.toml) for the whole
# workspace; defining one here is ignored with a warning by cargo.
