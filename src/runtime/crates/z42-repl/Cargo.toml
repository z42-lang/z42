[package]
name        = "z42-repl"
version     = "0.1.0"
edition     = "2024"
description = "Independent REPL script registration, portable input and optional terminal editor; VM-free C ABI."
publish     = false

[lib]
# - cdylib: libz42_repl.{so,dylib,dll} — dlopened by z42vm's __repl_* shims.
# - rlib: lightweight script registration or a statically linked editor.
# The backend feature selects rustyline; portable input does not require it.
name       = "z42_repl"
path       = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["backend"]
backend = ["dep:rustyline"]

[dependencies]
z42-rs = { path = "../z42-rs" }

# The line editor. Lives HERE, not in the z42 main crate — moving it out of the
# core VM is the whole point (dependency isolation). The `}` auto-dedent + Backspace-floor
# need `edit_insert_text` to advance the cursor; a `[patch.crates-io]` fork supplies that
# (declared at the workspace root, src/runtime/Cargo.toml — see add-repl-rbrace-floor).
rustyline = { version = "18", optional = true }

# Profile lives at workspace root (src/runtime/Cargo.toml); one here is ignored.
