# R0：桌面动态组件图（z42vm 同图）专属 rustflags —— 由 xtask 以第二个 --config 叠加
# （基础 .cargo/config.toml 保持无 rustflags，避免泄漏给 apphost / wasm 平台工程与
# 开发者裸 cargo）。target 表命中时整体替换 [build] 段（cargo 语义），故每表带全量。
# 静态图 / 启动器图以 RUSTFLAGS env（prefer-dynamic=no）整体覆盖本文件。
[build]
rustflags = ["-C", "prefer-dynamic", "-C", "rpath"]

[target.'cfg(target_os = "macos")']
rustflags = ["-C", "prefer-dynamic", "-C", "rpath", "-C", "link-arg=-Wl,-rpath,@loader_path"]

[target.'cfg(target_os = "linux")']
rustflags = ["-C", "prefer-dynamic", "-C", "rpath", "-C", "link-arg=-Wl,-rpath,$ORIGIN", "-C", "link-arg=-Wl,-rpath,$ORIGIN/../native"]
