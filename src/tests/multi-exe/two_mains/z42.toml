# unify-run-modes P3: one project, two [[exe]] targets sharing [sources].
# `z42c build` must produce dist/greet.zpkg + dist/farewell.zpkg, each with its
# own baked entry. No local deps (stdlib only). pack=true → packed zpkgs.
[project]
name    = "multiexe.demo"
version = "0.1.0"
pack    = true

[sources]
include = ["*.z42"]

[[exe]]
name  = "greet"
entry = "App.Greet.Main"

[[exe]]
name  = "farewell"
entry = "App.Farewell.Main"

# complete-runtime-settings P5: `z42c build` bakes this profile's runtime knobs into
# dist/<exe>.runtimeconfig.toml; `z42 run` hands it to z42vm via Z42_APP_CONFIG
# (the app-config layer, below the user's Z42_CONFIG). Build knobs (optimize/pack/
# strip/debug) stay compiler-side and are not written to the sidecar.
# so the debug run defaults to interp; exercised by the launcher smoke's
# `z42 run --bin` path.
[profile.debug.runtime]
mode = "interp"
