# unify-run-modes P3: one project, two [[exe]] targets sharing [sources].
# `z42c build` must produce dist/greet.zpkg + dist/farewell.zpkg, each with its
# own baked entry. No local deps (stdlib only). pack=true → packed zpkgs.
[project]
name    = "multiexe.demo"
version = "0.1.0"
pack    = true

[sources]
include = ["*.z42"]

[[exe]]
name  = "greet"
entry = "App.Greet.Main"

[[exe]]
name  = "farewell"
entry = "App.Farewell.Main"

# P2b: `z42 run <dir>` reads this profile's mode → sets Z42_MODE (below --mode CLI)
# so the debug run defaults to interp. z42c ignores [profile.*]; exercised by the
# launcher smoke's `z42 run --bin` path.
[profile.debug]
mode = "interp"
