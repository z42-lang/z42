# z42d — developer toolchain (muxer apphost). Compiled to z42.devtools.zpkg
# (Exe-mode). Single Std.Cli nested router fronting the source-/dev-facing tools
# `fmt` / `doc` / `dbg` / `prof` / `lint`. Mirrors z42b (builder): one exe, one
# router, launcher forwards `z42 fmt` → `z42d fmt`.
#
# Implemented: doc / symbolicate / install. fmt / dbg / prof / lint only
# register their command face and print "planned" until their engines land
# (see README.md). Shipped in the SDK via packages.toml [component.z42d].
[project]
name    = "z42.devtools"
version = "0.1.0"
kind    = "exe"
pack    = true

[lints]
# 内建行数 lint（style.*，默认关；见 compile-time-extensions.md「内建规则」）。硬限升 error =
# 拦编译；软限不动。豁免走源内抑制：方法级 [Suppress]、文件顶部 #suppress。
"style.fnLinesHard" = "error"

[sources]
include = ["devtools_cli.z42", "symbolicate.z42", "editor_install.z42", "doc_cmd.z42"]

[dependencies]
"z42.package"   = { version = "0.1.0", deploy = "shared" }   # SidecarReader (.zsym) + IrLineEntry (add-offline-symbolication)（SDK 库：不复制）
"z42.doc"       = { path = "../../../compiler/z42.doc" }   # `z42d doc` 的索引与查询引擎。编译器 driver 不依赖它（SDK 的 programs/z42c 里没有、driver dist 里也解析不到）⇒ path 依赖由 z42c 代建，并复制进本程序
"z42.project"   = { version = "0.1.0", deploy = "shared" }   # UserCache：文档索引的缓存位置（SDK 库：不复制）

[build]
# 产物落共享 artifacts 树：artifacts/build/toolchain/devtools/{dist,.cache,publish}
# （From this toml's dir src/toolchain/devtools/core up 4 levels to repo root）。
# 只配 output_dir，其余走级联默认 —— 同 builder / launcher（simplify-toolchain-output-dirs）。
output_dir = "../../../../artifacts/build/toolchain/devtools"

[profile.release.runtime]
mode = "interp"
# 🔴 relocate-compiler-domain-libs（2026-09-27）：`Z42.Project` / `Z42.Package` / `Z42.Build` 等
# 编译器域包已不在 shipped `libs/`，改住 `<sdk>/programs/z42c/`。本程序运行期靠这条搜索路径找它们
# —— **不复制**（`deploy = "shared"` 的效果，与 z42b / z42i 同形态）。
# ⚠️ **只能配一条**：`probing-paths` 按**平台分隔符**分隔（unix `:` / windows `;`），跨平台清单里
# 写两条必在一个平台上错（#816 的教训，z42i 那边踩过一次）。
probing-paths = "../z42c"

# apphost-as-config: publishes the z42d desktop apphost to the default
# ${output_dir}/publish (unified toolchain/<comp>/publish layout).
# bin/payload mirrors z42b's SDK package layout (add-package-layout-config).

[platform.desktop]
apphost     = true
bin         = "bin/z42d"
payload     = "programs/z42d/z42.devtools.zpkg"
