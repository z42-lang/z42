# z42d — developer toolchain (muxer apphost). Compiled to z42.devtools.zpkg
# (Exe-mode). Single Std.Cli nested router fronting the source-/dev-facing tools
# `fmt` / `doc` / `dbg` / `prof` / `lint`. Mirrors z42b (builder): one exe, one
# router, launcher forwards `z42 fmt` → `z42d fmt`.
#
# SCOPE (scaffold): command face only. Every subcommand prints "planned" — the
# real engines land per roadmap (fmt 0.2.4→0.4.x, doc 0.4.6, prof 0.4.4,
# lint 0.7.x, dbg/DAP 0.8.x). Registered in packages.toml ([component.z42d],
# 2026-07-01) and shipped in the SDK package as a placeholder binary — each
# subcommand still just prints "planned" until its engine lands. See README.md.
[project]
name    = "z42.devtools"
version = "0.1.0"
kind    = "exe"
entry   = "Z42Devtools.Main"
pack    = true

[sources]
include = ["devtools_cli.z42", "symbolicate.z42", "editor_install.z42"]

[dependencies]
"z42.core" = "0.1.0"   # String / core
"z42.io"   = "0.1.0"   # Console / Environment / File / Directory
"z42.cli"  = "0.1.0"   # Std.Cli nested router + ArgParser
"z42.package"   = "0.1.0"   # SidecarReader (.zsym) + IrLineEntry (add-offline-symbolication)

[build]
# Mirror builder/launcher: emit z42.devtools.zpkg into the shared artifacts tree
# (artifacts/build/toolchain/devtools). From this toml's dir
# (src/toolchain/devtools/core) up 4 levels to repo root.
# cache-dir-layout：显式 output_dir，让 cache（${output_dir}/.cache）与 z42b 中间产物也落进 artifacts，
# 不再按默认值落进源码树。
output_dir = "../../../../artifacts/build/toolchain/devtools"
dist_dir = "../../../../artifacts/build/toolchain/devtools"

[profile.release.runtime]
mode = "interp"
# 🔴 relocate-compiler-domain-libs（2026-09-27）：`Z42.Project` / `Z42.Package` / `Z42.Build` 等
# 编译器域包已不在 shipped `libs/`，改住 `<sdk>/programs/z42c/`。本程序运行期靠这条搜索路径找它们
# —— **不复制**（`deploy = "shared"` 的效果，与 z42b / z42i 同形态）。
# ⚠️ **只能配一条**：`probing-paths` 按**平台分隔符**分隔（unix `:` / windows `;`），跨平台清单里
# 写两条必在一个平台上错（#816 的教训，z42i 那边踩过一次）。开发树不需要第二条：搜索序末项是
# `libs`，而开发树下它指向 alllibs（stdlib + 全部 compiler 成员）。
probing-paths = "../z42c"

# apphost-as-config: publishes the z42d desktop apphost into the shared artifacts
# tree (unified toolchain/<comp>/publish layout, add-build-toolchain 2026-07-05).
# bin/payload mirrors z42b's SDK package layout (add-package-layout-config).

[platform.desktop]
apphost     = true
publish_dir = "../../../../artifacts/build/toolchain/devtools/publish"
bin         = "bin/z42d"
payload     = "programs/z42d/z42.devtools.zpkg"
