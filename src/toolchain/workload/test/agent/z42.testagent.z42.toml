# z42.testagent — the shared on-device test-agent app (add-embedded-app-run).
# Built to an app.zpkg, embedded via z42-host::run_app into every platform's
# test host. One runner (Std.Harness.Runner), all platforms.
[project]
name    = "z42.testagent"
version = "0.1.0"
kind    = "exe"
pack    = true

[sources]
include = ["src/**/*.z42"]
[build]
# cache-dir-layout：显式 output_dir，让 cache（${output_dir}/.cache）与 z42b 中间产物也落进 artifacts，
# 不再按默认值落进源码树。
# From this toml's dir (src/toolchain/workload/test/agent) up 5 levels to repo root；dist = ${output_dir}/dist。
output_dir = "../../../../../artifacts/build/toolchain/workload/test"

[profile.release.runtime]
mode = "interp"   # embedded on-device baseline is interp (mobile/wasm); desktop may override
