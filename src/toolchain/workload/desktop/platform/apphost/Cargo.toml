# Per-app native apphost stub — owned by the desktop workload (apphost-to-workload,
# 2026-06-18). `z42 publish` copies this binary and patches its embedded
# target placeholder with the app's zpkg path. The "locate z42vm + run app zpkg
# directly" logic lives in the `hostrun` module (src/hostrun.rs) — formerly the
# standalone `z42-hostrun` crate, folded in once the launcher (its only other
# consumer) was rewritten in z42 (merge-hostrun-into-apphost). Zero deps: pure std.
[package]
name = "z42-apphost"
version = "0.1.0"
edition = "2021"
publish = false
description = "Per-app native apphost stub — desktop workload publish artifact."

[[bin]]
name = "apphost"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto       = true
strip     = true
