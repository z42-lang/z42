# Android workload — z42 build logic (Gradle project export). Real workload z42
# package; launcher depends on it so `z42 export android` calls
# Z42.Workload.Android.AndroidExport.Generate. (platform-workload-packages, 2026-06-18)
[project]
name    = "z42.workload.android"
version = "0.1.0"
kind    = "lib"

[sources]
# Only the export logic. AndroidWorkload.z42 (future z42.build pipeline handler)
# is parked — imports the not-yet-compiled z42.build — so excluded here.
include = ["export.z42"]

[dependencies]
"z42.core" = "0.1.0"
"z42.io"   = "0.1.0"

[build]
# cache-dir-layout：显式 output_dir，让 cache（${output_dir}/.cache）与 z42b 中间产物也落进 artifacts，
# 不再按默认值落进源码树。
output_dir = "../../../../../artifacts/build/toolchain/workload/android"
# 🔴 **不再往 stdlib flat 里落**（2026-09-28）：原先 `dist_dir` 指着
# `artifacts/intermediate/libraries/flat/release`，理由是「让 launcher 的 z42c build 解析得到」——
# 但那是拿 stdlib flat 当编译期解析的堆放处，代价是**这些 zpkg 会随整目录被打进 SDK 的
# `libs/`**（实测发布包里就有 `z42.workload.android.zpkg` 等四个）。`libs/` 是用户面的
# 标准库表面，workload 不属于那里。
# 编译期改由消费者（launcher）写 **path 依赖**解决 —— 与 relocate-compiler-domain-libs 给
# 编译器域定的同一套办法；运行期由 `ExeDeps` 判「不在 shipped libs ⇒ 私有 ⇒ 拷进 dist」，
# 于是它们随 launcher 落在 `programs/launcher/`。
# dist 因此回落到级联默认值 `${output_dir}/dist`。
