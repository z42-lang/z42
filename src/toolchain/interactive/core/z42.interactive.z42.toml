# z42i — z42 interactive REPL (apphost). Compiled to z42.interactive.zpkg
# (Exe-mode). A single interactive entry (read-eval-print loop), NOT a muxer —
# unlike z42d it has no subcommands. Launcher forwards `z42 repl` (or bare `z42`
# with no args, TBD) → z42i.
#
# SCOPE (scaffold): entry point only — prints "planned" and exits. The real REPL
# (compile-snippet → VM eval → print) is the 0.3.x capstone (see
# docs/design/toolchain/repl.md), blocked on extract-compile-pipeline-api.
# Registered in packages.toml ([component.z42i], 2026-07-01) and shipped
# in the SDK package as a placeholder binary — still just prints "planned" and
# exits until the REPL lands. See README.md.
[project]
name    = "z42.interactive"
version = "0.1.0"
kind    = "exe"
entry   = "Z42Interactive.Main"
pack    = true

[sources]
include = ["interactive_main.z42"]

[dependencies]
"z42.core" = "0.1.0"   # String / core
"z42.io"   = "0.1.0"   # Console / Environment
"z42.scripting" = { version = "0.1.0", deploy = "shared" }   # Script.Eval / Completeness / Completer（REPL eval-core）
"z42.repl" = { path = "../repl" }   # Std.Repl.Repl 行编辑 + ReplEditing 键位（tty 交互）。私有组件 = path 依赖（add-path-dependencies）：z42c 建闭包 + colocate z42.repl.zpkg 进 z42i payload，不入 <sdk>/libs
"z42.threading" = "0.1.0"   # Thread（add-repl-prewarm：启动即 spawn 预热 worker）
"z42.package" = { version = "0.1.0", deploy = "shared" }   # ZbcVersion / ZpkgWriterZ 格式版本常量（`.version` 元指令）——add-package-roles 批 0 自 z42.scripting 迁入
# 编译器域（SDK 库）一律 `deploy = "shared"`：不复制，运行期经下面的 `probing-paths = "../z42c"` 解析（drop-alllibs）。
# 下面四个本工程不直接用，是 `z42.repl`（私有 path 依赖，会被复制进 payload）DEPS 段里的 SDK 库——复制 z42.repl 时
# 其传递依赖按默认规则走，而默认规则会复制 SDK 库（用户 exe 要自包含）；在这里声明 shared 才挡得住（间接依赖无处写
# deploy）。z42.repl 的 SDK 依赖变了，`xtask package sdk` 产物与 nightly 的文件清单对比会把漏网的报出来。
"z42c.syntax" = { version = "0.1.0", deploy = "shared" }
"z42c.core"   = { version = "0.1.0", deploy = "shared" }
"z42.build"   = { version = "0.1.0", deploy = "shared" }
"z42.project" = { version = "0.1.0", deploy = "shared" }

[build]
# 产物落共享 artifacts 树：artifacts/build/toolchain/interactive/{dist,.cache,publish}
# （From this toml's dir src/toolchain/interactive/core up 4 levels to repo root）。
# 只配 output_dir，其余走级联默认 —— 同 builder / launcher（simplify-toolchain-output-dirs）。
output_dir = "../../../../artifacts/build/toolchain/interactive"

[profile.release.runtime]
# add-deployment-model 批 5 use：编译器组件的位置**声明在这里**，不再硬编码进代码。
# `_findCompilerZpkg` 读 `ModuleSearch.Dirs()`（= VM 已解析的搜索序）在其中找 `z42c.pipeline.zpkg`。
#
# 🔴 **只配一条**：`probing-paths` 是**平台分隔符**分隔的（unix `:` / windows `;`），
# 跨平台清单里写多条就必然在一个平台上错。初稿配了两条（SDK 态 + 开发树），
# `package-host(windows-x64)` 当场红在 `no compiler injected` —— 整串被当成一条不存在的路径。
# **这条限制是 #816 自己记下的，我却先踩了一遍。**
#
# 开发树不需要第二条：xtask 运行 z42b 时经 `Z42_PROBING_PATHS` 给出各编译器成员的 dist（`_z42bProc`，
# drop-alllibs 2026-10-01；此前靠 Z42_LIBS 指向 stdlib + 编译器包拷成的 alllibs）。
probing-paths = "../z42c"
mode = "interp"

# apphost-as-config: publishes the z42i desktop apphost to the default
# ${output_dir}/publish (unified toolchain/<comp>/publish layout).
# bin/payload mirrors z42b's SDK package layout (add-package-layout-config).

[platform.desktop]
apphost     = true
bin         = "bin/z42i"
payload     = "programs/z42i/z42.interactive.zpkg"
