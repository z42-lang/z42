# z42.repl — REPL 终端交互层（tier1）。rustyline 行编辑 + 缩进感知键位策略。
# 依赖 z42.scripting（Completeness，判「写完没」/续行缩进）。真 tty + native 行编辑 builtin（平台绑定重、
# 只被 z42.interactive 消费）→ 非跨平台 stdlib 料，留 src/toolchain/，由 xtask_toolchain 普通 build 步以
# Z42_LIBS=stdlib dist（已含搬入 libraries 的 z42.scripting）构建。move-scripting-to-libraries 后 scripting
# 已成 stdlib 成员，本库不再走已删的 `_buildScriptingLib` 合并-libs 特例步。
# 拆自 z42.scripting（split-z42-repl；程序 stdlib-interop-and-repl-split-program 轴 2 PR1）。
[project]
name    = "z42.repl"
version = "0.1.0"
kind    = "lib"

[dependencies]
"z42.core"      = "0.1.0"
"z42.scripting" = "0.1.0"   # Std.Scripting.Completeness（ReplEditing enter 分支整块完整性 + 续行缩进）

# build hook（add-native-dep-config）：本库携带私有 native 行编辑器 cdylib（libz42_repl）。
# ProvideNative 现场用与 VM 同源的裸 cargo 编 crates/z42-repl → 拷进 dist/<rid>/<prefix>z42_repl<suffix>，
# 令 z42.repl 的 dist 自包含（zpkg + native），可被任意项目引用。取代已删的 xtask _pkgStageReplCdylib。
[build]
hooks = "hooks"

# 声明本包携带的私有 native 库 z42_repl。文件名平台派生 <prefix>z42_repl<suffix>
# （<prefix>=DLL_PREFIX：Windows 空、其他 lib；<suffix>=.dylib/.so/.dll）。消费方（z42.interactive）
# publish 时沿 path-dep 闭包读本段、跑本库 ProvideNative、按目标 rid 平铺进 payload。
[native.z42_repl]
