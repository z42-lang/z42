# z42b — reflective [Test]/[Benchmark] host + desktop publish. Compiled to
# z42.builder.zpkg (Exe-mode). xtask spawns it via z42vm to run a compiled
# test/bench artifact (replacing the retired Rust z42-test-runner); the launcher
# forwards `z42 test`/`z42 bench`/`z42 publish` here.
#
# SCOPE: test/bench (builder_test) + desktop publish (builder_publish +
# builder_apphost, move-publish-to-z42b) + build/new/export 编排（wire-z42b 2b：
# builder.z42 / builder_commands.z42 / builder_new.z42 已接入）。
#
# 编译器接入 = **运行时动态注入**（dynamic-component-registration）：z42b 编译期仅依赖
# z42.build 的 ICompiler 接口——**零 z42c 编译器程序依赖**，保持独立 exe（test-runner 角色不破；
# 注意 z42.build 自身已属编译器域、不在 shipped libs/，见下方 [dependencies] 头注）。build 动词运行时经 ModuleLoader.Load
# 加载 programs/z42c/z42c.pipeline.zpkg → 反射实例化 Z42cCompiler → as ICompiler 注入。
# 换/升级编译器 = 替换 zpkg，z42b 零改动（见 builder.z42 _hostCompiler）。
[project]
name    = "z42.builder"
version = "0.1.0"
kind    = "exe"
entry   = "Z42Builder.Main"
pack    = true

[sources]
include = ["builder_cli.z42", "builder_test.z42", "builder_device.z42", "builder_device_ios.z42", "builder_device_android.z42", "builder_publish.z42", "builder_publish_sidecar.z42", "builder_publish_build.z42", "builder_apphost.z42",
           "builder.z42", "builder_commands.z42", "builder_new.z42", "builder_hooks.z42",
           "builder_dev_targets.z42"]

[dependencies]
# z42b 同时是反射 test-runner，故刻意不依赖任何**编译器程序**（z42c.*）；publish 因此内联了
# apphost patcher（builder_apphost.z42）。那个内联曾是为了「不依赖 z42.workload.desktop」，
# 而 2026-09-29 起它成了**唯一一份** —— 那个包只剩这一处副本，已删。
#
# 🔴 **但它不再是「stdlib-only」了**（relocate-compiler-domain-libs，2026-09-27）：`z42.build` /
# `z42.project` 已随整个编译器域挪去 `src/compiler/`，不在 shipped `libs/` 里——它们是 **SDK 库**，按名声明、
# `deploy = "shared"`：编译期由 driver 从编译器目录解析，**不复制**进 z42b 的发布包；发布态运行期靠
# `probing-paths = "../z42c"`（与 z42i 同形态）。此前不写 deploy、靠构建时 Z42_LIBS 是 alllibs 把它们当「框架」
# 才不复制——是否复制取决于构建环境，drop-alllibs（2026-10-01）起改由这里显式声明。
# ⇒ 这段注释原话是「z42.build/z42.project 均为 stdlib → 不破 stdlib-only」，挪动后已不成立。
"z42.core"    = "0.1.0"   # String / core / Platform / Std.Reflection (Activator/Type)
"z42.io"      = "0.1.0"   # Console / File / Directory / Path / Process / Environment
"z42.cli"     = "0.1.0"   # Std.Cli nested router + ArgParser
"z42.test"    = "0.1.0"   # Std.Test.Runner + ModuleLoader + BundleRunner（反射 runner + bundle 执行）
"z42.json"    = "0.1.0"   # JsonValue.Parse — read a test-bundle manifest in `z42b test --rid host`
"z42.toml"    = "0.1.0"   # TomlValue.Parse — read [platform.desktop] in `z42b publish`
"z42.build"   = { version = "0.1.0", deploy = "shared" }   # ICompiler 接口 + Pipeline 八相位（编排；接口经动态注入绑定实现）
"z42.project" = { version = "0.1.0", deploy = "shared" }   # ProjectManifest / ManifestLoader（build/new/export 动词读清单）

[build]
# 产物落共享 artifacts 树：artifacts/build/toolchain/builder/{dist,.cache,publish}
# （From this toml's dir src/toolchain/builder/core up 4 levels to repo root）。
# 只配 output_dir —— dist / cache / publish 都走级联默认（${output_dir}/dist 等），与 launcher 同形。
# simplify-toolchain-output-dirs（2026-09-30）：此前另配 `dist_dir = output_dir`（平铺），
# 让 zpkg 与 .cache/ build/ publish/ 挤在同一层，stage-toolchain 还得专门跳子目录。
output_dir = "../../../../artifacts/build/toolchain/builder"

[profile.release.runtime]
mode = "interp"
# add-deployment-model 批 5 use：编译器组件的位置**声明在这里**，不再硬编码进代码。
# `_findCompilerZpkg` 读 `ModuleSearch.Dirs()`（= VM 已解析的搜索序）在其中找 `z42c.pipeline.zpkg`。
#
# 🔴 **只配一条**：`probing-paths` 是**平台分隔符**分隔的（unix `:` / windows `;`），
# 跨平台清单里写多条就必然在一个平台上错。初稿配了两条（SDK 态 + 开发树），
# `package-host(windows-x64)` 当场红在 `no compiler injected` —— 整串被当成一条不存在的路径。
# **这条限制是 #816 自己记下的，我却先踩了一遍。**
#
# 开发树不需要第二条：xtask 运行 z42b 时经 `Z42_PROBING_PATHS` 给出各编译器成员的 dist（`_z42bProc`，
# drop-alllibs 2026-10-01；此前靠 Z42_LIBS 指向 stdlib + 编译器包拷成的 alllibs）。
probing-paths = "../z42c"

# apphost-as-config: this binary publishes a native desktop apphost.
#   apphost = true  → gate（无此则 `z42 publish` 不产 apphost）。
#   publish_dir 不配：缺省 ${output_dir}/publish（toolchain/<组件>/publish 统一格式）。
#   bin/payload（add-package-layout-config）：镜像现状布局。

[platform.desktop]
apphost     = true
bin         = "bin/z42b"
payload     = "programs/z42b/z42.builder.zpkg"
