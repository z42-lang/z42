# z42b — reflective [Test]/[Benchmark] host + desktop publish. Compiled to
# z42.builder.zpkg (Exe-mode). xtask spawns it via z42vm to run a compiled
# test/bench artifact (replacing the retired Rust z42-test-runner); the launcher
# forwards `z42 test`/`z42 bench`/`z42 publish` here.
#
# SCOPE: test/bench (builder_test) + desktop publish (builder_publish +
# builder_apphost, move-publish-to-z42b) + build/new/export 编排（wire-z42b 2b：
# builder.z42 / builder_commands.z42 / builder_new.z42 已接入）。
#
# 编译器接入 = **运行时动态注入**（dynamic-component-registration）：z42b 编译期仅依赖
# z42.build 的 ICompiler 接口（stdlib）——**零 z42c 编译期依赖**，保持独立 exe +
# stdlib-only 可构建（test-runner 角色不破）。build 动词运行时经 ModuleLoader.Load
# 加载 programs/z42c/z42c.pipeline.zpkg → 反射实例化 Z42cCompiler → as ICompiler 注入。
# 换/升级编译器 = 替换 zpkg，z42b 零改动（见 builder.z42 _hostCompiler）。
[project]
name    = "z42.builder"
version = "0.1.0"
kind    = "exe"
entry   = "Z42Builder.Main"
pack    = true

[sources]
include = ["builder_cli.z42", "builder_test.z42", "builder_device.z42", "builder_device_ios.z42", "builder_device_android.z42", "builder_publish.z42", "builder_publish_sidecar.z42", "builder_publish_build.z42", "builder_apphost.z42",
           "builder.z42", "builder_commands.z42", "builder_new.z42", "builder_hooks.z42"]

[dependencies]
# stdlib-only — z42b doubles as the reflective test-runner, which the `stdlib [Test]`
# build stage compiles with ONLY stdlib in Z42_LIBS. publish therefore inlines its
# apphost patcher (builder_apphost.z42) rather than depending on z42.workload.desktop.
# z42.build/z42.project 均为 stdlib（wire-z42b 阶段 1 / converge 已注册）→ 不破 stdlib-only。
"z42.core"    = "0.1.0"   # String / core / Platform / Std.Reflection (Activator/Type)
"z42.io"      = "0.1.0"   # Console / File / Directory / Path / Process / Environment
"z42.cli"     = "0.1.0"   # Std.Cli nested router + ArgParser
"z42.test"    = "0.1.0"   # Std.Test.Runner + ModuleLoader + BundleRunner（反射 runner + bundle 执行）
"z42.json"    = "0.1.0"   # JsonValue.Parse — read a test-bundle manifest in `z42b test --rid host`
"z42.toml"    = "0.1.0"   # TomlValue.Parse — read [platform.desktop] in `z42b publish`
"z42.build"   = "0.1.0"   # ICompiler 接口 + Pipeline 八相位（编排；接口经动态注入绑定实现）
"z42.project" = "0.1.0"   # ProjectManifest / ManifestLoader（build/new/export 动词读清单）

[build]
# Mirror launcher: emit z42.builder.zpkg into the shared artifacts tree
# (artifacts/build/toolchain/builder), parallel to src/toolchain/builder.
# From this toml's dir (src/toolchain/builder/core) up 4 levels to repo root.
dist_dir = "../../../../artifacts/build/toolchain/builder"

[profile.release.runtime]
mode = "interp"

# apphost-as-config: this binary publishes a native desktop apphost.
#   apphost = true  → gate（无此则 `z42 publish` 不产 apphost）。
#   publish_dir 落共享 artifacts 树（toolchain/<组件>/publish 统一格式，
#   add-build-toolchain 2026-07-05）。缺省即 ${output_dir}/publish。
#   bin/payload（add-package-layout-config）：镜像现状布局。

[platform.desktop]
apphost     = true
publish_dir = "../../../../artifacts/build/toolchain/builder/publish"
bin         = "bin/z42b"
payload     = "programs/z42b/z42.builder.zpkg"
