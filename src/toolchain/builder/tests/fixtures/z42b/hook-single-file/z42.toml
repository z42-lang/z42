# deps-plugin-routing 收官：`[plugins]` 的源码 path 形态（指单个 .z42 / 无清单目录）已删除。
# 本夹具钉删除后的行为：z42b 侧 hook 解析直接硬错并指路源集条目（include，对齐 [tests]）。
# 免写清单的 hook 形态活在源集条目上（正路径见 hook-include）。
[project]
name    = "hs.app"
version = "0.1.0"
kind    = "exe"

[sources]
include = ["src/**/*.z42"]

[plugins]
"hs.a" = { path = "hooka.z42" }
