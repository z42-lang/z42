# unify-plugin-packages 1b：hook 经 [plugins] 插件工程注入（旧 `[build] hooks` 目录写法已删除）。
# 由 `xtask test toolchain` 的 _smokeBuildHooksMode 驱动：hook 打出收到的 Target.Mode，断言
# publish / publish --self-contained 各传对值。
[project]
name    = "bh.app"
version = "0.1.0"
kind    = "exe"

[sources]
include = ["src/**/*.z42"]

[plugins]
"bh.hooks" = { path = "hooks" }

# `_smokeBuildHooksMode` 要跑普通 `z42b publish`（断言 hook 收到 Mode = publish）：没有这一节，publish 在调 hook
# 之前就以「not configured to publish a desktop apphost」退出。stub 由测试经 Z42_APPHOST_TEMPLATE 给一个假的，
# 部署成败与该格无关。
[platform.desktop]
apphost = true
