# unify-plugin-packages：`[plugins]` 里带 hook 能力位的插件工程（path 条目）→ z42b 反射出 BuildHooks 具体类、
# 按声明序组合执行。两个插件各打一行标记；_smokeHookPlugin 断言两行都在且 A 在 B 前（声明序）。
[project]
name    = "hp.app"
version = "0.1.0"
kind    = "exe"

[sources]
include = ["src/**/*.z42"]

[dependencies]
# deps-plugin-routing：独立分发的 hook 插件按普通依赖声明——z42b 读 zpkg 头分流加载 BuildHooks。
"hp.a" = { path = "pluga/dist/hp.a.zpkg" }
"hp.b" = { path = "plugb/dist/hp.b.zpkg" }
