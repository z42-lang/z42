[project]
name = "mexeapp"
version = "0.1.0"
pack = true
[sources]
include = ["*.z42"]
[dependencies]
"z42.core" = "0.1.0"
"z42.io" = "0.1.0"
[build]
dist_dir = "dist"
[platform.desktop]
apphost = true
publish_dir = "."
[[exe]]
name = "aexe"
entry = "App.A.Main"
[[exe]]
name = "bexe"
entry = "App.B.Main"
