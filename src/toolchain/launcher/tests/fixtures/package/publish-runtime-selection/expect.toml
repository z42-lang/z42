desc = "publish preserves CLI/Host private runtime selection in shared dist, validates stale bytes and retains manual no-build inputs"
tags = ["launcher"]

[[step]]
tool="z42c"
args=["build","{case}/leaf/z42.toml","--release"]
exit=0

[[step]]
tool="z42c"
args=["build","{case}/private/z42.toml","--release"]
exit=0

[[step]]
tool="z42c"
args=["build","{case}/shared/z42.toml","--release"]
exit=0

[[step]]
tool="z42b"
args=["build","{case}/host/z42.toml","--release"]
exit=0

[[step]]
tool="z42c"
args=["build","{case}/shared/z42.toml","--release"]
exit=0

[[step]]
args=["publish","{case}/shared/z42.toml","--no-build"]
env={Z42_APPHOST_TEMPLATE="{apphost_template}"}
exit=0

[[step]]
tool="check"
absent=["shared/published/programs/selection.leaf.zpkg"]
exists=["dist/selection.leaf.zpkg"]

[[step]]
tool="exec"
target="shared/published/bin/run{exe}"
env={Z42_HOME="{sdk}",Z42_PROBING_PATHS="{case}/vendor"}
exit=0
stdout_equals="42"

[[step]]
args=["publish","{case}/host/z42.toml","--no-build"]
env={Z42_APPHOST_TEMPLATE="{apphost_template}"}
exit=0

[[step]]
tool="check"
absent=["host/published/programs/selection.leaf.zpkg"]
exists=["dist/selection.leaf.zpkg"]

[[step]]
tool="exec"
target="host/published/bin/run{exe}"
env={Z42_HOME="{sdk}",Z42_PROBING_PATHS="{case}/vendor"}
exit=0
stdout_equals="42"

[[step]]
args=["publish","{case}/private/z42.toml","--no-build"]
env={Z42_APPHOST_TEMPLATE="{apphost_template}"}
exit=0

[[step]]
tool="exec"
target="private/published/bin/run{exe}"
env={Z42_HOME="{sdk}"}
exit=0
stdout_equals="42"

[[step]]
tool="copy"
from="private/published/programs/app.zpkg"
to="saved.zpkg"

[[step]]
tool="copy"
from="invalid.txt"
to="dist/selection.leaf.zpkg"

[[step]]
args=["publish","{case}/private/z42.toml","--no-build"]
env={Z42_APPHOST_TEMPLATE="{apphost_template}"}
exit=1
stderr_contains=["stale runtime deployment record"]

[[step]]
tool="check"
same_bytes=[["saved.zpkg","private/published/programs/app.zpkg"]]

[[step]]
tool="copy"
from="vendor/selection.leaf.zpkg"
to="dist/selection.leaf.zpkg"

[[step]]
args=["publish","{case}/private/z42.toml","--no-build"]
env={Z42_APPHOST_TEMPLATE="{apphost_template}"}
exit=0

[[step]]
tool="copy"
from="dist/selection.private.zpkg"
to="manual-dist/selection.private.zpkg"

[[step]]
tool="copy"
from="vendor/selection.leaf.zpkg"
to="manual-dist/selection.leaf.zpkg"

[[step]]
args=["publish","{case}/manual/z42.toml","--no-build"]
env={Z42_APPHOST_TEMPLATE="{apphost_template}"}
exit=0

[[step]]
tool="exec"
target="manual/published/bin/run{exe}"
env={Z42_HOME="{sdk}"}
exit=0
stdout_equals="42"
