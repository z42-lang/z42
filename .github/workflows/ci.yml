name: CI

on:
  # 只改 `.claude/**` 不触发 CI。纯文档改动照样触发（要跑死链门禁），走 docs-only 快速通道（见 detect-changes）。
  pull_request:
    branches: [main]
    paths-ignore:
      - '.claude/**'
  push:
    branches: [main]
    paths-ignore:
      - '.claude/**'
  # 手动全量运行 / 重发 nightly（格式 bump 后旧 nightly 让下载自举的门暂时红时用）：gh workflow run CI --ref main。
  # 救不了 nightly 本身损坏（publish 的 needs 全靠 nightly 自举）——那靠 ci-bootstrap 的种子回退链（ci.md §3.1）。
  workflow_dispatch:
  # 每日全量：补上 push 时被路径过滤跳过的 job，并跑只在这里跑的 Tier-2 平台测试。16:00 UTC = 00:00 UTC+8。
  schedule:
    - cron: '0 16 * * *'

# 同一 ref、同一事件里新的运行取消旧的；事件名进 group，schedule 与 push 不互相取消。
# main 的 push 每个 commit 单独一组（不自动取消），改由 detect-changes 的 main-supersede.sh 只取消
# 不影响 SDK 的旧运行——否则连续合并时 nightly 一个也发不出来（ci.md §2「main 上的运行不互相打断」）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

jobs:
  # 按改动路径给重 job 开关；schedule / dispatch 下各 filter 恒 false，相应 job 的 if: 另有放行。
  changes:
    name: detect-changes
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      actions: write        # main-supersede：取消被替换的 main push 运行
      contents: read
      pull-requests: read   # Docs-only PR?：读 PR 文件列表
    outputs:
      platform: ${{ steps.filter.outputs.platform }}
      examples: ${{ steps.filter.outputs.examples }}
      compiler: ${{ steps.filter.outputs.compiler }}
      vm: ${{ steps.filter.outputs.vm }}
      stdlib: ${{ steps.filter.outputs.stdlib }}
      docs_only: ${{ steps.docsonly.outputs.docs_only }}
      # 当前 nightly → 本 commit 的累计改动是否影响 SDK；只在 push to main 上判，其余事件为空（= 照常发布）。
      sdk: ${{ steps.supersede.outputs.sdk }}
    steps:
      - uses: actions/checkout@v7

      # main 上的运行不互相打断（见顶部 concurrency 注释）：取消较早的、不影响 SDK 的 main push 运行，
      # 并判出本运行是否需要发布 nightly。
      - name: Supersede older main runs
        id: supersede
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # 这一步出错不该拖垮 main：失败时 sdk 输出为空 ⇒ publish-nightly 照常（安全的默认），只是没取消旧运行。
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/ci/main-supersede.sh supersede
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            platform:
              - 'src/runtime/**'
              - 'src/toolchain/workload/**'
              # 打包管道自身、它的注册表 / CLI 面、消费包的 e2e，以及只在 package sdk 里被编译的工具链组件
              # （launcher / devtools / interactive）——不在这里就等于没有任何 PR job 编过它们。
              - 'scripts/package/**'
              - 'scripts/packages.toml'
              - 'scripts/cli/xtask_cli_package.z42'
              # 安装脚本：package-host 用刚打出的包离线跑一遍（Installer smoke）。
              - 'scripts/install/**'
              - 'src/toolchain/launcher/**'
              - 'src/toolchain/devtools/**'
              - 'src/toolchain/interactive/**'
              # z42b 的 publish（apphost / iOS / Android 导出）只在 package-* 里被执行。
              - 'src/toolchain/builder/**'
              - 'scripts/test/xtask_test_dist.z42'
              - 'scripts/common/xtask_fixture_harness.z42'
              - 'scripts/test/xtask_test_platform.z42'
              - 'scripts/test/xtask_test_wasm.z42'
              - 'scripts/test/xtask_test_ios.z42'
              - 'scripts/test/xtask_test_android.z42'
              - 'scripts/test/xtask_test_desktop.z42'
              - 'scripts/test/xtask_test_embedded.z42'
              - 'scripts/versions.toml'
              - '.github/workflows/ci.yml'
            # 学习手册示例：只有 package-host 用打包出的 SDK（含 Windows）重放。单独成 flag：并进 platform 会让改一页
            # learn 就拉起 package-{ios,android,wasm} + test-desktop。
            examples:
              - 'examples/**'
              - 'docs/learn/**'
              - '.github/workflows/ci.yml'
            # compiler-checks（自举不动点 + vscode 语法）。编译器域全在 src/compiler/ 下。
            compiler:
              - 'src/compiler/**'
              # vscode 语法门比对「入库生成产物 ↔ 模板 + Lexer 关键字表」，产物与模板都在这里。
              - 'src/toolchain/devtools/vscode/**'
              - '.github/workflows/ci.yml'
            # change-detect rule (c): gates the Rust VM unit harness (cargo test)
            # + JIT consistency. Only a src/runtime change can affect it.
            # ci.yml fallback = 保底全跑.
            vm:
              # （含 src/runtime/.cargo/config.toml：target-dir 与 wasm rustflags）
              - 'src/runtime/**'
              - '.github/workflows/ci.yml'
            # stdlib [Test]（interp + jit）：stdlib 源码，加上 [Test] 的执行器（z42b、xtask 的 test-lib 编排）。
            stdlib:
              - 'src/libraries/**'
              - 'src/toolchain/builder/**'
              - 'scripts/test/xtask_test_lib*.z42'
              - '.github/workflows/ci.yml'

      # 纯文档快速通道：改动**全部**是文档（docs/learn、examples 除外——示例会被重放）⇒ 只跑 docs-check。
      # 逐个文件判（全称判断，paths-filter 是「任一命中」）。PR 看文件列表；main push 看 before...sha 的 compare，
      # 拿不到或满 300 文件就全跑。schedule / dispatch 恒为空（全跑）。
      - name: Docs-only change?
        id: docsonly
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=""
          before="${{ github.event.before }}"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/files" -q '.[].filename')
          elif [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] \
               && json=$(gh api "repos/$GITHUB_REPOSITORY/compare/$before...$GITHUB_SHA" 2>/dev/null); then
            n=$(printf '%s' "$json" | jq '.files | length')
            if [ "$n" -lt 300 ]; then files=$(printf '%s' "$json" | jq -r '.files[].filename'); fi
          fi
          # 非文档 = 既不在 docs/ 下、也不是 .md；学习手册与示例 = 算作非文档的例外。两者都为空才是纯文档。
          nondoc=$(printf '%s\n' "$files" | grep -v '^$' | grep -Ev '^docs/' | grep -Ev '\.md$' || true)
          learn=$(printf '%s\n' "$files" | grep -E '^(docs/learn/|examples/)' || true)
          docs_only=false
          if [ -n "$files" ] && [ -z "$nondoc" ] && [ -z "$learn" ]; then docs_only=true; fi
          echo "docs_only=$docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  # ── 纯文档改动的全部门禁：死链 + gate 清单对账、诊断码文档对账。不需要 SDK，xtask 用种子 z42c 编出即可。
  docs-check:
    name: docs-check(linux-x64)
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 不需要 Rust：xtask 跑在 `.z42` SDK 的 z42vm 上，docs / diagcodes 两道门不碰构建树（add-sdk-libs D7）。
      - name: Bootstrap xtask (seed z42c → current xtask only)
        uses: ./.github/actions/ci-bootstrap
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          xtask-only: "true"

      - name: Docs gates
        shell: bash
        run: |
          set -euo pipefail
          xtask test docs links
          xtask check diagcodes

  build-and-test:
    name: test-host(${{ matrix.platform }})
    # 全量 gate 在 linux-x64 上接近 60 分钟，留余量。
    timeout-minutes: 75
    # needs: changes so the Windows cargo-test step can gate on the `vm` filter
    # (rule c). The job itself still runs on every non-docs push (changes always
    # succeeds); only the Rust-unit step is conditionally skipped.
    needs: changes
    # 纯文档改动（PR 与 main push）走 docs-check（见 changes 的 Docs-only 步骤）。被 `if:` skip 的 required check 视同通过。
    if: needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    platform: linux-x64 }
          - { os: ubuntu-24.04-arm, platform: linux-arm64 }
          - { os: macos-26,         platform: macos-arm64 }
          - { os: windows-latest,   platform: windows-x64 }
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      # build-and-test runs on ALL OS — every leg downloads the prev nightly's z42c
      # seed and bootstraps the toolchain from source with it. See the Bootstrap step.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # 独立 cache key：compile-toolchain 只编 release 且先结束，共用 key 时本 job 额外编的 debug / test 依赖从不回存。
      - name: Cache Rust deps (Swatinem)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/runtime -> ../../artifacts/build/runtime
          shared-key: test-host-v1

      # 每条腿都用上一版 nightly 的 z42c 种子从源码自举（bootstrap-seed 纪律保证能编过），之后一切经 xtask。
      - name: Bootstrap toolchain (nightly z42c seed → current source)
        uses: ./.github/actions/ci-bootstrap
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      # examples stage 要一个带 launcher 的完整 SDK（artifacts/.z42）：bootstrap 已建好 z42c / stdlib，
      # 这里补 apphost 发布再组装。
      - name: Build SDK for the examples stage
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          xtask build toolchain
          xtask package dev-sdk

      - name: Test (xtask test --no-build --skip ...)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci-logs
          # --no-build：bootstrap 已建好 z42c + stdlib + xtask，gate 只重生 goldens。
          # 下放到并行 job 的 stage：stdlib → test-stdlib-interp；compiler / vscode → compiler-checks（host 无关，1 次）。
          # cross-zpkg、bench 也 host 无关，只在 linux-x64（required）上跑；性能判定在 bench-pr.yml。
          SKIP="stdlib,compiler,vscode"
          if [ "${{ matrix.platform }}" != "linux-x64" ]; then
            SKIP="stdlib,cross-zpkg,bench,compiler,vscode"
          fi
          # 按路径分流（只在 PR 上）：`--changed <base>` 用 `test changed` 的映射表只跑受影响的重 stage；
          # build wave、e2e goldens 与静态检查恒跑，scripts/ / ci.yml / 未知文件 / 拿不到 base ⇒ 全跑。
          # main push / schedule / dispatch 不分流（全跑）。判定打印在日志开头（[test --changed] …）。
          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            git fetch --no-tags --depth=1 origin "$base" || base=""
          fi
          if [ -n "$base" ]; then
            xtask test --no-build --skip "$SKIP" --changed "$base" 2>&1 | tee artifacts/ci-logs/test-all.log
          else
            xtask test --no-build --skip "$SKIP" 2>&1 | tee artifacts/ci-logs/test-all.log
          fi
          exit "${PIPESTATUS[0]}"

      # build wave 就地重写 zbc-format 字节基线；diff 非空 = 提交的基线过期（格式变更漏了 version-bumping.md 第 4 步）。
      # 消费方校验的永远是刚重写的字节，不靠这道门过期基线会一直绿。挂在 required 的 test-host 上，零额外构建。
      - name: Golden byte baselines are up to date (regen produced no diff)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- src/compiler/z42.package/tests/fixtures/zbc-format; then
            echo "::error::committed zbc-format byte baselines are stale — regen rewrote them."
            echo "Fix: run 'xtask build compiler && xtask build stdlib && xtask build test',"
            echo "review the diff, then commit the regenerated fixtures"
            echo "(see docs/agent/rules/version-bumping.md step 4)."
            git --no-pager diff --stat -- src/compiler/z42.package/tests/fixtures/zbc-format
            exit 1
          fi
          echo "OK: zbc-format baselines match the current writer"

      # 失败时把 stage 保留的临时输出传上来（runner 回收后就没了）。
      - name: Upload test logs on failure
        if: failure() && matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.os }}
          path: |
            artifacts/ci-logs/
            /tmp/z42-test-all.*
            /var/folders/*/*/T/z42-test-all.*
          retention-days: 7
          if-no-files-found: warn

      # Rust 单测不在 `xtask test` 里（signal 测试在受限沙箱会挂），每条腿单独一步。Windows 不跑 gate，
      # 先 `build test` 备好 zbc_compat 要的 goldens。schedule / dispatch 下 filter 恒 false，故显式放行。
      - name: Build golden test assets (Windows — zbc_compat inputs)
        if: matrix.os == 'windows-latest' && (needs.changes.outputs.vm == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          set -euo pipefail
          xtask build test

      # 串行（--test-threads=1，_testRuntime 内设）：--lib 测试有跨线程内存竞争。按 vm filter 门控。
      - name: Rust VM unit tests (xtask test runtime)
        if: needs.changes.outputs.vm == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          xtask test runtime

      # ── 抢号预检：PR 的绿基于触发那一刻的 base，两个 PR 能各自拿走同一个诊断码号、双双全绿合入。
      # 不开「必须基于最新 main」（要每个 PR 重跑整套 CI），改为在 GREEN 之后并入最新 main 重跑一次秒级的
      # diagcodes。挂在已是 required 的 test-host(linux-x64) 末尾——新开的 job 默认不是 required，红了也挡不住。
      - name: Code-number preflight (merge LATEST main, rerun diagcodes)
        if: github.event_name == 'pull_request' && matrix.platform == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          # checkout 是浅克隆 ⇒ 先把历史挖深到能找到共同祖先；挖不到就**放行**（这一步是加保险，
          # 不是新增的失败源——真正的唯一性判据在 diagcodes 门本身，它在上面的 `test` 里已跑过）。
          git fetch --no-tags --deepen=200 origin main 2>/dev/null || true
          if ! git merge-base HEAD FETCH_HEAD >/dev/null 2>&1; then
            echo "::notice::浅历史里找不到与 main 的共同祖先，跳过抢号预检"
            exit 0
          fi
          if ! git -c user.name=ci -c user.email=ci@z42.invalid merge --no-edit FETCH_HEAD; then
            git merge --abort || true
            echo "::notice::与最新 main 有文本冲突 —— GitHub 本身已挡住合并，此处不重复报警"
            exit 0
          fi
          xtask check diagcodes

  # ── 宿主 RID 打包（4 个 OS），与 host 测试并行，吃共享的 toolchain artifact；publish-nightly 消费其上传。
  host-package:
    name: package-host(${{ matrix.platform }})
    timeout-minutes: 45
    # package-* 的产物只给 publish-nightly 用；PR 上它们只是「还能不能打包」，只在 platform 改动时跑。
    needs: [changes, toolchain-bootstrap]
    # `examples`：学习手册示例只在这里用打包出的 SDK 重放（含 Windows 的唯一覆盖），
    # 所以 learn / examples 改动只拉起本 job，不拉起其余 package-* / test-desktop。
    if: ${{ needs.changes.outputs.platform == 'true' || needs.changes.outputs.examples == 'true' || github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    platform: linux-x64 }
          - { os: ubuntu-24.04-arm, platform: linux-arm64 }
          - { os: macos-26,         platform: macos-arm64 }
          - { os: windows-latest,   platform: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # 独立 cache key：打包另编 cdylib / staticlib / compression / apphost，共用窄 key 会每次冷编（Windows 6~8 分钟）。
      - uses: ./.github/actions/xtask-bootstrap-artifact
        with:
          cache-key: package-host-v2

      - name: Package host RID (xtask package)
        shell: bash
        run: |
          set -euo pipefail
          # --no-build：z42c / stdlib 用 artifact 里还原的；包自己的原生库照编。
          # --archive：在本 runner 上出归档（保留可执行位；Windows 出 zip）。PR 上也出——下面的 Installer smoke 装的就是它。
          xtask package sdk --no-build --archive --label nightly
          xtask package runtime --no-build --archive --label nightly
          xtask package workload --archive --label nightly
          # test workload = payload-only, platform-agnostic → build once on macos-arm64
          # (package-test-workload) → z42-workload-nightly-test.tar.gz.
          if [ "${{ matrix.platform }}" = "macos-arm64" ]; then
            xtask package workload test --archive --label nightly
          fi

      - name: Dist test (launcher + desktop-publish + golden legs)
        # 全仓唯一调用 `test package` 的地方：每条腿都必须跑到（发行包夹具 + golden）。
        shell: bash
        run: |
          set -euo pipefail
          xtask test package

      - name: Learn-book examples (packaged SDK)
        # 与 test-host 的 examples stage 同一套会话脚本，这里用打包出的 SDK 跑——最贴近用户安装形态，
        # 也是 Windows 上唯一的覆盖。
        shell: bash
        run: |
          set -euo pipefail
          pkg_dir=$(ls -d "$PWD"/artifacts/packages/z42-*-release | head -1)
          xtask test docs examples --sdk "$pkg_dir"

      - name: Installer smoke (offline, packaged SDK)
        # 用户安装脚本（scripts/install/）对刚打出的 SDK 包跑一遍 `--archive` 离线安装：
        # 装进临时 home → `z42 --version` → `z42 new` + `z42 run`。第二次安装同一份包必须
        # 保留安装目录里的非 SDK 内容（workload 等）。网络下载路径由 nightly 发布后的真实 URL 覆盖。
        shell: bash
        run: |
          set -euo pipefail
          # 装的是上面 `--archive` 出的**发布归档**本身（与 nightly / release 上传的同一个文件）。
          rid="${{ matrix.platform }}"
          home="$RUNNER_TEMP/z42-install-home"
          rm -rf "$home"; mkdir -p "$home/runtimes/keep"
          if [ "${RUNNER_OS:-}" = "Windows" ]; then
            archive="$PWD/artifacts/packages/z42-sdk-nightly-${rid}.zip"
            pwsh -NoProfile -File scripts/install/install.ps1 -Archive "$archive" -Dest "$home" -NoModifyPath
            z42="$home/z42.exe"
          else
            archive="$PWD/artifacts/packages/z42-sdk-nightly-${rid}.tar.gz"
            sh scripts/install/install.sh --archive "$archive" --dest "$home" --no-modify-path
            z42="$home/z42"
          fi
          "$z42" --version | grep -E '^z42 [0-9]'
          test -d "$home/runtimes/keep" || { echo "error: installer removed non-SDK content"; exit 1; }
          work="$RUNNER_TEMP/z42-install-work"; rm -rf "$work"; mkdir -p "$work"; cd "$work"
          env -u Z42_PORTABLE_VM -u Z42_LIBS -u Z42_HOME "$z42" new hello
          cd hello
          out=$(env -u Z42_PORTABLE_VM -u Z42_LIBS -u Z42_HOME "$z42" run | tr -d '\r')
          [ "$out" = "Hello, World!" ] || { echo "error: z42 run printed '$out'"; exit 1; }
          echo "✓ installed SDK: new + run → Hello, World!"

      - name: C host links the packaged runtime (static + dynamic)
        # P0-17：同一套 R1–R7 C 宿主（test-desktop-cabi 用的那份 r1_r7.c）改链**打出来的 runtime 包**，
        # 静态一遍、动态一遍（经 rpath 找 libz42.{dylib,so}）——install name / SONAME 坏了，动态那遍就加载不了。
        # Windows 没有 `cc`，上一步按文件检查 import lib。
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          rt_dir=$(ls -d "$PWD"/artifacts/packages/z42-runtime-*-"${{ matrix.platform }}" | head -1)
          Z42_RUNTIME_DIR="$rt_dir" xtask test app desktop

      - name: Upload host archives
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: release-host-${{ matrix.platform }}
          path: |
            artifacts/packages/z42-*.tar.gz
            artifacts/packages/z42-*.zip
          retention-days: 14
          if-no-files-found: error

  # ── toolchain artifact：只自举一次（种子 z42c → 当前 z42c + stdlib + xtask），把 zpkg 快照上传为
  # toolchain-ubuntu-latest，打包 / 平台测试 job 下载后各自 cargo 编 z42vm，并行跑。产物与宿主无关，只要 linux 一条腿。
  toolchain-bootstrap:
    name: compile-toolchain(linux-x64)
    timeout-minutes: 30
    # Runs unconditionally (like the test jobs) — its artifact roots the package
    # jobs (which always run) + the platform-test jobs, so it must always be present.
    # 例外：纯文档改动（ci-docs-fast-path）——它下游的 assemble / consume current-sdk 随之 skip。
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust deps (Swatinem)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/runtime -> ../../artifacts/build/runtime
          shared-key: host-v2

      - name: Bootstrap toolchain (nightly z42c seed → current source)
        uses: ./.github/actions/ci-bootstrap
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      # z42b 进这个 artifact（tier-2 设备 job 经它跑），按当前 z42c 编；`package ci` 只组装。
      - name: Snapshot built toolchain (package ci; zpkg products only)
        shell: bash
        run: |
          set -euo pipefail
          xtask build toolchain z42b
          xtask package ci "$RUNNER_TEMP/tc"

      # 只跑 xtask、不调 cargo 的 linux-x64 消费方（xtask-bootstrap-artifact 的 `prebuilt-vm`）直接用这份 z42vm。
      # cdylib（libz42_compression.so 等）一起带上：VM 在自己旁边解析 `[Native(lib = …)]`。
      - name: Upload z42vm-linux-x64
        uses: actions/upload-artifact@v7
        with:
          name: z42vm-linux-x64
          path: |
            artifacts/build/runtime/release/z42vm
            artifacts/build/runtime/release/*.so
          retention-days: 3
          if-no-files-found: error

      # 名字保留 `-ubuntu-latest` 后缀：xtask-bootstrap-artifact / bench 等消费方按这个名字取。
      - name: Upload toolchain-ubuntu-latest
        uses: actions/upload-artifact@v7
        with:
          name: toolchain-ubuntu-latest
          path: ${{ runner.temp }}/tc/
          retention-days: 3
          if-no-files-found: error

  # ── current-sdk：组装 `.z42` 布局 + 打包 golden .zbc，给 test-consume / test-vm-jit。单独成 job，不拖关键路径。
  assemble-current-sdk:
    name: compile-test-assets(linux-x64)
    timeout-minutes: 30
    needs: toolchain-bootstrap
    # 消费方只下载 linux 这一份。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # cargo 编 z42vm + 原地还原 z42c / stdlib / xtask（缓存 key 的取舍写在 action 的 cache-key input 上）。
      - uses: ./.github/actions/xtask-bootstrap-artifact

      # golden .zbc 只在这里编一次，下游 interp / jit 跑同一份字节（.zbc 与执行模式无关）。
      - name: Build golden .zbc test assets (compile shared assets once)
        shell: bash
        run: |
          xtask build test

      - name: Assemble .z42 toolchain (package dev-sdk) + bundle goldens
        shell: bash
        run: |
          set -euo pipefail
          xtask package dev-sdk --out "$RUNNER_TEMP/z42sdk"
          # bundle the prebuilt golden .zbc into current-sdk so consumers run them
          # with --no-build (shared compiled asset across interp/jit).
          if [ -d artifacts/build/tests ]; then
            cp -r artifacts/build/tests "$RUNNER_TEMP/z42sdk/tests"
          fi

      - name: Upload current-sdk-ubuntu-latest
        uses: actions/upload-artifact@v7
        with:
          name: current-sdk-ubuntu-latest
          path: ${{ runner.temp }}/z42sdk/
          retention-days: 3
          if-no-files-found: error

  # ── 证明下载来的 current-sdk 是自包含工具链：只用它自己的 z42vm / z42c / libs 编并跑一个真实工程（xtask）。
  consume-current-sdk:
    name: test-consume(linux-x64)
    timeout-minutes: 30
    needs: assemble-current-sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download current-sdk-ubuntu-latest
        uses: actions/download-artifact@v8
        with:
          name: current-sdk-ubuntu-latest
          path: .z42-dl
      - name: Compile + run via ONLY the downloaded toolchain (consume smoke)
        shell: bash
        run: |
          set -euo pipefail
          TC="$PWD/.z42-dl"
          chmod +x "$TC/bin/z42vm"
          ls "$TC/programs/z42c/" "$TC/libs/" >/dev/null
          # 直接调 driver 时由 Z42_COMPILER_LIBS 给出编译器目录（xtask 的 z42.project / z42.build 是 deploy = "sdk"）；
          # 运行期侧车的 ${Z42_HOME}/programs/z42c 由 VM 从自己的位置展开——下面的 `build -h` 就是实测。
          Z42_COMPILER_LIBS="$TC/programs/z42c" Z42_LIBS="$TC/libs" "$TC/bin/z42vm" "$TC/programs/z42c/z42c.driver.zpkg" --mode interp -- \
            build scripts/xtask.z42.toml --release --output-dir "$RUNNER_TEMP/consume-out"
          test -f "$RUNNER_TEMP/consume-out/xtask.zpkg" \
            || { echo "::error::current-sdk compile failed — no xtask.zpkg"; exit 1; }
          # execute the just-compiled zpkg on the toolchain's z42vm (proves run, not just compile)
          out=$(Z42_LIBS="$TC/libs" "$TC/bin/z42vm" "$RUNNER_TEMP/consume-out/xtask.zpkg" -- build -h)
          echo "$out" | grep -q "build compiler\|SUBCOMMANDS" \
            && echo "✅ current-sdk compiles AND runs (cross-job, self-contained)" \
            || { echo "::error::current-sdk run failed"; echo "$out"; exit 1; }
      - name: Run cross-zpkg gate via --toolchain (real test-stage consume)
        shell: bash
        run: |
          set -euo pipefail
          TC="$PWD/.z42-dl"
          # the just-compiled xtask drives the cross-zpkg gate entirely from the
          # downloaded toolchain (z42c + stdlib + z42vm), no bootstrap/rebuild.
          Z42_LIBS="$TC/libs" "$TC/bin/z42vm" "$RUNNER_TEMP/consume-out/xtask.zpkg" -- \
            --toolchain "$TC" test e2e --dir cross-zpkg
      # current-sdk 里带着只编一次的 golden .zbc；解到规范镜像位置，`--no-rebuild` 直接跑（interp / jit 跑同一份字节）。
      - name: Extract bundled goldens (shared compiled asset)
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .z42-dl/tests ]; then
            mkdir -p artifacts/build/tests
            cp -r .z42-dl/tests/. artifacts/build/tests/
          else
            echo "::error::current-sdk has no bundled goldens (tests/) — P2.4 regen step?"; exit 1
          fi
      # interp: the shared compiled asset (prebuilt .zbc) runs with no regen/bootstrap.
      # GATE — 169/169 proven.
      - name: Run VM goldens INTERP from shared asset (--no-rebuild)
        shell: bash
        run: |
          set -euo pipefail
          TC="$PWD/.z42-dl"
          Z42_LIBS="$TC/libs" "$TC/bin/z42vm" "$RUNNER_TEMP/consume-out/xtask.zpkg" -- \
            --toolchain "$TC" test e2e --mode interp --no-rebuild

  # ── VM goldens 的 JIT 门（唯一的一道）：test-host 只跑 interp。cranelift 行为与宿主无关，linux-x64 一条足够。
  vm-jit-consistency:
    name: test-vm-jit(linux-x64) shard ${{ matrix.shard }}
    # 2 个分片，各跑一段共享的 golden .zbc（不再各自重生）。
    timeout-minutes: 55
    runs-on: ubuntu-latest
    needs: [changes, toolchain-bootstrap, assemble-current-sdk]
    # vm 或 compiler 改动都要跑：编译器的优化 pass 会重排 IR，JIT 的输入变了（test-host 只覆盖 interp）。
    if: ${{ needs.changes.outputs.vm == 'true' || needs.changes.outputs.compiler == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@v7

      # 吃 toolchain artifact，不在每个分片重新自举（rust toolchain + cache 由 action 自带）。
      - uses: ./.github/actions/xtask-bootstrap-artifact

      # 共享 golden .zbc 解到规范镜像位置（.zbc 与执行模式无关、z42c 输出确定，等价于本地重生）。
      - name: Download shared golden .zbc (compiled once)
        uses: actions/download-artifact@v8
        with:
          name: current-sdk-ubuntu-latest
          path: .z42-dl
      - name: Extract bundled goldens
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .z42-dl/tests ]; then
            mkdir -p artifacts/build/tests
            cp -r .z42-dl/tests/. artifacts/build/tests/
          else
            echo "::error::current-sdk has no bundled goldens (tests/) — assemble-current-sdk regen step?"; exit 1
          fi

      - name: VM goldens — JIT mode (shard ${{ matrix.shard }}/2)
        shell: bash
        run: |
          set -euo pipefail
          # --no-rebuild：直接跑共享 .zbc；JIT 的逐 case 编译发生在运行时（这正是本门要测的）。
          xtask test e2e --mode jit --no-rebuild --shard ${{ matrix.shard }}/2 --jobs=4

  # ── stdlib [Test] 的 JIT 门：每个单元 fork `z42vm --mode jit`（进程内 runner 驱动不了 JIT）。独立并行 job，
  # 不拉长关键路径；linux-x64 一条（cranelift 与宿主无关）。
  stdlib-jit-consistency:
    name: test-stdlib-jit(linux-x64) shard ${{ matrix.shard }}
    timeout-minutes: 45
    runs-on: ubuntu-latest
    needs: [changes, toolchain-bootstrap]
    # change-detect rule (d+c): stdlib [Test] JIT divergence can arise from a VM
    # change (JIT codegen) or a stdlib change (test content). Skip when neither
    # changed. Schedule/dispatch = 全跑.
    if: ${{ needs.changes.outputs.vm == 'true' || needs.changes.outputs.stdlib == 'true' || needs.changes.outputs.compiler == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@v7

      # 吃 toolchain artifact，不在每个分片重新自举（rust toolchain + cache 由 action 自带）。
      - uses: ./.github/actions/xtask-bootstrap-artifact
        with:
          prebuilt-vm: "true"   # 后续只跑 xtask、不调 cargo（ci-prebuilt-vm；非 linux-x64 腿照常自建）

      - name: stdlib [Test] — JIT mode (shard ${{ matrix.shard }}/2)
        shell: bash
        run: |
          set -euo pipefail
          # xtask runs this shard's stdlib [Test] units under JIT (z42b via
          # z42vm --mode jit). --shard splits the libs balanced by unit count
          # across 2 machines; --jobs 4 parallelizes within the shard.
          xtask test stdlib --mode jit --no-build --shard ${{ matrix.shard }}/2 --jobs 4

  # ── stdlib [Test] interp，每个 OS 一个 job（io / net / process / fs / threading 依赖宿主）；test-host 跳过它。
  stdlib-interp-consistency:
    name: test-stdlib-interp(${{ matrix.platform }})
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    needs: [changes, toolchain-bootstrap]
    # change-detect rule (d+c): stdlib [Test] interp can diverge on VM change
    # (interp dispatch) or stdlib change (test content/API). Schedule/dispatch = 全跑.
    if: ${{ needs.changes.outputs.vm == 'true' || needs.changes.outputs.stdlib == 'true' || needs.changes.outputs.compiler == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      # 不分片：每个 OS 全量约 12~14 分钟；分片会挤爆约 20 个并发的 runner 池，排队比省下的还多。
      matrix:
        include:
          - { os: ubuntu-latest,    platform: linux-x64 }
          - { os: ubuntu-24.04-arm, platform: linux-arm64 }
          - { os: macos-26,         platform: macos-arm64 }

    steps:
      - uses: actions/checkout@v7

      # 吃与架构无关的 toolchain artifact，本机 cargo 编 z42vm（rust toolchain + cache 由 action 自带）。
      - uses: ./.github/actions/xtask-bootstrap-artifact
        with:
          prebuilt-vm: "true"   # 后续只跑 xtask、不调 cargo（ci-prebuilt-vm；非 linux-x64 腿照常自建）

      - name: stdlib [Test] — INTERP mode (full)
        shell: bash
        run: |
          set -euo pipefail
          xtask test stdlib --mode interp --no-build --jobs 4

  # ── cross-zpkg 在 test-host(linux-x64) 的 gate 里跑：夹具用 release z42vm 编、debug z42vm 跑（保留 debug 断言）。
  # 不跑 JIT 版：zpkg 链接是字节码层的，JIT 执行正确性由 vm-jit goldens 覆盖。

  # ── 编译器检查（与宿主无关，linux 一次）：自举不动点 gen1 == gen2 + z42c [Test] units + vscode 语法同步；
  # test-host 跳过它们。「上一版 nightly 能编当前源」由每个跑 ci-bootstrap 的 job 顺带实测。
  compiler-checks:
    name: compiler-checks(linux-x64)
    timeout-minutes: 30
    needs: [changes, toolchain-bootstrap]
    if: ${{ needs.changes.outputs.compiler == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # rust toolchain + rust-cache 由该 action 自带（见其 cache-key input）。
      - uses: ./.github/actions/xtask-bootstrap-artifact

      - name: z42c self-host fixpoint (xtask test compiler)
        shell: bash
        run: |
          set -euo pipefail
          xtask test compiler

      - name: VSCode grammar ↔ Lexer keyword sync (xtask check vscode-syntax)
        shell: bash
        run: |
          set -euo pipefail
          xtask check vscode-syntax

  # ── iOS packaging ──────────────────────────────────────────────────────
  # Packages ios-arm64 + iossim-arm64. Requires Xcode (pre-installed on
  # macos-26 arm64) + iOS Rust targets. The source bootstrap also builds z42c.
  package-ios:
    name: package-ios(macos-arm64)
    timeout-minutes: 45
    # PR 上只在 platform 改动时跑（同 host-package）。
    needs: [changes, toolchain-bootstrap]
    if: ${{ needs.changes.outputs.platform == 'true' || github.event_name != 'pull_request' }}
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/xtask-bootstrap-artifact
        with:
          cache-key: ios-v2
          rust-targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Package ios-arm64 + iossim-arm64 (xtask package)
        shell: bash
        run: |
          set -euo pipefail
          # --archive：平台 tooling 包只由主 RID（ios-arm64）出归档，iossim 那份说明后跳过。
          for rid in ios-arm64 iossim-arm64; do
            xtask package runtime --rid "$rid" --archive --label nightly
          done

      - name: Upload iOS archives
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: release-ios
          path: |
            artifacts/packages/z42-*.tar.gz
            artifacts/packages/z42-*.zip
          retention-days: 14
          if-no-files-found: error

  # ── Android packaging ───────────────────────────────────────────────────
  # Packages android-arm64 + android-x64 via cargo-ndk + NDK r30.
  package-android:
    name: package-android(linux-x64)
    timeout-minutes: 45
    # PR 上只在 platform 改动时跑（同 host-package）。
    needs: [changes, toolchain-bootstrap]
    if: ${{ needs.changes.outputs.platform == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # local-cache: false — local-cache produced an incomplete ANDROID_NDK_HOME
      # (clang missing under toolchains/llvm/prebuilt/) causing libffi-sys's
      # configure to fail. Fresh download is ~2 min slower but reliable.
      - name: Setup Android NDK r30
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r30
          local-cache: false

      - uses: ./.github/actions/xtask-bootstrap-artifact
        with:
          cache-key: android-v2
          rust-targets: aarch64-linux-android,x86_64-linux-android

      - name: Package android-arm64 + android-x64 (xtask package)
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          # --archive：平台 tooling 包只由主 RID（android-arm64）出归档，android-x64 那份说明后跳过。
          for rid in android-arm64 android-x64; do
            xtask package runtime --rid "$rid" --archive --label nightly
          done

      - name: Upload Android archives
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: |
            artifacts/packages/z42-*.tar.gz
            artifacts/packages/z42-*.zip
          retention-days: 14
          if-no-files-found: error

  # ── wasm 打包：先 `test app wasm build` 产出 pkg-web/ + pkg-nodejs/，打包才能组装（wasm-pack 不需要 Node）。
  package-wasm:
    name: package-wasm(linux-x64)
    timeout-minutes: 40
    # PR 上只在 platform 改动时跑（同 host-package）。
    needs: [changes, toolchain-bootstrap]
    if: ${{ needs.changes.outputs.platform == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install wasm-pack + wasm-tools
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack,wasm-tools

      - uses: ./.github/actions/xtask-bootstrap-artifact
        with:
          cache-key: wasm-v2
          rust-targets: wasm32-unknown-unknown

      # interp-only 的依赖图里不许混进 cranelift（jit 依赖）；各 feature 组合编不编得过由 package-{wasm,ios,android}
      # 的真实构建覆盖。`cargo tree` 只解析依赖图、不编译。
      - name: Verify cranelift excluded under interp-only
        shell: bash
        run: |
          set -euo pipefail
          if cargo tree --locked --manifest-path src/runtime/Cargo.toml \
             --no-default-features --features interp-only 2>&1 | grep -q "cranelift"; then
            echo "ERROR: cranelift still present in interp-only build" >&2
            exit 1
          fi

      - name: Build wasm platform (pkg-web/ + pkg-nodejs/ via `xtask test app wasm build`)
        shell: bash
        run: |
          set -euo pipefail
          xtask test app wasm build

      - name: Package browser-wasm (xtask package)
        shell: bash
        run: |
          set -euo pipefail
          xtask package runtime --rid browser-wasm --archive --label nightly

      # 每个 push / PR 真跑一次 wasm VM（上面只编译、校验、打包；真执行的 test-wasm-browser 只在 nightly）——
      # 第一次 loadZbc 就 trap 的 VM 能一路打包通过。pkg-nodejs 在暂存的 host 副本里构建，不写源码目录。
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: pkg-nodejs smoke (load + invoke Hello.Main in Node, no browser)
        shell: bash
        run: |
          set -euo pipefail
          xtask test app wasm build
          xtask test app wasm assets
          node artifacts/intermediate/toolchain/workload/wasm/host/demo/node/run.js

      - name: Upload wasm archives
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: release-wasm
          path: |
            artifacts/packages/z42-*.tar.gz
            artifacts/packages/z42-*.zip
          retention-days: 14
          if-no-files-found: error

  # ── nightly 滚动预发布：main 的每次 push 把 9 个 RID 的归档原地更新到同一个 `nightly` Release（URL 稳定：
  #   https://github.com/<owner>/z42/releases/download/nightly/z42-sdk-nightly-<rid>.{tar.gz,zip}）。不签名，--prerelease。
  publish-nightly:
    name: publish-nightly
    timeout-minutes: 40
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.changes.outputs.sdk != 'false'
    # needs 只列编 / 测 / 打包**当前源码**的 job。所有自举都从上一版 nightly 起步，自愈靠 bootstrap-seed 纪律
    # （上一版 nightly 必须能编当前源）。不要加纯下载自举的门（vm-jit / stdlib-jit）：格式 bump 时它们会暂时红、
    # 下次自愈，把 publish 挂在它们身上只会多一条死锁边。
    needs:
      - changes               # sdk == false（nightly 之后只改了文档 / 测试）⇒ 没有新东西可发
      - build-and-test
      - host-package
      - package-ios
      - package-android
      - package-wasm
      - toolchain-bootstrap   # provides the toolchain-<os> artifact for `xtask release`
    runs-on: ubuntu-latest
    # 所有事件的 publish-nightly 串行（job 级 group）：并发的两次会交错改同一个 nightly Release；不取消，排队等前一个发完。
    concurrency:
      group: publish-nightly-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      actions: read     # setup-z42-sdk 回退（gh run download）
      contents: write   # gh release upload / edit / create + tag ref PATCH
    steps:
      - uses: actions/checkout@v7

      # 防回退：main 的运行不再互相取消，较早的运行可能在较新的之后才排到发布（本 job 的 group 串行）。
      # nightly 已指向本 commit 的后代 ⇒ 跳过，不拿旧 commit 覆盖新 nightly。
      - name: Skip if nightly is already newer
        id: stale
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cur=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/nightly" -q .object.sha 2>/dev/null || true)
          stale=false
          if [ -n "$cur" ] && [ "$cur" != "$GITHUB_SHA" ]; then
            rel=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...${cur}" -q .status 2>/dev/null || true)
            if [ "$rel" = "ahead" ]; then stale=true; fi
          fi
          echo "nightly @ ${cur:-<none>}, this run @ $GITHUB_SHA ⇒ stale=$stale"
          echo "stale=$stale" >> "$GITHUB_OUTPUT"

      - name: Provision z42vm + xtask (consume toolchain artifact)
        if: steps.stale.outputs.stale != 'true'
        uses: ./.github/actions/xtask-bootstrap-artifact
        with:
          prebuilt-vm: "true"   # 后续只跑 xtask、不调 cargo（ci-prebuilt-vm；非 linux-x64 腿照常自建）

      # 各 package job 已在自己的 runner 上用 `--archive` 出好归档——upload-artifact 不保留可执行位，
      # 所以不能下载包目录到这里再打。
      - name: Download all release archives
        if: steps.stale.outputs.stale != 'true'
        uses: actions/download-artifact@v8
        with:
          path: artifacts/packages
          pattern: 'release-*'
          merge-multiple: true

      # 合并 4 份逐 RID 桌面 workload → SHA256SUMS → release-index.json（与 release.yml 同一条命令）。
      - name: Finalize release assets (nightly)
        if: steps.stale.outputs.stale != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ls -la artifacts/packages/
          xtask package finalize nightly --channel nightly --tag nightly --version nightly

      # 原地更新 nightly，绝不删了重建：GitHub 上旧 tag 的延迟删除可能落在新 tag 之后，Release 失去 tag 会静默变回
      # draft——其它运行的 GITHUB_TOKEN 看不见它，所有种子下载失败、CI 死锁。所以只做：上传（--clobber）→ 删掉本次
      # 不再发的资产 → PATCH 移动 tag → 改标题 / 说明。
      - name: Update nightly release in place
        if: steps.stale.outputs.stale != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          short_sha=$(git rev-parse --short HEAD)
          today=$(date -u +%Y-%m-%d)
          notes=$(cat <<EOF
          **Rolling pre-release** built from \`main\` on ${today} (commit \`${short_sha}\`).

          - **Unsigned** — do not use for production.
          - **Replaced on every push to main** — URL stays stable, contents change.
          - For tagged releases see [Releases](../../releases?q=v).

          ## Downloads (host)

          | Platform | SDK | Runtime |
          |----------|-----|---------|
          | Linux x64 | \`z42-sdk-nightly-linux-x64.tar.gz\` | \`z42-runtime-nightly-linux-x64.tar.gz\` |
          | Linux arm64 | \`z42-sdk-nightly-linux-arm64.tar.gz\` | \`z42-runtime-nightly-linux-arm64.tar.gz\` |
          | macOS arm64 | \`z42-sdk-nightly-macos-arm64.tar.gz\` | \`z42-runtime-nightly-macos-arm64.tar.gz\` |
          | Windows x64 | \`z42-sdk-nightly-windows-x64.zip\` | \`z42-runtime-nightly-windows-x64.zip\` |

          ## Downloads (mobile + wasm runtime)

          | Platform | Runtime |
          |----------|---------|
          | iOS arm64 (device) | \`z42-runtime-nightly-ios-arm64.tar.gz\` |
          | iOS arm64 (simulator) | \`z42-runtime-nightly-iossim-arm64.tar.gz\` |
          | Android arm64 | \`z42-runtime-nightly-android-arm64.tar.gz\` |
          | Android x64 | \`z42-runtime-nightly-android-x64.tar.gz\` |
          | Browser WASM | \`z42-runtime-nightly-browser-wasm.tar.gz\` |

          ## Workloads (\`z42 workload install <wl>\`; ios/android/wasm bundle the runtime packs above — desktop carries the per-RID apphost stubs and reuses the host runtime)

          | Workload | Tooling archive |
          |----------|-----------------|
          | Desktop (apphost) | \`z42-workload-nightly-desktop.tar.gz\` |
          | iOS (SwiftPM) | \`z42-workload-nightly-ios.tar.gz\` |
          | Android (Gradle) | \`z42-workload-nightly-android.tar.gz\` |
          | WASM (npm) | \`z42-workload-nightly-wasm.tar.gz\` |
          | Test (capability; test-agent payload) | \`z42-workload-nightly-test.tar.gz\` |

          Install (macOS / Linux): \`curl -fsSL https://z42-lang.github.io/z42/install.sh | sh\`
          Install (Windows): \`irm https://z42-lang.github.io/z42/install.ps1 | iex\`

          Verify: \`shasum -a 256 -c SHA256SUMS --ignore-missing\`
          EOF
          )
          title="Nightly (main @ ${short_sha} · ${today})"
          assets=(artifacts/packages/SHA256SUMS artifacts/packages/release-index.json
                  artifacts/packages/z42-* scripts/install/install.sh scripts/install/install.ps1)
          if gh release view nightly >/dev/null 2>&1; then
            # (1) assets first — same names, --clobber replaces each one
            gh release upload nightly "${assets[@]}" --clobber
            # (2) drop assets this build no longer ships (e.g. a renamed package)
            keep=" "
            for f in "${assets[@]}"; do keep="${keep}$(basename "$f") "; done
            for name in $(gh release view nightly --json assets -q '.assets[].name'); do   # asset names have no spaces
              case "$keep" in
                *" $name "*) ;;
                *) echo "  removing stale asset $name"; gh release delete-asset nightly "$name" --yes ;;
              esac
            done
            # (3) move the tag to this commit — the release follows the tag NAME, so it never detaches
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            # (4) metadata; target = the commit setup-z42-sdk records as the seed identity
            gh release edit nightly --title "$title" --notes "$notes" --target "$GITHUB_SHA" --prerelease --draft=false
          else
            # No nightly at all (first publish, or deleted by hand): create once; later runs only update.
            gh release create nightly --prerelease --target "$GITHUB_SHA" --title "$title" --notes "$notes" "${assets[@]}"
          fi
          # Verify: published (a DRAFT is invisible to other runs' GITHUB_TOKEN ⇒ every
          # download-bootstrap job fails), tag on this commit, every asset present.
          if [ "$(gh release view nightly --json isDraft -q .isDraft)" = "true" ]; then
            echo "::error::nightly release is a draft — download-bootstrap jobs will fail"; exit 1
          fi
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/nightly" -q .object.sha)
          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "::error::nightly tag points at $tag_sha, expected $GITHUB_SHA"; exit 1
          fi
          have=" $(gh release view nightly --json assets -q '.assets[].name' | tr '\n' ' ')"
          for f in "${assets[@]}"; do
            case "$have" in
              *" $(basename "$f") "*) ;;
              *) echo "::error::asset $(basename "$f") missing after publish"; exit 1 ;;
            esac
          done
          echo "✓ nightly @ ${short_sha} published in place (non-draft, tag moved, assets complete)"

  # ── Tier-2 平台测试（nightly）：wasm（Playwright）、iOS 模拟器、Android 模拟器，各自把 JUnit 发成 Check。
  test-wasm:
    name: test-wasm-browser(linux-x64) shard ${{ matrix.shard }}
    # 冷构建（wasm-pack LTO + 全语料编译）约 27 分钟，加上分片的浏览器内运行。
    timeout-minutes: 75
    needs: toolchain-bootstrap   # `changes` 不在 needs：本 job 的 if: 只看 event_name，从不读 needs.changes.outputs.*
    # Tier-2（浏览器 / 模拟器，慢）：只在 nightly 与手动触发时跑。
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    # 嵌入语料全量分 3 片（`--shard k/3`）；R1–R7 与语料无关，只在第 1 片跑。
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    permissions:
      actions: read     # setup-z42-sdk 回退（gh run download）
      contents: read
      checks: write
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/artifacts/tools/playwright-browsers
    steps:
      - uses: actions/checkout@v7
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/toolchain/workload/wasm/platform/tests/package-lock.json
      # 按 lockfile 里钉住的 playwright 版本缓存浏览器二进制（Chromium 约 150MB）。
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/artifacts/tools/playwright-browsers
          key: playwright-${{ runner.os }}-${{ hashFiles('src/toolchain/workload/wasm/platform/tests/package-lock.json') }}
      - uses: ./.github/actions/xtask-bootstrap-artifact
        with:
          cache-key: tier2-wasm
          rust-targets: wasm32-unknown-unknown
      - name: Prime Playwright (node deps + Chromium + OS libs)
        shell: bash
        run: |
          set -euo pipefail
          # node deps go into the staged host copy (where `test app wasm` runs Playwright).
          xtask test app wasm stage
          cd artifacts/intermediate/toolchain/workload/wasm/host/tests
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      # 整条设备流水线就是一条命令，与本地相同（test-layout §6）；步骤顺序归 `xtask test app`。
      - name: xtask test app wasm (shard ${{ matrix.shard }}/3)
        shell: bash
        run: |
          set -euo pipefail
          xtask test app wasm --shard ${{ matrix.shard }}/3
      # R1–R7 junit exists only on shard 1 (Playwright embedded reports via `list`,
      # not junit — its result is the step exit code above).
      - name: Publish wasm test report (GitHub Check)
        if: ${{ always() && matrix.shard == 1 }}
        uses: dorny/test-reporter@v3
        with:
          name: platform-tests / wasm
          path: artifacts/reports/tests/wasm/junit.xml
          reporter: java-junit
          fail-on-error: false
      - name: Upload wasm JUnit
        if: ${{ always() && matrix.shard == 1 }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-wasm
          path: artifacts/reports/tests/wasm/junit.xml
          if-no-files-found: warn

  test-ios:
    name: test-ios-sim(macos-arm64) shard ${{ matrix.shard }}
    # 冷构建 + 模拟器冷启动。
    timeout-minutes: 60
    needs: toolchain-bootstrap   # `changes` 不在 needs：本 job 的 if: 只看 event_name，从不读 needs.changes.outputs.*
    # Tier-2（浏览器 / 模拟器，慢）：只在 nightly 与手动触发时跑。
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    # 嵌入语料全量分 3 片，每片约 155 个用例，压在模拟器 60 分钟墙内；每片自己起模拟器，R1–R7 并进同一次运行。
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: macos-26
    permissions:
      actions: read     # setup-z42-sdk 回退（gh run download）
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/xtask-bootstrap-artifact
        with:
          cache-key: tier2-ios
          rust-targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin
      # 一条命令，与本地相同：这一片的嵌入语料 + R1–R7 走一次 `xcodebuild test`，z42b 解析模拟器并写 JUnit。
      - name: xtask test app ios (shard ${{ matrix.shard }}/3, one simulator run)
        shell: bash
        run: |
          set -euo pipefail
          xtask test app ios --shard ${{ matrix.shard }}/3
      - name: Publish iOS test report (GitHub Check)
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: platform-tests / ios (shard ${{ matrix.shard }})
          path: artifacts/reports/tests/ios/junit.xml
          reporter: java-junit
          fail-on-error: false
      - name: Upload iOS JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-ios-${{ matrix.shard }}
          path: artifacts/reports/tests/ios/**
          if-no-files-found: warn

  test-android:
    name: test-android-emu(linux-x64) shard ${{ matrix.shard }}
    # 冷 NDK / cargo-ndk 构建 + 模拟器冷启动。
    timeout-minutes: 60
    needs: toolchain-bootstrap   # `changes` 不在 needs：本 job 的 if: 只看 event_name，从不读 needs.changes.outputs.*
    # Tier-2（浏览器 / 模拟器，慢）：只在 nightly 与手动触发时跑。
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    # 嵌入语料全量分 3 片，每片压在模拟器墙内；每片自己起模拟器，R1–R7 并进同一次 connectedAndroidTest。
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # ubuntu-26.04：旧宿主栈上 API 37 模拟器的 surfaceflinger 开机约 1 分钟后 abort（issuetracker 557246813）。
    runs-on: ubuntu-26.04
    permissions:
      actions: read     # setup-z42-sdk 回退（gh run download）
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android NDK r30
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r30
      - uses: ./.github/actions/xtask-bootstrap-artifact
        with:
          cache-key: tier2-android
          rust-targets: aarch64-linux-android,x86_64-linux-android
      # 冷启动、不缓存 AVD 快照（可选的后续提速）。一条命令跑完整条流水线；action 只提供模拟器，z42b 复用已连上的设备。
      - name: xtask test app android on emulator (shard ${{ matrix.shard }}/3)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          Z42_SHARD: ${{ matrix.shard }}
        with:
          api-level: '37.0'   # API 37 packages are named android-37.0; a bare 37 resolves to a non-existent image
          arch: x86_64
          target: google_apis
          working-directory: src/toolchain/workload/android/platform
          force-avd-creation: false
          # The default userdata partition is too small for the androidTest APK with the
          # embedded corpus: `Requested internal only, but not enough space` on install.
          disk-size: 8G
          # -memory 4096：默认约 2GB 跑嵌入语料会 OOM。-no-snapshot：冷启动，不读写快照。
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          disable-animations: true
          # Must stay ONE line: the runner executes each `script:` line in a separate
          # `sh -c`, so the multi-line body (logcat capture + z42b run + tombstones)
          # lives in .github/scripts/android-emulator-test.sh.
          script: bash "$GITHUB_WORKSPACE/.github/scripts/android-emulator-test.sh"
      - name: Upload Android logcat + tombstones (crash diagnostics)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-embed-crash-diagnostics-${{ matrix.shard }}
          path: |
            android-embed-logcat.txt
            android-tombstones/**
          if-no-files-found: warn
      - name: Publish Android test report (GitHub Check)
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: platform-tests / android (shard ${{ matrix.shard }})
          path: 'artifacts/intermediate/toolchain/workload/android/host/z42vm/build/outputs/androidTest-results/connected/**/*.xml'
          reporter: java-junit
          fail-on-error: false
      - name: Upload Android JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-android-${{ matrix.shard }}
          path: artifacts/intermediate/toolchain/workload/android/host/z42vm/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn

  test-desktop:
    name: test-desktop-cabi(linux-x64)
    timeout-minutes: 30
    needs: [changes, toolchain-bootstrap]
    # Tier-1 (desktop C ABI, fast — no emulator/sim/browser): stays per-PR on
    # platform changes (only Tier-2 wasm/iOS/Android moved to nightly-only).
    if: ${{ needs.changes.outputs.platform == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read     # setup-z42-sdk 回退（gh run download）
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      # 吃 toolchain artifact + 本机 cargo 编 z42vm（rust toolchain + cache 由 action 自带）。
      - uses: ./.github/actions/xtask-bootstrap-artifact
      - name: test app desktop (Tier-1 C ABI R1–R7 + embedded corpus)
        shell: bash
        run: |
          set -euo pipefail
          xtask test app desktop
      - name: Publish desktop test report (GitHub Check)
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: platform-tests / desktop
          path: artifacts/reports/tests/desktop/junit.xml
          reporter: java-junit
          fail-on-error: false
      - name: Upload desktop JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-desktop
          path: artifacts/reports/tests/desktop/junit.xml
          if-no-files-found: warn

  # ── 单一结论 job：任一 job failure / cancelled ⇒ 红，success / skipped ⇒ 绿；分支保护只需要它一个。
  # `if: always()`：上游失败时本 job 也要跑出红（被 skip 的 required check 视同通过）。新增 job 时加进 needs。
  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - changes
      - docs-check
      - build-and-test
      - host-package
      - toolchain-bootstrap
      - assemble-current-sdk
      - consume-current-sdk
      - vm-jit-consistency
      - stdlib-jit-consistency
      - stdlib-interp-consistency
      - compiler-checks
      - package-ios
      - package-android
      - package-wasm
      - publish-nightly
      - test-wasm
      - test-ios
      - test-android
      - test-desktop
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded or was skipped
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          results="${RESULTS:?}"
          echo "$results" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'
          bad=$(echo "$results" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"] | join(", ")')
          if [ -n "$bad" ]; then echo "::error::not green: $bad"; exit 1; fi
          echo "✓ all jobs green or skipped"
