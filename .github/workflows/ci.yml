name: CI

on:
  # 纯文档改动照样触发（要跑死链门禁），走 docs-only 快速通道（见 detect-changes）。
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  # 手动全量运行 / 重发 nightly（格式 bump 后旧 nightly 让下载自举的门暂时红时用）：gh workflow run CI --ref main。
  # 救不了 nightly 本身损坏（publish 的 needs 全靠 nightly 自举）——那靠 ci-bootstrap 的种子回退链（ci.md §3.1）。
  workflow_dispatch:
  # 每日全量：补上 push 时被路径过滤跳过的 job，并跑只在这里跑的 Tier-2 平台测试。16:00 UTC = 00:00 UTC+8。
  schedule:
    - cron: '0 16 * * *'

# 同一 ref、同一事件里新的运行取消旧的；事件名进 group，schedule 与 push 不互相取消。
# main 的 push 每个 commit 单独一组（不自动取消），改由 detect-changes 的 xtask ci supersede 只取消
# 不影响 SDK 的旧运行——否则连续合并时 nightly 一个也发不出来（ci.md §2「main 上的运行不互相打断」）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

jobs:
  # 规划器输出重 job 开关；schedule / dispatch 使用完整验证策略。
  changes:
    name: detect-changes
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      actions: write        # supersede：取消被替换的 main push 运行
      contents: read
      pull-requests: read   # Docs-only PR?：读 PR 文件列表
    outputs:
      platform: ${{ steps.filter.outputs.platform }}
      # 非 PR 运行只在确认没有待发布 SDK 改动时收窄。空结果包含定期、手动与无法判定的情况。
      platform_package: ${{ steps.filter.outputs.platform_package }}
      # 宿主还负责 SDK 验证与示例重放。test-host 也使用此结果决定是否卸下示例阶段。
      host_package: ${{ steps.filter.outputs.host_package }}
      compiler: ${{ steps.filter.outputs.compiler }}
      compiler_checks: ${{ steps.filter.outputs.compiler_checks }}
      vm: ${{ steps.filter.outputs.vm }}
      runtime_checks: ${{ steps.filter.outputs.runtime_checks }}
      host_checks: ${{ steps.filter.outputs.host_checks }}
      toolchain_build: ${{ steps.filter.outputs.toolchain_build }}
      test_assets: ${{ steps.filter.outputs.test_assets }}
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
      wasm: ${{ steps.filter.outputs.wasm }}
      stdlib: ${{ steps.filter.outputs.stdlib }}
      docs_only: ${{ steps.filter.outputs.docs_only }}
      docs_checks: ${{ steps.filter.outputs.docs_checks }}
      macos_host_lane: ${{ steps.macos_queue.outputs.host }}
      macos_package_lane: ${{ steps.macos_queue.outputs.package }}
      macos_checks_lane: ${{ steps.macos_queue.outputs.checks }}
      # 当前 nightly → 本 commit 的累计改动是否影响 SDK；只在 push to main 上判，其余事件为空（= 照常发布）。
      sdk: ${{ steps.supersede.outputs.sdk }}
      test_base: ${{ steps.filter.outputs.test_base }}
    steps:
      - uses: actions/checkout@v7

      - name: Bootstrap planner (xtask only)
        uses: ./.github/actions/ci-bootstrap
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          xtask-only: "true"

      - name: Select bounded macOS runner queue
        id: macos_queue
        run: xtask ci queue

      # main 上的运行不互相打断（见顶部 concurrency 注释）：取消较早的、不影响 SDK 的 main push 运行，
      # 并判出本运行是否需要发布 nightly。
      - name: Supersede older main runs
        id: supersede
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # 这一步出错不该拖垮 main：失败时 sdk 输出为空 ⇒ publish-nightly 照常（安全的默认），只是没取消旧运行。
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: xtask ci supersede
      - name: Plan affected flows
        id: filter
        env:
          XTASK_RELEASE_REQUIRED: ${{ steps.supersede.outputs.sdk }}
        shell: bash
        run: xtask flow plan --event-file "$GITHUB_EVENT_PATH" --out artifacts/ci-plan.json --github-output "$GITHUB_OUTPUT"

      - name: Setup Rust for selected runner fixtures
        if: steps.filter.outputs.rust_tools == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Validate selected planner contracts
        run: xtask flow run --plan artifacts/ci-plan.json --job planner

      - name: Share immutable flow plan
        uses: actions/upload-artifact@v7
        with:
          name: ci-plan
          path: artifacts/ci-plan.json

  # ── 纯文档改动的检查：死链与文档结构、诊断码和测试布局对账。不需要 SDK
  #    构建树，xtask 用种子 z42c 编出即可。doc-lints 不在这里：纯文档改动碰不到 stdlib
  #    的 `///`（那是 src/）；它是 `xtask test` 的一个 stage，随 build-and-test 跑。
  docs-check:
    name: docs-check(linux-x64)
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.docs_checks == 'true' && (needs.changes.outputs.host_checks != 'true' || needs.changes.outputs.docs_only == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Bootstrap xtask (seed z42c → current xtask only)
        uses: ./.github/actions/ci-bootstrap
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          xtask-only: "true"

      # `test docs links` 先 `build docs` 生成 reference 的 stdlib 包页（不入库），用的是 xtask 自带的 z42c.syntax——
      # xtask-only 下那是种子 SDK 的解析器；stdlib 用上种子还不认的语法时，到下一次 nightly 前这里会红（窗口很短）。
      - name: Docs gates
        shell: bash
        run: |
          set -euo pipefail
          xtask test docs links
          xtask check diagcodes
          xtask check layout

  build-and-test:
    name: test-host(${{ matrix.platform }})
    # 全量 gate 在 linux-x64 上接近 60 分钟，留余量。
    timeout-minutes: 75
    # 本 job 按规划器要求验证非文档改动；完整 Rust harness 只在 VM 相关改动或定期运行时执行。
    needs: changes
    # 纯文档改动（PR 与 main push）走 docs-check（见 changes 的 Docs-only 步骤）；本 job 被 skip 时 ci-ok 照样绿。
    if: needs.changes.outputs.host_checks == 'true' && needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    platform: linux-x64 }
          - { os: ubuntu-24.04-arm, platform: linux-arm64 }
          - { os: macos-26,         platform: macos-arm64 }
          - { os: windows-latest,   platform: windows-x64 }
    runs-on: ${{ matrix.os }}
    # Three shared lanes bound macOS demand; job classes rotate between them per run.
    # Non-macOS matrix legs keep independent groups and run in parallel.
    concurrency:
      group: ${{ matrix.platform == 'macos-arm64' && format('ci-macos-arm64-{0}', needs.changes.outputs.macos_host_lane) || format('ci-test-host-{0}-{1}', github.run_id, matrix.platform) }}
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ci-plan
          path: artifacts


      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # 独立 cache key：compile-toolchain 只编 release 且先结束，共用 key 时本 job 额外编的 debug / test 依赖从不回存。
      - name: Cache Rust deps (Swatinem)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/runtime -> ../../artifacts/build/runtime
          shared-key: test-host-v1

      # 每条腿都用上一版 nightly 的 z42c 种子从源码自举（自举纪律保证能编过），之后一切经 xtask。
      - name: Bootstrap toolchain (nightly z42c seed → current source)
        uses: ./.github/actions/ci-bootstrap
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate host from the shared plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci-logs
          xtask ci test-host --plan artifacts/ci-plan.json 2>&1 | tee artifacts/ci-logs/test-all.log

      # 失败时把 stage 保留的临时输出传上来（runner 回收后就没了）。
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.os }}
          path: |
            artifacts/ci-logs/
            /tmp/z42-test-all.*
            /var/folders/*/*/T/z42-test-all.*
          retention-days: 7
          if-no-files-found: warn

  # ── 宿主 RID 打包（4 个 OS），与 host 测试并行，吃共享的 toolchain artifact；publish-nightly 消费其上传。
  host-package:
    name: package-host(${{ matrix.platform }})
    timeout-minutes: 45
    needs: [changes, toolchain-bootstrap]
    # SDK 验证和示例重放也需要桌面 SDK（包括 Windows）。runtime / workload 包按平台打包职责选择。
    if: needs.changes.outputs.host_package == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    platform: linux-x64 }
          - { os: ubuntu-24.04-arm, platform: linux-arm64 }
          - { os: macos-26,         platform: macos-arm64 }
          - { os: windows-latest,   platform: windows-x64 }
    runs-on: ${{ matrix.os }}
    concurrency:
      group: ${{ matrix.platform == 'macos-arm64' && format('ci-macos-arm64-{0}', needs.changes.outputs.macos_package_lane) || format('ci-package-host-{0}-{1}', github.run_id, matrix.platform) }}
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      # 独立 cache key：打包另编 cdylib / staticlib / compression / apphost，共用窄 key 会每次冷编（Windows 6~8 分钟）。
      - uses: ./.github/actions/xtask-bootstrap-artifact
        with:
          cache-key: package-host-v3

      - name: Package host SDK + verify
        shell: bash
        run: |
          set -euo pipefail
          # --no-build：z42c / stdlib 用 artifact 里还原的；包自己的原生库照编。
          # --archive：在本 runner 上出归档（保留可执行位；Windows 出 zip）。PR 上也出——下面的 Installer smoke 装的就是它。
          # --verify：在这份 SDK 上跑 packages.toml 自检 + 发行包夹具 + golden（每条腿都必须跑到）。
          xtask package sdk --no-build --archive --label nightly --verify

      - name: Relocated dynamic execution components + C host
        if: needs.changes.outputs.platform_package == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y gdb
          fi
          xtask package runtime --linkage dynamic --profile debug --no-build --verify

      - name: Package host runtime and workloads
        if: needs.changes.outputs.platform_package == 'true'
        shell: bash
        run: |
          set -euo pipefail
          xtask package runtime --no-build --archive --label nightly --verify
          xtask package workload --archive --label nightly
          # test workload = payload-only, platform-agnostic → build once on macos-arm64
          # (package-test-workload) → z42-workload-nightly-test.tar.gz.
          if [ "${{ matrix.platform }}" = "macos-arm64" ]; then
            xtask package workload test --archive --label nightly
          fi

      - name: Learn-book examples (packaged SDK)
        # 本 job 被选中时负责各平台的示例重放；使用真实打包 SDK，Windows 也在此验证。
        shell: bash
        run: |
          set -euo pipefail
          pkg_dir=$(ls -d "$PWD"/artifacts/packages/z42-*-release | head -1)
          xtask test docs examples --sdk "$pkg_dir"

      - name: Installer smoke (offline, packaged SDK)
        # 统一安装脚本（scripts/install-z42.*）对刚打出的 SDK 包跑一遍 `--archive` 离线安装：
        # 装进临时 home → `z42 --version` → `z42 new` + `z42 run`。第二次安装同一份包必须
        # 保留安装目录里的非 SDK 内容（workload 等）。网络下载路径由 nightly 发布后的真实 URL 覆盖。
        shell: bash
        run: |
          set -euo pipefail
          # 装的是上面 `--archive` 出的**发布归档**本身（与 nightly / release 上传的同一个文件）。
          rid="${{ matrix.platform }}"
          home="$RUNNER_TEMP/z42-install-home"
          rm -rf "$home"; mkdir -p "$home/runtimes/keep"
          if [ "${RUNNER_OS:-}" = "Windows" ]; then
            archive="$PWD/artifacts/packages/z42-sdk-nightly-${rid}.zip"
            pwsh -NoProfile -File scripts/install-z42.ps1 -Archive "$archive" -Dest "$home" -NoModifyPath
            z42="$home/z42.exe"
          else
            archive="$PWD/artifacts/packages/z42-sdk-nightly-${rid}.tar.gz"
            sh scripts/install-z42.sh --archive "$archive" --dest "$home" --no-modify-path
            z42="$home/z42"
          fi
          "$z42" --version | grep -E '^z42 [0-9]'
          test -d "$home/runtimes/keep" || { echo "error: installer removed non-SDK content"; exit 1; }
          work="$RUNNER_TEMP/z42-install-work"; rm -rf "$work"; mkdir -p "$work"; cd "$work"
          env -u Z42_PORTABLE_VM -u Z42_LIBS -u Z42_HOME "$z42" new hello
          cd hello
          out=$(env -u Z42_PORTABLE_VM -u Z42_LIBS -u Z42_HOME "$z42" run | tr -d '\r')
          [ "$out" = "Hello, World!" ] || { echo "error: z42 run printed '$out'"; exit 1; }
          echo "✓ installed SDK: new + run → Hello, World!"

      - name: C host links the packaged runtime (static + dynamic)
        # 同一套 R1–R7 C 宿主（test-desktop-cabi 用的那份 r1_r7.c）改链**打出来的 runtime 包**，
        # 静态一遍、动态一遍（经 rpath 找 libz42.{dylib,so}）——install name / SONAME 坏了，动态那遍就加载不了。
        # 打包模式只跑 R1–R7：嵌入语料用的是构建树的 VM，与包无关，归 test-desktop-cabi。
        # Windows 没有 `cc`，上一步按文件检查 import lib。
        if: runner.os != 'Windows' && needs.changes.outputs.platform_package == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rt_dir=$(ls -d "$PWD"/artifacts/packages/z42-runtime-*-"${{ matrix.platform }}" | head -1)
          Z42_RUNTIME_DIR="$rt_dir" xtask test app desktop

      - name: Upload host archives
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: release-host-${{ matrix.platform }}
          path: |
            artifacts/packages/z42-*.tar.gz
            artifacts/packages/z42-*.zip
          retention-days: 14
          if-no-files-found: error

  # ── toolchain artifact：只自举一次（种子 z42c → 当前 z42c + stdlib + xtask），把 zpkg 快照上传为
  # toolchain-ubuntu-latest，打包 / 平台测试 job 下载后各自 cargo 编 z42vm，并行跑。产物与宿主无关，只要 linux 一条腿。
  toolchain-bootstrap:
    name: compile-toolchain(linux-x64)
    timeout-minutes: 30
    # 需要代码验证时构建：artifact 是打包 / 平台测试 / current-sdk 各 job 的根。
    needs: changes
    if: needs.changes.outputs.toolchain_build == 'true' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust deps (Swatinem)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/runtime -> ../../artifacts/build/runtime
          shared-key: host-v2

      - name: Bootstrap toolchain (nightly z42c seed → current source)
        uses: ./.github/actions/ci-bootstrap
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      # z42b 进这个 artifact（tier-2 设备 job 经它跑），按当前 z42c 编；`package ci` 只组装。
      - name: Snapshot built toolchain (package ci; zpkg products only)
        shell: bash
        run: |
          set -euo pipefail
          xtask build toolchain z42b
          xtask package ci "$RUNNER_TEMP/tc"

      # 只跑 xtask、不调 cargo 的 linux-x64 消费方（`vm: prebuilt`）直接用这份 z42vm。
      # cdylib（libz42_compression.so 等）一起带上：VM 在自己旁边解析 `[Native(lib = …)]`。
      - name: Upload z42vm-linux-x64
        uses: actions/upload-artifact@v7
        with:
          name: z42vm-linux-x64
          path: |
            artifacts/build/runtime/release-dynamic/z42vm
            artifacts/build/runtime/release-dynamic/*.so
          retention-days: 3
          if-no-files-found: error

      # 名字保留 `-ubuntu-latest` 后缀：xtask-bootstrap-artifact 按这个名字取。
      - name: Upload toolchain-ubuntu-latest
        uses: actions/upload-artifact@v7
        with:
          name: toolchain-ubuntu-latest
          path: ${{ runner.temp }}/tc/
          retention-days: 3
          if-no-files-found: error

  # ── current-sdk：组装 `.z42` 布局 + 打包 golden .zbc，给 test-consume / test-vm-jit。单独成 job，不拖关键路径。
  assemble-current-sdk:
    name: compile-test-assets(linux-x64)
    timeout-minutes: 30
    needs: [changes, toolchain-bootstrap]
    if: needs.changes.outputs.test_assets == 'true'
    # 消费方只下载 linux 这一份。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 只编 z42 测试资产与组装 SDK，直接复用同轮已建的 release VM，无需再调 cargo。
      - uses: ./.github/actions/xtask-bootstrap-artifact
        with:
          vm: prebuilt

      # golden .zbc 只在这里编一次，下游 interp / jit 跑同一份字节（.zbc 与执行模式无关）。
      - name: Build golden .zbc test assets (compile shared assets once)
        shell: bash
        run: |
          xtask build test

      - name: Assemble .z42 toolchain (package dev-sdk) + bundle goldens
        shell: bash
        run: |
          set -euo pipefail
          xtask package dev-sdk --out "$RUNNER_TEMP/z42sdk"
          # Keep the build mirror paths so both consumers find language and library goldens.
          cd artifacts/build
          shopt -s nullglob
          tar -cf "$RUNNER_TEMP/z42sdk/goldens.tar" tests libraries/*/release/tests

      - name: Upload current-sdk-ubuntu-latest
        uses: actions/upload-artifact@v7
        with:
          name: current-sdk-ubuntu-latest
          path: ${{ runner.temp }}/z42sdk/
          retention-days: 3
          if-no-files-found: error

  # ── 证明下载来的 current-sdk 是自包含工具链：只用它自己的 z42vm / z42c / libs 编并跑一个真实工程（xtask）。
  consume-current-sdk:
    name: test-consume(linux-x64)
    timeout-minutes: 30
    needs: assemble-current-sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download current-sdk-ubuntu-latest
        uses: actions/download-artifact@v8
        with:
          name: current-sdk-ubuntu-latest
          path: .z42-dl
      - name: Compile + run via ONLY the downloaded toolchain (consume smoke)
        shell: bash
        run: |
          set -euo pipefail
          TC="$PWD/.z42-dl"
          chmod +x "$TC/bin/z42vm"
          ls "$TC/programs/z42c/" "$TC/libs/" >/dev/null
          # 直接调 driver 时由 Z42_HOME 给出编译器目录 <sdk>/programs/z42c（xtask 的 z42.project / z42.build 是 deploy = "sdk"）；
          # 运行期侧车的 ${Z42_HOME}/programs/z42c 由 VM 从自己的位置展开——下面的 `build -h` 就是实测。
          Z42_HOME="$TC" Z42_LIBS="$TC/libs" "$TC/bin/z42vm" "$TC/programs/z42c/z42c.driver.zpkg" --mode interp -- \
            build scripts/xtask.z42.toml --release --output-dir "$RUNNER_TEMP/consume-out"
          test -f "$RUNNER_TEMP/consume-out/xtask.zpkg" \
            || { echo "::error::current-sdk compile failed — no xtask.zpkg"; exit 1; }
          # execute the just-compiled zpkg on the toolchain's z42vm (proves run, not just compile)
          out=$(Z42_LIBS="$TC/libs" "$TC/bin/z42vm" "$RUNNER_TEMP/consume-out/xtask.zpkg" -- build -h)
          echo "$out" | grep -q "build compiler\|SUBCOMMANDS" \
            && echo "✅ current-sdk compiles AND runs (cross-job, self-contained)" \
            || { echo "::error::current-sdk run failed"; echo "$out"; exit 1; }
      # current-sdk 里带着只编一次的 golden .zbc；解到规范镜像位置，`--no-rebuild` 直接跑（interp / jit 跑同一份字节）。
      - name: Extract bundled goldens (shared compiled asset)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/build
          tar -xf .z42-dl/goldens.tar -C artifacts/build
      # 无筛选的 e2e 已包含 cross-zpkg 与 multi-exe；golden 消费共享字节，夹具使用下载的工具链编跑一次。
      - name: Run INTERP e2e (shared goldens + cross-zpkg + multi-exe)
        shell: bash
        run: |
          set -euo pipefail
          TC="$PWD/.z42-dl"
          Z42_LIBS="$TC/libs" "$TC/bin/z42vm" "$RUNNER_TEMP/consume-out/xtask.zpkg" -- \
            --toolchain "$TC" test e2e --mode interp --no-rebuild --jobs 4

  # ── VM goldens 的 JIT 门（唯一的一道）：test-host 只跑 interp。cranelift 行为与宿主无关，linux-x64 一条足够。
  vm-jit-consistency:
    name: test-vm-jit(linux-x64) shard ${{ matrix.shard }}
    # 2 个分片，各跑一段共享的 golden .zbc（不再各自重生）。
    timeout-minutes: 55
    runs-on: ubuntu-latest
    needs: [changes, toolchain-bootstrap, assemble-current-sdk]
    # vm 或 compiler 改动都要跑：编译器的优化 pass 会重排 IR，JIT 的输入变了（test-host 只覆盖 interp）。
    if: ${{ needs.changes.outputs.vm == 'true' || needs.changes.outputs.compiler == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@v7

      # `test e2e` 自建 debug VM 与压缩库，保留断言覆盖。
      - uses: ./.github/actions/xtask-bootstrap-artifact
        with:
          vm: deferred
          cache-key: vm-jit-debug-v1

      # 共享 golden .zbc 解到规范镜像位置（.zbc 与执行模式无关、z42c 输出确定，等价于本地重生）。
      - name: Download shared golden .zbc (compiled once)
        uses: actions/download-artifact@v8
        with:
          name: current-sdk-ubuntu-latest
          path: .z42-dl
      - name: Extract bundled goldens
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/build
          tar -xf .z42-dl/goldens.tar -C artifacts/build

      - name: VM goldens — JIT mode (shard ${{ matrix.shard }}/2)
        shell: bash
        run: |
          set -euo pipefail
          # --no-rebuild：直接跑共享 .zbc；JIT 的逐 case 编译发生在运行时（这正是本门要测的）。
          xtask test e2e --mode jit --no-rebuild --shard ${{ matrix.shard }}/2 --jobs=4

  # One matrix covers JIT's two shards and the three host-dependent interp legs.
  stdlib-consistency:
    name: test-stdlib-${{ matrix.mode }}(${{ matrix.platform }})${{ matrix.shard && format(' shard {0}', matrix.shard) || '' }}
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    needs: [changes, toolchain-bootstrap]
    if: needs.changes.outputs.stdlib == 'true'
    concurrency:
      group: ${{ matrix.platform == 'macos-arm64' && format('ci-macos-arm64-{0}', needs.changes.outputs.macos_checks_lane) || format('ci-stdlib-{0}-{1}-{2}-{3}', github.run_id, matrix.platform, matrix.mode, matrix.shard) }}
      queue: max
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    platform: linux-x64,   mode: jit,    shard: 1/2 }
          - { os: ubuntu-latest,    platform: linux-x64,   mode: jit,    shard: 2/2 }
          - { os: ubuntu-latest,    platform: linux-x64,   mode: interp }
          - { os: ubuntu-24.04-arm, platform: linux-arm64, mode: interp }
          - { os: macos-26,         platform: macos-arm64, mode: interp }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ci-plan
          path: artifacts
      - uses: ./.github/actions/xtask-bootstrap-artifact
        with:
          vm: prebuilt
      - name: Run stdlib tests
        shell: bash
        run: xtask test stdlib --plan artifacts/ci-plan.json --no-build --mode ${{ matrix.mode }} --jobs 4 ${{ matrix.shard && format('--shard {0}', matrix.shard) || '' }}

  # ── cross-zpkg 在 test-host(linux-x64) 的 gate 里跑：夹具用 release z42vm 编、debug z42vm 跑（保留 debug 断言）。
  # 不跑 JIT 版：zpkg 链接是字节码层的，JIT 执行正确性由 vm-jit goldens 覆盖。

  # ── 编译器检查（与宿主无关，linux 一次）：自举不动点 gen1 == gen2 + z42c [Test] units + vscode 语法同步；
  # test-host 跳过它们。「上一版 nightly 能编当前源」由每个跑 ci-bootstrap 的 job 顺带实测。
  compiler-checks:
    name: compiler-checks(linux-x64)
    timeout-minutes: 30
    needs: [changes, toolchain-bootstrap]
    if: ${{ needs.changes.outputs.compiler_checks == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ci-plan
          path: artifacts


      # 复用同轮 release VM、gen1 和 stdlib，仍由测试重建 gen2。
      - uses: ./.github/actions/xtask-bootstrap-artifact
        with:
          vm: prebuilt

      - name: z42c self-host fixpoint, units and CLI fixtures
        shell: bash
        run: |
          set -euo pipefail
          xtask flow run --plan artifacts/ci-plan.json --job compiler-checks

      - name: VSCode grammar ↔ Lexer keyword sync (xtask check vscode-syntax)
        shell: bash
        run: |
          set -euo pipefail
          xtask check vscode-syntax

  # ── iOS packaging ──────────────────────────────────────────────────────
  # Packages ios-arm64 + iossim-arm64. Requires Xcode (pre-installed on
  # macos-26 arm64) + iOS Rust targets. The source bootstrap also builds z42c.
  package-ios:
    name: package-ios(macos-arm64)
    timeout-minutes: 45
    # PR 上只在 platform 改动时跑（同 host-package）。
    needs: [changes, toolchain-bootstrap]
    if: needs.changes.outputs.platform_package == 'true' || needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    concurrency:
      group: ${{ format('ci-macos-arm64-{0}', needs.changes.outputs.macos_checks_lane) }}
      queue: max
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/xtask-bootstrap-artifact
        with:
          cache-key: ios-v2
          rust-targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Package ios-arm64 + iossim-arm64 (xtask package)
        shell: bash
        run: |
          set -euo pipefail
          # --archive：平台 tooling 包只由主 RID（ios-arm64）出归档，iossim 那份说明后跳过。
          for rid in ios-arm64 iossim-arm64; do
            xtask package runtime --rid "$rid" --archive --label nightly
          done
          xtask package runtime --rid iossim-arm64 --no-build --verify

      - name: Upload iOS archives
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: release-ios
          path: |
            artifacts/packages/z42-*.tar.gz
            artifacts/packages/z42-*.zip
          retention-days: 14
          if-no-files-found: error

  # ── Android packaging ───────────────────────────────────────────────────
  # Packages android-arm64 + android-x64 via cargo-ndk + NDK r30.
  package-android:
    name: package-android(linux-x64)
    timeout-minutes: 45
    # PR 上只在 platform 改动时跑（同 host-package）。
    needs: [changes, toolchain-bootstrap]
    if: needs.changes.outputs.platform_package == 'true' || needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Install from crates.io: Release asset outages must not block Android packaging.
      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@4.1.2
          fallback: cargo-install

      # local-cache: false — local-cache produced an incomplete ANDROID_NDK_HOME
      # (clang missing under toolchains/llvm/prebuilt/) causing libffi-sys's
      # configure to fail. Fresh download is ~2 min slower but reliable.
      - name: Setup Android NDK r30
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r30
          local-cache: false

      - uses: ./.github/actions/xtask-bootstrap-artifact
        with:
          cache-key: android-v2
          rust-targets: aarch64-linux-android,x86_64-linux-android

      - name: Package android-arm64 + android-x64 (xtask package)
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          # --archive：平台 tooling 包只由主 RID（android-arm64）出归档，android-x64 那份说明后跳过。
          for rid in android-arm64 android-x64; do
            xtask package runtime --rid "$rid" --archive --label nightly
          done

      - name: Upload Android archives
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: |
            artifacts/packages/z42-*.tar.gz
            artifacts/packages/z42-*.zip
          retention-days: 14
          if-no-files-found: error

  # ── wasm 打包：先 `test app wasm build` 产出 pkg-web/ + pkg-nodejs/，打包才能组装（wasm-pack 不需要 Node）。
  package-wasm:
    name: package-wasm(linux-x64)
    timeout-minutes: 40
    # PR 上只在 platform 改动时跑（同 host-package）。
    needs: [changes, toolchain-bootstrap]
    if: needs.changes.outputs.platform_package == 'true' || needs.changes.outputs.wasm == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install wasm-pack + wasm-tools
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.1,wasm-tools

      - uses: ./.github/actions/xtask-bootstrap-artifact
        with:
          cache-key: wasm-v2
          rust-targets: wasm32-unknown-unknown
      - uses: ./.github/actions/setup-wasm-opt

      # 发布依赖图不许混进 cranelift；宿主白盒测试的 dev-dependencies 不属于发布产物。
      # 同时检查 interp-only 和真实 wasm 入口，避免目标或 feature 选择掩盖 JIT 依赖。
      - name: Verify cranelift excluded under interp-only
        shell: bash
        run: |
          set -euo pipefail
          cargo tree --locked -p z42 --manifest-path src/runtime/Cargo.toml \
            --edges normal,build --no-default-features --features interp-only > /tmp/interp-deps.txt
          cargo tree --locked --manifest-path src/toolchain/workload/wasm/platform/Cargo.toml \
            --target wasm32-unknown-unknown --edges normal,build > /tmp/wasm-deps.txt
          if grep -E 'cranelift|z42-jit' /tmp/interp-deps.txt /tmp/wasm-deps.txt; then
            echo "ERROR: JIT dependency present in interpreter publication graph" >&2
            exit 1
          fi

      - name: Build wasm platform (pkg-web/ + pkg-nodejs/ via `xtask test app wasm build`)
        shell: bash
        run: |
          set -euo pipefail
          xtask test app wasm build

      - name: Package browser-wasm (xtask package)
        shell: bash
        run: |
          set -euo pipefail
          xtask package runtime --rid browser-wasm --archive --label nightly --verify

      - name: Rebuild final WASM after static component packaging
        shell: bash
        run: xtask test app wasm build

      # 每个 push / PR 真跑一次 wasm VM（上面只编译、校验、打包；真执行的 test-wasm-browser 只在 nightly）——
      # 第一次 loadZbc 就 trap 的 VM 能一路打包通过。pkg-nodejs 已由上面的 `test app wasm build` 建在暂存的 host 副本里。
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: pkg-nodejs smoke (load + invoke Hello.Main in Node, no browser)
        shell: bash
        run: |
          set -euo pipefail
          xtask test app wasm assets
          node artifacts/intermediate/toolchain/workload/wasm/host/demo/node/run.js

      - name: Upload wasm archives
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: release-wasm
          path: |
            artifacts/packages/z42-*.tar.gz
            artifacts/packages/z42-*.zip
          retention-days: 14
          if-no-files-found: error

  # ── nightly 滚动预发布：main 的 SDK 改动把 9 个 RID 的归档原地更新到同一个 `nightly` Release（URL 稳定：
  #   https://github.com/<owner>/z42/releases/download/nightly/z42-sdk-nightly-<rid>.{tar.gz,zip}）。不签名，--prerelease。
  publish-nightly:
    name: publish-nightly
    timeout-minutes: 40
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.changes.outputs.sdk != 'false'
    # needs 只列编 / 测 / 打包**当前源码**的 job。所有自举都从上一版 nightly 起步，自愈靠 自举纪律
    # （上一版 nightly 必须能编当前源）。不要加纯下载自举的门（vm-jit / stdlib-jit）：格式 bump 时它们会暂时红、
    # 下次自愈，把 publish 挂在它们身上只会多一条死锁边。
    needs:
      - changes               # sdk == false（nightly 之后只改了文档 / 测试）⇒ 没有新东西可发
      - build-and-test
      - host-package
      - package-ios
      - package-android
      - package-wasm
      - toolchain-bootstrap   # provides the toolchain artifact for `xtask package release`
    runs-on: ubuntu-latest
    # 所有事件的 publish-nightly 串行（job 级 group）：并发的两次会交错改同一个 nightly Release；不取消，排队等前一个发完。
    concurrency:
      group: publish-nightly-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      actions: read     # setup-z42-sdk 回退（gh run download）
      contents: write   # gh release upload / edit / create + tag ref PATCH
    steps:
      - uses: actions/checkout@v7

      # 防回退：main 的运行不再互相取消，较早的运行可能在较新的之后才排到发布（本 job 的 group 串行）。
      # nightly 已指向本 commit 的后代 ⇒ 跳过，不拿旧 commit 覆盖新 nightly。
      - name: Skip if nightly is already newer
        id: stale
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cur=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/nightly" -q .object.sha 2>/dev/null || true)
          stale=false
          if [ -n "$cur" ] && [ "$cur" != "$GITHUB_SHA" ]; then
            rel=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...${cur}" -q .status 2>/dev/null || true)
            if [ "$rel" = "ahead" ]; then stale=true; fi
          fi
          echo "nightly @ ${cur:-<none>}, this run @ $GITHUB_SHA ⇒ stale=$stale"
          echo "stale=$stale" >> "$GITHUB_OUTPUT"

      - name: Provision z42vm + xtask (consume toolchain artifact)
        if: steps.stale.outputs.stale != 'true'
        uses: ./.github/actions/xtask-bootstrap-artifact
        with:
          vm: prebuilt

      # 各 package job 已在自己的 runner 上用 `--archive` 出好归档——upload-artifact 不保留可执行位，
      # 所以不能下载包目录到这里再打。
      - name: Download all release archives
        if: steps.stale.outputs.stale != 'true'
        uses: actions/download-artifact@v8
        with:
          path: artifacts/packages
          pattern: 'release-*'
          merge-multiple: true

      # 合并 4 份逐 RID 桌面 workload → SHA256SUMS → release-index.json（与 release.yml 同一条命令）。
      - name: Release aggregate (nightly)
        if: steps.stale.outputs.stale != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ls -la artifacts/packages/
          xtask package release nightly --channel nightly --tag nightly --version nightly

      # 原地更新 nightly，绝不删了重建：GitHub 上旧 tag 的延迟删除可能落在新 tag 之后，Release 失去 tag 会静默变回
      # draft——其它运行的 GITHUB_TOKEN 看不见它，所有种子下载失败、CI 死锁。所以只做：上传（--clobber）→ 删掉本次
      # 不再发的资产 → PATCH 移动 tag → 改标题 / 说明。
      - name: Update nightly release in place
        if: steps.stale.outputs.stale != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          short_sha=$(git rev-parse --short HEAD)
          today=$(date -u +%Y-%m-%d)
          # 安装命令与下载表由上一步 `xtask package release` 按 versions.toml 生成（release-notes.md，不作附件）；
          # 先读进变量：heredoc 里的命令替换失败不会触发 set -e。
          generated=$(cat artifacts/packages/release-notes.md)
          notes=$(cat <<EOF
          **Rolling pre-release** built from \`main\` on ${today} (commit \`${short_sha}\`).

          - **Unsigned** — do not use for production.
          - **Replaced on every push to main** — URL stays stable, contents change.
          - For tagged releases see [Releases](../../releases?q=v).

          ${generated}
          EOF
          )
          title="Nightly (main @ ${short_sha} · ${today})"
          assets=(artifacts/packages/SHA256SUMS artifacts/packages/release-index.json
                  artifacts/packages/z42-* scripts/install-z42.sh scripts/install-z42.ps1)
          if gh release view nightly >/dev/null 2>&1; then
            # (1) assets first — sequential --clobber with verified receipts and bounded retries
            xtask ci upload-release nightly "${assets[@]}"
            # (2) drop assets this build no longer ships (e.g. a renamed package)
            keep=" "
            for f in "${assets[@]}"; do keep="${keep}$(basename "$f") "; done
            for name in $(gh release view nightly --json assets -q '.assets[].name'); do   # asset names have no spaces
              case "$keep" in
                *" $name "*) ;;
                *) echo "  removing stale asset $name"; gh release delete-asset nightly "$name" --yes ;;
              esac
            done
            # (3) move the tag to this commit — the release follows the tag NAME, so it never detaches
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            # (4) metadata; target = the commit setup-z42-sdk records as the seed identity
            gh release edit nightly --title "$title" --notes "$notes" --target "$GITHUB_SHA" --prerelease --draft=false
          else
            # No nightly at all (first publish, or deleted by hand): create once; later runs only update.
            gh release create nightly --prerelease --target "$GITHUB_SHA" --title "$title" --notes "$notes" "${assets[@]}"
          fi
          # Verify: published (a DRAFT is invisible to other runs' GITHUB_TOKEN ⇒ every
          # download-bootstrap job fails), tag on this commit, every asset present.
          if [ "$(gh release view nightly --json isDraft -q .isDraft)" = "true" ]; then
            echo "::error::nightly release is a draft — download-bootstrap jobs will fail"; exit 1
          fi
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/nightly" -q .object.sha)
          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "::error::nightly tag points at $tag_sha, expected $GITHUB_SHA"; exit 1
          fi
          have=" $(gh release view nightly --json assets -q '.assets[].name' | tr '\n' ' ')"
          for f in "${assets[@]}"; do
            case "$have" in
              *" $(basename "$f") "*) ;;
              *) echo "::error::asset $(basename "$f") missing after publish"; exit 1 ;;
            esac
          done
          echo "✓ nightly @ ${short_sha} published in place (non-draft, tag moved, assets complete)"

  # ── Tier-2 平台测试（nightly）：wasm（Playwright）、iOS 模拟器、Android 模拟器，各自把 JUnit 发成 Check。
  test-wasm:
    name: test-wasm-browser(linux-x64) ${{ matrix.shard == 0 && 'smoke' || format('shard {0}/3', matrix.shard) }}
    # 冷构建（wasm-pack LTO + 全语料编译）约 27 分钟，加上分片的浏览器内运行。
    timeout-minutes: 75
    needs: [changes, toolchain-bootstrap]
    # Browser-executor PRs run smoke; scheduled/manual validation runs the full corpus.
    if: ${{ needs.changes.outputs.wasm == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    # 嵌入语料全量分 3 片（`--shard k/3`）；R1–R7 与语料无关，只在第 1 片跑。
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('[1,2,3]') || fromJSON('[0]') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read     # setup-z42-sdk 回退（gh run download）
      contents: read
      checks: write
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/artifacts/tools/playwright-browsers
    steps:
      - uses: actions/checkout@v7
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/toolchain/workload/wasm/platform/tests/package-lock.json
      # 按 lockfile 里钉住的 playwright 版本缓存浏览器二进制（Chromium 约 150MB）。
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/artifacts/tools/playwright-browsers
          key: playwright-${{ runner.os }}-${{ hashFiles('src/toolchain/workload/wasm/platform/tests/package-lock.json') }}
      - uses: ./.github/actions/xtask-bootstrap-artifact
        with:
          cache-key: tier2-wasm
          rust-targets: wasm32-unknown-unknown
      - uses: ./.github/actions/setup-wasm-opt
      - name: Prime Playwright (node deps + Chromium + OS libs)
        shell: bash
        run: |
          set -euo pipefail
          # node deps go into the staged host copy (where `test app wasm` runs Playwright).
          xtask test app wasm stage
          cd artifacts/intermediate/toolchain/workload/wasm/host/tests
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      # 整条设备流水线就是一条命令，与本地相同（test-layout §6）；步骤顺序归 `xtask test app`。
      - name: xtask test app wasm (shard ${{ matrix.shard }}/3)
        shell: bash
        run: |
          set -euo pipefail
          xtask test app wasm ${{ matrix.shard != 0 && format('--shard {0}/3', matrix.shard) || '' }}
      # R1–R7 junit exists only on shard 1 (Playwright embedded reports via `list`,
      # not junit — its result is the step exit code above).
      - name: Publish wasm test report (GitHub Check)
        if: ${{ always() && matrix.shard <= 1 }}
        uses: dorny/test-reporter@v3
        with:
          name: platform-tests / wasm
          path: artifacts/reports/tests/wasm/junit.xml
          reporter: java-junit
          fail-on-error: false
      - name: Upload wasm JUnit
        if: ${{ always() && matrix.shard <= 1 }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-wasm
          path: artifacts/reports/tests/wasm/junit.xml
          if-no-files-found: warn

  test-ios:
    name: test-ios-sim(macos-arm64) shard ${{ matrix.shard }}
    # 冷构建 + 模拟器冷启动。
    timeout-minutes: 60
    needs: [changes, toolchain-bootstrap]   # macOS 原生资源槽由 changes 输出。
    # Platform changes run embedding/JIT/compression smoke; nightly/manual retains the full corpus.
    if: needs.changes.outputs.platform_package == 'true' || needs.changes.outputs.ios == 'true'
    # 嵌入语料全量分 3 片，每片约 155 个用例，压在模拟器 60 分钟墙内；每片自己起模拟器，R1–R7 并进同一次运行。
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '[1,2,3]' || '[1]') }}
    runs-on: macos-26
    concurrency:
      group: ${{ format('ci-macos-arm64-{0}', needs.changes.outputs.macos_checks_lane) }}
      queue: max
      cancel-in-progress: false
    permissions:
      actions: read     # setup-z42-sdk 回退（gh run download）
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/xtask-bootstrap-artifact
        with:
          cache-key: tier2-ios
          rust-targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin
      # 一条命令，与本地相同：这一片的嵌入语料 + R1–R7 走一次 `xcodebuild test`，z42b 解析模拟器并写 JUnit。
      - name: xtask test app ios (shard ${{ matrix.shard }}/3, one simulator run)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = schedule ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then
            xtask test app ios --shard ${{ matrix.shard }}/3
          else
            xtask test app ios --filter z42.compression
          fi
      - name: Publish iOS test report (GitHub Check)
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: platform-tests / ios (shard ${{ matrix.shard }})
          path: artifacts/reports/tests/ios/junit.xml
          reporter: java-junit
          fail-on-error: false
      - name: Upload iOS JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-ios-${{ matrix.shard }}
          path: artifacts/reports/tests/ios/**
          if-no-files-found: warn

  test-android:
    name: test-android-emu(linux-x64) shard ${{ matrix.shard }}
    # 冷 NDK / cargo-ndk 构建 + 模拟器冷启动。
    timeout-minutes: 60
    needs: [changes, toolchain-bootstrap]
    # Platform PRs run one smoke lane (embedding contracts + JIT + compression).
    # Nightly/manual runs retain the full corpus in three shards.
    if: needs.changes.outputs.platform_package == 'true' || needs.changes.outputs.android == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '[1,2,3]' || '[1]') }}
    # ubuntu-26.04：旧宿主栈上 API 37 模拟器的 surfaceflinger 开机约 1 分钟后 abort（issuetracker 557246813）。
    runs-on: ubuntu-26.04
    permissions:
      actions: read     # setup-z42-sdk 回退（gh run download）
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Install from crates.io: Release asset outages must not block Android packaging.
      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@4.1.2
          fallback: cargo-install
      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android NDK r30
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r30
      - uses: ./.github/actions/xtask-bootstrap-artifact
        with:
          cache-key: tier2-android
          rust-targets: aarch64-linux-android,x86_64-linux-android
      # 冷启动、不缓存 AVD 快照（可选的后续提速）。一条命令跑完整条流水线；action 只提供模拟器，z42b 复用已连上的设备。
      - name: xtask test app android on emulator (shard ${{ matrix.shard }}/3)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          Z42_SHARD: ${{ matrix.shard }}
          Z42_ANDROID_SMOKE: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && '1' || '0' }}
        with:
          api-level: '37.0'   # API 37 packages are named android-37.0; a bare 37 resolves to a non-existent image
          arch: x86_64
          target: google_apis
          working-directory: src/toolchain/workload/android/platform
          force-avd-creation: false
          # The default userdata partition is too small for the androidTest APK with the
          # embedded corpus: `Requested internal only, but not enough space` on install.
          disk-size: 8G
          # -memory 4096：默认约 2GB 跑嵌入语料会 OOM。-no-snapshot：冷启动，不读写快照。
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          disable-animations: true
          # Must stay ONE line: the runner executes each `script:` line in a separate
          # `sh -c`, so the multi-line body (logcat capture + z42b run + tombstones)
          # lives in .github/scripts/android-emulator-test.sh.
          script: bash "$GITHUB_WORKSPACE/.github/scripts/android-emulator-test.sh"
      - name: Upload Android logcat + tombstones (crash diagnostics)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-embed-crash-diagnostics-${{ matrix.shard }}
          path: |
            android-embed-logcat.txt
            android-tombstones/**
          if-no-files-found: warn
      - name: Publish Android test report (GitHub Check)
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: platform-tests / android (shard ${{ matrix.shard }})
          path: 'artifacts/intermediate/toolchain/workload/android/host/z42vm/build/outputs/androidTest-results/connected/**/*.xml'
          reporter: java-junit
          fail-on-error: false
      - name: Upload Android JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-android-${{ matrix.shard }}
          path: artifacts/intermediate/toolchain/workload/android/host/z42vm/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn

  test-desktop:
    name: test-desktop-cabi(linux-x64)
    timeout-minutes: 30
    needs: [changes, toolchain-bootstrap]
    # Tier-1 (desktop C ABI, fast — no emulator/sim/browser): runs per-PR on platform changes.
    if: ${{ needs.changes.outputs.platform == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read     # setup-z42-sdk 回退（gh run download）
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      # 吃 toolchain artifact + 本机 cargo 编 z42vm（rust toolchain + cache 由 action 自带）。
      - uses: ./.github/actions/xtask-bootstrap-artifact
      - name: test app desktop (Tier-1 C ABI R1–R7 + embedded corpus)
        shell: bash
        run: |
          set -euo pipefail
          xtask test app desktop
      - name: Publish desktop test report (GitHub Check)
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: platform-tests / desktop
          path: artifacts/reports/tests/desktop/junit.xml
          reporter: java-junit
          fail-on-error: false
      - name: Upload desktop JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-desktop
          path: artifacts/reports/tests/desktop/junit.xml
          if-no-files-found: warn

  # ── 单一结论 job，也是 main 分支保护唯一的必需检查：任一 job failure / cancelled ⇒ 红，success / skipped ⇒ 绿。
  # 不逐个列 job 当必需检查——job 级被 skip 的矩阵 job 只上报未展开的名字，按平台名列的检查永远等不到（ci.md §3）。
  # `if: always()`：上游失败时本 job 也要跑出红（被 skip 的必需检查视同通过）。新增 job 时加进 needs。
  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - changes
      - docs-check
      - build-and-test
      - host-package
      - toolchain-bootstrap
      - assemble-current-sdk
      - consume-current-sdk
      - vm-jit-consistency
      - stdlib-consistency
      - compiler-checks
      - package-ios
      - package-android
      - package-wasm
      - publish-nightly
      - test-wasm
      - test-ios
      - test-android
      - test-desktop
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded or was skipped
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          results="${RESULTS:?}"
          echo "$results" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'
          # publish-nightly 的发布按 job 级 concurrency 串行，等待中的会被更新的运行顶掉（GitHub 每组只留一个等待者）。
          # 顶掉它的那个已过全部前置 job、发布的是超集 ⇒ 这里的 cancelled 是正常结局，不算红。
          bad=$(echo "$results" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped")
            | select((.key == "publish-nightly" and .value.result == "cancelled") | not) | "\(.key)=\(.value.result)"] | join(", ")')
          if [ -n "$bad" ]; then echo "::error::not green: $bad"; exit 1; fi
          if echo "$results" | jq -e '.["publish-nightly"].result == "cancelled"' >/dev/null; then
            echo "note: publish-nightly 被更新的 main 运行接管（发布排队被顶替），nightly 由它发布"
          fi
          echo "✓ all jobs green or skipped"
