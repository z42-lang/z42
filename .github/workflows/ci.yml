name: CI

on:
  # change-detect rule (a): non-code-only changes (docs / *.md / .claude) do NOT
  # trigger CI — no run is started, so a running code CI is never cancelled and no
  # compute is wasted. (Doc-specific checks land later.) A push touching BOTH docs
  # and code still triggers (paths-ignore only skips when ALL changed paths match).
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
  # Manual trigger: force a nightly republish from the latest main WITHOUT a new
  # push. This is the escape hatch for the xtask↔nightly bootstrap cycle — after
  # a zbc/zpkg bump (or an xtask change needing a newer stdlib API), the
  # download-bootstrap jobs (vm-jit/bench) transiently fail on the OLD nightly,
  # but publish-nightly is decoupled from them (source-bootstrapped only) and
  # republishes a compatible nightly so the next run self-heals. Run via the
  # Actions "Run workflow" button or: gh workflow run CI --ref main
  workflow_dispatch:
  # Nightly full platform-test sweep — covers commits the per-push paths filter
  # skipped (z42c-only, stdlib-only, etc.) AND the slow Tier-2 platform tests
  # (wasm/iOS-sim/Android-emu), which are nightly-only to keep per-PR iteration
  # fast (see their `if:` gates). 16:00 UTC = 00:00 UTC+8 (daily, local midnight).
  schedule:
    - cron: '0 16 * * *'

# Cancel superseded in-progress runs of the SAME event on the same ref. The
# event_name in the group keeps push / schedule / workflow_dispatch independent:
# the daily `schedule` nightly and a `push` near 07:00 UTC no longer cancel each
# other (that produced spurious "cancelled" reds + a wasted re-run). Within one
# event type, a newer run still supersedes the older (new push cancels old push).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Detect whether platform-relevant files changed, to gate the heavy
  # wasm/iOS/Android/desktop test jobs (15-25 min each). On schedule /
  # workflow_dispatch they always run (full sweep); on push/PR only when
  # platform-relevant paths change — stops the per-commit churn + the
  # cancel-in-progress storm from frequent unrelated pushes.
  changes:
    name: detect-changes
    timeout-minutes: 15
    runs-on: ubuntu-latest
    outputs:
      platform: ${{ steps.filter.outputs.platform }}
      compiler: ${{ steps.filter.outputs.compiler }}
      vm: ${{ steps.filter.outputs.vm }}
      stdlib: ${{ steps.filter.outputs.stdlib }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            platform:
              - 'src/runtime/**'
              - 'src/toolchain/workload/**'
              - 'examples/embedding/**'
              - 'scripts/test/xtask_test_platform.z42'
              - 'scripts/test/xtask_test_wasm.z42'
              - 'scripts/test/xtask_test_ios.z42'
              - 'scripts/test/xtask_test_android.z42'
              - 'scripts/test/xtask_test_desktop.z42'
              - 'scripts/test/xtask_test_embedded.z42'
              - 'versions.toml'
              - '.github/workflows/ci.yml'
            # change-detect rule (b): gates the bootstrap boundary check
            # (verify-selfhost) + compiler-checks (self-host fixpoint + vscode).
            # Only a z42c change can make the prev nightly's z42c unable to compile
            # current source, or change the self-host fixpoint / vscode grammar.
            #
            # z42c 的 member 分布在两处，两处都必须匹配：
            #   src/compiler/       → z42c.driver / z42c.pipeline / z42c.semantics
            #   src/libraries/z42c.* → z42c.core / z42c.syntax（词法+语法前端，route A 后迁出）
            # 只写 src/compiler/** 会漏掉整个前端：改 Lexer 加关键字 → compiler=false
            # → compiler-checks 被跳过 → 专为此存在的 `xtask test vscode-syntax`
            # （"Lexer 加关键字未重新生成即红"）恰好在唯一需要它的场景下不跑，
            # verify-selfhost 同理被跳过。
            # ci.yml fallback = 保底全跑.
            compiler:
              - 'src/compiler/**'
              - 'src/libraries/z42c.core/**'
              - 'src/libraries/z42c.syntax/**'
              - '.github/workflows/ci.yml'
            # change-detect rule (c): gates the Rust VM unit harness (cargo test)
            # + JIT consistency. Only a src/runtime change can affect it.
            # ci.yml fallback = 保底全跑.
            vm:
              - 'src/runtime/**'
              - '.github/workflows/ci.yml'
            # change-detect rule (d): gates stdlib [Test] consistency (interp+jit).
            # Only a stdlib or runtime change can affect it.
            stdlib:
              - 'src/libraries/**'
              - '.github/workflows/ci.yml'
            # NOTE: 曾有一个 `tests:` filter（src/tests + scripts），但它的 output
            # 从未被任何 job 的 `if:` 引用 —— 注释描述的门控从来没实现过。留着只会让
            # 人以为 e2e golden 有内容级门控。2026-09-04 删除；真要门控 e2e 时重新加，
            # 并在同一提交里接上消费方。

  build-and-test:
    name: test-host(${{ matrix.platform }})
    # 60→75 (2026-07-21): `xtask test all` (full rebuild + all gates) sits at the
    # 60m cap on linux-x64 since the 0.4.x bench-suite additions inflated wall-time
    # (test-vm-jit likewise flaps at its cap — see vm-jit-consistency). Not a
    # functional regression; give headroom. Sharding is the longer-term fix if it
    # keeps growing.
    timeout-minutes: 75
    # needs: changes so the Windows cargo-test step can gate on the `vm` filter
    # (rule c). The job itself still runs on every non-docs push (changes always
    # succeeds); only the Rust-unit step is conditionally skipped.
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    platform: linux-x64 }
          - { os: ubuntu-24.04-arm, platform: linux-arm64 }
          - { os: macos-15,         platform: macos-arm64 }
          - { os: windows-latest,   platform: windows-x64 }
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # build-and-test runs on ALL OS — every leg downloads the prev nightly's z42c
      # seed and bootstraps the toolchain from source with it. See the Bootstrap step.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust deps (Swatinem)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/runtime -> ../../artifacts/build/runtime
          shared-key: host-v2

      # ALL legs bootstrap from the prev nightly seed — download the prev published
      # nightly's z42c compiler seed, then build current z42c + stdlib + xtask from
      # source with it. The staged-bootstrap discipline (.claude/rules/bootstrap-seed.md)
      # guarantees the prev nightly compiles current source; `xtask test bootstrap`
      # is the local boundary check. Logic lives in the ci-bootstrap composite action
      # (Windows adds .zip/.exe handling — same seed contract). After this, every later
      # step drives work through `z42vm xtask.zpkg …`.
      - name: Bootstrap toolchain (nightly z42c seed → current source)
        uses: ./.github/actions/ci-bootstrap
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      # migrate-scripts-to-z42: version-drift check via xtask (replaces the
      # feature-matrix `bash scripts/check-versions-drift.sh` step). ubuntu only —
      # the check is OS-independent (versions.toml + zbc/zpkg/gradle/Package.swift
      # version constants). Reuses the from-source xtask bootstrapped above.
      - name: Check versions.toml drift (z42 xtask.zpkg deps check)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          Z42_PORTABLE_VM="$PWD/artifacts/build/runtime/release/z42vm" \
          Z42_LIBS="$PWD/artifacts/build/libraries/dist/release" \
            artifacts/build/runtime/release/z42vm artifacts/xtask/xtask.zpkg -- deps check

      # add-tests-bench-manifest-config Phase 6.1 (2026-06-06): release guard.
      # xtask's dir-mode tests / benches produce synthetic
      # `<lib>.test.<unit>.zpkg` / `<lib>.bench.<unit>.zpkg` artifacts under
      # an xtask-controlled output_dir (currently /tmp/.../xtask-testlib*/);
      # they must NEVER land in the production `dist/` tree under
      # `artifacts/build/libraries/<lib>/<profile>/`. A regression here
      # (e.g. forgotten output_dir override in a future xtask path) would
      # silently ship test scaffolding to end users via the SDK package.
      # The guard scans every per-lib dist tree and fails on the first
      # `.test.` / `.bench.` infix hit. ubuntu-only (path semantics
      # identical across platforms; one check is enough).
      - name: Release guard (no .test./.bench. zpkgs in dist/)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          # Forward: production dist/ must not contain test/bench zpkgs.
          # Excludes the per-lib tests/dist/ and bench/dist/ subdirs by
          # requiring the `/dist/` path component to NOT be preceded by
          # `/tests/` or `/bench/`.
          violators=$(
            find artifacts/build/libraries -type f \
              \( -name '*.test.*.zpkg' -o -name '*.bench.*.zpkg' \) \
              -path '*/dist/*' \
              ! -path '*/tests/dist/*' \
              ! -path '*/bench/dist/*' \
              2>/dev/null || true
          )
          if [ -n "$violators" ]; then
            echo "::error::test/bench harness zpkgs leaked into release dist/:"
            echo "$violators"
            exit 1
          fi
          echo "release guard (forward): 0 .test./.bench. zpkgs in production dist/ (OK)"

      # Reverse guard: anything inside <lib>/<profile>/tests/dist/ MUST
      # carry the `.test.` infix; same for bench/dist/. Belt-and-suspenders
      # against a future refactor that accidentally writes a production
      # zpkg into the test/bench output tree. add-tests-bench-manifest-config
      # Phase 6.1.2 (2026-06-06).
      - name: Release guard (tests/dist contents are .test. only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          # tests/dist/ must contain only `.test.` zpkgs
          tests_strangers=$(
            find artifacts/build/libraries -path '*/tests/dist/*' \
              -type f -name '*.zpkg' ! -name '*.test.*.zpkg' \
              2>/dev/null || true
          )
          # bench/dist/ must contain only `.bench.` zpkgs
          bench_strangers=$(
            find artifacts/build/libraries -path '*/bench/dist/*' \
              -type f -name '*.zpkg' ! -name '*.bench.*.zpkg' \
              2>/dev/null || true
          )
          if [ -n "$tests_strangers" ] || [ -n "$bench_strangers" ]; then
            echo "::error::non-harness zpkg appeared in tests/dist/ or bench/dist/:"
            [ -n "$tests_strangers" ] && echo "$tests_strangers"
            [ -n "$bench_strangers" ] && echo "$bench_strangers"
            exit 1
          fi
          echo "release guard (reverse): tests/dist + bench/dist contain only harness zpkgs (OK)"

      # Test on Unix runners via the native z42 build CLI (xtask). The GREEN gate
      # runs through `xtask test all` — was test-all.sh (migrate-scripts-to-z42);
      # `--parallel`/`--jobs`/test-*.sh were C#/bash-era, not in the z42 xtask.
      # Bootstrap = release z42vm (to run xtask.zpkg) + compile xtask.zpkg; then
      # `xtask test all` (which itself rebuilds stdlib/compiler/zbc + runs
      # compiler+vm+cross-zpkg+stdlib). z42c/stdlib from the prior steps are reused.
      # --no-build: the Bootstrap step already built z42c+stdlib+xtask, so `test
      # all` skips its redundant build-wave rebuild (_regenCore) and only regens
      # the goldens against those canonical artifacts (~12-15 min/leg saved). The
      # consume path (_regenGolden + --no-build stages) is the same one the
      # test-consume job already exercises green.
      - name: Test (z42 xtask.zpkg test all --no-build --skip ...)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci-logs
          # Stages offloaded to dedicated parallel jobs:
          #   stdlib   → stdlib-interp-consistency (per OS)
          #   compiler → compiler-checks (linux, 1×; host-independent fixpoint)
          #   vscode   → compiler-checks (linux, 1×; host-independent keyword sync)
          # cross-zpkg: runs on linux-x64 only (host-independent, bytecode-level
          # zpkg linking — one OS is sufficient). Other legs skip it.
          SKIP="stdlib,compiler,vscode"
          if [ "${{ matrix.platform }}" != "linux-x64" ]; then
            SKIP="stdlib,cross-zpkg,compiler,vscode"
          fi
          Z42_PORTABLE_VM="$PWD/artifacts/build/runtime/release/z42vm" \
          Z42_LIBS="$PWD/artifacts/build/libraries/dist/release" \
            artifacts/build/runtime/release/z42vm artifacts/xtask/xtask.zpkg -- test all --no-build --skip "$SKIP" 2>&1 | tee artifacts/ci-logs/test-all.log
          exit "${PIPESTATUS[0]}"

      # diag-ci-test-log-upload (2026-05-30): the wave-failed stage prints
      # `stage outputs preserved at: /tmp/...` paths that disappear when
      # the runner is recycled. Capture them as an artifact so we can
      # inspect failure mode without admin-only log access (the public
      # actions/jobs API only surfaces "exit code 1" annotations).
      - name: Upload test logs on failure
        if: failure() && matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          path: |
            artifacts/ci-logs/
            /tmp/z42-test-all.*
            /var/folders/*/*/T/z42-test-all.*
          retention-days: 7
          if-no-files-found: warn

      # The Rust VM unit harness = `xtask test runtime` (cargo test --test-threads=1).
      # It is NOT part of `test all` (its signal_handler_e2e tests spawn crash-helpers
      # that hang in signal-restricted sandboxes → would wedge the always-run gate).
      # It runs here as its own per-leg step so every OS gets Rust-unit coverage —
      # including the #[cfg(unix)] tests that Windows skips (cargo test used to be
      # Windows-only, so those unix tests never ran on CI; enabling all-legs surfaced +
      # got fixed a real run-timeout bug — see fix-process-run-timeout-orphan).
      #
      # Windows doesn't run `test all` (goldens run on linux/macos), so it first needs
      # `build test` to populate artifacts/build/tests so zbc_compat sees ≥50 goldens.
      # non-Windows already regen'd them in `test all` above.
      # schedule/dispatch 逃生口同 verify-selfhost：paths-filter 在这两个事件下恒 false，
      # 否则 nightly 全量 sweep 上 windows 腿几乎什么都不做。
      - name: Build golden test assets (Windows — zbc_compat inputs)
        if: matrix.os == 'windows-latest' && (needs.changes.outputs.vm == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          set -euo pipefail
          vm="$PWD/artifacts/build/runtime/release/z42vm"; [ -f "$vm.exe" ] && vm="$vm.exe"
          Z42_PORTABLE_VM="$vm" Z42_LIBS="$PWD/artifacts/build/libraries/dist/release" \
            "$vm" artifacts/xtask/xtask.zpkg -- build test

      # --test-threads=1 + RUST_MIN_STACK are set inside _testRuntime. Serialized
      # because the --lib tests have a pre-existing cross-thread memory-corruption race
      # (SIGSEGVs under parallel scheduling on macOS too; --test-threads=1 passes).
      # cargo test builds debug binaries — never relinks the running release z42vm, so
      # no Windows file-lock. Gated on the vm change filter (rule c).
      - name: Rust VM unit tests (xtask test runtime)
        if: needs.changes.outputs.vm == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          vm="$PWD/artifacts/build/runtime/release/z42vm"; [ -f "$vm.exe" ] && vm="$vm.exe"
          Z42_PORTABLE_VM="$vm" Z42_LIBS="$PWD/artifacts/build/libraries/dist/release" \
            "$vm" artifacts/xtask/xtask.zpkg -- test runtime

  # ── parallelize-host-package: SDK packaging, parallel to host tests (all 4 OS) ──
  # The host package (`xtask package release`) used to run sequentially after
  # `test all` on each build-and-test leg, adding ~10 min to the critical path. It's
  # independent of the tests, so it now runs as its own job off the shared toolchain-
  # bootstrap artifact — ready well before the tests finish. All 4 OS, incl.
  # windows-latest (consumes the platform-independent toolchain-ubuntu-latest zpkgs +
  # cargo-builds its own z42vm). build-and-test is now pure test. publish-nightly
  # consumes these uploads.
  host-package:
    name: package-host(${{ matrix.platform }})
    timeout-minutes: 45
    # gate-pr-package: package-* artifacts are consumed ONLY by publish-nightly
    # (push-to-main / dispatch). On a PR they are pure "does packaging still build"
    # validation, and packaging is affected only by `platform`-scope changes
    # (runtime cross-compile / workload / packaging scripts) — NOT compiler/stdlib/
    # tests source, which just change which zpkg bytes get bundled. So on a PR run
    # them only when platform changed; push/schedule/dispatch always run (publish-
    # nightly needs the artifacts). Cuts host-package×4 + package-{ios,android,wasm}
    # = 7 jobs from every non-platform PR → frees runner-pool headroom (full runs
    # sit at the ~20 concurrent-job cap). None of package-* are required checks, and
    # a required check skipped via `if:` does not block merge here anyway.
    needs: [changes, toolchain-bootstrap]
    if: ${{ needs.changes.outputs.platform == 'true' || github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    platform: linux-x64 }
          - { os: ubuntu-24.04-arm, platform: linux-arm64 }
          - { os: macos-15,         platform: macos-arm64 }
          - { os: windows-latest,   platform: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # OWN cache key (not the default artifact-host-v1): the package step below
      # builds z42 as cdylib + staticlib + z42-compression + apphost on top of what
      # the action itself builds. A dedicated key caches the FULL package build →
      # warm reuse (sharing a narrower key meant those extra crate-types recompiled
      # cold every run, ~6-8 min on Windows).
      - uses: ./.github/actions/xtask-bootstrap-artifact
        with:
          cache-key: package-host-v2

      - name: Package host RID (z42 xtask.zpkg package)
        shell: bash
        run: |
          set -euo pipefail
          vm="$PWD/artifacts/build/runtime/release/z42vm"; [ -f "$vm.exe" ] && vm="$vm.exe"
          # Windows: `package` cargo-relinks z42vm and can't overwrite the *running*
          # z42vm.exe → run xtask from a copy outside the cargo output dir. (No-op on
          # Linux/macOS.)
          runner="$vm"
          if [ "${RUNNER_OS:-}" = "Windows" ]; then
            mkdir -p "$PWD/.ci-runner"; cp "$vm" "$PWD/.ci-runner/"
            cp "$PWD"/artifacts/build/runtime/release/*.dll "$PWD/.ci-runner/" 2>/dev/null || true
            runner="$PWD/.ci-runner/$(basename "$vm")"
          fi
          # --no-build: xtask-bootstrap-artifact already restored z42c + stdlib (the
          # toolchain artifact); skip rebuilding them (~10 min on Windows: the [1/5]
          # z42c self-build + the former 2nd self-build in the runtime pack). The
          # package's own cargo native libs (z42vm/cdylib/staticlib/apphost) + launcher
          # still build. Verified locally byte-identical to a full build (mod build-date).
          # merge-package-release: the former combined `package release` split into
          # name-driven subcommands — host produces SDK + runtime + desktop workload.
          Z42_PORTABLE_VM="$vm" Z42_LIBS="$PWD/artifacts/build/libraries/dist/release" \
            "$runner" artifacts/xtask/xtask.zpkg -- package sdk --no-build
          Z42_PORTABLE_VM="$vm" Z42_LIBS="$PWD/artifacts/build/libraries/dist/release" \
            "$runner" artifacts/xtask/xtask.zpkg -- package runtime --no-build
          Z42_PORTABLE_VM="$vm" Z42_LIBS="$PWD/artifacts/build/libraries/dist/release" \
            "$runner" artifacts/xtask/xtask.zpkg -- package workload
          # test workload = payload-only, platform-agnostic → build once on macos-arm64
          # (package-test-workload). Uploaded within artifacts/packages/; publish-nightly
          # re-archives it to z42-workload-nightly-test.tar.gz.
          if [ "${{ matrix.platform }}" = "macos-arm64" ]; then
            Z42_PORTABLE_VM="$vm" Z42_LIBS="$PWD/artifacts/build/libraries/dist/release" \
              "$runner" artifacts/xtask/xtask.zpkg -- package workload test
          fi

      - name: Dist test (launcher + desktop-publish + golden legs)
        # Runs on all RIDs incl. Windows (P5 cleanup fixed the dist-test preflight +
        # launcher-smoke `.exe`-suffix gaps: bin/z42c[.exe] / z42[.exe] / z42vm[.exe]).
        #
        # fix-package-gates-false-red (2026-09-06): 此前这一步带 DIST_SMOKE_ONLY=launcher，
        # 注释说是「跳过更 flaky 的 desktop-publish/golden 腿」。但全仓**只有这一处**调
        # `test dist` —— 所谓「跳过」的实际效果不是换个地方覆盖，而是那两条腿**永远没人跑**：
        #   · desktop-publish smoke 自 apphost 迁进 desktop workload 后判据恒不满足 → 静默 SKIP；
        #   · golden 腿调 z42c 的 CLI 根本不存在（`--emit zbc -o`）→ 282 个 case 全 compile fail。
        # 两条都是「从不打印、从不失败的门」。判据修好后在这里接通，让它真的会红。
        # Consumes the SDK package + desktop workload produced above.
        shell: bash
        run: |
          set -euo pipefail
          vm="$PWD/artifacts/build/runtime/release/z42vm"; [ -f "$vm.exe" ] && vm="$vm.exe"
          runner="$vm"
          if [ "${RUNNER_OS:-}" = "Windows" ]; then runner="$PWD/.ci-runner/$(basename "$vm")"; fi
          Z42_PORTABLE_VM="$vm" Z42_LIBS="$PWD/artifacts/build/libraries/dist/release" \
            "$runner" artifacts/xtask/xtask.zpkg -- test dist

      - name: Verify package manifest + native artifacts
        shell: bash
        run: |
          set -euo pipefail
          pkg_dir=$(ls -d artifacts/packages/z42-*-release | head -1)
          [ -d "$pkg_dir" ] || { echo "error: no package produced"; exit 1; }
          echo "Package: $pkg_dir"
          test -f "$pkg_dir/manifest.toml"        || { echo "missing manifest.toml"; exit 1; }
          test -d "$pkg_dir/libs"                 || { echo "missing libs/"; exit 1; }
          test -d "$pkg_dir/native/include"       || { echo "missing native/include/"; exit 1; }
          if [ -f "$pkg_dir/bin/z42c.exe" ]; then
              echo "✓ bin/z42c.exe ($(du -h "$pkg_dir/bin/z42c.exe" | cut -f1))"
          elif [ -f "$pkg_dir/bin/z42c" ]; then
              echo "✓ bin/z42c ($(du -h "$pkg_dir/bin/z42c" | cut -f1))"
          else
              echo "error: bin/z42c[.exe] missing"; ls -la "$pkg_dir/bin/"; exit 1
          fi
          if [ -f "$pkg_dir/native/libz42_compression.dylib" ] \
             || [ -f "$pkg_dir/native/libz42_compression.so" ] \
             || [ -f "$pkg_dir/native/z42_compression.dll" ]; then
              echo "✓ native/libz42_compression.* (dlopen target)"
          else
              echo "error: native/libz42_compression.{dylib,so,dll} missing — z42.compression facade will fail with 'unknown builtin' at runtime"
              ls -la "$pkg_dir/native/"; exit 1
          fi
          test -f "$pkg_dir/native/libz42_compression.a" \
              && echo "✓ native/libz42_compression.a (staticlib for mobile / future bundled link)"
          test -f "$pkg_dir/libs/z42.compression.zpkg" \
              || { echo "error: libs/z42.compression.zpkg missing"; exit 1; }
          echo "✓ libs/z42.compression.zpkg"
          test ! -e "$pkg_dir/bin/apphost" && test ! -e "$pkg_dir/bin/apphost.exe" \
              || { echo "error: apphost must NOT be in SDK bin/ anymore (it ships via desktop workload)"; exit 1; }
          dt_dir=$(ls -d artifacts/packages/z42-workload-*-desktop-* 2>/dev/null | head -1)
          [ -d "$dt_dir" ] || { echo "error: no desktop workload package produced"; exit 1; }
          ls "$dt_dir"/apphost-* >/dev/null 2>&1 \
              || { echo "error: desktop workload missing apphost-<rid> stub"; ls -la "$dt_dir"; exit 1; }
          test -f "$dt_dir/manifest.toml" || { echo "missing desktop workload manifest.toml"; exit 1; }
          echo "✓ desktop workload: $dt_dir"
          echo "--- manifest.toml ---"
          cat "$pkg_dir/manifest.toml"

      - name: Upload host package
        uses: actions/upload-artifact@v4
        with:
          name: z42-host-package-${{ matrix.os }}
          path: artifacts/packages/
          retention-days: 14
          if-no-files-found: error

  # ── toolchain artifact (parallelization keystone + option-B seed handoff) ──
  # Bootstrap the host compiler ONCE per host OS (z42c + stdlib + xtask
  # via the prev nightly seed) and publish the .zpkg products as `toolchain-<os>`. The
  # package / platform-test jobs consume it (xtask-bootstrap-artifact action) + cargo-
  # build their own z42vm — and run in parallel instead of each re-bootstrapping.
  # Fast: bootstrap only, no test.
  toolchain-bootstrap:
    name: compile-toolchain(${{ matrix.platform }})
    timeout-minutes: 30
    # Runs unconditionally (like the test jobs) — its artifact roots the package
    # jobs (which always run) + the platform-test jobs, so it must always be present.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-x64 }
          - { os: macos-15,      platform: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust deps (Swatinem)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/runtime -> ../../artifacts/build/runtime
          shared-key: host-v2

      - name: Bootstrap toolchain (nightly z42c seed → current source)
        uses: ./.github/actions/ci-bootstrap
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage toolchain (zpkg products only)
        shell: bash
        run: |
          vm="$PWD/artifacts/build/runtime/release/z42vm"; [ -f "$vm.exe" ] && vm="$vm.exe"
          Z42_PORTABLE_VM="$vm" Z42_LIBS="$PWD/artifacts/build/libraries/dist/release" \
            "$vm" artifacts/xtask/xtask.zpkg -- build stage-toolchain "$RUNNER_TEMP/tc"

      - name: Upload toolchain-${{ matrix.os }}
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-${{ matrix.os }}
          path: ${{ runner.temp }}/tc/
          retention-days: 3
          if-no-files-found: error

  # ── compile-once P2 (additive): assemble current-sdk in a SEPARATE job ──────
  # Builds the `.z42` current-sdk layout (programs/z42c + libs + bin) + bundles
  # the golden .zbc, consumable by `xtask --toolchain <dir>`. SPLIT OUT of
  # toolchain-bootstrap on purpose: the golden regen takes ~9 min and used to run
  # AFTER the toolchain-<os> upload but INSIDE toolchain-bootstrap — so every
  # `needs: toolchain-bootstrap` job (host-package → publish-nightly critical
  # path) waited those ~9 min for an artifact it doesn't use. As its own job
  # (consuming the toolchain artifact via xtask-bootstrap-artifact + a host cargo
  # z42vm) it runs fully in PARALLEL, off the critical path, and packages start as
  # soon as the toolchain zpkgs are up. Nothing gating publish needs current-sdk.
  # continue-on-error per step: additive validation — if regen/build sdk hits a
  # CI-only path diff, the gating jobs are unaffected (only current-sdk is skipped).
  assemble-current-sdk:
    name: compile-test-assets(${{ matrix.platform }})
    timeout-minutes: 30
    needs: toolchain-bootstrap
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-x64 }
          - { os: macos-15,      platform: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # cargo build z42vm + restore z42c/stdlib/xtask zpkgs at canonical paths。
      # rust toolchain + rust-cache 由该 action 自带 —— 缓存 key 的选择理由（为什么
      # 不能共用 ci-bootstrap 的 host-v2）现在写在 action 的 cache-key input 上，
      # 单点维护，不再逐 job 复制。
      - uses: ./.github/actions/xtask-bootstrap-artifact

      # compile-once P2.4 (shared compiled assets): build the golden .zbc ONCE here
      # so downstream interp + jit consumers run the SAME prebuilt bytecode
      # (.zbc is execution-mode-agnostic) via `test e2e --no-build`.
      - name: Build golden .zbc test assets (compile shared assets once)
        continue-on-error: true
        shell: bash
        run: |
          Z42_PORTABLE_VM="$PWD/artifacts/build/runtime/release/z42vm" \
          Z42_LIBS="$PWD/artifacts/build/libraries/dist/release" \
            artifacts/build/runtime/release/z42vm artifacts/xtask/xtask.zpkg -- build test

      # refresh-format-fixtures: committed byte baselines must be up to date.
      # `build test` above regenerates src/tests/zbc-format/*/source.zbc IN PLACE, so a
      # non-empty diff here means the checked-in bytes were stale — i.e. some earlier
      # format change skipped step 4 of .claude/rules/version-bumping.md.
      #
      # Why this gate is needed: the baselines' only prior safeguard was "a human
      # notices `git diff`". Since regen runs before every consumer, `zbc_compat`
      # validates the freshly-rewritten bytes and never the committed ones — so stale
      # baselines stayed green while dirtying every contributor's working tree
      # (they sat at zbc 1.37 right through the 1.38 bump). Same shape as
      # `cargo fmt --check`: regen, then fail if it changed anything.
      - name: Golden byte baselines are up to date (regen produced no diff)
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- src/tests/zbc-format; then
            echo "::error::committed zbc-format byte baselines are stale — regen rewrote them."
            echo "Fix: run 'xtask build compiler && xtask build stdlib && xtask build test',"
            echo "review the diff, then commit the regenerated fixtures"
            echo "(see .claude/rules/version-bumping.md step 4)."
            git --no-pager diff --stat -- src/tests/zbc-format
            exit 1
          fi
          echo "OK: zbc-format baselines match the current writer"

      # 以下组装 + 上传 linux 腿独占：current-sdk 的两个消费方
      # （consume-current-sdk / vm-jit-consistency）都硬编码 current-sdk-ubuntu-latest，
      # `current-sdk-macos-15` 上传后从无人下载。
      # macOS 腿保留上面的 golden 重生 + 字节基线门 —— 那是真覆盖（zbc 是 arch-中立的，
      # 在 macOS 上重生仍须与提交字节逐字一致 = 跨架构确定性），只跳过这两步无人消费的。
      - name: Assemble .z42 toolchain (build sdk --no-build) + bundle goldens
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        shell: bash
        run: |
          Z42_PORTABLE_VM="$PWD/artifacts/build/runtime/release/z42vm" \
          Z42_LIBS="$PWD/artifacts/build/libraries/dist/release" \
            artifacts/build/runtime/release/z42vm artifacts/xtask/xtask.zpkg -- \
            build sdk --out "$RUNNER_TEMP/z42sdk" --no-build
          # bundle the prebuilt golden .zbc into current-sdk so consumers run them
          # with --no-build (shared compiled asset across interp/jit).
          if [ -d artifacts/build/tests ]; then
            cp -r artifacts/build/tests "$RUNNER_TEMP/z42sdk/tests"
          fi

      - name: Upload current-sdk-${{ matrix.os }}
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: current-sdk-${{ matrix.os }}
          path: ${{ runner.temp }}/z42sdk/
          retention-days: 3
          if-no-files-found: warn

  # ── compile-once P3 (additive): consume current-sdk cross-job ───────────────
  # Proves the current-sdk `.z42` artifact, downloaded fresh in a SEPARATE job, is
  # a working self-contained toolchain: its own bin/z42vm + programs/z42c/driver +
  # libs/ compile a real project (xtask) with no rebuild/bootstrap. This is the
  # downstream-consume model (test jobs will adopt it instead of each re-
  # bootstrapping) + the seed of cross-bootstrap (Decision 7). continue-on-error
  # while we validate — promote to a gate once proven.
  consume-current-sdk:
    name: test-consume(linux-x64)
    timeout-minutes: 30
    needs: assemble-current-sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download current-sdk-ubuntu-latest
        uses: actions/download-artifact@v4
        with:
          name: current-sdk-ubuntu-latest
          path: .z42-dl
      - name: Compile + run via ONLY the downloaded toolchain (consume smoke)
        shell: bash
        run: |
          set -euo pipefail
          TC="$PWD/.z42-dl"
          chmod +x "$TC/bin/z42vm"
          ls "$TC/programs/z42c/" "$TC/libs/" >/dev/null
          # compile a real project (xtask) with the downloaded toolchain's z42c
          Z42_LIBS="$TC/libs" "$TC/bin/z42vm" "$TC/programs/z42c/z42c.driver.zpkg" --mode interp -- \
            build scripts/xtask.z42.toml --release --output-dir "$RUNNER_TEMP/consume-out"
          test -f "$RUNNER_TEMP/consume-out/xtask.zpkg" \
            || { echo "::error::current-sdk compile failed — no xtask.zpkg"; exit 1; }
          # execute the just-compiled zpkg on the toolchain's z42vm (proves run, not just compile)
          out=$(Z42_LIBS="$TC/libs" "$TC/bin/z42vm" "$RUNNER_TEMP/consume-out/xtask.zpkg" -- build -h)
          echo "$out" | grep -q "build sdk\|SUBCOMMANDS" \
            && echo "✅ current-sdk compiles AND runs (cross-job, self-contained)" \
            || { echo "::error::current-sdk run failed"; echo "$out"; exit 1; }
      - name: Run cross-zpkg gate via --toolchain (real test-stage consume)
        shell: bash
        run: |
          set -euo pipefail
          TC="$PWD/.z42-dl"
          # the just-compiled xtask drives the cross-zpkg gate entirely from the
          # downloaded toolchain (z42c + stdlib + z42vm), no bootstrap/rebuild.
          Z42_LIBS="$TC/libs" "$TC/bin/z42vm" "$RUNNER_TEMP/consume-out/xtask.zpkg" -- \
            --toolchain "$TC" test e2e --dir cross-zpkg
      # compile-once P2.4: the SHARED compiled asset. current-sdk bundles the
      # prebuilt golden .zbc (built once in the compile job). Extract them to the
      # canonical mirror so `test e2e --no-rebuild` runs them with NO regen — interp
      # and jit below execute the SAME .zbc, differing only by --mode.
      - name: Extract bundled goldens (shared compiled asset)
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .z42-dl/tests ]; then
            mkdir -p artifacts/build/tests
            cp -r .z42-dl/tests/. artifacts/build/tests/
          else
            echo "::error::current-sdk has no bundled goldens (tests/) — P2.4 regen step?"; exit 1
          fi
      # interp: the shared compiled asset (prebuilt .zbc) runs with no regen/bootstrap.
      # GATE — 169/169 proven.
      - name: Run VM goldens INTERP from shared asset (--no-rebuild)
        shell: bash
        run: |
          set -euo pipefail
          TC="$PWD/.z42-dl"
          Z42_LIBS="$TC/libs" "$TC/bin/z42vm" "$RUNNER_TEMP/consume-out/xtask.zpkg" -- \
            --toolchain "$TC" test e2e --mode interp --no-rebuild
      # jit: same prebuilt .zbc, --mode jit. PROBE (continue-on-error) while a
      # jit-via-toolchain discrepancy is investigated: some cases (default_params,
      # delegate_d1a, …) produce blank output under the toolchain release vm jit
      # though interp passes the SAME .zbc — looks like a jit-miscompile sensitivity.
      # vm-jit-consistency still gates jit independently, so coverage is intact.
      - name: Run VM goldens JIT from shared asset (--no-rebuild, probe)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          TC="$PWD/.z42-dl"
          Z42_LIBS="$TC/libs" "$TC/bin/z42vm" "$RUNNER_TEMP/consume-out/xtask.zpkg" -- \
            --toolchain "$TC" test e2e --mode jit --no-rebuild --shard 1/4 --jobs=4

  # ── VM cross-mode consistency (0.3.0 退出标准) ───────────────────────────
  # split-interp-jit: `xtask test all` in build-and-test runs the golden suites in
  # INTERP only (on every host OS). This job is the SOLE JIT gate — it runs the VM
  # goldens under JIT here, catching interp/JIT divergence (opcode handling, codegen
  # bugs) before main. Single linux-x64 lane is enough — cranelift JIT behaviour is
  # host-independent, so running jit on every build-and-test OS leg was redundant
  # (5× the slow per-case cranelift compile) and is now removed from the
  # host legs' critical path.
  vm-jit-consistency:
    name: test-vm-jit(linux-x64) shard ${{ matrix.shard }}
    # 2026-07-25 (share-goldens-no-regen): shards download golden .zbc compiled
    # ONCE by assemble-current-sdk and run their slice with --no-rebuild — no
    # per-shard golden regen. 2026-07-26: 4→2 shards (each ~5-6 min); 4-way
    # over-split flooded the runner pool while each shard was only ~3 min.
    timeout-minutes: 55
    runs-on: ubuntu-latest
    needs: [changes, toolchain-bootstrap, assemble-current-sdk]
    # change-detect rule (c): JIT execution behaviour changes when the Rust VM changes
    # (JIT codegen) OR when a z42c change alters the .zbc the JIT lowers — codegen /
    # optimization passes (inline/LICM/CSE/…) restructure the IR, so the JIT's INPUT
    # differs and its lowering of that new IR is exercised. test-host's interp goldens
    # cover interp of the new .zbc, NOT its JIT lowering. So gate on vm OR compiler.
    # (2026-08-04: #103's opt-pipeline changes skipped this leg → optimized IR was
    # never JIT-tested; added `compiler` to close that gap.) Schedule/dispatch = 全跑.
    if: ${{ needs.changes.outputs.vm == 'true' || needs.changes.outputs.compiler == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@v4

      # Consume the toolchain artifact built ONCE by toolchain-bootstrap (z42c +
      # stdlib + xtask.zpkg) instead of re-bootstrapping per shard — removes 4×
      # redundant z42c/stdlib builds + the per-shard nightly-download drift flake
      # (xtask-review §3.1). Same consume path as host-package / assemble-current-sdk.
      # rust toolchain + rust-cache 由该 action 自带（见其 cache-key input）。
      - uses: ./.github/actions/xtask-bootstrap-artifact

      # Golden .zbc are compiled ONCE by assemble-current-sdk (build test) and bundled
      # into current-sdk. Extract them to the canonical mirror so the run below uses
      # --no-rebuild (NO per-shard regen). Mirrors consume-current-sdk's "Extract
      # bundled goldens" — .zbc are execution-mode-agnostic and z42c output is
      # deterministic, so the shared asset is byte-equivalent to a local regen.
      - name: Download shared golden .zbc (compiled once)
        uses: actions/download-artifact@v4
        with:
          name: current-sdk-ubuntu-latest
          path: .z42-dl
      - name: Extract bundled goldens
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .z42-dl/tests ]; then
            mkdir -p artifacts/build/tests
            cp -r .z42-dl/tests/. artifacts/build/tests/
          else
            echo "::error::current-sdk has no bundled goldens (tests/) — assemble-current-sdk regen step?"; exit 1
          fi

      - name: VM goldens — JIT mode (shard ${{ matrix.shard }}/2)
        shell: bash
        run: |
          set -euo pipefail
          # warm toolchain; xtask runs this shard of the JIT goldens on z42vm.
          # --no-rebuild: run the shared .zbc as-is (no golden regen, no toolchain
          # rebuild). cranelift JIT per-case compile still happens at RUN time
          # (that's what this gate measures), split across 2 shards.
          vm="$PWD/artifacts/build/runtime/release/z42vm"
          libs="$PWD/artifacts/build/libraries/dist/release"
          Z42_PORTABLE_VM="$vm" Z42_LIBS="$libs" "$vm" artifacts/xtask/xtask.zpkg -- test e2e --mode jit --no-rebuild --shard ${{ matrix.shard }}/2 --jobs=4

  # ── stdlib [Test] JIT consistency (parallelize-and-jit-stdlib-tests) ──────
  # build-and-test runs the 272 stdlib [Test] files under interp (in-process
  # runner). This job re-runs them under JIT (`--mode jit` forks z42vm --mode
  # jit per unit) to catch interp/JIT divergence in stdlib — the in-process
  # runner can't drive the JIT, so subprocess is the proven jit path. Separate
  # parallel lane (not folded into vm-jit-consistency) so it overlaps build-and-
  # test instead of extending the critical path. linux-x64 only — cranelift
  # behaviour is host-independent (same rationale as vm-jit-consistency).
  stdlib-jit-consistency:
    name: test-stdlib-jit(linux-x64) shard ${{ matrix.shard }}
    timeout-minutes: 45
    runs-on: ubuntu-latest
    needs: [changes, toolchain-bootstrap]
    # change-detect rule (d+c): stdlib [Test] JIT divergence can arise from a VM
    # change (JIT codegen) or a stdlib change (test content). Skip when neither
    # changed. Schedule/dispatch = 全跑.
    if: ${{ needs.changes.outputs.vm == 'true' || needs.changes.outputs.stdlib == 'true' || needs.changes.outputs.compiler == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@v4

      # Consume the toolchain artifact built ONCE by toolchain-bootstrap (z42c +
      # stdlib + xtask.zpkg) instead of re-bootstrapping per shard.
      # rust toolchain + rust-cache 由该 action 自带（见其 cache-key input）。
      - uses: ./.github/actions/xtask-bootstrap-artifact

      - name: stdlib [Test] — JIT mode (shard ${{ matrix.shard }}/2)
        shell: bash
        run: |
          set -euo pipefail
          # xtask runs this shard's stdlib [Test] units under JIT (z42b via
          # z42vm --mode jit). --shard splits the libs balanced by unit count
          # across 2 machines; --jobs 4 parallelizes within the shard.
          vm="$PWD/artifacts/build/runtime/release/z42vm"
          libs="$PWD/artifacts/build/libraries/dist/release"
          Z42_PORTABLE_VM="$vm" Z42_LIBS="$libs" "$vm" artifacts/xtask/xtask.zpkg -- test stdlib --mode jit --no-build --shard ${{ matrix.shard }}/2 --jobs 4

  # ── stdlib [Test] INTERP consistency — one job per OS ─────────────────────────
  # The build-and-test (test-host) legs skip stdlib [Test] (`--skip stdlib`); this
  # job runs the full suite under interp on each OS so per-OS host-dependent stdlib
  # (io/net/process/fs/threading) keeps its own-platform coverage. INTERP only —
  # jit is covered by stdlib-jit-consistency (linux). Consumes the toolchain
  # artifact (arch-independent .zpkg) + cargo-builds the native z42vm.
  stdlib-interp-consistency:
    name: test-stdlib-interp(${{ matrix.platform }})
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    needs: [changes, toolchain-bootstrap]
    # change-detect rule (d+c): stdlib [Test] interp can diverge on VM change
    # (interp dispatch) or stdlib change (test content/API). Schedule/dispatch = 全跑.
    if: ${{ needs.changes.outputs.vm == 'true' || needs.changes.outputs.stdlib == 'true' || needs.changes.outputs.compiler == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      # No sharding: each OS runs the full stdlib [Test] suite (~12-14 min). The
      # prior 2-shard/OS split (6 jobs) flooded the ~20-slot runner pool — the queue
      # delay dwarfed the per-shard savings. Unsharded (3 jobs) frees 3 slots and
      # each job still finishes well within the 45m cap.
      matrix:
        include:
          - { os: ubuntu-latest,    platform: linux-x64 }
          - { os: ubuntu-24.04-arm, platform: linux-arm64 }
          - { os: macos-15,         platform: macos-arm64 }

    steps:
      - uses: actions/checkout@v4

      # Consume the toolchain artifact (z42c+stdlib+xtask.zpkg — arch-independent
      # bytecode) + cargo-build the native z42vm. macOS resolves toolchain-macos-15;
      # linux (x64 AND arm64) resolves toolchain-ubuntu-latest (zpkg is arch-neutral).
      # rust toolchain + rust-cache 由该 action 自带（见其 cache-key input）。
      - uses: ./.github/actions/xtask-bootstrap-artifact

      - name: stdlib [Test] — INTERP mode (full)
        shell: bash
        run: |
          set -euo pipefail
          vm="$PWD/artifacts/build/runtime/release/z42vm"; [ -f "$vm.exe" ] && vm="$vm.exe"
          libs="$PWD/artifacts/build/libraries/dist/release"
          Z42_PORTABLE_VM="$vm" Z42_LIBS="$libs" "$vm" artifacts/xtask/xtask.zpkg -- test stdlib --mode interp --no-build --jobs 4

  # ── cross-zpkg coverage ─────────────────────────────────────────────────────
  # cross-zpkg (zpkg linking + cross-package dispatch) is folded back into
  # test-host(linux-x64): that leg's `_testAll` runs the cross-zpkg stage under
  # interp (only linux-x64 — other legs skip it; host-independent). Fixtures are
  # COMPILED on the release z42vm (the 3-stage-per-fixture compile was the ~18min
  # pole on debug) and RUN on the debug z42vm (keeps debug-assertions + overflow-
  # checks coverage on real cross-package execution) — speed-up-cross-zpkg-compile-vm.
  # Both z42vm builds come from _testAll's build wave. JIT cross-zpkg is dropped:
  # zpkg linking is bytecode-level,
  # and JIT execution correctness is already covered by vm-jit goldens (~222 cases).

  # ── self-host bootstrap verification ──────────────
  # Proves z42c can rebuild stdlib + z42c + xtask from CURRENT source using the
  # DOWNLOADED nightly z42c seed (runtime pkg z42c/ + libs/). A PATH-shadow stub
  # (below) hard-fails if anything tries to invoke dotnet, asserting the toolchain
  # is fully self-hosted. Like the other download-bootstrap jobs, this transiently
  # fails on an OLD nightly predating the z42c seed until publish-nightly
  # republishes a seed-carrying nightly; then it self-heals. NOT in publish-nightly's
  # needs (no deadlock). linux-x64 only.
  verify-selfhost:
    name: verify-selfhost(linux-x64)
    timeout-minutes: 40
    # change-detect rule (b): the bootstrap boundary check only matters when z42c
    # changes (a stdlib/xtask-only change can't use syntax/format the published
    # nightly lacks without a same-window compiler change). Skip otherwise. Safe
    # to gate: no job has verify-selfhost in its `needs:` (deliberately excluded
    # from publish-nightly for deadlock-avoidance).
    #
    # schedule / workflow_dispatch 必须无条件跑：paths-filter 在这两个事件下没有
    # before-sha 可比，filter 基本恒 false —— 没有这个逃生口，每日 nightly 全量
    # sweep 里 verify-selfhost 从不运行，而 nightly 的存在意义恰恰是覆盖 per-push
    # filter 跳过的提交（见文件头 schedule 注释）。其余 changes-gated job
    # (vm-jit / stdlib-jit / stdlib-interp / compiler-checks / feature-matrix)
    # 早就都带这个逃生口，只有这里漏了。
    needs: changes
    if: ${{ needs.changes.outputs.compiler == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust deps (Swatinem)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/runtime -> ../../artifacts/build/runtime
          shared-key: host-v2

      # Hard no-dotnet guard: shadow `dotnet` with a failing stub and put it on PATH
      # via $GITHUB_PATH so it covers EVERY later step. ubuntu-latest ships dotnet in
      # the base image, so presence proves nothing — we prove it is never CALLED. The
      # toolchain is fully z42-self-hosted; dotnet must never be reached.
      - name: Install no-dotnet guard
        shell: bash
        run: |
          mkdir -p /tmp/no-dotnet-bin
          printf '#!/usr/bin/env bash\necho "::error::dotnet invoked — the toolchain is self-hosted; dotnet must not be reached" >&2\nexit 97\n' > /tmp/no-dotnet-bin/dotnet
          chmod +x /tmp/no-dotnet-bin/dotnet
          echo "/tmp/no-dotnet-bin" >> "$GITHUB_PATH"

      # Bootstrap from the prev nightly seed (download nightly → cargo z42vm → seed
      # z42c builds xtask → xtask builds z42c=gen1 + stdlib) — the SAME action every
      # bootstrap job uses, now under the no-dotnet guard. This is the boundary check:
      # if current z42c source uses syntax/format the published nightly lacks, the
      # seed can't compile it and this fails (transient until publish-nightly republishes).
      - uses: ./.github/actions/ci-bootstrap
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      # Self-host fixpoint: rebuild z42c gen1 → gen2 and assert gen1 == gen2
      # byte-identical (BLID-tolerant) + z42c [Test] units. The closure proof lives in
      # xtask (_testZ42cSelfHostByteIdentical via `test compiler`), not a duplicate
      # shell script — selfhost-bootstrap.sh was exactly this logic reimplemented.
      - name: Self-host fixpoint (xtask test compiler)
        shell: bash
        run: |
          set -euo pipefail
          vm="$PWD/artifacts/build/runtime/release/z42vm"
          Z42_PORTABLE_VM="$vm" Z42_LIBS="$PWD/artifacts/build/libraries/dist/release" \
            "$vm" artifacts/xtask/xtask.zpkg -- test compiler

  # ── compiler checks (host-independent, 1× linux) ──────────────────────────
  # z42c self-host fixpoint (gen1==gen2 byte-identical) + z42c [Test] units +
  # vscode-syntax keyword consistency. These are HOST-INDEPENDENT: z42c output
  # is deterministic regardless of OS → running on all 4 test-host legs was 4×
  # redundant (~5 min/leg wasted). Offloaded here as a single linux job; test-host
  # skips them (`--skip compiler,vscode`). Gated on compiler changes (rule b) —
  # only z42c source can change the fixpoint or the keyword table.
  # Distinct from verify-selfhost: that job tests the NIGHTLY-SEED bootstrap path
  # (prev nightly compiles current source); this job tests the IN-TREE fixpoint
  # (current z42c compiles itself, gen1==gen2). Both are compiler-gated; together
  # they cover the two self-host dimensions.
  compiler-checks:
    name: compiler-checks(linux-x64)
    timeout-minutes: 30
    needs: [changes, toolchain-bootstrap]
    if: ${{ needs.changes.outputs.compiler == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # rust toolchain + rust-cache 由该 action 自带（见其 cache-key input）。
      - uses: ./.github/actions/xtask-bootstrap-artifact

      - name: z42c self-host fixpoint (xtask test compiler)
        shell: bash
        run: |
          set -euo pipefail
          vm="$PWD/artifacts/build/runtime/release/z42vm"
          Z42_PORTABLE_VM="$vm" Z42_LIBS="$PWD/artifacts/build/libraries/dist/release" \
            "$vm" artifacts/xtask/xtask.zpkg -- test compiler

      - name: VSCode grammar ↔ Lexer keyword sync (xtask test vscode-syntax)
        shell: bash
        run: |
          set -euo pipefail
          vm="$PWD/artifacts/build/runtime/release/z42vm"
          Z42_PORTABLE_VM="$vm" Z42_LIBS="$PWD/artifacts/build/libraries/dist/release" \
            "$vm" artifacts/xtask/xtask.zpkg -- test vscode-syntax

  # 2026-05-07 add-runtime-feature-flags (P4.1): verify all 4 feature presets
  # compile on host target. P4.2/P4.3/P4.4 will add real cross-compile jobs
  # (wasm32-unknown-unknown / aarch64-apple-ios / aarch64-linux-android).
  feature-matrix:
    name: verify-features(linux-x64)
    timeout-minutes: 40
    needs: changes
    if: ${{ needs.changes.outputs.vm == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Cache the 4 feature-combo release builds' deps (review §3.6). Plain
      # `cargo build` here uses the DEFAULT target (src/runtime/target), not the
      # redirected artifacts/build/runtime the bootstrap jobs use — hence the bare
      # `src/runtime` workspace + a distinct key (feature combos ≠ the host-v2 cache).
      - name: Cache Rust deps (Swatinem)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/runtime
          shared-key: feature-matrix-v1

      # migrate-scripts-to-z42: feature presets are plain cargo feature combos
      # (was `just build-*-feature`) — inlined so this job needs no `just`.
      - name: Build interp-only (no cranelift)
        run: cargo build --locked --release --manifest-path src/runtime/Cargo.toml --no-default-features --features interp-only

      - name: Build wasm preset (host target)
        run: cargo build --locked --release --manifest-path src/runtime/Cargo.toml --no-default-features --features wasm

      - name: Build ios preset (host target)
        run: cargo build --locked --release --manifest-path src/runtime/Cargo.toml --no-default-features --features ios

      - name: Build android preset (host target)
        run: cargo build --locked --release --manifest-path src/runtime/Cargo.toml --no-default-features --features android

      - name: Verify cranelift excluded under interp-only
        run: |
          if cargo tree --manifest-path src/runtime/Cargo.toml \
             --no-default-features --features interp-only 2>&1 | grep -q "cranelift"; then
            echo "ERROR: cranelift still present in interp-only build" >&2
            exit 1
          fi

      # (versions.toml drift check moved to build-and-test via
      # `z42 xtask.zpkg deps check` — migrate-scripts-to-z42.)

  # ── iOS packaging ──────────────────────────────────────────────────────
  # Packages ios-arm64 + iossim-arm64. Requires Xcode (pre-installed on
  # macos-15 arm64) + iOS Rust targets. The source bootstrap also builds z42c.
  package-ios:
    name: package-ios(macos-arm64)
    timeout-minutes: 45
    # gate-pr-package (see host-package): PR-skip unless platform changed.
    needs: [changes, toolchain-bootstrap]
    if: ${{ needs.changes.outputs.platform == 'true' || github.event_name != 'pull_request' }}
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/xtask-bootstrap-artifact
        with:
          cache-key: ios-v2
          rust-targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Package ios-arm64 + iossim-arm64 (z42 xtask.zpkg package)
        shell: bash
        run: |
          set -euo pipefail
          vm="$PWD/artifacts/build/runtime/release/z42vm"
          libs="$PWD/artifacts/build/libraries/dist/release"
          for rid in ios-arm64 iossim-arm64; do
            Z42_PORTABLE_VM="$vm" Z42_LIBS="$libs" \
              "$vm" artifacts/xtask/xtask.zpkg -- package runtime --rid "$rid"
          done

      - name: Verify iOS packages
        run: |
          set -euo pipefail
          # runtime/workload split (B2-1): tooling pkg = SwiftPM sources + placeholder
          # Package.swift; native libs + Z42VM.xcframework live in the separate runtime pack.
          for rid in ios-arm64 iossim-arm64; do
            pkg_dir=$(ls -d artifacts/packages/z42-*-${rid}-release | head -1)
            rt_dir=$(ls -d artifacts/packages/z42-runtime-*-${rid} 2>/dev/null | head -1)
            [ -d "$pkg_dir" ] || { echo "error: no $rid tooling package"; exit 1; }
            [ -d "$rt_dir" ]  || { echo "error: no $rid runtime pack (z42-runtime-*-$rid)"; exit 1; }
            echo "Tooling: $pkg_dir   Runtime: $rt_dir"
            # tooling (workload): SwiftPM sources + self-contained Z42VMC header + placeholder Package.swift
            test -f "$pkg_dir/manifest.toml"                     || { echo "missing manifest.toml"; exit 1; }
            test -d "$pkg_dir/Sources/Z42VM"                     || { echo "missing Sources/Z42VM/"; exit 1; }
            test -f "$pkg_dir/Sources/Z42VMC/include/z42_host.h" || { echo "missing self-contained Z42VMC header"; exit 1; }
            test -f "$pkg_dir/Package.swift"                     || { echo "missing Package.swift"; exit 1; }
            grep -q "__Z42_RUNTIME_XCFRAMEWORK__" "$pkg_dir/Package.swift" \
              || { echo "Package.swift not an install-resolved placeholder template"; exit 1; }
            # runtime pack: native static lib + xcframework + headers + stdlib libs
            test -f "$rt_dir/native/libz42.a"            || { echo "missing runtime native/libz42.a"; exit 1; }
            test -d "$rt_dir/native/Z42VM.xcframework"   || { echo "missing runtime Z42VM.xcframework/"; exit 1; }
            test -d "$rt_dir/native/include"             || { echo "missing runtime native/include/"; exit 1; }
            test -d "$rt_dir/libs"                       || { echo "missing runtime libs/"; exit 1; }
            # lipo: xcframework contains an arm64 Mach-O static archive
            xcfw_lib=$(find "$rt_dir/native/Z42VM.xcframework" -name "libz42.a" | head -1)
            [ -f "$xcfw_lib" ] || { echo "error: libz42.a missing inside xcframework"; exit 1; }
            lipo_out=$(lipo -info "$xcfw_lib")
            echo "$lipo_out" | grep -q "arm64" \
              || { echo "error: $rid xcframework wrong arch: $lipo_out"; exit 1; }
            echo "✓ $rid lipo: $lipo_out"
          done

      - name: Upload iOS packages
        uses: actions/upload-artifact@v4
        with:
          name: z42-ios-packages
          path: artifacts/packages/
          retention-days: 14
          if-no-files-found: error

  # ── Android packaging ───────────────────────────────────────────────────
  # Packages android-arm64 + android-x64 via cargo-ndk + NDK r26d.
  package-android:
    name: package-android(linux-x64)
    timeout-minutes: 45
    # gate-pr-package (see host-package): PR-skip unless platform changed.
    needs: [changes, toolchain-bootstrap]
    if: ${{ needs.changes.outputs.platform == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # local-cache: false — local-cache produced an incomplete ANDROID_NDK_HOME
      # (clang missing under toolchains/llvm/prebuilt/) causing libffi-sys's
      # configure to fail. Fresh download is ~2 min slower but reliable.
      - name: Setup Android NDK r26d
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          local-cache: false

      - uses: ./.github/actions/xtask-bootstrap-artifact
        with:
          cache-key: android-v2
          rust-targets: aarch64-linux-android,x86_64-linux-android

      - name: Package android-arm64 + android-x64 (z42 xtask.zpkg package)
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          vm="$PWD/artifacts/build/runtime/release/z42vm"
          libs="$PWD/artifacts/build/libraries/dist/release"
          for rid in android-arm64 android-x64; do
            Z42_PORTABLE_VM="$vm" Z42_LIBS="$libs" \
              "$vm" artifacts/xtask/xtask.zpkg -- package runtime --rid "$rid"
          done

      - name: Verify Android packages
        run: |
          set -euo pipefail
          # runtime/workload split (B2-3): tooling pkg = gradle project; per-ABI .so/.a
          # + headers + stdlib libs live in the separate runtime pack.
          for rid in android-arm64 android-x64; do
            pkg_dir=$(ls -d artifacts/packages/z42-*-${rid}-release | head -1)
            rt_dir=$(ls -d artifacts/packages/z42-runtime-*-${rid} 2>/dev/null | head -1)
            [ -d "$pkg_dir" ] || { echo "error: no $rid tooling package"; exit 1; }
            [ -d "$rt_dir" ]  || { echo "error: no $rid runtime pack (z42-runtime-*-$rid)"; exit 1; }
            echo "Tooling: $pkg_dir   Runtime: $rt_dir"
            # tooling (workload): the buildable gradle project + self-contained JNI header
            test -f "$pkg_dir/manifest.toml"                          || { echo "missing manifest.toml"; exit 1; }
            test -f "$pkg_dir/gradlew"                                || { echo "missing gradlew"; exit 1; }
            test -f "$pkg_dir/settings.gradle.kts"                    || { echo "missing settings.gradle.kts"; exit 1; }
            test -d "$pkg_dir/z42vm/src/main/java/io/z42/vm"          || { echo "missing kotlin facade"; exit 1; }
            test -f "$pkg_dir/z42vm/src/main/cpp/z42vm_jni.c"         || { echo "missing JNI bridge"; exit 1; }
            test -f "$pkg_dir/z42vm/src/main/cpp/include/z42_host.h"  || { echo "missing self-contained JNI header"; exit 1; }
            # runtime pack: per-ABI .so + .a + headers + stdlib libs
            test -f "$rt_dir/native/libz42_platform_android.so"      || { echo "missing runtime .so"; exit 1; }
            test -f "$rt_dir/native/libz42_platform_android.a"       || { echo "missing runtime .a"; exit 1; }
            test -d "$rt_dir/native/include"                         || { echo "missing runtime native/include/"; exit 1; }
            test -d "$rt_dir/libs"                                   || { echo "missing runtime libs/"; exit 1; }
            # ELF architecture of the runtime .so
            so="$rt_dir/native/libz42_platform_android.so"
            file_out=$(file "$so")
            case "$rid" in
              android-arm64)
                echo "$file_out" | grep -q "ARM aarch64" \
                  || { echo "error: $rid .so wrong arch: $file_out"; exit 1; }
                echo "✓ $rid ELF arch: ARM aarch64" ;;
              android-x64)
                echo "$file_out" | grep -q "x86-64" \
                  || { echo "error: $rid .so wrong arch: $file_out"; exit 1; }
                echo "✓ $rid ELF arch: x86-64" ;;
            esac
          done

      - name: Upload Android packages
        uses: actions/upload-artifact@v4
        with:
          name: z42-android-packages
          path: artifacts/packages/
          retention-days: 14
          if-no-files-found: error

  # ── wasm packaging ──────────────────────────────────────────────────────
  # Packages browser-wasm via wasm-pack (no Node.js needed — wasm-pack build
  # only generates JS glue, it doesn't execute it).
  # `xtask test platform wasm build` (WasmBackend) produces pkg-web/ +
  # pkg-nodejs/ before `xtask package` can assemble the wasm SDK package.
  package-wasm:
    name: package-wasm(linux-x64)
    timeout-minutes: 40
    # gate-pr-package (see host-package): PR-skip unless platform changed.
    needs: [changes, toolchain-bootstrap]
    if: ${{ needs.changes.outputs.platform == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install wasm-pack + wasm-tools
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack,wasm-tools

      - uses: ./.github/actions/xtask-bootstrap-artifact
        with:
          cache-key: wasm-v2
          rust-targets: wasm32-unknown-unknown

      - name: Build wasm platform (pkg-web/ + pkg-nodejs/ via test platform wasm build)
        shell: bash
        run: |
          set -euo pipefail
          vm="$PWD/artifacts/build/runtime/release/z42vm"
          Z42_PORTABLE_VM="$vm" Z42_LIBS="$PWD/artifacts/build/libraries/dist/release" \
            "$vm" artifacts/xtask/xtask.zpkg -- test platform wasm build

      - name: Package browser-wasm (z42 xtask.zpkg package)
        shell: bash
        run: |
          set -euo pipefail
          vm="$PWD/artifacts/build/runtime/release/z42vm"
          Z42_PORTABLE_VM="$vm" Z42_LIBS="$PWD/artifacts/build/libraries/dist/release" \
            "$vm" artifacts/xtask/xtask.zpkg -- package runtime --rid browser-wasm

      - name: Verify wasm package + WebAssembly validation
        run: |
          set -euo pipefail
          # runtime/workload split (B2-3): tooling pkg = js facade + package.json; the
          # wasm module + libz42.a + pkg-web/pkg-nodejs + stdlib libs live in the runtime pack.
          pkg_dir=$(ls -d artifacts/packages/z42-*-browser-wasm-release | head -1)
          rt_dir=$(ls -d artifacts/packages/z42-runtime-*-browser-wasm 2>/dev/null | head -1)
          [ -d "$pkg_dir" ] || { echo "error: no browser-wasm tooling package"; exit 1; }
          [ -d "$rt_dir" ]  || { echo "error: no browser-wasm runtime pack (z42-runtime-*-browser-wasm)"; exit 1; }
          echo "Tooling: $pkg_dir   Runtime: $rt_dir"
          # tooling (workload): js facade + package.json
          test -f "$pkg_dir/manifest.toml"               || { echo "missing manifest.toml"; exit 1; }
          test -f "$pkg_dir/package.json"                || { echo "missing package.json"; exit 1; }
          test -d "$pkg_dir/js"                          || { echo "missing js/"; exit 1; }
          # runtime pack: wasm module + static lib + wasm-bindgen output + stdlib libs
          test -f "$rt_dir/native/z42_wasm_bg.wasm"      || { echo "missing z42_wasm_bg.wasm"; exit 1; }
          test -f "$rt_dir/native/libz42.a"              || { echo "missing native/libz42.a"; exit 1; }
          test -d "$rt_dir/pkg-web"                      || { echo "missing pkg-web/"; exit 1; }
          test -d "$rt_dir/pkg-nodejs"                   || { echo "missing pkg-nodejs/"; exit 1; }
          test -d "$rt_dir/libs"                         || { echo "missing runtime libs/"; exit 1; }
          echo "✓ browser-wasm layout OK"
          # WebAssembly spec validation via wasm-tools (Bytecode Alliance).
          # Validates binary encoding + all active wasm proposals; no JS runtime needed.
          wasm="$rt_dir/native/z42_wasm_bg.wasm"
          wasm-tools validate "$wasm"
          export_count=$(wasm-tools print "$wasm" | grep -c '(export' || true)
          [ "$export_count" -gt 0 ] || { echo "error: no exports in wasm module"; exit 1; }
          echo "✓ wasm valid — $export_count exports (wasm-tools)"

      - name: Upload wasm package
        uses: actions/upload-artifact@v4
        with:
          name: z42-wasm-package
          path: artifacts/packages/
          retention-days: 14
          if-no-files-found: error

  # ── Nightly rolling pre-release ────────────────────────────────────────
  # On every push to main, repackage all 9 RID artifacts (host ×4 + ios ×2 +
  # android ×2 + wasm) into archives and force-replace a single `nightly`
  # GitHub Release. The tag URL stays stable so downstream consumers can pin to:
  #
  #   https://github.com/<owner>/z42/releases/download/nightly/z42-sdk-nightly-<rid>.{tar.gz,zip}
  #
  # Not signed. Marked --prerelease. Skipped on PRs (token + fork-PR limitations).
  publish-nightly:
    name: publish-nightly
    timeout-minutes: 40
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    # NIGHTLY-SEED DEADLOCK POSTURE: EVERY bootstrap path (build-and-test, host-package,
    # package-*, all via the ci-bootstrap action / toolchain-bootstrap) seeds from the
    # PREVIOUS nightly's z42c and builds current source with it — every bootstrap depends
    # on a prior nightly. The self-heal invariant rests entirely
    # on the staged-bootstrap discipline (.claude/rules/bootstrap-seed.md): the prev
    # nightly's z42c MUST always be able to compile current source (new syntax / zbc
    # bump lands "support" one release before "use"; `xtask test bootstrap`
    # is the boundary check). If that discipline is ever violated, the prev nightly
    # can't build current source → these deps fail → publish can't republish a fixed
    # nightly → manual recovery. Keep `needs` to the jobs that
    # build + test + package CURRENT source (build-and-test test + windows pkg,
    # host-package unix pkgs, package-* mobile); do NOT add the pure download-bootstrap
    # gates (vm-jit / stdlib-jit) — they transiently fail on a bump until a
    # compatible nightly exists and self-heal next run, and gating publish on them
    # would add a needless deadlock edge. JIT correctness is gated by the dedicated
    # vm-jit-consistency job (build-and-test's `xtask test all` is interp-only).
    needs:
      - build-and-test
      - host-package
      # feature-matrix: removed from needs (no artifact produced; pure compile-check
      # now gated on vm changes — a skip would block publish). It still gates
      # correctness independently.
      - package-ios
      - package-android
      - package-wasm
      - toolchain-bootstrap   # provides the toolchain-<os> artifact for `xtask release`
    runs-on: ubuntu-latest
    # Serialize publish-nightly across ALL events/runs: it does `gh release delete
    # nightly` → `gh release create nightly`, which two concurrent runs (e.g. a push
    # and the daily schedule, now in separate top-level concurrency groups) would
    # race on — one deletes the release out from under the other's edit → HTTP 403 /
    # stuck-draft. cancel-in-progress: false queues the newer run so the in-flight
    # publish finishes cleanly, then the newer SHA republishes. Job-level group, so
    # only publish-nightly is serialized — build/test stay decoupled per event.
    concurrency:
      group: publish-nightly-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write   # gh release create / delete
    steps:
      - uses: actions/checkout@v4

      - name: Provision z42vm + xtask (consume toolchain artifact)
        uses: ./.github/actions/xtask-bootstrap-artifact

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-raw
          pattern: 'z42-*-package*'
          merge-multiple: true

      - name: Show downloaded layout (debug)
        run: |
          echo "--- dist-raw top level ---"
          ls -la dist-raw/ || true
          echo "--- z42-* dirs under dist-raw/ ---"
          find dist-raw -maxdepth 1 -type d | sort || true

      - name: Layout + archive each RID package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/packages artifacts/release
          out="$(pwd)/artifacts/release"

          # Find SDK package dirs (z42-*-release) at top level.
          mapfile -t sdk_dirs < <(find dist-raw -maxdepth 1 -type d -name 'z42-*-release' | sort -u)
          [ "${#sdk_dirs[@]}" -gt 0 ] \
              || { echo "error: no z42-*-release dirs under dist-raw/"; find dist-raw -maxdepth 3 -type d; exit 1; }
          echo "→ Found ${#sdk_dirs[@]} SDK package dirs"

          for src in "${sdk_dirs[@]}"; do
              name=$(basename "$src")          # z42-<v>-<rid>-release
              stripped=${name#z42-}            # <v>-<rid>-release
              stripped=${stripped%-release}    # <v>-<rid>
              # rid = last segment matching a known suffix (handles linux-x64,
              # iossim-arm64, browser-wasm). iOS device (ios-arm64) and simulator
              # (iossim-arm64) now use distinct prefixes, so suffix matching is
              # unambiguous regardless of list order.
              rid=""
              for candidate in linux-x64 linux-arm64 macos-arm64 windows-x64 \
                               iossim-arm64 ios-arm64 \
                               android-arm64 android-x64 browser-wasm; do
                  if [[ "$stripped" == *-"$candidate" ]]; then rid="$candidate"; break; fi
              done
              [ -n "$rid" ] || { echo "error: cannot infer RID from $name"; exit 1; }

              # Rename to neutral version label so the download URL stays stable.
              new_name="z42-nightly-${rid}-release"
              dst="artifacts/packages/$new_name"
              rm -rf "$dst"; cp -R "$src" "$dst"

              if [ "$rid" = "windows-x64" ]; then
                  # Archive contents directly (no top-level subdirectory).
                  # Use `zip` (not `tar -a`): GNU tar's zip output is incompatible
                  # with Windows Expand-Archive / Explorer on some tar versions.
                  (cd "$dst" && zip -r "${out}/z42-sdk-nightly-${rid}.zip" .)
                  echo "✓ sdk ${rid} → z42-sdk-nightly-${rid}.zip"
                  psrc=$(find dist-raw -maxdepth 1 -type d -name "z42-runtime-*-${rid}" | head -1)
                  [ -d "$psrc" ] || { echo "error: missing runtime package for ${rid}"; exit 1; }
                  (cd "$psrc" && zip -r "${out}/z42-runtime-nightly-${rid}.zip" .)
                  echo "✓ runtime ${rid} → z42-runtime-nightly-${rid}.zip"
                  dwsrc=$(find dist-raw -maxdepth 1 -type d -name "z42-workload-*-desktop-${rid}" | head -1)
                  [ -d "$dwsrc" ] || { echo "error: missing desktop workload for ${rid}"; exit 1; }
                  (cd "$dwsrc" && zip -r "${out}/z42-workload-nightly-desktop-${rid}.zip" .)
                  echo "✓ desktop workload ${rid} → z42-workload-nightly-desktop-${rid}.zip"
              elif [[ "$rid" == linux-* || "$rid" == macos-* ]]; then
                  tar -C "$dst" -czf "${out}/z42-sdk-nightly-${rid}.tar.gz" .
                  echo "✓ sdk ${rid} → z42-sdk-nightly-${rid}.tar.gz"
                  psrc=$(find dist-raw -maxdepth 1 -type d -name "z42-runtime-*-${rid}" | head -1)
                  [ -d "$psrc" ] || { echo "error: missing runtime package for ${rid}"; exit 1; }
                  tar -C "$psrc" -czf "${out}/z42-runtime-nightly-${rid}.tar.gz" .
                  echo "✓ runtime ${rid} → z42-runtime-nightly-${rid}.tar.gz"
                  dwsrc=$(find dist-raw -maxdepth 1 -type d -name "z42-workload-*-desktop-${rid}" | head -1)
                  [ -d "$dwsrc" ] || { echo "error: missing desktop workload for ${rid}"; exit 1; }
                  tar -C "$dwsrc" -czf "${out}/z42-workload-nightly-desktop-${rid}.tar.gz" .
                  echo "✓ desktop workload ${rid} → z42-workload-nightly-desktop-${rid}.tar.gz"
              else
                  # Platform RID (runtime/workload split): runtime pack (per RID) +
                  # workload tooling (primary RID only — identical across ABIs/slices).
                  psrc=$(find dist-raw -maxdepth 1 -type d -name "z42-runtime-*-${rid}" | head -1)
                  [ -d "$psrc" ] || { echo "error: missing runtime pack for ${rid}"; exit 1; }
                  tar -C "$psrc" -czf "${out}/z42-runtime-nightly-${rid}.tar.gz" .
                  echo "✓ runtime ${rid} → z42-runtime-nightly-${rid}.tar.gz"
                  case "$rid" in
                    ios-arm64)     wl=ios ;;
                    android-arm64) wl=android ;;
                    browser-wasm)  wl=wasm ;;
                    *)             wl="" ;;
                  esac
                  if [ -n "$wl" ]; then
                      tar -C "$dst" -czf "${out}/z42-workload-nightly-${wl}.tar.gz" .
                      echo "✓ workload ${wl} → z42-workload-nightly-${wl}.tar.gz"
                  fi
              fi
          done

          # test workload (payload-only, platform-agnostic) — a SINGLE archive built
          # once on macos-arm64 (package-test-workload), not per-RID → re-archive here
          # to the neutral nightly label. No merge (D6b): the built dir is the artifact.
          twsrc=$(find dist-raw -maxdepth 1 -type d -name "z42-workload-*-test" | head -1)
          [ -d "$twsrc" ] || { echo "error: missing test workload package (expected z42-workload-*-test in dist-raw)"; exit 1; }
          tar -C "$twsrc" -czf "${out}/z42-workload-nightly-test.tar.gz" .
          echo "✓ test workload → z42-workload-nightly-test.tar.gz"

      # Merge the 4 per-RID desktop-workload pieces into ONE RID-agnostic
      # z42-workload-nightly-desktop.tar.gz (every RID's apphost-<rid>) → cross-output.
      - name: Assemble single desktop workload (nightly)
        shell: bash
        run: |
          Z42_PORTABLE_VM="$PWD/artifacts/build/runtime/release/z42vm" \
          Z42_LIBS="$PWD/artifacts/build/libraries/dist/release" \
            artifacts/build/runtime/release/z42vm artifacts/xtask/xtask.zpkg -- \
            package workload nightly artifacts/release

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/release
          shasum -a 256 z42-*.tar.gz z42-*.zip 2>/dev/null | sort -k2 > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: Generate release-index.json
        shell: bash
        run: |
          Z42_PORTABLE_VM="$PWD/artifacts/build/runtime/release/z42vm" \
          Z42_LIBS="$PWD/artifacts/build/libraries/dist/release" \
            artifacts/build/runtime/release/z42vm artifacts/xtask/xtask.zpkg -- \
            package index nightly artifacts/release nightly nightly nightly

      - name: Force-replace nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          short_sha=$(git rev-parse --short HEAD)
          today=$(date -u +%Y-%m-%d)
          # Delete prior nightly (release + tag); ignore if absent.
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          notes=$(cat <<EOF
          **Rolling pre-release** built from \`main\` on ${today} (commit \`${short_sha}\`).

          - **Unsigned** — do not use for production.
          - **Replaced on every push to main** — URL stays stable, contents change.
          - For tagged releases see [Releases](../../releases?q=v).

          ## Downloads (host)

          | Platform | SDK | Runtime |
          |----------|-----|---------|
          | Linux x64 | \`z42-sdk-nightly-linux-x64.tar.gz\` | \`z42-runtime-nightly-linux-x64.tar.gz\` |
          | Linux arm64 | \`z42-sdk-nightly-linux-arm64.tar.gz\` | \`z42-runtime-nightly-linux-arm64.tar.gz\` |
          | macOS arm64 | \`z42-sdk-nightly-macos-arm64.tar.gz\` | \`z42-runtime-nightly-macos-arm64.tar.gz\` |
          | Windows x64 | \`z42-sdk-nightly-windows-x64.zip\` | \`z42-runtime-nightly-windows-x64.zip\` |

          ## Downloads (mobile + wasm runtime)

          | Platform | Runtime |
          |----------|---------|
          | iOS arm64 (device) | \`z42-runtime-nightly-ios-arm64.tar.gz\` |
          | iOS arm64 (simulator) | \`z42-runtime-nightly-iossim-arm64.tar.gz\` |
          | Android arm64 | \`z42-runtime-nightly-android-arm64.tar.gz\` |
          | Android x64 | \`z42-runtime-nightly-android-x64.tar.gz\` |
          | Browser WASM | \`z42-runtime-nightly-browser-wasm.tar.gz\` |

          ## Workloads (\`z42 workload install <wl>\`; ios/android/wasm bundle the runtime packs above — desktop carries the per-RID apphost stubs and reuses the host runtime)

          | Workload | Tooling archive |
          |----------|-----------------|
          | Desktop (apphost) | \`z42-workload-nightly-desktop.tar.gz\` |
          | iOS (SwiftPM) | \`z42-workload-nightly-ios.tar.gz\` |
          | Android (Gradle) | \`z42-workload-nightly-android.tar.gz\` |
          | WASM (npm) | \`z42-workload-nightly-wasm.tar.gz\` |
          | Test (capability; test-agent payload) | \`z42-workload-nightly-test.tar.gz\` |

          Verify: \`shasum -a 256 -c SHA256SUMS --ignore-missing\`
          EOF
          )
          gh release create nightly --prerelease --target "$GITHUB_SHA" \
            --title "Nightly (main @ ${short_sha} · ${today})" \
            --notes "$notes" \
            artifacts/release/SHA256SUMS artifacts/release/release-index.json artifacts/release/z42-*
          # Defensive (fix-nightly-draft): the nightly MUST be a published (non-draft)
          # release — a DRAFT is invisible to other runs' GITHUB_TOKEN, so every
          # download-bootstrap job (build-and-test, verify-selfhost,
          # vm-jit/stdlib-jit) fails with "release not found", and since build-and-test
          # now seeds from the nightly, that DEADLOCKS the self-heal (no run can
          # republish a fixed nightly). Some create paths (tag recreation after
          # --cleanup-tag) can leave it draft, so force-publish + verify here.
          gh release edit nightly --draft=false --prerelease
          if [ "$(gh release view nightly --json isDraft -q .isDraft)" = "true" ]; then
            echo "::error::nightly release is still a draft after edit — download-bootstrap jobs will fail"; exit 1
          fi
          echo "✓ nightly published (non-draft) — reachable by GITHUB_TOKEN"

  # ── Platform test pipeline → cross-platform CI dashboard ─────────────────
  # `z42 xtask.zpkg test platform <p>` (add-platform-test-pipeline) on real
  # runners: wasm (Playwright/Chromium), iOS Simulator (xcodebuild test),
  # Android emulator (reactivecircus). Each publishes its JUnit as a GitHub
  # Check via dorny/test-reporter — the 3 checks on the PR ARE the dashboard.
  # (infra-ci-platform-test-dashboard, 2026-06-16)
  test-wasm:
    name: test-wasm-browser(linux-x64) shard ${{ matrix.shard }}
    # ci-perf-tier2: 30→60. Cold "build deployable" (wasm-pack LTO + z42c compiling
    # the whole corpus) runs ~27min and was hitting the 30min cap → the job was
    # cancelled at that step and the in-browser test never ran (repeatedly). The
    # rust-cache above cuts the wasm-pack part; the higher cap absorbs the rest.
    # fix-wasm-shard-timeout: 60→75. The corpus keeps growing (each shard's
    # in-browser Playwright run passed 10min → hit the old 620s test-timeout), so
    # the raised Playwright timeout (playwright.embedded.config.ts) needs more room
    # under the job wall alongside a cold ~27min build; 75 matches toolchain-bootstrap.
    timeout-minutes: 75
    needs: toolchain-bootstrap   # `changes` 不在 needs：本 job 的 if: 只看 event_name，从不读 needs.changes.outputs.*
    # Tier-2 (slow: browser/emulator/simulator) — nightly-only (16:00 UTC = 00:00
    # UTC+8) + manual, NOT per-PR, to keep daily iteration fast (reduce-tier2-ci-cadence).
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    # tier2-shard-full-coverage: fan out the embedded corpus into N parallel shards
    # so nightly runs the FULL runnable corpus (`test embedded --shard k/N`, no cap)
    # instead of the 60-case smoke sample. R1–R7 (`test platform wasm`) is NOT
    # per-corpus, so it runs only on shard 1 (gated below) to avoid N× redundancy;
    # the embedded slice + its Playwright run happen on every shard. wasm = n=3:
    # measured per-shard runtime is small (~5-7 min build-cached) with big wall
    # headroom, and z42.compression is capability-excluded — 3 shards over the ~340
    # runnable wasm cases keeps each well under the job wall without over-flooding
    # the runner pool.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/artifacts/tools/playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # ci-perf-tier2: cache ~/.npm keyed on the tests lockfile.
          cache: npm
          cache-dependency-path: src/toolchain/workload/wasm/platform/tests/package-lock.json
      # ci-perf-tier2: cache the Playwright browser binaries (Chromium ~150MB) keyed
      # on the pinned playwright version in the lockfile — the Prime step's
      # `npx playwright install` then skips the download on a hit (apt --with-deps
      # OS libs still run, but they're fast/idempotent).
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/artifacts/tools/playwright-browsers
          key: playwright-${{ runner.os }}-${{ hashFiles('src/toolchain/workload/wasm/platform/tests/package-lock.json') }}
      - uses: ./.github/actions/xtask-bootstrap-artifact
        with:
          cache-key: tier2-wasm
          rust-targets: wasm32-unknown-unknown
      - name: Prime Playwright (node deps + Chromium + OS libs)
        shell: bash
        run: |
          set -euo pipefail
          cd src/toolchain/workload/wasm/platform/tests
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      # tier2-shard-full-coverage: R1–R7 is corpus-independent → run it only on
      # shard 1 (not N× redundantly). Its junit is published/uploaded below, also
      # shard-1-only, so the artifact name stays unique.
      - name: test platform wasm (build + assets + Playwright R1–R7)
        if: ${{ matrix.shard == 1 }}
        shell: bash
        run: |
          set -euo pipefail
          vm="$PWD/artifacts/build/runtime/release/z42vm"
          libs="$PWD/artifacts/build/libraries/dist/release"
          Z42_PORTABLE_VM="$vm" Z42_LIBS="$libs" "$vm" artifacts/xtask/xtask.zpkg -- test platform wasm
      # z42b-device-run PR-4 (dogfood): z42b resolves the on-device test-agent from
      # the installed `test` workload in ITS OWN SDK home (Z42_PORTABLE_VM →
      # artifacts/build/runtime), not an in-tree --agent. Stage the agent there at
      # compile time: build the workload payload from current source and drop its
      # z42.testagent.zpkg into <home>/runtimes/<ver>/workloads/test/ — the exact
      # path `z42 workload install test` would populate. z42b finds it → no launcher
      # spawn / archive download needed in CI (design D4; the install-if-missing
      # branch covers real installed SDKs / local dev).
      - name: Provision test workload into z42b's SDK (dogfood)
        shell: bash
        run: |
          set -euo pipefail
          vm="$PWD/artifacts/build/runtime/release/z42vm"
          libs="$PWD/artifacts/build/libraries/dist/release"
          Z42_PORTABLE_VM="$vm" Z42_LIBS="$libs" "$vm" artifacts/xtask/xtask.zpkg -- package workload test dev
          dest="$PWD/artifacts/build/runtime/runtimes/dev/workloads/test"
          mkdir -p "$dest"
          cp artifacts/packages/z42-workload-dev-test*/z42.testagent.zpkg "$dest/"
      # add-wasm-testhost G6: same runner + primed Playwright — build the embedded
      # deployable (agent+bundle+libs → artifacts/build/wasm-test/) and run the
      # bundled corpus in-browser (distinct config rooted at that dir).
      # tier2-shard-full-coverage: --shard k/N → this shard's full-coverage slice.
      - name: test embedded --rid browser-wasm (build deployable, shard ${{ matrix.shard }}/3)
        shell: bash
        run: |
          set -euo pipefail
          vm="$PWD/artifacts/build/runtime/release/z42vm"
          libs="$PWD/artifacts/build/libraries/dist/release"
          Z42_PORTABLE_VM="$vm" Z42_LIBS="$libs" "$vm" artifacts/xtask/xtask.zpkg -- test embedded --rid browser-wasm --shard ${{ matrix.shard }}/3
      # z42b-device-run PR-1: the embedded RUN is z42b's wasm driver (spawns the
      # playwright embedded config in the tests dir). node is on PATH here
      # (actions/setup-node) → --node-bin empty. Report回收 = playwright exit code
      # (run.js still self-asserts window.__report; z42b relays the verdict).
      - name: Playwright — embedded corpus runs green in-browser (via z42b --run)
        shell: bash
        run: |
          set -euo pipefail
          vm="$PWD/artifacts/build/runtime/release/z42vm"
          libs="$PWD/artifacts/build/libraries/dist/release"
          Z42_PORTABLE_VM="$vm" Z42_LIBS="$libs" "$vm" artifacts/xtask/xtask.zpkg -- test embedded --rid browser-wasm --run
      # R1–R7 junit exists only on shard 1 (Playwright embedded reports via `list`,
      # not junit — its result is the step exit code above).
      - name: Publish wasm test report (GitHub Check)
        if: ${{ always() && matrix.shard == 1 }}
        uses: dorny/test-reporter@v1
        with:
          name: platform-tests / wasm
          path: artifacts/test-reports/wasm/junit.xml
          reporter: java-junit
          fail-on-error: false
      - name: Upload wasm JUnit
        if: ${{ always() && matrix.shard == 1 }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-wasm
          path: artifacts/test-reports/wasm/junit.xml
          if-no-files-found: warn

  test-ios:
    name: test-ios-sim(macos-arm64) shard ${{ matrix.shard }}
    # ci-perf-tier2: 45→60. Same cold-build + simulator-boot pressure repeatedly
    # cancelled this job before it could report.
    timeout-minutes: 60
    needs: toolchain-bootstrap   # `changes` 不在 needs：本 job 的 if: 只看 event_name，从不读 needs.changes.outputs.*
    # Tier-2 (slow: browser/emulator/simulator) — nightly-only (16:00 UTC = 00:00
    # UTC+8) + manual, NOT per-PR, to keep daily iteration fast (reduce-tier2-ci-cadence).
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    # tier2-mobile-coverage: fan the embedded corpus into N shards for FULL
    # coverage (`test embedded --shard k/N`, no 60-cap), mirroring test-wasm.
    # Mobile's runnable corpus (~465 cases; only net + process/console/env + OS
    # identity are capability-excluded — see _targetExcludes) is much larger than
    # wasm's, so the uncapped full corpus blew the 60min emulator/sim wall (why
    # the 60-smoke cap existed). n=3 keeps each shard's ~155-case slice under the
    # wall. Each shard boots its own simulator and runs its 1/N slice + R1–R7
    # (R1–R7 is corpus-independent → redundant across shards, but cheap vs the
    # boot+corpus; folding into the single Z42VM scheme run avoids a 2nd sim boot).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: macos-15
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/xtask-bootstrap-artifact
        with:
          cache-key: tier2-ios
          rust-targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin
      - name: test platform ios + embedded (shard ${{ matrix.shard }}/3, one simulator run)
        shell: bash
        run: |
          set -euo pipefail
          vm="$PWD/artifacts/build/runtime/release/z42vm"
          libs="$PWD/artifacts/build/libraries/dist/release"
          run() { Z42_PORTABLE_VM="$vm" Z42_LIBS="$libs" "$vm" artifacts/xtask/xtask.zpkg -- "$@"; }
          # z42b-device-run PR-4 (dogfood): stage the test-agent into z42b's own SDK
          # home workload dir (<home>/runtimes/<ver>/workloads/test/, where
          # `z42 workload install test` puts it) so z42b resolves it from there — no
          # in-tree --agent, no launcher spawn / archive download in CI (design D4).
          run package workload test dev
          dest="$PWD/artifacts/build/runtime/runtimes/dev/workloads/test"
          mkdir -p "$dest"
          cp artifacts/packages/z42-workload-dev-test*/z42.testagent.zpkg "$dest/"
          # add-wasm-testhost G6 + tier2-mobile-coverage: fold this shard's embedded
          # slice into the SAME xcodebuild/simulator run as R1–R7 (no 2nd sim boot).
          # z42b-device-run PR-2: iOS build+deploy+run 下沉 z42b's ios driver.
          #  1) embedded --rid iossim-arm64 → z42b --build: xcframework (sim+host) +
          #     this shard's Resources/embedded slice (Z42EmbeddedTests corpus).
          #  2) platform ios assets → R1–R7 fixtures + stdlib into Resources.
          #  3) embedded --rid iossim-arm64 --run → z42b --run: ONE `xcodebuild test
          #     -scheme Z42VM` runs both Z42VMTests (R1–R7) and Z42EmbeddedTests,
          #     resolves the sim UDID, and writes the JUnit below.
          run test embedded --rid iossim-arm64 --shard ${{ matrix.shard }}/3
          run test platform ios assets
          run test embedded --rid iossim-arm64 --run
      - name: Publish iOS test report (GitHub Check)
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: platform-tests / ios (shard ${{ matrix.shard }})
          path: artifacts/test-reports/ios/junit.xml
          reporter: java-junit
          fail-on-error: false
      - name: Upload iOS JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-ios-${{ matrix.shard }}
          path: artifacts/test-reports/ios/**
          if-no-files-found: warn

  test-android:
    name: test-android-emu(linux-x64) shard ${{ matrix.shard }}
    # ci-perf-tier2: 45→60. Cold NDK/cargo-ndk build + emulator boot headroom
    # (AVD snapshot cache below cuts boot once warm).
    timeout-minutes: 60
    needs: toolchain-bootstrap   # `changes` 不在 needs：本 job 的 if: 只看 event_name，从不读 needs.changes.outputs.*
    # Tier-2 (slow: browser/emulator/simulator) — nightly-only (16:00 UTC = 00:00
    # UTC+8) + manual, NOT per-PR, to keep daily iteration fast (reduce-tier2-ci-cadence).
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    # tier2-mobile-coverage: fan the embedded corpus into N shards for FULL
    # coverage (`test embedded --shard k/N`, no 60-cap), mirroring test-wasm/ios.
    # The uncapped full corpus (~465 runnable) blew the 60min emulator wall (why
    # the 60-smoke cap existed); n=3 keeps each ~155-case slice under it. Every
    # shard boots its own emulator and runs its 1/N slice + R1–R7 (R1–R7 is
    # corpus-independent → redundant across shards; folding into the single
    # connectedAndroidTest run avoids a 2nd emulator boot). The AVD snapshot cache
    # is corpus-independent → shared key across shards.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android NDK r26d
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
      - uses: ./.github/actions/xtask-bootstrap-artifact
        with:
          cache-key: tier2-android
          rust-targets: aarch64-linux-android,x86_64-linux-android
      - name: test platform android — cargo-ndk + AAR + assets
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          vm="$PWD/artifacts/build/runtime/release/z42vm"
          libs="$PWD/artifacts/build/libraries/dist/release"
          Z42_PORTABLE_VM="$vm" Z42_LIBS="$libs" "$vm" artifacts/xtask/xtask.zpkg -- test platform android build
          Z42_PORTABLE_VM="$vm" Z42_LIBS="$libs" "$vm" artifacts/xtask/xtask.zpkg -- test platform android assets
          # z42b-device-run PR-4 (dogfood): stage the test-agent into z42b's own SDK
          # home workload dir (<home>/runtimes/<ver>/workloads/test/) so z42b's --build
          # resolves it from there — no in-tree --agent, no launcher / download (design D4).
          Z42_PORTABLE_VM="$vm" Z42_LIBS="$libs" "$vm" artifacts/xtask/xtask.zpkg -- package workload test dev
          dest="$PWD/artifacts/build/runtime/runtimes/dev/workloads/test"
          mkdir -p "$dest"
          cp artifacts/packages/z42-workload-dev-test*/z42.testagent.zpkg "$dest/"
          # add-wasm-testhost G6 + tier2-mobile-coverage: build this shard's embedded
          # slice (x86_64 .so — matches the emulator ABI — + androidTest/assets/embedded)
          # so the single connectedAndroidTest below runs Z42EmbeddedInstrumentedTest's
          # 1/3 full-coverage slice too.
          Z42_PORTABLE_VM="$vm" Z42_LIBS="$libs" "$vm" artifacts/xtask/xtask.zpkg -- test embedded --rid android-x64 --shard ${{ matrix.shard }}/3
      # ci-perf-tier2 (#4): AVD snapshot cache. A cold emulator boot is ~4min every
      # run; caching ~/.android/avd + a warm snapshot boots in ~1min on a hit.
      # arch/target/api-level MUST match between the create-snapshot run and the
      # test run (reactivecircus recipe).
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-x86_64-google_apis
      - name: Create AVD snapshot (cache miss)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          # fix-android-embed-oom: -memory 4096 (default ~2GB was OOM'd by the
          # embedded corpus). Must match the test run below for snapshot consistency.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."
      - name: connectedAndroidTest on emulator (R1–R7 + embedded corpus)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: src/toolchain/workload/android/platform
          # ci-perf-tier2: AVD snapshot (load cached, don't re-save).
          force-avd-creation: false
          # fix-android-embed-oom: -memory 4096 (matches the snapshot-create run).
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          disable-animations: true
          # diagnose-mobile-wasm-embed (#159): the embedded corpus can crash the app
          # process natively ("Instrumentation run failed due to Process crashed")
          # — the cause lives in logcat/tombstones, not the JUnit XML. A post-crash
          # `adb logcat -d` returns nothing (buffer gone). Capture logcat
          # CONTINUOUSLY in the background so the SIGSEGV/abort + z42vm native
          # frames land on disk as they happen, and `tail` it INLINE into the job
          # log so the cause is visible even if the artifact upload path misses.
          # z42b-device-run PR-3: the emulator RUN 下沉 z42b's android driver — `test
          # embedded --rid android-x64 --run` spawns `./gradlew :z42vm:connectedAndroidTest`
          # (ONE emulator run = R1–R7 + embedded corpus), gradle writes its own junit
          # to the path the reporter below reads. reactivecircus still supplies the
          # emulator (design D2 asymmetry); z42b only triggers gradle. `_root()` uses
          # `git rev-parse` so xtask resolves the repo root regardless of cwd.
          script: |
            set +e
            vm="$GITHUB_WORKSPACE/artifacts/build/runtime/release/z42vm"
            libs="$GITHUB_WORKSPACE/artifacts/build/libraries/dist/release"
            adb logcat -c || true
            adb logcat > "$GITHUB_WORKSPACE/android-embed-logcat.txt" 2>&1 &
            LOGCAT_PID=$!
            Z42_PORTABLE_VM="$vm" Z42_LIBS="$libs" "$vm" "$GITHUB_WORKSPACE/artifacts/xtask/xtask.zpkg" -- test embedded --rid android-x64 --run
            rc=$?
            sleep 3
            kill "$LOGCAT_PID" 2>/dev/null || true
            adb pull /data/tombstones "$GITHUB_WORKSPACE/android-tombstones" 2>/dev/null || true
            echo "===== android-embed-logcat.txt (tail 120, inline) ====="
            tail -120 "$GITHUB_WORKSPACE/android-embed-logcat.txt" 2>/dev/null || echo "(no logcat captured)"
            echo "===== end logcat tail ====="
            exit $rc
      - name: Upload Android logcat + tombstones (crash diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-embed-crash-diagnostics-${{ matrix.shard }}
          path: |
            android-embed-logcat.txt
            android-tombstones/**
          if-no-files-found: warn
      - name: Publish Android test report (GitHub Check)
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: platform-tests / android (shard ${{ matrix.shard }})
          path: 'src/toolchain/workload/android/platform/z42vm/build/outputs/androidTest-results/connected/**/*.xml'
          reporter: java-junit
          fail-on-error: false
      - name: Upload Android JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-android-${{ matrix.shard }}
          path: src/toolchain/workload/android/platform/z42vm/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn

  test-desktop:
    name: test-desktop-cabi(linux-x64)
    timeout-minutes: 30
    needs: [changes, toolchain-bootstrap]
    # Tier-1 (desktop C ABI, fast — no emulator/sim/browser): stays per-PR on
    # platform changes (only Tier-2 wasm/iOS/Android moved to nightly-only).
    if: ${{ needs.changes.outputs.platform == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      # consume the toolchain-ubuntu-latest artifact (z42c + stdlib + xtask)
      # + cargo-build z42vm。rust toolchain + rust-cache 由该 action 自带。
      - uses: ./.github/actions/xtask-bootstrap-artifact
      - name: test platform desktop (Tier-1 C ABI R1–R7)
        shell: bash
        run: |
          set -euo pipefail
          vm="$PWD/artifacts/build/runtime/release/z42vm"
          libs="$PWD/artifacts/build/libraries/dist/release"
          Z42_PORTABLE_VM="$vm" Z42_LIBS="$libs" "$vm" artifacts/xtask/xtask.zpkg -- test platform desktop
      - name: Publish desktop test report (GitHub Check)
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: platform-tests / desktop
          path: artifacts/test-reports/desktop/junit.xml
          reporter: java-junit
          fail-on-error: false
      - name: Upload desktop JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-desktop
          path: artifacts/test-reports/desktop/junit.xml
          if-no-files-found: warn
