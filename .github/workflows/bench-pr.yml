name: Bench PR Regression

# 同-runner A/B 性能门：在本 runner 上同时建 PR 与其 merge-base（base.sha）两套工具链，
# 两侧相邻测量 ⇒ runner 速度因子在 ratio=pr/base 里抵消。
#   · e2e（`bench --ab --tier gate`）与 micro（`bench --micro-diff`）是硬门禁：阈值 0.15，
#     初判可疑的条目整轮复测、用跑间离散度判红；
#   · criterion（Rust）层只打印、不 fail。
# 判红语义、噪声底与阈值、改动面守卫、格式代差的完整推导见
# docs/internals/src/devinfra/benchmarking.md（§5–§10）；改阈值 / 守卫前先读那页。

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/runtime/**'
      - 'src/libraries/**'
      - 'src/compiler/**'
      # src/benches/：整程序性能场景 / 能力探针 / 判红 fixture / 结果 schema。
      # src/tests/ 是正确性 golden，动它们不影响性能测量，所以不列。
      - 'src/benches/**'
      - 'scripts/**/*.z42'
      - 'scripts/xtask.z42.toml'
      - '.github/workflows/bench-pr.yml'
      # 负向模式在后 ⇒ 覆盖前面的匹配：只动 .md 的 PR 不触发；.md 与代码同改照旧跑。
      - '!**/*.md'
  # main 上预热 bench 的 Rust 依赖缓存（见 bench-cache-warm job）。
  # 只在会改变缓存内容的路径上触发（Cargo.lock 就在 src/runtime/ 下）；每周一次兜住 rustc stable 升级
  # （缓存 key 含 rustc 版本，升级后 main 上没有 runtime 改动就不会有人重建）。
  push:
    branches: [main]
    paths:
      - 'src/runtime/**'
      - '.github/workflows/bench-pr.yml'
      - '!**/*.md'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  # PR：每个 PR 一组（新提交取消旧的）。push / schedule / dispatch：共用一组，新的预热取消旧的。
  group: bench-pr-${{ github.event.pull_request.number || 'warm' }}
  cancel-in-progress: true

jobs:
  # ── 缓存预热 ──────────────────────────────────────────────────────────────
  # GitHub 的缓存作用域：PR 分支上存的缓存只有该 PR 能读，main 上存的才对所有 PR 可见 ⇒
  # main 上编一遍、存一份；PR 只读（bench-regression 的 save-if: false）。
  # 编的东西与 bench-regression 实际会编的一致：z42vm + z42-compression（ci-bootstrap 里的 `xtask build runtime` 与 base
  # 工具链那两条）+ gc_cycle_bench 的 bench profile（criterion A/B）。Rust 配置逐字照抄，key 才对得上。
  bench-cache-warm:
    name: bench-cache-warm(linux-x64)
    if: github.event_name != 'pull_request'
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust deps (Swatinem)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src/runtime -> ../../artifacts/build/runtime
            base-src/src/runtime -> ../../artifacts/build/runtime
          shared-key: bench-ab-v1

      - name: Build what bench-regression builds
        shell: bash
        run: |
          set -euo pipefail
          # cargo 只从 cwd 向上找 .cargo/config.toml（target-dir），配置在 src/runtime/.cargo ⇒ 在那里跑。
          cd src/runtime
          cargo build --locked --release
          cargo build --locked --release --manifest-path crates/z42-compression/Cargo.toml
          cargo bench --locked --bench gc_cycle_bench --no-run

  bench-regression:
    name: bench-regression(linux-x64)
    if: github.event_name == 'pull_request'
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Fetch enough history that `git rev-parse --abbrev-ref HEAD` works
          # for the bench JSON metadata, and that the base.sha diff below resolves.
          fetch-depth: 0

      # A/B: the PR's merge-base toolchain, built on THIS same runner. Its build
      # location is irrelevant to the measurement — both base.zbc and pr.zbc are
      # compiled AND run on this runner, so the same-runner cancellation holds.
      - name: Checkout base (merge-base) for A/B
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-src
          fetch-depth: 0

      # 代差检测（benchmarking.md §10）：base 侧 stdlib 的写出格式由 PR 一侧的 z42.package 决定 ⇒ 格式
      # 常量不同时 base VM 读不了，A/B 结构上不可测。检测到代差就跳过依赖 base 产物的步骤，并用
      # ::warning:: + job summary 明示「本次没测」（不能静默变绿）；自检与 criterion 照跑。
      # 常量读不出来 ⇒ 直接失败，绝不按「无代差」放行。
      - name: Detect zbc/zpkg format gap (base vs PR)
        id: fmtgap
        shell: bash
        run: |
          set -euo pipefail
          ver() { # <tree-root> → "zbcMajor.zbcMinor/zpkgMajor.zpkgMinor"
            local ld="$1/src/compiler/z42.package"
            local zf="$ld/src/BinaryFormat/ZbcFormat.z42"
            local pf="$ld/src/ZpkgWriter.z42"
            local a b c d
            a=$(grep -oE 'public static int Major = [0-9]+' "$zf" | grep -oE '[0-9]+$' || true)
            b=$(grep -oE 'public static int Minor = [0-9]+' "$zf" | grep -oE '[0-9]+$' || true)
            c=$(grep -oE 'public static int Major = [0-9]+' "$pf" | grep -oE '[0-9]+$' || true)
            d=$(grep -oE 'public static int Minor = [0-9]+' "$pf" | grep -oE '[0-9]+$' || true)
            if [ -z "$a" ] || [ -z "$b" ] || [ -z "$c" ] || [ -z "$d" ]; then
              # stderr：ver 在 $(...) 里被调用，写 stdout 会被变量吞掉 —— 门会红，但读者看不到原因。
              echo "::error::cannot read zbc/zpkg format constants under $1 (moved? renamed?) — refusing to guess" >&2
              return 1
            fi
            echo "$a.$b/$c.$d"
          }
          # 第二种代差——命名空间：base 编译器源码是对着 PR libs 类型检查的，PR 删掉/改名的
          # stdlib 命名空间会让 base 侧 E0494。判据取「base 有而 PR 没有」：纯新增不影响 base。
          # ⚠️ ver() / nsset() 对 base 与 PR 两棵树都调用，不得写死只有一侧成立的路径。
          nsset() { # <tree-root> → 该树 stdlib 声明的命名空间集合（排序去重）
            grep -rhoE '^namespace [A-Za-z0-9_.]+;' "$1/src/libraries" --include='*.z42' 2>/dev/null \
              | sed 's/^namespace //; s/;$//' | sort -u
          }
          NSGONE=$(comm -23 <(nsset "$PWD/base-src") <(nsset "$PWD") | tr '\n' ' ' | sed 's/ *$//')

          PRV=$(ver "$PWD")
          BASEV=$(ver "$PWD/base-src")
          echo "format: pr=$PRV base=$BASEV"
          echo "namespaces dropped base→pr: ${NSGONE:-<none>}"
          if [ -n "$NSGONE" ]; then
            echo "gap=1" >> "$GITHUB_OUTPUT"
            msg="stdlib namespace(s) removed/renamed base→pr ($NSGONE): the base compiler source is type-checked against the PR libs, which no longer declare them (E0494), so the e2e/micro A/B is SKIPPED — this PR's performance was NOT measured."
            echo "::warning title=bench A/B skipped (namespace gap)::$msg"
            {
              echo "## ⚠️ bench A/B skipped — namespace gap"
              echo
              echo "$msg"
              echo
              echo "Still run: verdict-logic self-check, Criterion (Rust) A/B."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PRV" = "$BASEV" ]; then
            echo "gap=0" >> "$GITHUB_OUTPUT"
          else
            echo "gap=1" >> "$GITHUB_OUTPUT"
            msg="zbc/zpkg format differs (pr=$PRV, base=$BASEV): base artifacts cannot be run by the base VM, so the e2e/micro A/B is SKIPPED — this PR's performance was NOT measured."
            echo "::warning title=bench A/B skipped (format gap)::$msg"
            {
              echo "## ⚠️ bench A/B skipped — format gap"
              echo
              echo "$msg"
              echo
              echo "Still run: verdict-logic self-check, Criterion (Rust) A/B."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install hyperfine
        run: |
          wget -q https://github.com/sharkdp/hyperfine/releases/download/v1.20.0/hyperfine_1.20.0_amd64.deb
          sudo dpkg -i hyperfine_1.20.0_amd64.deb

      # 独立 key（不与 ci.yml 共用）：`cargo bench` 的依赖产物（dev-deps 参与 feature 统一）与
      # `cargo build --bin z42vm` 哈希不同，共用 key 时恒 exact hit、从不回存。base-src 同理纳入。
      - name: Cache Rust deps (Swatinem)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src/runtime -> ../../artifacts/build/runtime
            base-src/src/runtime -> ../../artifacts/build/runtime
          shared-key: bench-ab-v1
          # 只读：缓存由 main 上的 bench-cache-warm 维护（PR 存的缓存别的 PR 读不到）。
          save-if: false

      # Seed from the prev nightly + build current source warm (xtask bench
      # rebuilds stdlib via the warm self-build). Same path as CI build-and-test.
      - name: Bootstrap toolchain (nightly z42c seed → current source)
        uses: ./.github/actions/ci-bootstrap
        with:
          rid: linux-x64
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      # 判红逻辑自检（benchmarking.md §9「第 3 步自检守的是什么」）：纯 JSON / 纯函数，放在测量之前，
      # 规则改坏立刻失败。每个 fixture 套件跑 0.15 与 0.25 两遍——各套件里有一个只在其中一个阈值下
      # 翻红的用例，是唯一对阈值本身敏感的用例。
      # ⚠️ 0.15 这一列必须跟着门禁实际用的 --threshold-time 走。
      # 覆盖边界：守的是判定规则，不是测量与编排（hyperfine 调用、base 工具链构建、基线采集）。
      - name: Verdict logic self-check (_abVerdict/_abResampleVerdict + _benchDiff + _microDiff fixtures)
        shell: bash
        run: |
          set -uo pipefail
          T="src/benches/testdata"
          fail=0
          xt() {
            xtask "$@" >/dev/null 2>&1
            echo $?
          }
          expect() { # <label> <want> <got>
            if [ "$3" = "$2" ]; then
              echo "✅ $1 → exit $3"
            else
              echo "::error::verdict self-check: $1 exited $3, expected $2"
              fail=1
            fi
          }

          # 1) _abVerdict + _abResampleVerdict + pause-gate pure-function unit check (17 cases).
          expect "ab-selftest" 0 "$(xt bench --ab-selftest)"

          # 2) _benchDiff — gate is `delta > thr AND cur.ci_lower > base.ci_upper`.
          for c in overlap:0:0 regress:1:1 improve:0:0 separated-under-threshold:1:0; do
            name="${c%%:*}"; rest="${c#*:}"; w15="${rest%%:*}"; w25="${rest##*:}"
            expect "diff/$name@0.15" "$w15" \
              "$(xt bench --diff --current "$T/current-$name.json" --baseline "$T/baseline.json" --threshold-time 0.15)"
            expect "diff/$name@0.25" "$w25" \
              "$(xt bench --diff --current "$T/current-$name.json" --baseline "$T/baseline.json" --threshold-time 0.25)"
          done

          # 3) _microDiff single round — gate is R_lower > 1+thr, per name+metric+mode key.
          #    fallback-* drive the no-SEM interval path (base carries mean_ns=-1);
          #    unmatched holds three 3x-blown-up entries whose name or mode key has
          #    no base counterpart — they must be SKIPPED, so a loosened match
          #    turns this case red.
          for c in regress:1:1 overlap:0:0 improve:0:0 separated-under-threshold:1:0 \
                   fallback-regress:1:1 fallback-overlap:0:0 unmatched:0:0; do
            name="${c%%:*}"; rest="${c#*:}"; w15="${rest%%:*}"; w25="${rest##*:}"
            expect "micro/$name@0.15" "$w15" \
              "$(xt bench --micro-diff --current "$T/micro-$name.json" --baseline "$T/micro-base.json" --threshold-time 0.15)"
            expect "micro/$name@0.25" "$w25" \
              "$(xt bench --micro-diff --current "$T/micro-$name.json" --baseline "$T/micro-base.json" --threshold-time 0.25)"
          done

          # 4) _microDiff RESAMPLED — three rounds per side,
          #    verdict from the BETWEEN-ROUND ratio dispersion. Each case guards one thing:
          #      rs-drift   round 1 +60%, rounds 2-3 +5%/+10%. MEAN ratio (1.25) is above
          #                 1+0.15 on purpose ⇒ green only if the interval width is computed.
          #      rs-real    +30% in every round ⇒ still red (resampling did not blind the gate).
          #      rs-mid     +20%-ish, the thr-sensitive one: red at 0.15, quiet at 0.25.
          #      rs-missing regressing entry absent from round 3 ⇒ EXCLUDED (warning) ⇒ green.
          #    Base rounds carry DIFFERENT values per round ⇒ pairing pr round i with the
          #    wrong base round flips rs-mid@0.15.
          RSB="$T/micro-rs-base-r1.json,$T/micro-rs-base-r2.json,$T/micro-rs-base-r3.json"
          for c in drift:0:0 real:1:1 mid:1:0; do
            name="${c%%:*}"; rest="${c#*:}"; w15="${rest%%:*}"; w25="${rest##*:}"
            cur="$T/micro-rs-$name-r1.json,$T/micro-rs-$name-r2.json,$T/micro-rs-$name-r3.json"
            expect "micro-resample/$name@0.15" "$w15" \
              "$(xt bench --micro-diff --current "$cur" --baseline "$RSB" --threshold-time 0.15)"
            expect "micro-resample/$name@0.25" "$w25" \
              "$(xt bench --micro-diff --current "$cur" --baseline "$RSB" --threshold-time 0.25)"
          done
          MISS="$T/micro-rs-real-r1.json,$T/micro-rs-real-r2.json,$T/micro-rs-missing-r3.json"
          expect "micro-resample/missing@0.15" 0 \
            "$(xt bench --micro-diff --current "$MISS" --baseline "$RSB" --threshold-time 0.15)"
          expect "micro-resample/missing@0.25" 0 \
            "$(xt bench --micro-diff --current "$MISS" --baseline "$RSB" --threshold-time 0.25)"
          # 轮数不匹配必须是**用法错误**（exit 2），不能被当成「没有回归」放行。
          expect "micro-resample/round-count-mismatch" 2 \
            "$(xt bench --micro-diff --current "$MISS" --baseline "$T/micro-rs-base-r1.json" --threshold-time 0.15)"

          [ "$fail" -eq 0 ] || { echo "❌ 判红规则与 fixture 不符 —— 改了阈值或区间条件?"; exit 1; }
          echo "✅ verdict logic matches all fixtures (17 pure-function cases + 15 fixtures x 2 thresholds + 1 usage-error case)"

      # Build the base (merge-base) toolchain on THIS runner. The PR z42c (newer)
      # compiles the older base source (staged bootstrap guarantees newer compiles
      # older). Only scenario RUNTIME is measured, and base's driver still runs base's
      # codegen logic → base-style scenario .zbc. If src/runtime is unchanged,
      # base_vm == pr_vm (byte identical) → skip building base's Rust VM.
      - name: Build base (merge-base) toolchain for A/B
        if: steps.fmtgap.outputs.gap != '1'
        id: base
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD"
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          PRVM="$ROOT/artifacts/build/runtime/release/z42vm"
          PRDRIVER="$ROOT/artifacts/build/compiler/z42c.driver/release/dist/z42c.driver.zpkg"

          # PR flat libs (stdlib + z42c siblings) — PR driver's runtime resolve
          # set + the TSIG surface base compiler source is type-checked against.
          # Per-file copy (not a single `cp <glob> dir/`): each z42c member's dist
          # bundles copies of its sibling zpkgs, so the compiler glob resolves the
          # same basename (e.g. z42c.core.zpkg) from multiple dirs → GNU cp aborts
          # with "will not overwrite just-created". The copies are byte-identical, so
          # a per-file loop (last-wins) is safe. (Same for every dist-glob copy below.)
          PRALL="$ROOT/.ab-pr-alllibs"; rm -rf "$PRALL"; mkdir -p "$PRALL"
          cp -f "$ROOT/artifacts/intermediate/libraries/flat/release/"*.zpkg "$PRALL/"
          # 只拷 base 成员表里也存在的编译器包：PR 独有（重命名/合并出来）的包进 base 解析域
          # ⇒ 同 FQN 双包 E0606，base workspace 当场红。
          for f in "$ROOT/artifacts/build/compiler/"*/release/dist/*.zpkg; do
            n="$(basename "$f" .zpkg)"
            if grep -q "\"$n\"" "$ROOT/base-src/src/compiler/z42.workspace.toml"; then cp -f "$f" "$PRALL/"; fi
          done

          # base z42vm: reuse PR's unless src/runtime differs base..pr.
          # 排除 *.md：README 改动不算「VM 变了」（benchmarking.md §8）。
          if git diff --quiet "$BASE_SHA"..HEAD -- src/runtime ':(exclude,glob)src/runtime/**/*.md'; then
            echo "→ src/runtime unchanged base..pr → base_vm = pr_vm"
            BASEVM="$PRVM"
          else
            echo "→ src/runtime changed → cargo-build base z42vm + native cdylib"
            # Also build the z42-compression cdylib: the VM resolves
            # `[Native(lib = "z42_compression")]` next to its own binary, so without it
            # every compression [Benchmark] fails on the BASE side.
            # Run inside src/runtime: cargo reads .cargo/config.toml from its cwd upward.
            ( cd base-src/src/runtime && cargo build --locked --release --bin z42vm \
              && cargo build --locked --release \
                --manifest-path crates/z42-compression/Cargo.toml )
            BASEVM="$ROOT/base-src/artifacts/build/runtime/release/z42vm"
          fi

          # base z42c: PR driver compiles base-src/src/compiler (newer→older).
          ( cd base-src/src/compiler && \
            Z42_LIBS="$PRALL" "$PRVM" "$PRDRIVER" --mode jit -- build --workspace --release --no-incremental )

          # 取证：两侧 driver 是否同一个二进制（下面 fingerprint guard 判读用）。sha 相同而输出不同
          # ⇒ 编译非确定性；sha 不同 ⇒ 自举代差（BASEDRIVER 是 PRDRIVER 又编一代）。
          echo "driver sha (pr)   $(sha256sum "$PRDRIVER" | cut -c1-16)  $PRDRIVER"

          # base flat libs = base z42c siblings + stdlib (to RUN the base driver) +
          # base stdlib (built next, overwriting the seed stdlib for measurement).
          BASEALL="$ROOT/.ab-base-alllibs"; rm -rf "$BASEALL"; mkdir -p "$BASEALL"
          for f in "$ROOT/base-src/artifacts/build/compiler/"*/release/dist/*.zpkg; do cp -f "$f" "$BASEALL/"; done
          # ⚠️ 顺序承重：上面那圈编译器 dist 自带构建时那一代 stdlib 副本 ⇒ 下面的 PR flat 必须
          # 在后（后拷者赢）。BASEDRIVER 是 PR z42c 对着 PR stdlib 编的，要同代 stdlib 才跑得起来
          # （extern mangling 跨 z42c 版本可能不同 → `undefined function …$N`）；下面建好的 base
          # stdlib 再覆盖它们用于实测。
          for f in "$ROOT/artifacts/intermediate/libraries/flat/release/"*.zpkg; do cp -f "$f" "$BASEALL/"; done
          BASEDRIVER="$BASEALL/z42c.driver.zpkg"
          echo "driver sha (base) $(sha256sum "$BASEDRIVER" | cut -c1-16)  $BASEDRIVER"
          # ⚠ 以下构建用 **PR 的 VM** 跑，不是 BASEVM：BASEALL 里此刻是 PR stdlib，可能用到 base VM
          # 还没有的 builtin。产物字节由 BASEDRIVER 决定、与执行它的 VM 无关；BASEVM 只用于实测环节
          # （那时 BASEALL 已被 base stdlib 覆盖）。
          #
          # 携带插件先于 workspace：z42.harness 经 [plugins.export] 携带 z42.harness.lint，其 release
          # 构建会验插件工程 dist（PluginCarry._verifyDist）⇒ 产物须先于 workspace 存在。与 xtask 的
          # _buildStdlibCarriedPlugins 同一 CLI 形态（`build <toml> --release --output-dir <工程>/dist
          # --internal-of z42.harness`：lint 用宿主的 internal 成员）。只建产物、不平铺进 BASEALL 同级
          # plugins/——PR 侧 PRALL 同样没有，两侧对称。
          # Z42_LIBS 用 PR flat（纯 stdlib）而不是 BASEALL：契约包（z42c.syntax / z42c.plugin）对
          # kind=plugin 免声明，靠 SdkLibs.Plan 从 Z42_LIBS 上溯探到 driver dist 收集候选；BASEALL 的
          # 祖先探不到 driver dist，且同名 zpkg 被 BASEALL 遮蔽 ⇒ 候选空 ⇒ E0497。
          LINT_TOML="$ROOT/base-src/src/libraries/z42.harness/plugins/lint/z42.z42.toml"
          if [ -f "$LINT_TOML" ]; then
            ( cd base-src/src/libraries && \
              Z42_LIBS="$ROOT/artifacts/intermediate/libraries/flat/release" "$PRVM" "$BASEDRIVER" --mode jit -- build "$LINT_TOML" --release \
                --output-dir "$(dirname "$LINT_TOML")/dist" --internal-of z42.harness )
          fi
          ( cd base-src/src/libraries && \
            Z42_LIBS="$BASEALL" "$PRVM" "$BASEDRIVER" --mode jit -- build --workspace --release --no-incremental )
          for f in "$ROOT/base-src/artifacts/build/libraries/"*/release/dist/*.zpkg; do cp -f "$f" "$BASEALL/"; done

          echo "base_vm=$BASEVM"         >> "$GITHUB_OUTPUT"
          echo "base_libs=$BASEALL"      >> "$GITHUB_OUTPUT"
          echo "base_driver=$BASEDRIVER" >> "$GITHUB_OUTPUT"

      # 编译器指纹门：用 PR 编译器把 base stdlib 源码再编一遍、逐包比字节——输出变了而
      # CompilerFingerprint / 格式 Minor 没累加 ⇒ 红（docs/internals/src/compiler/compiler-fingerprint.md）。
      # `--base-driver` 让门自己判两侧 driver 是否同一个二进制；这里本就不是（BASEDRIVER 是 PRDRIVER
      # 又编一代）⇒ 门如实说「判不了」而不判红。根治需两侧 driver 同代，尚未做。
      - name: Compiler fingerprint guard (output changed ⇒ version bumped)
        if: steps.fmtgap.outputs.gap != '1'
        shell: bash
        run: |
          xtask test compiler fingerprint --base "$PWD/base-src" \
              --base-driver "${{ steps.base.outputs.base_driver }}"

      # PR 侧的树与工具链，逐项对齐 base 侧（Build base 步）的形状；e2e 与 micro 两道 A/B 共用。
      # 🔴 两侧必须**同形**（benchmarking.md §3「两侧必须同形捕获」）：被测进程的 argv / env / 路径字节数
      # 决定它的内存布局，布局能让同一份代码稳定快慢 10%~60%，且每轮复测都一样 ⇒ 复测看不见、只会当成回归。
      # libs 目录的**内容**也要同配方：VM 启动时逐个读 Z42_LIBS 下每个 zpkg 的 NSPC，目录里多十几个
      # 编译器包 = 那一侧启动多干活。
      #   · 树根等长：PR 源码另开 worktree `head-src`（与 `base-src` 等长），artifacts 软链回 PR 产物；
      #   · 工具链显式且同配方：`.ab-head-alllibs` 与 `.ab-base-alllibs` 等长、同一套拷贝顺序。
      - name: Prepare head toolchain (same shape as base, for both A/B gates)
        if: steps.fmtgap.outputs.gap != '1'
        id: head
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD"
          git worktree add --detach head-src HEAD
          ln -s ../artifacts head-src/artifacts
          HEADALL="$ROOT/.ab-head-alllibs"; rm -rf "$HEADALL"; mkdir -p "$HEADALL"
          for f in "$ROOT/artifacts/build/compiler/"*/release/dist/*.zpkg; do cp -f "$f" "$HEADALL/"; done
          for f in "$ROOT/artifacts/intermediate/libraries/flat/release/"*.zpkg; do cp -f "$f" "$HEADALL/"; done
          for f in "$ROOT/artifacts/build/libraries/"*/release/dist/*.zpkg; do cp -f "$f" "$HEADALL/"; done
          BASEVM="${{ steps.base.outputs.base_vm }}"
          BASEALL="${{ steps.base.outputs.base_libs }}"
          # VM 没变 ⇒ base_vm 就是 PR 的 z42vm，两侧同一个路径串；变了 ⇒ 各取本树 artifacts 下的那个（等长）。
          if [ "$BASEVM" = "$ROOT/artifacts/build/runtime/release/z42vm" ]; then
            HEADVM="$BASEVM"
          else
            HEADVM="$ROOT/head-src/artifacts/build/runtime/release/z42vm"
          fi
          # 等长是这一步的不变量：谁改了目录名，这里当场红，而不是悄悄变回有偏的门。
          [ "${#HEADALL}" -eq "${#BASEALL}" ] && [ "${#HEADVM}" -eq "${#BASEVM}" ] \
            || { echo "::error::A/B 两侧工具链路径不等长（$HEADALL / $BASEALL；$HEADVM / $BASEVM）"; exit 1; }
          echo "head libs: $(ls "$HEADALL" | wc -l) zpkg（base: $(ls "$BASEALL" | wc -l)）"
          echo "head_vm=$HEADVM"                         >> "$GITHUB_OUTPUT"
          echo "head_libs=$HEADALL"                      >> "$GITHUB_OUTPUT"
          echo "head_driver=$HEADALL/z42c.driver.zpkg"   >> "$GITHUB_OUTPUT"

      - name: Same-runner A/B regression gate (symmetric toolchains; >15% time fails)
        if: steps.fmtgap.outputs.gap != '1'
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          # --mode 按改动面收窄：interp 与 jit 的相对性能只会被 VM 改动挪动，src/runtime 没变只测 jit。
          # 排除 *.md：README 改动不算「VM 变了」（benchmarking.md §8）。
          if git diff --quiet "$BASE_SHA"..HEAD -- src/runtime ':(exclude,glob)src/runtime/**/*.md'; then
            MODE=jit;  echo "→ src/runtime unchanged base..pr → --mode jit"
          else
            MODE=both; echo "→ src/runtime changed → --mode both (interp + jit)"
          fi
          # --tier gate：只测门禁场景，同时压低多重比较的假红概率。
          # --threshold-time 0.15 与复测（--resample-rounds，默认开）是同一件事的两半：单独收阈值
          # = 退回假红（benchmarking.md §5–§6）。改它必须同步上面自检的 0.15 那一列。
          # --pause-cap-ms / --threshold-pause / --threshold-pause-max：`// gc-pause: report` 的场景另判
          # GC 停顿——p99 超上限**且**比 base 差 25% 以上才红；max 是单次极值，超上限且比 base 差一倍以上
          # 才红，否则只报告（benchmarking.md §3「GC 停顿子门禁」）。
          # --pr-*：PR 侧用上一步备好的同形工具链，不用树内那套（路径长度、libs 内容都与 base 侧不同）。
          xtask bench --ab --tier gate --mode "$MODE" --threshold-time 0.15 \
              --pause-cap-ms 16 --threshold-pause 0.25 --threshold-pause-max 1.0 \
              --base-vm     "${{ steps.base.outputs.base_vm }}" \
              --base-libs   "${{ steps.base.outputs.base_libs }}" \
              --base-driver "${{ steps.base.outputs.base_driver }}" \
              --pr-vm       "${{ steps.head.outputs.head_vm }}" \
              --pr-libs     "${{ steps.head.outputs.head_libs }}" \
              --pr-driver   "${{ steps.head.outputs.head_driver }}"

      # ── micro/stdlib tier same-runner A/B ──
      # micro [Benchmark]s run IN-PROCESS under z42b, so base+pr stdlib cannot be
      # co-loaded (unlike e2e's isolated per-scenario z42vm). Instead capture two
      # ISOLATED `bench stdlib --json` baselines on THIS runner — PR tree + base tree —
      # and diff them (bench --micro-diff).
      #
      # 两侧同形：PR 侧与 base 侧走同一个 `capture`，树与工具链来自「Prepare head toolchain」步。
      #
      # micro 硬门禁 = 可疑即复测（benchmarking.md §5）：第 1 轮只点名可疑条目；有标记才整轮
      # 重采两次，用三轮比值的跑间离散度判红。整轮重采而不按 benchmark 名过滤：
      # `bench stdlib --filter` 过滤的是文件名，按名重采要另建映射，映射错 = 静默少测。
      - name: Micro A/B gate (symmetric capture; resample-on-suspicion; >15% time fails)
        if: steps.fmtgap.outputs.gap != '1'
        shell: bash
        run: |
          set -euo pipefail
          A="$PWD/artifacts/reports/benches"
          ROOT="$PWD"
          xt() { xtask "$@"; }

          BASEVM="${{ steps.base.outputs.base_vm }}"
          BASEALL="${{ steps.base.outputs.base_libs }}"
          HEADVM="${{ steps.head.outputs.head_vm }}"
          HEADALL="${{ steps.head.outputs.head_libs }}"

          # 一轮捕获，两侧共用：跑 PR 的 xtask（垫片按自己所在位置定位 `.z42` 与 xtask.zpkg，不看 cwd），
          # cwd=<tree> ⇒ _root()=<tree>（bench 源码 / 产物目录都是那棵树的），工具链显式传入、不做树内重建。
          capture() { # <tree> <vm> <libs> <out.json>
            ( cd "$1" && \
              xtask bench stdlib --json "$4" --no-build --mode interp \
                --vm "$2" --driver "$3/z42c.driver.zpkg" --libs "$3" )
          }
          capture head-src "$HEADVM" "$HEADALL" "$A/micro-pr.json"
          capture base-src "$BASEVM" "$BASEALL" "$A/micro-base.json"

          # 第 1 轮：只用来点名可疑条目，**不判红**（它的区间正是不可信的那个）。
          xt bench --micro-diff --threshold-time 0.15 \
              --current  "$A/micro-pr.json" \
              --baseline "$A/micro-base.json" \
              --suspects "$A/micro-suspects.txt" || true
          # `--suspects` 总会写出文件（没有可疑就是空文件）⇒ 文件不存在 = xtask 崩了，
          # 不能读成「没有可疑」。set -e 已经拦住崩溃，这里再显式确认一次。
          [ -f "$A/micro-suspects.txt" ] || { echo "::error::micro round 1 未写出 suspects 文件"; exit 1; }
          if [ ! -s "$A/micro-suspects.txt" ]; then
            echo "✅ micro round 1 未标记任何条目 —— 无需复测（零额外开销）"
            exit 0
          fi
          echo "── round 1 标记了以下条目，进入复测 ──"
          cat "$A/micro-suspects.txt"

          for r in 2 3; do
            echo "── micro resample round $r ──"
            capture head-src "$HEADVM" "$HEADALL" "$A/micro-pr-r$r.json"
            capture base-src "$BASEVM" "$BASEALL" "$A/micro-base-r$r.json"
          done

          # 最终判定：三轮比值的**跑间**离散度重算区间。这一步才是硬门禁。
          xt bench --micro-diff --threshold-time 0.15 \
              --current  "$A/micro-pr.json,$A/micro-pr-r2.json,$A/micro-pr-r3.json" \
              --baseline "$A/micro-base.json,$A/micro-base-r2.json,$A/micro-base-r3.json"

      # ── criterion(Rust) tier A/B — informational, never fails (benchmarking.md §7) ──
      # Only when the PR touched src/runtime (VM unchanged ⇒ result cannot move).
      # criterion's NATIVE baseline compare: base tree SAVES, PR tree COMPARES; a shared
      # CRITERION_HOME lets the two trees' runs meet. Its bootstrap CI is within-run and
      # blind to between-run drift, so it only prints. ⚠️ 别删测量：它是 GC 内部热路径
      # 唯一的观测点；要重新硬门禁需先量出跑间漂移，不是调阈值。
      - name: Criterion(Rust) A/B (informational — never fails; only if src/runtime changed)
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          # 排除 *.md：README 改动不算「VM 变了」（benchmarking.md §8）。
          if git diff --quiet "$BASE_SHA"..HEAD -- src/runtime ':(exclude,glob)src/runtime/**/*.md'; then
            echo "→ src/runtime unchanged base..pr → skip criterion A/B (VM byte-identical)"
            exit 0
          fi
          export CRITERION_HOME="$PWD/.criterion-ab"
          rm -rf "$CRITERION_HOME"; mkdir -p "$CRITERION_HOME"
          echo "── base: save criterion baseline 'ab-base' (base tree) ──"
          ( cd base-src/src/runtime && CRITERION_HOME="$CRITERION_HOME" \
              cargo bench --locked \
                --bench gc_cycle_bench -- --save-baseline ab-base )
          echo "── pr: compare against 'ab-base' (this tree) ──"
          ( cd src/runtime && CRITERION_HOME="$CRITERION_HOME" \
            cargo bench --locked \
              --bench gc_cycle_bench -- --baseline ab-base )
          echo "── informational: 整个 95% 区间在 +25% 之上（lower_bound > thr）= 标记，但不 fail ──"
          python3 - "$CRITERION_HOME" <<'PY'
          # 标记条件是**整个区间**在阈值之上（lower_bound > thr），不是「点估计过阈值 + 下界 > 0」
          # ——后者让 [+0.5%, +60%] 这种宽区间也算证据。thr 0.25：criterion 层噪声底约 ±16%。
          import json, os, sys, glob
          home = sys.argv[1]; thr = 0.25; regr = []
          for est in glob.glob(os.path.join(home, "**", "change", "estimates.json"), recursive=True):
              with open(est) as f: d = json.load(f)
              mean = d.get("mean", {}); pe = mean.get("point_estimate")
              ci = mean.get("confidence_interval", {})
              lo, hi = ci.get("lower_bound"), ci.get("upper_bound")
              if pe is None or lo is None or hi is None: continue
              bench = est.split(os.sep)[-3]
              # 打完整区间与宽度：只打下界看不出 [+0.5%, +60%] 这种区间有多没用
              tag = f"{pe*100:+.1f}% (CI [{lo*100:+.1f}%, {hi*100:+.1f}%], 宽 {(hi-lo)*100:.1f}pp)"
              if lo > thr:
                  regr.append(bench); print(f"  ↑ REGRESSION {bench}: {tag}")
              elif pe > thr:
                  # 点估计过阈值但区间没整体过 —— 正是「可疑」，也正是「可疑即复测」该接手的地方
                  print(f"  ? {bench}: {tag} — 点估计过阈值但区间未分离，判为噪声（见 benchmarking.md「可疑即复测」）")
              else:
                  print(f"  ≈ {bench}: {tag}")
          # 只打印，不 sys.exit(1)。
          if regr:
              print(f"⚠️  {len(regr)} criterion 条目整个区间在 +{int(thr*100)}% 之上 —— "
                    f"informational，不 fail job；改了 GC 请人工看一眼上面的区间")
          else:
              print("✅ no criterion regression")
          PY
          echo "── criterion tier is informational; it never fails this job ──"

      - name: Upload A/B results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-ab-results
          path: |
            artifacts/reports/benches/ab.json
            artifacts/reports/benches/micro-pr.json
            artifacts/reports/benches/micro-base.json
            artifacts/reports/benches/micro-pr-r*.json
            artifacts/reports/benches/micro-base-r*.json
            artifacts/reports/benches/micro-suspects.txt
          if-no-files-found: ignore
