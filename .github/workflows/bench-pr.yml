name: Bench PR Regression

# Trigger: pull requests that touch performance-sensitive code.
# Runs the full e2e bench against the PR branch, diffs the JSON against the
# latest baseline published on `bench-baselines` by bench-update.yml, fails
# the workflow when any time metric regresses by more than the configured
# threshold.
#
# Threshold: 10% time per the 0.2.3 退出标准 — matches `xtask bench --diff
# --threshold-time 0.10`. Memory is informational (the bench harness doesn't
# track RSS yet; --threshold-memory keeps its default).
#
# Trigger paths intentionally narrow — doc-only PRs skip the run.

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/runtime/**'
      - 'src/libraries/**'
      - 'src/compiler/**'
      - 'bench/**'
      - 'scripts/**/*.z42'
      - 'scripts/xtask.z42.toml'
      - '.github/workflows/bench-pr.yml'

concurrency:
  group: bench-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bench-regression:
    name: bench-regression(linux-x64)
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch enough history that `git rev-parse --abbrev-ref HEAD` works
          # for the bench JSON metadata.
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install hyperfine
        run: |
          wget -q https://github.com/sharkdp/hyperfine/releases/download/v1.20.0/hyperfine_1.20.0_amd64.deb
          sudo dpkg -i hyperfine_1.20.0_amd64.deb

      - name: Cache Rust deps (Swatinem)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/runtime -> ../../artifacts/build/runtime
          shared-key: host-v2

      # C#-free: seed from the prev nightly + build current source warm (xtask bench
      # rebuilds stdlib via the warm self-build). Same path as CI build-and-test.
      - name: Bootstrap toolchain (nightly z42c seed → current source)
        uses: ./.github/actions/ci-bootstrap
        with:
          rid: linux-x64
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run full e2e bench (xtask, interp + jit)
        shell: bash
        run: |
          set -euo pipefail
          # add-exec-profile-matrix: --mode both measures each scenario under
          # interp AND jit (two profile-tagged results); the diff below matches
          # per (name, metric, mode_label@os/arch) so the two never cross-compare.
          vm="$PWD/artifacts/build/runtime/release/z42vm"
          Z42_PORTABLE_VM="$vm" Z42_LIBS="$PWD/artifacts/build/libraries/dist/release" \
            "$vm" artifacts/xtask/xtask.zpkg -- bench --mode both

      - name: Fetch baseline from bench-baselines branch
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          # `bench-update.yml` publishes baselines/e2e-ubuntu-latest.json to the
          # dedicated `bench-baselines` branch on every push to main. Pull it
          # without touching the worktree.
          if git fetch origin bench-baselines:bench-baselines 2>/dev/null; then
            git show bench-baselines:baselines/e2e-ubuntu-latest.json \
              > /tmp/baseline.json
            echo "have_baseline=1" >> "$GITHUB_OUTPUT"
            echo "→ baseline fetched from bench-baselines branch"
          else
            echo "have_baseline=0" >> "$GITHUB_OUTPUT"
            echo "::warning::bench-baselines branch not present yet (bench-update has never run); skipping regression diff"
          fi

      - name: Diff against baseline (>10% time fails)
        if: steps.baseline.outputs.have_baseline == '1'
        shell: bash
        run: |
          set -euo pipefail
          vm="$PWD/artifacts/build/runtime/release/z42vm"
          Z42_PORTABLE_VM="$vm" Z42_LIBS="$PWD/artifacts/build/libraries/dist/release" \
            "$vm" artifacts/xtask/xtask.zpkg -- \
            bench --diff \
              --current bench/results/e2e.json \
              --baseline /tmp/baseline.json \
              --threshold-time 0.10

      # ── expose-diagnostics-counters (script-profiling P1c) ────────────────
      # INFORMATIONAL allocations probe. Unlike wall-time (±60% cross-runner
      # noise, see docs/design/testing), `allocations` is deterministic — it is
      # the intended signal for a future hard alloc-regression gate. This step
      # only PRINTS the count (per scenario × GC-mode); it never fails the job.
      # Observe 3-5 rounds of cross-GC-mode stability here before a follow-up
      # change turns it into a threshold gate (Decision D4). `|| true` guards
      # every probe so a profiler hiccup can't red the bench job.
      - name: Allocations probe (informational — never fails)
        shell: bash
        run: |
          set -uo pipefail
          vm="$PWD/artifacts/build/runtime/release/z42vm"
          export Z42_PORTABLE_VM="$vm"
          export Z42_LIBS="$PWD/artifacts/build/libraries/dist/release"
          echo "── allocations (informational; deterministic; not a gate) ──"
          # alloc-heavy + call-heavy scenarios, each under two GC modes.
          for scn in bench/scenarios/08_dict_heavy.z42 bench/scenarios/01_fibonacci.z42; do
            for gc in stw generational; do
              out="$(Z42_GC_MODE="$gc" "$vm" artifacts/xtask/xtask.zpkg -- \
                       profile --threads "$scn" --mode interp 2>/dev/null \
                     | grep -oE 'alloc=[0-9]+' | head -1 || true)"
              printf 'informational: %-40s gc=%-13s %s\n' "$(basename "$scn")" "$gc" "${out:-alloc=?}"
            done
          done
          echo "── end allocations probe ──"
