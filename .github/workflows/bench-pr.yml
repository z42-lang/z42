name: Bench PR Regression

# Trigger: pull requests that touch performance-sensitive code.
# add-same-runner-ab-bench-gate: builds BOTH the PR toolchain and the PR's
# merge-base (base.sha) toolchain on THIS runner, then `xtask bench --ab`
# compiles + measures every scenario under each — base and pr adjacent on the
# same machine, so the runner speed factor cancels in ratio=pr/base and the
# within-run SEM is statistically valid. A regression = ratio 95% lower bound
# R_lower > 1 + threshold. This replaces the old cross-runner baseline diff
# (bench-baselines snapshot on ANOTHER runner ⇒ ±26–60% between-run drift that
# made the gate near-blind).
#
# simplify-bench-gate (2026-09-05)：门禁此前**每个 PR 期望假红约 2 条**，实测最近
# 4 次失败逐条核对全是假红 —— 三个叠加缺陷（完整数据与推导见 book 判红语义页
# docs/book/src/dev/benchmarking.md「噪声底与阈值」）：
#   ① 判红阈值 10% 画在**噪声底之下**：两个 perf-neutral PR 上实测比值对数标准差
#      6.4%（e2e）/ 8.1%（micro）⇒ 真实噪声 ±13~16%。
#   ② 声称的置信区间被系统性低估（micro 中位 4.8% vs 真实 ±16%，约三倍），
#      「区间分离」这道保险因此失效。
#   ③ 每个 PR 做 22+65=87 次比较、不做多重比较校正。
# 对策（本次落地，与上面三条一一对应）：
#   ① --threshold-time 0.25（抬到噪声底之上）。
#   ② micro 层降级为**信息性、不再 fail**（见下面那一步的注释）。
#   ③ e2e 只测 --tier gate 的 6 条场景 + --mode 按改动面收窄 ⇒ 比较数 87 → 6~12。
# 同时删掉 allocations 探针（informational、从不 fail，却占单次 job 的 26%）。
# 单次 job 执行墙钟 17~18 min → 约 8~10 min。
# 未做（下一步）：「可疑即复测」—— 只对初判超阈值的条目做 k=3 交替重测、用跑间
# 比值离散度重算区间。那是让阈值从 25% 收回 15%、以及让 micro 重新硬门禁的前提。
#
# extend-ab-bench-micro-criterion: micro/stdlib tier 仍每次采两份隔离基线
# （PR 树 + base 树，同 runner）并 diff，但**只打印不判红**。base's toolchain is
# reused from the "Build base toolchain" step; only base z42b is built fresh.
#
# Trigger paths intentionally narrow — doc-only PRs skip the run.

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/runtime/**'
      - 'src/libraries/**'
      - 'src/compiler/**'
      - 'bench/**'
      - 'scripts/**/*.z42'
      - 'scripts/xtask.z42.toml'
      - '.github/workflows/bench-pr.yml'

concurrency:
  group: bench-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bench-regression:
    name: bench-regression(linux-x64)
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch enough history that `git rev-parse --abbrev-ref HEAD` works
          # for the bench JSON metadata, and that the base.sha diff below resolves.
          fetch-depth: 0

      # A/B: the PR's merge-base toolchain, built on THIS same runner. Its build
      # location is irrelevant to the measurement — both base.zbc and pr.zbc are
      # compiled AND run on this runner, so the same-runner cancellation holds.
      - name: Checkout base (merge-base) for A/B
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-src
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install hyperfine
        run: |
          wget -q https://github.com/sharkdp/hyperfine/releases/download/v1.20.0/hyperfine_1.20.0_amd64.deb
          sudo dpkg -i hyperfine_1.20.0_amd64.deb

      - name: Cache Rust deps (Swatinem)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/runtime -> ../../artifacts/build/runtime
          shared-key: host-v2

      # Seed from the prev nightly + build current source warm (xtask bench
      # rebuilds stdlib via the warm self-build). Same path as CI build-and-test.
      - name: Bootstrap toolchain (nightly z42c seed → current source)
        uses: ./.github/actions/ci-bootstrap
        with:
          rid: linux-x64
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      # Build the base (merge-base) toolchain on THIS runner. The PR z42c
      # (newer) compiles the older base source — the staged-bootstrap discipline
      # guarantees a newer z42c compiles older source. Only the scenario RUNTIME
      # is measured, so base's driver being emitted by the PR z42c is irrelevant:
      # base's driver still runs base's codegen logic → base-style scenario .zbc.
      # VM reuse: if the PR did not touch src/runtime, base_vm == pr_vm (byte
      # identical) → skip building base's Rust VM (the heaviest step).
      - name: Build base (merge-base) toolchain for A/B
        id: base
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD"
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          PRVM="$ROOT/artifacts/build/runtime/release/z42vm"
          PRDRIVER="$ROOT/artifacts/build/compiler/z42c.driver/release/dist/z42c.driver.zpkg"

          # PR flat libs (stdlib + z42c siblings) — PR driver's runtime resolve
          # set + the TSIG surface base compiler source is type-checked against.
          # Per-file copy (not a single `cp <glob> dir/`): each z42c member's dist
          # bundles copies of its sibling zpkgs, so the compiler glob resolves the
          # same basename (e.g. z42c.core.zpkg) from multiple dirs → GNU cp aborts
          # with "will not overwrite just-created". The copies are byte-identical, so
          # a per-file loop (last-wins) is safe. (Same for every dist-glob copy below.)
          PRALL="$ROOT/.ab-pr-alllibs"; rm -rf "$PRALL"; mkdir -p "$PRALL"
          cp -f "$ROOT/artifacts/build/libraries/dist/release/"*.zpkg "$PRALL/"
          for f in "$ROOT/artifacts/build/compiler/"*/release/dist/*.zpkg; do cp -f "$f" "$PRALL/"; done

          # base z42vm: reuse PR's unless src/runtime differs base..pr.
          if git diff --quiet "$BASE_SHA"..HEAD -- src/runtime; then
            echo "→ src/runtime unchanged base..pr → base_vm = pr_vm"
            BASEVM="$PRVM"
          else
            echo "→ src/runtime changed → cargo-build base z42vm + native cdylib"
            # fix-bench-base-cdylib (2026-09-03): build the z42-compression cdylib too.
            # The VM resolves `[Native(lib = "z42_compression")]` next to its own binary
            # (`artifacts/build/runtime/release/`, per the repo-root .cargo target-dir).
            # Building only `--bin z42vm` left base-src's dir without the dylib, so every
            # compression [Benchmark] failed on the BASE side → "captured compression_bench
            # (partial: some benches failed)" → non-zero exit → this job red. That hit
            # EVERY PR touching src/runtime (#394 / #395 / #402 / #406 / #409 / #413) and
            # no others — the PR side was fine because its dylib sits beside the PR vm.
            ( cd base-src && cargo build --locked --release \
                --manifest-path src/runtime/Cargo.toml --bin z42vm \
              && cargo build --locked --release \
                --manifest-path src/runtime/crates/z42-compression/Cargo.toml )
            BASEVM="$ROOT/base-src/artifacts/build/runtime/release/z42vm"
          fi

          # base z42c: PR driver compiles base-src/src/compiler (newer→older).
          ( cd base-src/src/compiler && \
            Z42_LIBS="$PRALL" "$PRVM" "$PRDRIVER" --mode jit -- build --workspace --release )

          # base flat libs = base z42c siblings + stdlib (to RUN the base driver) +
          # base stdlib (built next, overwriting the seed stdlib for measurement).
          BASEALL="$ROOT/.ab-base-alllibs"; rm -rf "$BASEALL"; mkdir -p "$BASEALL"
          for f in "$ROOT/base-src/artifacts/build/compiler/"*/release/dist/*.zpkg; do cp -f "$f" "$BASEALL/"; done
          # The compiler dist does NOT bundle stdlib, so BASEALL has no z42.io yet.
          # BASEDRIVER (compiled by the PR z42c against PR stdlib) needs a matching
          # stdlib to RUN — seed it with the PR stdlib (same z42c ⇒ same extern
          # mangling). Without this the base driver falls back to the VM entry-dir
          # stdlib, whose mangling can differ across z42c versions → runtime
          # `undefined function …$N` (regressed once #295's parser changed mangling).
          # This mirrors PRALL (which stages stdlib + compiler); base stdlib built
          # below then overwrites these for the actual measurement.
          for f in "$ROOT/artifacts/build/libraries/dist/release/"*.zpkg; do cp -f "$f" "$BASEALL/"; done
          BASEDRIVER="$BASEALL/z42c.driver.zpkg"
          ( cd base-src/src/libraries && \
            Z42_LIBS="$BASEALL" "$BASEVM" "$BASEDRIVER" --mode jit -- build --workspace --release )
          for f in "$ROOT/base-src/artifacts/build/libraries/"*/release/dist/*.zpkg; do cp -f "$f" "$BASEALL/"; done

          echo "base_vm=$BASEVM"         >> "$GITHUB_OUTPUT"
          echo "base_libs=$BASEALL"      >> "$GITHUB_OUTPUT"
          echo "base_driver=$BASEDRIVER" >> "$GITHUB_OUTPUT"

      - name: Same-runner A/B regression gate (>25% time fails)
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          # simplify-bench-gate: --mode 按改动面收窄。interp 与 jit 的相对性能只可能
          # 被 VM 改动挪动，src/runtime 没变就只测 jit（默认执行模式），measurement
          # 数量减半。碰了 runtime 才扫 both。
          if git diff --quiet "$BASE_SHA"..HEAD -- src/runtime; then
            MODE=jit;  echo "→ src/runtime unchanged base..pr → --mode jit"
          else
            MODE=both; echo "→ src/runtime changed → --mode both (interp + jit)"
          fi
          # --tier gate: 只测门禁那 6 条代表性场景（其余 tier=full 的场景本地/按需跑）。
          # 这同时把每个 PR 的比较次数从 22 条降到 6–12 条 —— 多重比较的假红概率随之
          # 降一个量级，不只是省时间。
          # --threshold-time 0.25: 实测噪声底 ±13~16%（见 book 判红语义页「噪声底与阈值」），
          # 10% 的旧阈值画在噪声底之下，假红是数学必然。25% 留安全边际。
          vm="$PWD/artifacts/build/runtime/release/z42vm"
          Z42_PORTABLE_VM="$vm" Z42_LIBS="$PWD/artifacts/build/libraries/dist/release" \
            "$vm" artifacts/xtask/xtask.zpkg -- \
            bench --ab --tier gate --mode "$MODE" --threshold-time 0.25 \
              --base-vm     "${{ steps.base.outputs.base_vm }}" \
              --base-libs   "${{ steps.base.outputs.base_libs }}" \
              --base-driver "${{ steps.base.outputs.base_driver }}"

      # ── extend-ab-bench-micro-criterion Part B: micro/stdlib tier same-runner A/B ──
      # micro [Benchmark]s run IN-PROCESS under z42b, so base+pr stdlib cannot be
      # co-loaded (unlike e2e's isolated per-scenario z42vm). Instead we capture two
      # ISOLATED `bench stdlib --json` baselines on THIS runner — PR tree + base tree —
      # and diff them (bench --micro-diff). Same machine ⇒ speed factor cancels in
      # ratio=pr/base; Part A's per-benchmark mean/stddev make the SEM valid.
      - name: Capture PR micro baseline (bench stdlib --json)
        shell: bash
        run: |
          set -euo pipefail
          vm="$PWD/artifacts/build/runtime/release/z42vm"
          Z42_PORTABLE_VM="$vm" Z42_LIBS="$PWD/artifacts/build/libraries/dist/release" \
            "$vm" artifacts/xtask/xtask.zpkg -- \
            bench stdlib --json "$PWD/bench/results/micro-pr.json" --no-build --mode interp

      - name: Capture base micro baseline (base tree, same runner)
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD"
          PRVM="$ROOT/artifacts/build/runtime/release/z42vm"
          # Run the PR xtask (Z42_LIBS = PR libs for xtask's OWN deps) against the base
          # tree (cwd=base-src → _root()=base-src, so bench sources / output dirs are
          # base's). The measured toolchain is passed EXPLICITLY via --vm/--driver/--libs
          # = the exact base toolchain the e2e A/B already used (.ab-base-alllibs), so
          # base benchmarks compile+run against a proven-consistent base stdlib — no
          # in-tree rebuild, no reliance on base-src's assembled-libs layout.
          ( cd base-src && \
            Z42_PORTABLE_VM="$PRVM" Z42_LIBS="$ROOT/artifacts/build/libraries/dist/release" \
            "$PRVM" "$ROOT/artifacts/xtask/xtask.zpkg" -- \
            bench stdlib --json "$ROOT/bench/results/micro-base.json" --no-build --mode interp \
              --vm     "${{ steps.base.outputs.base_vm }}" \
              --driver "${{ steps.base.outputs.base_driver }}" \
              --libs   "${{ steps.base.outputs.base_libs }}" )

      # simplify-bench-gate: micro 层**降级为信息性，不再 fail job**。
      # 依据（实测，见 book 判红语义页「噪声底与阈值」）：micro 声称的置信区间宽度
      # 中位仅 4.8%、最窄 0.25%，而同一批数据反推的真实噪声是 ±16% —— **低估约三倍**。
      # 根因：`Bencher` 的 stddev 是单个进程内批次样本的离散度，而 base 与 pr 是两个
      # 独立进程，进程间那部分方差（CPU 频率 / page cache / 分配器与 GC 起始状态 /
      # 代码布局）完全没被建模。区间既然不可信，「区间分离」这道保险就不成立，判红
      # 退化成「谁的区间碰巧最窄」的抽签 —— 实测现场：同一批里 sha256_4k(+11.5%) 判红、
      # sha256_small(+11.0%) 放过，而 aes_cbc_4k 报「快 19%，区间 ±0.06%」（GC 改动
      # 不可能让 AES 快 19%）。最近 4 次 bench-pr 失败有 3 次在这一层，逐条核对全是假红。
      # 仍然每次跑、仍然打印全部 65 条比值（改 stdlib 热路径后眼看一下的材料），
      # 丢掉的只是它 fail job 的权力。要重新硬门禁，需先做「可疑即复测」（见 book 页）。
      - name: Micro A/B (informational — never fails)
        shell: bash
        run: |
          set -uo pipefail
          vm="$PWD/artifacts/build/runtime/release/z42vm"
          Z42_PORTABLE_VM="$vm" Z42_LIBS="$PWD/artifacts/build/libraries/dist/release" \
            "$vm" artifacts/xtask/xtask.zpkg -- \
            bench --micro-diff --threshold-time 0.25 \
              --current  "$PWD/bench/results/micro-pr.json" \
              --baseline "$PWD/bench/results/micro-base.json" || true
          echo "── micro tier is informational; it never fails this job ──"

      # ── extend-ab-bench-micro-criterion Part C: criterion(Rust) tier A/B ──
      # Only when the PR touched src/runtime (VM unchanged ⇒ criterion result cannot
      # move). Uses criterion's NATIVE same-runner baseline compare — base tree SAVES
      # a baseline, PR tree COMPARES against it — with criterion doing its own outlier
      # detection + bootstrap CI. A shared CRITERION_HOME lets the two trees' runs meet.
      # gc_cycle_bench is a real VM benchmark (gated); smoke_bench is a pure-Rust
      # sanity harness (NOT gated). Gate: any bench mean change >10% AND CI-separated.
      # EXCEPTION: `concurrent_*` (multi-threaded) benchmarks are INFORMATIONAL only —
      # criterion's --baseline compares two SEPARATE runs (base saved, then pr), and
      # for threaded GC the between-run thread-scheduling noise on a shared CI runner
      # is large (validated: a perf-neutral comment-only PR saw the concurrent benches
      # swing +6–33% while single-threaded ones centred on 0). criterion's tight
      # within-run CI does not capture that drift, so gating them false-reds. They are
      # printed but never fail the job; single-threaded GC benches remain hard-gated.
      - name: Criterion(Rust) A/B gate (gc_cycle_bench; only if src/runtime changed)
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if git diff --quiet "$BASE_SHA"..HEAD -- src/runtime; then
            echo "→ src/runtime unchanged base..pr → skip criterion A/B (VM byte-identical)"
            exit 0
          fi
          export CRITERION_HOME="$PWD/.criterion-ab"
          rm -rf "$CRITERION_HOME"; mkdir -p "$CRITERION_HOME"
          echo "── base: save criterion baseline 'ab-base' (base tree) ──"
          ( cd base-src && CRITERION_HOME="$CRITERION_HOME" \
              cargo bench --locked --manifest-path src/runtime/Cargo.toml \
                --bench gc_cycle_bench -- --save-baseline ab-base )
          echo "── pr: compare against 'ab-base' (this tree) ──"
          CRITERION_HOME="$CRITERION_HOME" \
            cargo bench --locked --manifest-path src/runtime/Cargo.toml \
              --bench gc_cycle_bench -- --baseline ab-base
          echo "── gate: mean change >10% AND CI-separated (lower_bound>0) = regression ──"
          python3 - "$CRITERION_HOME" <<'PY'
          import json, os, sys, glob
          home = sys.argv[1]; thr = 0.10; regr = []
          for est in glob.glob(os.path.join(home, "**", "change", "estimates.json"), recursive=True):
              with open(est) as f: d = json.load(f)
              mean = d.get("mean", {}); pe = mean.get("point_estimate")
              lo = mean.get("confidence_interval", {}).get("lower_bound")
              if pe is None or lo is None: continue
              bench = est.split(os.sep)[-3]
              tag = f"{pe*100:+.1f}% (CI lower {lo*100:+.1f}%)"
              noisy = "concurrent" in bench   # threaded → between-run scheduling noise; informational only
              if pe > thr and lo > 0.0:
                  if noisy:
                      print(f"  ~ {bench}: {tag} (concurrent — informational, not gated)")
                  else:
                      regr.append(bench); print(f"  ↑ REGRESSION {bench}: {tag}")
              else:
                  print(f"  ≈ {bench}: {tag}")
          if regr:
              print(f"❌ {len(regr)} criterion regression(s) — mean >{int(thr*100)}% AND CI-separated"); sys.exit(1)
          print("✅ no criterion regression")
          PY

      - name: Upload A/B results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-ab-results
          path: |
            bench/results/ab.json
            bench/results/micro-pr.json
            bench/results/micro-base.json
          if-no-files-found: ignore
