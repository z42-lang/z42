name: Bench Baseline Update

# Trigger: every push (including merges) to main.
# Runs the full e2e bench and publishes the result JSON to the dedicated
# `bench-baselines` branch. PR-side workflows (P1.D.4) will fetch the latest
# baseline from there to run auto-diff.
#
# Concurrency: only one update at a time per branch (later runs cancel earlier).

on:
  push:
    branches: [main]
    # change-detect rule (a): non-code-only changes (docs / *.md / .claude) do
    # NOT recompute the bench baseline — a doc edit can't move performance, and
    # the full e2e bench (~compile z42c + hyperfine) is wasted compute. Mirrors
    # ci.yml's paths-ignore so docs-only pushes are inert across all workflows.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'

permissions:
  # Required to push to the bench-baselines branch.
  contents: write

concurrency:
  group: bench-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-baseline:
    name: bench-baseline-update(linux-x64)
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history so we can switch to bench-baselines branch.
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install hyperfine
        run: |
          wget -q https://github.com/sharkdp/hyperfine/releases/download/v1.20.0/hyperfine_1.20.0_amd64.deb
          sudo dpkg -i hyperfine_1.20.0_amd64.deb

      # Swatinem keyed on the REDIRECTED target dir (.cargo/config.toml sends it to
      # artifacts/build/runtime, not src/runtime/target) — the old manual cache on
      # src/runtime/target cached an empty dir → cold release compile every push.
      # shared-key host-v2 also reuses the warm cache the CI host jobs populate.
      - name: Cache Rust deps (Swatinem)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/runtime -> ../../artifacts/build/runtime
          shared-key: host-v2

      # C#-free: seed the toolchain from the prev nightly (NO dotnet) and build
      # current source warm — same path as CI build-and-test. `xtask bench` rebuilds
      # stdlib via the warm self-build, so it needs the primed seed (the old download
      # action left artifacts/build empty → bench hit the now-removed C# cold seed).
      - name: Bootstrap toolchain (nightly z42c seed → current source)
        uses: ./.github/actions/ci-bootstrap
        with:
          rid: linux-x64
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run full e2e bench (xtask)
        shell: bash
        run: |
          set -euo pipefail
          vm="$PWD/artifacts/build/runtime/release/z42vm"
          Z42_PORTABLE_VM="$vm" Z42_LIBS="$PWD/artifacts/build/libraries/dist/release" \
            "$vm" artifacts/xtask/xtask.zpkg -- bench

      - name: Publish baseline to bench-baselines branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Save current baseline aside before switching branches.
          cp bench/results/e2e.json /tmp/baseline.json

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Try to fetch existing bench-baselines; create if absent.
          if git fetch origin bench-baselines:bench-baselines 2>/dev/null; then
            echo "→ Switching to existing bench-baselines branch"
            git checkout bench-baselines
          else
            echo "→ bench-baselines branch absent, bootstrapping"
            git checkout --orphan bench-baselines
            git rm -rf . 2>/dev/null || true
            cat > README.md <<'EOF'
          # Bench Baselines

          Auto-published by `.github/workflows/bench-update.yml` on every push to `main`.

          Each `baselines/<tag>.json` conforms to `bench/baseline-schema.json` (see main branch).

          PR workflows fetch from this branch to run informational regression diffs (P1.D.4).
          EOF
            git add README.md
            git commit -m "init bench-baselines branch"
          fi

          # Write/overwrite baseline for this OS-runner tag.
          mkdir -p baselines
          cp /tmp/baseline.json baselines/e2e-ubuntu-latest.json

          git add baselines/e2e-ubuntu-latest.json

          if git diff --cached --quiet; then
            echo "→ No baseline changes; skipping commit."
          else
            git commit -m "bench: update e2e-ubuntu-latest baseline (main@${GITHUB_SHA::7})"
            git push origin bench-baselines
            echo "✅ Baseline published"
          fi
