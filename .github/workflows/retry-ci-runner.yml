name: Maintain CI Runs

on:
  workflow_run:
    workflows: [CI]
    types: [requested, completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Failed PR CI run ID to inspect and retry
        required: true
        type: string

permissions:
  contents: read
  actions: write
  checks: read
  pull-requests: read

concurrency:
  group: retry-ci-runner-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  retry:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'pull_request' &&
        (github.event.action == 'requested' ||
          (github.event.action == 'completed' && github.event.workflow_run.conclusion == 'failure')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # workflow_run has write permissions. Only execute the trusted workflow's
      # revision on main; never check out the PR or download its artifacts.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Bootstrap trusted xtask
        uses: ./.github/actions/ci-bootstrap
        with:
          gh-token: ${{ github.token }}
          xtask-only: "true"
      - name: Release superseded PR runs
        if: github.event_name == 'workflow_run' && github.event.action == 'requested'
        env:
          GH_TOKEN: ${{ github.token }}
        run: xtask ci supersede

      - name: Retry only unacquired hosted runner jobs
        if: github.event_name == 'workflow_dispatch' || github.event.action == 'completed'
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY_RUN_ID: ${{ inputs.run_id }}
        run: xtask ci retry-runner
