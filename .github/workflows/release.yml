name: Release

# Tag-triggered cross-platform SDK package publish.
#
# Triggers on tag matching v[0-9]+.[0-9]+.[0-9]+* (e.g. v0.2.5, v0.2.5-rc1).
# Pre-1.0 versions and tags containing '-' are published as GitHub prereleases.
#
# Pipeline: verify (tag ↔ versions.toml) → package × 9 RIDs → publish (with SHA256SUMS).
# See docs/spec/changes/add-release-automation/ (until archived) or
# docs/spec/archive/<date>-add-release-automation/.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (must match versions.toml [project].version, e.g. 0.1.0)'
        required: true
        type: string

permissions:
  contents: write   # gh release create
  actions: read     # ci-bootstrap → setup-z42-sdk 回退（gh run download）

jobs:
  # ── 1. Verify tag matches versions.toml [project].version ──────────────
  verify:
    name: verify-version(linux-x64)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Extract + verify version
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="${GITHUB_REF#refs/tags/v}"
          else
            tag="${{ inputs.version }}"
          fi
          # read versions.toml [project].version (no versions.sh; this job has no
          # z42 toolchain — same awk pattern as scripts/install-z42.sh). Split on
          # the quote so a trailing comment (`version = "0.2.0"  # ...`) doesn't
          # leak into the value (the old gsub /.*"|".*/ kept the comment).
          repo_version=$(awk '
            /^\[project\]/ {inblock=1; next}
            /^\[/ {inblock=0}
            inblock && /^version/ {split($0, a, "\""); print a[2]; exit}
          ' scripts/versions.toml)
          if [ "$tag" != "$repo_version" ]; then
            echo "drift: tag=$tag scripts/versions.toml=$repo_version" >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "✓ release version: $tag"

  # ── 2. Build per-RID SDK package + archive ─────────────────────────────
  package:
    name: package-${{ matrix.rid }}
    timeout-minutes: 60
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64,      runs-on: ubuntu-latest,      rust-target: x86_64-unknown-linux-gnu }
          - { rid: linux-arm64,    runs-on: ubuntu-24.04-arm,   rust-target: aarch64-unknown-linux-gnu }
          - { rid: macos-arm64,    runs-on: macos-26,           rust-target: aarch64-apple-darwin }
          - { rid: windows-x64,    runs-on: windows-latest,     rust-target: x86_64-pc-windows-msvc }
          - { rid: ios-arm64,      runs-on: macos-26,           rust-target: aarch64-apple-ios }
          - { rid: iossim-arm64,  runs-on: macos-26,           rust-target: aarch64-apple-ios-sim }
          - { rid: android-arm64,  runs-on: ubuntu-latest,      rust-target: aarch64-linux-android }
          - { rid: android-x64,    runs-on: ubuntu-latest,      rust-target: x86_64-linux-android }
          - { rid: browser-wasm,   runs-on: ubuntu-latest,      rust-target: wasm32-unknown-unknown }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache Rust deps (Swatinem)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/runtime -> ../../artifacts/build/runtime
          cache-directories: artifacts/build/toolchain/target
          shared-key: release-${{ matrix.rid }}

      # Android-only: cargo-ndk + NDK r30
      - name: Install cargo-ndk
        if: startsWith(matrix.rid, 'android-')
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # local-cache: false — local-cache: true produced an incomplete
      # ANDROID_NDK_HOME directory (clang missing under toolchains/llvm/prebuilt/),
      # causing libffi-sys's configure to fail with "C compiler cannot create
      # executables". Fresh download every run is ~2 min slower but reliable.
      - name: Setup Android NDK r30
        if: startsWith(matrix.rid, 'android-')
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r30
          local-cache: false

      # wasm-only: wasm-pack + wasm-tools
      - name: Install wasm-pack + wasm-tools
        if: matrix.rid == 'browser-wasm'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack,wasm-tools

      # build the host toolchain from the prev nightly's z42c
      # seed (same path as CI build-and-test), then the package steps below run via
      # `z42vm xtask.zpkg`. The host RID is derived from the runner; the cross target
      # (matrix.rust-target) is handled by `xtask package`.
      - name: Bootstrap toolchain (nightly z42c seed → current source)
        uses: ./.github/actions/ci-bootstrap
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      # wasm-only: pre-build pkg-web/ + pkg-nodejs/ via wasm-pack (WasmBackend)
      - name: Build wasm platform
        if: matrix.rid == 'browser-wasm'
        shell: bash
        run: xtask test platform wasm build

      # `xtask` 是 ci-bootstrap 加进 PATH 的垫片（.github/ci/xtask）：与本地 `./xtask` 一样，用 `.z42` SDK 的
      # z42vm + libs 跑 xtask.zpkg（cargo 重链构建树 z42vm.exe 时碰不到它）。
      - name: Package ${{ matrix.rid }}
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          rid="${{ matrix.rid }}"
          # Desktop host RID → SDK + runtime + desktop workload（--no-build：用 bootstrap 已建好的 z42c + stdlib）；
          # platform RID（ios/android/wasm）→ runtime pack + tooling facade。
          if [[ "$rid" == linux-* || "$rid" == macos-* || "$rid" == windows-* ]]; then
            xtask package sdk --no-build
            xtask package runtime --no-build
            xtask package workload
            # test workload = payload-only、与平台无关 → 只在主桌面 host 出一份。
            if [[ "$rid" == "macos-arm64" ]]; then xtask package workload test; fi
          else
            xtask package runtime --rid "$rid"
          fi

      # 归档命名（sdk / runtime / 桌面 workload / 平台 workload 只由主 RID 出 / test workload）与 windows 出 zip
      # 都在 `xtask package archive` 里（与 ci.yml nightly、本地发布同一份）。
      - name: Archive
        shell: bash
        run: xtask package archive --label "${{ needs.verify.outputs.version }}"

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/packages/archives/z42-*
          retention-days: 7
          if-no-files-found: error

  # ── 3. Publish GitHub Release with all 9 archives + SHA256SUMS ─────────
  publish:
    name: publish-release(linux-x64)
    timeout-minutes: 45
    needs: [verify, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Provision z42vm + xtask.zpkg so the release-packaging steps run as
      # `xtask release …` (script-zero — no scripts/release/*.sh). Bootstrap
      # from the prev nightly seed, same as the package job. Host = linux-x64.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust deps (Swatinem)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/runtime -> ../../artifacts/build/runtime
          cache-directories: artifacts/build/toolchain/target
          shared-key: release-publish
      - name: Provision z42vm + xtask (bootstrap from prev nightly seed)
        uses: ./.github/actions/ci-bootstrap
        with:
          rid: linux-x64
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all archives
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: 'release-*'
          merge-multiple: true

      - name: List archives
        run: ls -la dist/

      # 合并 4 份逐 RID 桌面 workload → SHA256SUMS → release-index.json（channel stable / tag v<v>）。
      # 与 ci.yml publish-nightly 同一条命令。
      - name: Finalize release assets
        shell: bash
        run: xtask package finalize "${{ needs.verify.outputs.version }}" --dir dist

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          v="${{ needs.verify.outputs.version }}"
          # Prerelease if version contains '-' (e.g. -rc1) OR is strictly < 1.0.0.
          prerelease_flag=""
          if [[ "$v" == *-* ]]; then
            prerelease_flag="--prerelease"
          elif [ "$v" != "1.0.0" ] \
            && [ "$(printf '%s\n1.0.0\n' "$v" | sort -V | head -1)" = "$v" ]; then
            prerelease_flag="--prerelease"
          fi
          gh release create "v$v" $prerelease_flag --generate-notes \
            --title "z42 v$v" \
            dist/SHA256SUMS dist/release-index.json dist/z42-* \
            scripts/install/install.sh scripts/install/install.ps1
