name: Deploy book to GitHub Pages

# 每次 push 到 main 且改动了两本书、配套示例或安装脚本时，构建 mdBook 并发布到 GitHub Pages：
#   https://z42-lang.github.io/z42/         知识库（docs/book）
#   https://z42-lang.github.io/z42/learn/   学习手册（docs/learn；代码 include 自 examples/，发布即是最新代码）
#   https://z42-lang.github.io/z42/install.sh / install.ps1   安装脚本
# PR 上只构建不发布：mdBook 的 include 出错不会让构建失败（缺文件只打 ERROR），这里把 [ERROR] 判红。
# 一次性前置：仓库 Settings → Pages → Source 选 "GitHub Actions"。
# 发布后网址：https://z42-lang.github.io/z42/

on:
  push:
    branches: [main]
    paths:
      - 'docs/book/**'
      - 'docs/learn/**'
      - 'docs/reference/**'
      - 'docs/internals/**'
      - 'examples/**'
      - 'scripts/install/**'
      - '.github/workflows/deploy-book.yml'
  pull_request:
    paths:
      - 'docs/book/**'
      - 'docs/learn/**'
      - 'docs/reference/**'
      - 'docs/internals/**'
      - 'examples/**'
      - '.github/workflows/deploy-book.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 允许一个并发部署；不打断进行中的发布
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install mdBook + mdbook-mermaid
        run: |
          MDBOOK_VERSION=0.4.40
          MERMAID_VERSION=0.14.0
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          curl -sSL "https://github.com/badboy/mdbook-mermaid/releases/download/v${MERMAID_VERSION}/mdbook-mermaid-v${MERMAID_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build
        # mdbook-mermaid install 向 checkout 副本注入 mermaid 预处理器配置 + js 资源
        # （仓库内 book.toml 保持干净；本地无插件也能 build，GitHub 网页原生渲染 mermaid）
        run: |
          set -euo pipefail
          site="$PWD/_site"
          ( cd docs/book && mdbook-mermaid install . && mdbook build -d "$site" ) 2>&1 | tee book.log
          ( cd docs/learn && mdbook build -d "$site/learn" ) 2>&1 | tee -a book.log
          # 三书重构（restructure-docs-three-books）：reference / internals 与 learn 并列发布。
          # docs/book 在搬迁完成前继续发布到站点根，搬完即删（批 6）。
          ( cd docs/reference && mdbook build -d "$site/reference" ) 2>&1 | tee -a book.log
          ( cd docs/internals && mdbook-mermaid install . && mdbook build -d "$site/internals" ) 2>&1 | tee -a book.log
          if grep -q '\[ERROR\]' book.log; then
            echo "::error::mdBook reported errors (broken {{#include}} etc.) — see the log above"; exit 1
          fi
          # mdBook 对缺失锚点完全静默（渲染成空代码块）；未解析的 include 会原样留在页面里。
          # 完整的书↔示例校验（xtask test examples）要 SDK、只在 ci.yml 跑；这里把这两种
          # **静默**失败判红——它们在渲染产物里才看得见。
          if grep -rl '{{#include' "$site/learn" --include='*.html'; then
            echo "::error::unresolved {{#include}} left in the rendered learn book (files above)"; exit 1
          fi
          if grep -rlzP '<code class="language-[^"]*">\s*</code>' "$site/learn" --include='*.html'; then
            echo "::error::empty code block in the rendered learn book (missing ANCHOR?) — files above"; exit 1
          fi
          cp scripts/install/install.sh scripts/install/install.ps1 "$site/"
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: _site
          include-hidden-files: true   # keep mdBook .nojekyll (v4+ drops dotfiles by default)

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
