name: xtask-bootstrap-artifact
description: >
  Bootstrap by CONSUMING the `toolchain-ubuntu-latest` artifact produced by the
  toolchain-bootstrap job (z42c dist + stdlib dist + xtask.zpkg), plus a host
  `cargo build` for z42vm + native cdylibs (the build-tree VM the tests exercise), plus the
  previous nightly SDK in `.z42` that xtask itself runs on (same as local `./xtask`). After this, drive work via
  `xtask <cmd>` (the .github/ci/xtask shim, put on PATH here) exactly like ci-bootstrap.
  The consuming job MUST `needs: toolchain-bootstrap` and `actions/checkout` first
  (checkout cannot live in here — this action's own file has to exist on disk to
  be resolvable).
  Any host runner (Linux / macOS / Windows): the artifact is pure zpkg — host-neutral —
  so every OS consumes the same linux-built copy; only z42vm is built per host.
inputs:
  gh-token:
    description: "GitHub token for setup-z42-sdk (nightly download / CI-artifact fallback)"
    required: false
    default: ${{ github.token }}
  cache-key:
    description: >
      Swatinem rust-cache `shared-key`. Default `artifact-host-v1` = the shared
      full-workspace (incl. cdylib) cache for every job whose cargo invocation is
      byte-identical to the one below. Override ONLY when the job builds strictly
      MORE than this action does — e.g. host-package's package step additionally
      builds cdylib/staticlib/apphost, so it owns `package-host-v2`.

      历史：`host-v2`（ci-bootstrap 侧的 key）曾经只含 bin/rlib —— 那时 ci-bootstrap
      跑的是 `cargo build --bin z42vm`，共用它会让这里建的 cdylib 永远进不了缓存、
      每轮冷编（2026-09-04 前有 7 个 job 中招）。2026-09-05 起 ci-bootstrap 的 [0/5]
      已改为全 workspace（与本 action 同一 unit 集合，见该 action 注释），两边内容
      因此趋同；但仍保持两个 key 分开，因为两条 bootstrap 路径后续做的事不同，
      合并需要单独验证。把缓存配置留在本 action 内（而不是每个 job 抄一份）才是
      当初那个 bug 不再复发的原因。
    required: false
    default: artifact-host-v1
  rust-targets:
    description: >
      Extra rustup targets, comma-separated (e.g. `wasm32-unknown-unknown`), for
      jobs that cross-compile after bootstrapping. Empty = host only.
    required: false
    default: ""
  prebuilt-vm:
    description: >
      "true" = on a Linux X64 runner, take z42vm + native cdylibs from the `z42vm-linux-x64`
      artifact (uploaded by compile-toolchain, built by the very same `cargo build --release`
      command below) instead of cargo-building them. Saves ~95s per job: rust-cache only caches
      DEPENDENCIES, so even on an exact cache hit the z42 crate itself is re-linked with fat LTO.
      🔴 Only for jobs whose later steps never invoke cargo (they'd find a target dir with no
      fingerprints and rebuild the whole crate cold) — today: `test stdlib --no-build` jobs and
      publish-nightly. Ignored on other hosts (they always build their own z42vm).
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Setup Rust
      if: ${{ !(inputs.prebuilt-vm == 'true' && runner.os == 'Linux' && runner.arch == 'X64') }}
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.rust-targets }}

    - name: Cache Rust deps (Swatinem)
      if: ${{ !(inputs.prebuilt-vm == 'true' && runner.os == 'Linux' && runner.arch == 'X64') }}
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: src/runtime -> ../../artifacts/build/runtime
        shared-key: ${{ inputs.cache-key }}

    # z42vm + native cdylibs (libz42, libz42_compression, …) — host-matched, fresh.
    # cargo's target-dir is artifacts/build/runtime, so this lands z42vm at the
    # standard artifacts/build/runtime/release/z42vm the zpkg artifact expects.
    - name: cargo build z42vm + native libs (release)
      if: ${{ !(inputs.prebuilt-vm == 'true' && runner.os == 'Linux' && runner.arch == 'X64') }}
      shell: bash
      run: cargo build --locked --release --manifest-path src/runtime/Cargo.toml

    - name: Download prebuilt z42vm (linux-x64)
      if: ${{ inputs.prebuilt-vm == 'true' && runner.os == 'Linux' && runner.arch == 'X64' }}
      uses: actions/download-artifact@v8
      with:
        name: z42vm-linux-x64
        path: artifacts/build/runtime/release

    # upload-artifact 不保留可执行位。
    - name: Restore exec bit
      if: ${{ inputs.prebuilt-vm == 'true' && runner.os == 'Linux' && runner.arch == 'X64' }}
      shell: bash
      run: chmod +x artifacts/build/runtime/release/z42vm && artifacts/build/runtime/release/z42vm --version

    # z42c + stdlib + xtask.zpkg (.zpkg products) → restored at repo root
    # under artifacts/build/{libraries,z42c}/ and artifacts/xtask/.
    # 所有宿主都取同一份 linux 产物（zpkg 与宿主无关；Windows 一直如此）。原先 macOS
    # 取自己的 toolchain-macos-26 —— 那条腿已删（speed-up-ci-quick-wins）。
    - name: Download toolchain artifact
      uses: actions/download-artifact@v8
      with:
        name: toolchain-ubuntu-latest
        path: .

    # xtask 跑在 `.z42` SDK 上（与本地 `./xtask` 一致，add-sdk-libs D7）——每个 job 都装一份，同 ci-bootstrap。
    - name: Install z42 SDK (.z42)
      id: sdk
      uses: ./.github/actions/setup-z42-sdk
      with:
        gh-token: ${{ inputs.gh-token }}

    # artifact 里的 xtask.zpkg 是 compile-toolchain 用**它那时**装的 SDK 编的（同目录 seed-id.txt 记身份）。
    # 两 job 之间 nightly 被重发（并发运行的 publish-nightly）⇒ 这里装到的 SDK 换了一版 —— 跨格式 bump
    # 时旧 xtask.zpkg 在新 VM 上加载不了。对不上就用本机 SDK 的 z42c 原地重编（~1 min），编与跑始终同一工具链。
    - name: Rebuild xtask if the SDK seed changed
      shell: bash
      run: |
        set -euo pipefail
        have="$(cat artifacts/xtask/seed-id.txt 2>/dev/null || echo none)"
        want="$(cat .z42/seed-id.txt)"
        if [ "$have" = "$want" ]; then echo "xtask.zpkg built by seed $want — reuse"; exit 0; fi
        echo "xtask.zpkg seed '$have' ≠ installed SDK '$want' — rebuilding xtask on the installed SDK"
        z42c=.z42/bin/z42c; [ -f "$z42c.exe" ] && z42c="$z42c.exe"
        env -u Z42_LIBS -u Z42_HOME -u Z42_PORTABLE_VM -u Z42_COMPILER_LIBS \
          "$z42c" build scripts/xtask.z42.toml --release --no-incremental
        cp -f .z42/seed-id.txt artifacts/xtask/seed-id.txt

    # 后续步骤用 `xtask <cmd>` 驱动（见 .github/ci/xtask 头注）。
    - name: Put the xtask CI shim on PATH
      shell: bash
      run: echo "$GITHUB_WORKSPACE/.github/ci" >> "$GITHUB_PATH"
