name: ci-bootstrap
description: >
  Self-hosted CI bootstrap into the STANDARD artifact locations that later steps
  (test all / package release / upload) expect. Seeds from the PREVIOUS published
  nightly SDK's z42c compiler (programs/z42c/, host tooling — the runtime package
  no longer carries a z42c seed, 2026-07-01): prev-nightly z42c seed → builds
  current xtask → xtask builds current z42c (warm self-build) + stdlib (flat dist
  + index). xtask is compiled by AND runs on the SDK in `.z42` (setup-z42-sdk), exactly like the
  local `./xtask` apphost; the cargo-built z42vm is the build-tree VM under test. Needs gh (auth'd
  via gh-token) + cargo + rust (not for xtask-only).
inputs:
  rid:
    description: "runtime ID (macos-arm64 / linux-x64 / linux-arm64 / windows-x64); empty = auto-detect host"
    required: false
    default: ""
  gh-token:
    description: "GitHub token for `gh release download` of the nightly seed"
    required: true
  xtask-only:
    description: >
      "true" = stop after [2/5] (SDK z42c → current xtask.zpkg); skip cargo and build compiler /
      stdlib. xtask runs on the SDK either way, so no build tree is needed. For jobs that only run
      xtask's pure source/doc checks (docs-check). Default "false".
    required: false
    default: "false"
runs:
  using: composite
  steps:
    # 种子 = 上一版 nightly SDK，装到 .z42（与本地 install-z42.sh 同一位置、同一形态）。CI 之后编 xtask、跑 xtask
    # 都用它 —— 与本地 `./xtask` apphost 完全一致（add-sdk-libs D7）。下载重试与回退链都在那个 action 里。
    - name: Install the nightly z42 SDK into .z42
      id: sdk
      uses: ./.github/actions/setup-z42-sdk
      with:
        rid: ${{ inputs.rid }}
        gh-token: ${{ inputs.gh-token }}

    - shell: bash
      env:
        XTASK_ONLY: ${{ inputs.xtask-only }}
        SEED_SRC: ${{ steps.sdk.outputs.seed-src }}
      run: |
        set -euo pipefail
        cd "$(git rev-parse --show-toplevel)"

        RID="${{ inputs.rid }}"
        if [ -z "$RID" ]; then
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64)        RID=macos-arm64 ;;
            Linux-x86_64)        RID=linux-x64 ;;
            Linux-aarch64)       RID=linux-arm64 ;;
            Linux-arm64)         RID=linux-arm64 ;;
            MINGW*|MSYS*|CYGWIN*) RID=windows-x64 ;;
            *) echo "::error::unsupported host for bootstrap; pass rid"; exit 2 ;;
          esac
        fi

        # winpath: native z42vm is a Windows binary on windows-x64 — it cannot parse the
        # git-bash/MSYS path style (`/d/a/z42/z42/...`) that $PWD yields under Actions'
        # shell. Any ABSOLUTE path we hand to z42vm (as an argv path or via an env var it
        # reads — Z42_LIBS / Z42_PORTABLE_VM / the driver.zpkg arg) must be the native
        # `D:\a\...` form. Relative paths (resolved against cwd by z42vm itself) are fine
        # as-is, so only absolutes flow through here. No-op on Unix.
        winpath() {
          case "$RID" in
            windows-*) cygpath -w "$1" ;;
            *)         printf '%s' "$1" ;;
          esac
        }
        ROOT="$PWD"

        # ── 0. z42vm (Rust; cargo) ───────────────────────────────────────────────────
        #
        # 故意**不加** `--bin z42vm`：必须与步骤 [3/5] 里 xtask `_buildRuntime` 的
        # `cargo build --release`（全 workspace）**是同一个 unit 集合**，否则这个 job
        # 会把 `z42` lib 编两遍。
        #
        # 原因是 cargo 的 feature unification：workspace 里除 z42vm 外还有
        # z42-compression / z42-repl 两个 cdylib，它们在 `z42` 上启用的 feature 与
        # `--bin z42vm` 单独解析出来的不同 → 两个不同 fingerprint 的 `z42` lib 各编一次，
        # 且两份产物在 target dir 里**并存**（所以不是来回覆盖，是实打实编两遍）。
        #
        # 本地实测（warm 树，release）：
        #   full(warm) 0.12s → `--bin z42vm` **60s** → full 再跑 0.26s → --bin 再跑 0.12s
        # 即首次跨过去要付一整轮 lib 编译。CI 上正是这个形状：
        #   步骤 [0/5] `--bin z42vm` 76s + 步骤 [3/5] 全 workspace 75s ≈ 150s，
        # 而实际只需要其中一份。对齐后 [3/5] 的 cargo 变成 no-op。
        #
        # 代价：这一步多编 z42-compression + z42-repl 两个 cdylib（实测 +7s / +0s），
        # 但它们本来也会在 [3/5] 被编——只是挪到这里，且不再触发 lib 二次编译。
        # xtask-only：xtask 跑在 SDK 的 VM 上、只做纯源码 / 文档检查 ⇒ 不需要构建树 VM，整步跳过。
        if [ "${XTASK_ONLY:-false}" != "true" ]; then
          echo "── [0/5] cargo build z42vm + cdylibs (release; unit set 对齐 _buildRuntime) ──"
          cargo build --locked --release --manifest-path src/runtime/Cargo.toml
        fi

        # ── 1. 种子 = setup-z42-sdk 装好的 .z42（nightly，或回退到最近成功 CI 运行的归档）────────
        # The seed lives in the SDK's programs/z42c/ (host tooling), NOT the runtime package — the runtime
        # package is a pure embeddable pack (native + stdlib only, no z42c/z42vm, 2026-07-01).
        SDK="$ROOT/.z42"
        echo "── [1/5] seed SDK = $SDK (${SEED_SRC:-unknown}) ──"
        seed="$ROOT/.ci-seed"; rm -rf "$seed"; mkdir -p "$seed"
        cp -f "$SDK/programs/z42c/"*.zpkg "$seed/"
        cp -f "$SDK/libs/"*.zpkg "$seed/"
        echo "   seed: $(ls "$seed"/*.zpkg | wc -l | tr -d ' ') zpkg @ $seed"

        # Native-form (Windows D:\… on windows-x64; unchanged on Unix) copies of every
        # ABSOLUTE path z42vm must parse. The bash exec position ("$vm" …) keeps the MSYS
        # form — git-bash launches the .exe fine; only what z42vm itself reads is converted.
        # (Defined here — before the 1.5 two-gen gate — because the gate references them.)
        seedw="$(winpath "$seed")"
        driverw="$(winpath "$seed/z42c.driver.zpkg")"

        # ── 1.5 版本差 gate:两代自举根治格式-bump 死结 ────────────────────────────────
        # (fix-bootstrap-format-bump-deadlock) 种子 zpkg minor 与当前源 writer minor 相等
        # → 日常 push,种子与新 VM 同版本,直接走下面的单 VM 快路径(零改动)。不等(zpkg/zbc
        # 格式 bump)→ cargo 新 VM strict-pin 读不了旧种子 stdlib → 单 VM 必炸。改用 nightly SDK
        # 自带的**旧 VM**(bin/z42vm,与旧种子同版本)做两代自举,把种子推进到当前格式,再交新 VM。
        # 机理见 docs/spec/archive/…-fix-bootstrap-format-bump-deadlock/design.md(D7,已本地端到端验证)。
        seed_minor=$(od -An -tu2 -j6 -N2 "$seed/z42c.driver.zpkg" | tr -d ' ')
        cur_minor=$(grep -oE 'Minor = [0-9]+' "$ROOT/src/compiler/z42.package/src/ZpkgWriter.z42" | head -1 | grep -oE '[0-9]+')
        echo "   zpkg minor: seed=$seed_minor  current=$cur_minor"
        if [ -n "$seed_minor" ] && [ -n "$cur_minor" ] && [ "$seed_minor" != "$cur_minor" ]; then
          echo "── [1.5] 格式 bump 检测(seed $seed_minor ≠ current $cur_minor)→ 两代自举 ──"
          OLDVM="$SDK/bin/z42vm"; case "$RID" in windows-*) OLDVM="$OLDVM.exe";; esac
          [ -f "$OLDVM" ] || { echo "::error::nightly SDK 缺 bin/z42vm — 两代自举需旧 VM(重发带 bin/z42vm 的 nightly)"; exit 1; }
          chmod +x "$OLDVM" 2>/dev/null || true
          # Gen0 stdlib: 旧VM + 旧种子 z42c → 编**当前** stdlib → 产出携带**当前 z42.package API**
          # (如本次新增的 IR 字段 StackAlloc)的新 z42.package(旧格式、旧VM 可读)。这样下面 gen1 z42c
          # 才对着「有新 API 的 z42.package」编——否则 z42c 源新用 z42.package 字段(轴④)在格式-bump 两代路径
          # 会 `no field` 编译失败(正常路径由 _ensureBootstrapSelfDepLibs 解,两代路径此前缺此步)。stdlib
          # 源不引用任何比种子更新的 API(轴② 纪律),故旧种子能编它。add-escape-analysis-stack-alloc。
          G0LIBS="$ROOT/.ci-gen0libs"; rm -rf "$G0LIBS"; mkdir -p "$G0LIBS"
          ( cd "$ROOT/src/libraries" && Z42_LIBS="$seedw" "$OLDVM" "$driverw" --mode interp -- build --workspace --release --no-incremental )
          for f in "$ROOT/artifacts/build/libraries/"*/release/dist/*.zpkg; do cp -f "$f" "$G0LIBS/"; done
          # 种子里 gen0 未产出的库(若有)用种子版兜底,保证种子 driver 运行期依赖齐全。
          for f in "$SDK/libs/"*.zpkg; do [ -f "$G0LIBS/$(basename "$f")" ] || cp -f "$f" "$G0LIBS/"; done
          g0libsw="$(winpath "$G0LIBS")"
          # Gen1 z42c: 旧VM + 旧种子 z42c,**对着 gen0 的新 z42.package 编**(含新 API)→ gen1(旧壳/新逻辑)。
          ( cd "$ROOT/src/compiler" && Z42_LIBS="$g0libsw" "$OLDVM" "$driverw" --mode interp -- build --workspace --release --no-incremental )
          # Gen1 stdlib: gen1 driver + gen0 新 z42.package 同目录(旧VM 运行时加载——gen1 运行期需新 z42.package
          # 的字段如 StackAlloc 才能 emit)→ 产新格式 stdlib。
          G1RUN="$ROOT/.ci-gen1run"; rm -rf "$G1RUN"; mkdir -p "$G1RUN"
          cp -f "$ROOT/artifacts/build/compiler/z42c.driver/release/dist/"*.zpkg "$G1RUN/"
          cp -f "$G0LIBS/"*.zpkg "$G1RUN/"
          g1runw="$(winpath "$G1RUN")"
          # 修 two-gen 格式-bump 回归(probe-two-gen-verify)——根因 = z42c DepScanCache（F2 进程级
          # memo，#247/#252 引入）的 path→内容稳定不变式在两代自举被破坏：gen0 与 gen1 stdlib **同一
          # `artifacts/build/libraries` 就地覆写**，故 gen1 stdlib 起步时该目录仍是 gen0 旧格式产物
          # (z42.core 旧 minor)。gen1 z42c 建 [1/25] z42.core 时 DepScan 预开循环 Get(该 path)读到
          # 旧份 → strict-pin skip → **缓存 null**;[1/25] 随即覆写为新 minor,但 [2/25] z42.encoding
          # 复用缓存 null → z42.core 缺席 → String/FormatException undefined(E0401/E0443)全红。
          # DepScanCache 注释原文即言:「进程内覆写 zpkg 后重扫需 mtime/size 守卫」——两代自举正是此路径。
          # 修法(恢复该不变式,CI 侧最小改动):每代 stdlib/compiler 构建前清空其就地 artifacts,使各成员
          # dist 起步为空(与 DepScanCache「建成员前其 dist 空、不在 paths」的前提一致)。gen0 产物已在
          # 上面拷进 G0LIBS,gen1 driver 已拷进 G1RUN,故清 artifacts 安全。
          rm -rf "$ROOT/artifacts/build/libraries"
          ( cd "$ROOT/src/libraries" && Z42_LIBS="$g1runw" "$OLDVM" "$(winpath "$G1RUN/z42c.driver.zpkg")" --mode interp -- build --workspace --release --no-incremental )
          echo "   ✓ gen1 stdlib: fresh z42.core minor=$(od -An -tu2 -j6 -N2 "$ROOT/artifacts/build/libraries/z42.core/release/dist/z42.core.zpkg" | tr -d ' ')"
          # 新格式 stdlib flat 视图
          FLAT="$ROOT/artifacts/build/libraries/dist/release"; mkdir -p "$FLAT"
          for f in "$ROOT/artifacts/build/libraries/"*/release/dist/*.zpkg; do cp -f "$f" "$FLAT/"; done
          flatw="$(winpath "$FLAT")"
          # Gen2 z42c: 旧VM + gen1 z42c(entry-dir=旧 stdlib 供运行时)+ Z42_LIBS=新 stdlib(编译期 TSIG)
          # → z42c 新壳。per-member topo 序:兄弟本轮先重写为新格式再被依赖。
          # ⚠️ 「entry-dir 供运行时」依赖旧VM 的 prelude(z42.core)解析**先看 entry-dir**:VM 把 $Z42_LIBS 当
          # libs 目录,若 prelude 只看 libs 目录,就会打开这里的**新格式** z42.core 并 bail —— 2026-09 两代自举
          # 因此回归(#444 把版本失配改成 bail 后触发)。修复 #631(app.rs 5.1b 走 search_dirs)随 nightly
          # 进入 OLDVM 后才成立;改动这段前先确认 OLDVM 仍具备该行为。
          # 同 gen1 stdlib:清就地 artifacts/build/compiler(gen1 已写 minor 41,gen2 重写 42),避免
          # DepScanCache 缓存 gen1 旧份的 strict-pin skip → gen2 兄弟(z42c.*)解析缺席。gen1 driver
          # 已在 G1RUN,gen2 用它作 driver,故清 artifacts/build/compiler 安全(gen2 重建)。
          rm -rf "$ROOT/artifacts/build/compiler"
          ( cd "$ROOT/src/compiler" && Z42_LIBS="$flatw" "$OLDVM" "$(winpath "$G1RUN/z42c.driver.zpkg")" --mode interp -- build --workspace --release --no-incremental )
          g2_minor=$(od -An -tu2 -j6 -N2 "$ROOT/artifacts/build/compiler/z42c.driver/release/dist/z42c.driver.zpkg" | tr -d ' ')
          [ "$g2_minor" = "$cur_minor" ] || { echo "::error::两代自举 gen2 z42c minor=$g2_minor ≠ current=$cur_minor"; exit 1; }
          echo "   ✓ 两代自举完成:gen2 z42c + stdlib 均 minor=$cur_minor(当前格式);新 VM 接管"
          # 构建树已 warm(当前格式):[3/5][4/5] 里 xtask(仍跑在 SDK 旧 VM 上)派生构建树的新 VM 做 warm 自建。
        fi

        # ── 2. 用 SDK 自己的 z42c 编当前 xtask（同本地 `.z42/bin/z42c build scripts/xtask.z42.toml`）──────────
        # xtask 编完**跑在同一个 SDK 上**（下面 [3/5][4/5] 与之后各步的 `xtask` 垫片）⇒ 编译与运行同一个工具链，版本严格一致
        # —— 格式 bump 那一轮也一样（xtask 是种子格式、跑在种子 VM 上），不必再改用 gen2 编 xtask。
        # 清掉 z42 相关环境变量：apphost 自己从所在 SDK 推出 VM / libs / 编译器目录（SDK 库从那里解析）。
        # --no-incremental + `|| echo` + 产物守卫：老 nightly z42c 在 Windows 写增量缓存会在**写完 zpkg 之后**崩（os error 3），
        # 缓存只是优化，跳过它；真失败（没产出 zpkg）由守卫判红。
        echo "── [2/5] SDK z42c builds current xtask.zpkg ──"
        z42c="$SDK/bin/z42c"; [ -f "$z42c.exe" ] && z42c="$z42c.exe"
        env -u Z42_LIBS -u Z42_HOME -u Z42_PORTABLE_VM -u Z42_COMPILER_LIBS \
          "$z42c" build scripts/xtask.z42.toml --release --no-incremental \
          || echo "  seed z42c exited non-zero (nightly Windows cache write?) — verifying xtask.zpkg below"
        [ -f "$ROOT/artifacts/xtask/xtask.zpkg" ] || { echo "::error::xtask.zpkg not produced"; exit 1; }
        # 种子身份随 xtask 走（toolchain artifact 带着它）：下游 job 装的 SDK 若不是同一份，就用自己的 SDK 重编 xtask。
        cp -f "$SDK/seed-id.txt" "$ROOT/artifacts/xtask/seed-id.txt"

        # xtask-only（ci-docs-fast-path）：只要 xtask 跑纯源码 / 文档检查的 job 到此为止 —— 省掉 build compiler / stdlib。
        if [ "${XTASK_ONLY:-false}" = "true" ]; then
          echo "✅ CI bootstrap (xtask-only) OK ($RID) — xtask.zpkg built by and running on the SDK"
          exit 0
        fi

        # ── 3/4. xtask（跑在 SDK 上，同本地 `./xtask`）构建当前 z42c + stdlib ──────────────────────────────
        # 冷树：xtask 的 `_ensureSeed` 经 `_seedSdkDir` 自己找到 `./.z42`（Z42_HOME → Z42_PORTABLE_VM 反推 → ./.z42）
        # 并把种子 stage 进构建树 —— 不再需要 Z42_HOME。两代路径下构建树已 warm（当前格式），xtask 直接 warm 自建。
        # `-v detailed`：CI 日志保留完整的种子查找过程与逐文件输出（排查自举用）。
        # Windows 上「xtask 从构建树 z42vm.exe 的拷贝启动，免得 cargo 重链时覆盖正在运行的 exe」那层绕行随之删掉：
        # xtask 现在跑在 SDK 的 VM 上，cargo 从不重链它。
        xt() { env -u Z42_HOME -u Z42_PORTABLE_VM -u Z42_COMPILER_LIBS "$GITHUB_WORKSPACE/.github/ci/xtask" "$@"; }
        echo "── [3/5] xtask build compiler ──"
        xt -v detailed build compiler

        echo "── [4/5] xtask build stdlib ──"
        xt -v detailed build stdlib

        # ── 5. sanity: toolchain present ─────────────────────────────────────────────
        echo "── [5/5] verify toolchain ──"
        [ -f "$ROOT/artifacts/build/compiler/z42c.driver/release/dist/z42c.driver.zpkg" ] \
          || { echo "::error::current z42c.driver.zpkg missing after build compiler"; exit 1; }
        [ -f "$ROOT/artifacts/build/libraries/dist/release/z42.core.zpkg" ] \
          || { echo "::error::stdlib flat dist missing"; exit 1; }
        echo "✅ CI bootstrap OK ($RID) — z42c + stdlib + xtask in standard locations"

    # 后续步骤用 `xtask <cmd>` 驱动（.github/ci/xtask = 本地 `./xtask` apphost 的等价物：`.z42` 的
    # z42vm + libs 跑 xtask.zpkg，见该文件头注）。GITHUB_WORKSPACE 在 Windows 上即原生
    # `D:\a\…` 形态，直接写进 GITHUB_PATH 最稳。
    - name: Put the xtask CI shim on PATH
      shell: bash
      run: echo "$GITHUB_WORKSPACE/.github/ci" >> "$GITHUB_PATH"
