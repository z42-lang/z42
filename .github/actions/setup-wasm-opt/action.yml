name: Build pinned wasm-opt
description: Cache a static Binaryen built from its pinned source commit (requires bootstrapped xtask)
runs:
  using: composite
  steps:
    - name: Test wasm-opt installer
      shell: bash
      run: xtask ci check-installers wasm
    - uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/z42-binaryen
        key: binaryen-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/versions.toml', 'scripts/src/setup/ci_tools.z42', 'scripts/src/setup/wasm_opt.z42') }}
    - name: Build or validate wasm-opt
      shell: bash
      run: xtask setup wasm-opt --root "${{ runner.temp }}/z42-binaryen"
