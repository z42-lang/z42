name: Restore pinned wasm-opt
description: Restore and validate the current run's static Binaryen (requires bootstrapped xtask)
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v8
      with:
        name: wasm-opt-linux-x64
        path: ${{ runner.temp }}/z42-binaryen
    - name: Validate restored wasm-opt
      shell: bash
      run: |
        chmod +x "${{ runner.temp }}/z42-binaryen/bin/wasm-opt"
        xtask setup wasm-opt --check --root "${{ runner.temp }}/z42-binaryen"
