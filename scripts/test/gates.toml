# 门禁棘轮与白名单的单一配置。
#
# 为什么一个文件：原 5 份散置 txt 基线各自一套格式与读写代码，且「白名单」类配置
# （doc-lints 的 allow、stage2 的宽限天数）没有自然的家。统一后分两个区：
#   · 手写配置区（下方）——按需增改，机器不碰；
#   · 机器维护区（`# z42-gates:<名>-begin/end` 标记之间）——由各门的
#     `xtask check <门> --update` 从当前树重写，手工改动会被冲掉；对条目想说的话
#     写在门脚本头注或 PR 描述里，别写在这里。
# 读写面：scripts/common/xtask_gates.z42（_gatesSection / _gatesWriteSection）。

# stage2：阶段-2 欠账的宽限天数（挂账日写在源码标记 STAGE2-DEBT(<tag>,YYYY-MM-DD) 里，
# 不在本文件；缺省 7——nightly 每天发，余量给发布链偶发失败与回来收尾）。
[stage2]
grace-days = 7

# doc-lints：W08xx 硬门的白名单——列入的码不计入欠账（空 = 任何 W08xx 都红）。
[doc-lints]
allow = []

