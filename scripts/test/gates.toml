# 门禁棘轮与白名单的单一配置。
#
# 分两个区：
#   · 手写配置区（放在机器维护区之前）——按需增改，机器不碰；
#   · 机器维护区（`# z42-gates:<名>-begin/end` 标记之间）——由各门的
#     `xtask check <门> --update` 从当前树重写，手工改动会被冲掉；对条目想说的话
#     写在门脚本头注或 PR 描述里，别写在这里。
# 读写面：scripts/common/xtask_gates.z42（_gatesSection / _gatesWriteSection）。
#
# 缺区 = 空基线：[diagcodes-literal] / [diagcodes-untested] 这类棘轮区为空时不出现，出现条目时
# --update 会自动把区段追加回来。

# ── 机器维护区（--update 重写，勿手改）───────────────────────────────────────────

# z42-gates:doc-refs-begin（xtask check doc-refs --update 维护）
[doc-refs]
readme = 173
internals = 799
reference = 253
# z42-gates:doc-refs-end
