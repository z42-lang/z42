# xtask 的 hook 插件（unify-plugin-packages 1b：[build] hooks 目录改插件工程）。
# 由 z42b 在 publish 时代建并反射加载：BeforeAssets 现场 cargo 编 apphost stub。
[project]
name    = "xtask.hooks"
version = "0.1.0"
kind    = "plugin"

[sources]
include = ["*.z42"]

[build]
# 产物落仓库 artifacts 树（缺省会写进源码目录）：xtask 是 build driver，其 hook 同样不进 artifacts/build/。
output_dir = "../../artifacts/xtask-hooks"
