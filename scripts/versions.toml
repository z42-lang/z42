# scripts/versions.toml — z42 build env 要求 + 运行时平台承诺 单一真相源
#
# 在 scripts/ 下：读它的几乎全是 xtask（`scripts/common/xtask_versions.z42` 的 `_versionsPath`
# 是唯一入口）；另有 release.yml 的 tag 校验、install-z42.{sh,bat}、z42b 的 iOS xcframework 构建。
#
# 唯一 SoT。**不**生成 rust-toolchain.toml 之类的"投影"文件（那只是把版本号写两遍），
# 改由 xtask 在入口处显式校验（`xtask check versions` / `xtask setup`）。代价：rustup 不再
# cd-into auto-install 该 channel；收益：单一文件就是答案。
#
# 六类块：
#   [project]     — z42 自身版本号（release tag SoT；workspace.package.version 镜像）
#   [toolchain.*] — 跨平台 build 工具版本（rust / dotnet / node）
#   [build.*]     — 每平台 native SDK（NDK / Xcode / ...）
#   [platform.*]  — z42 产物运行时支持承诺（min OS / arch / tier）
#   [workload]    — workload 枚举（xtask 各命令 --platform/--os 的参数域）
#   [rid.*]       — 目标 RID 登记（名字 ↔ cargo triple ↔ 类别 ↔ 主 RID）
#
# 其他原生 pin 文件（gradle 是个例外，因为 gradle wrapper 是 gradle 项目
# 标准做法、不算重复声明）：
#   gradle/wrapper/gradle-wrapper.properties  ← gradle pin 由 wrapper 自管
#
# `xtask setup` 用它下载 NDK 等；`xtask check versions` 拿 [project] / [platform.*] 对账
# Package.swift / build.gradle.kts（drift detection）。
#
# 字段约定：
#   version 用字符串（"30.0.16248370" / "22"）；
#   tier 用字符串 "tier1" / "tier2" / "tier3"（rust platform-support 约定）；
#   url 模板里的 {os} = darwin / linux / windows（`xtask setup` 替换）。

schema_version = 1

# ══════════════════════════════════════════════════════════════════════════
# PROJECT: z42 自身的版本（release tag 必须与此一致）
# ══════════════════════════════════════════════════════════════════════════
#
# Bumping 流程：
#   1. 改本字段 → 跑 `xtask check versions`
#   2. drift 报错 → 同步更新 src/runtime/Cargo.toml [workspace.package].version
#   3. commit → git tag v<version> → push --tags
#   4. .github/workflows/release.yml 自动触发跨平台 SDK package publish

[project]
version = "0.7.0"                       # → Cargo.toml [workspace.package].version

# ══════════════════════════════════════════════════════════════════════════
# TOOLCHAIN: 跨平台 build 工具（每台 dev/CI 机都要装）
# ══════════════════════════════════════════════════════════════════════════

[toolchain.rust]
channel     = "stable"
min_version = "1.95"                    # MSRV；cranelift 0.135 requires 1.95+; scripts/install/xtask_install.z42 的 rust 检查校它
components  = ["rustfmt", "clippy"]
# rust_targets 由各 [platform.*] 汇总

[toolchain.node]
min_version = "22"
# wasm tests / playwright 需要；verify-only
version = "24.21.0"   # Active LTS "Krypton"; `xtask setup --os wasm`（及 wasm 测试缺 node 时）下载此版本到 artifacts/tools/node

[toolchain.z42]
# z42-bootstrap: which prebuilt z42 launcher package
# scripts/install-z42.{sh,bat,command} downloads into <repo>/.z42.
#   "nightly" → tag nightly, re-download when the nightly release changes
#   "0.1.0"   → tag v0.1.0, download once (immutable)
launcher = "nightly"

# ══════════════════════════════════════════════════════════════════════════
# BUILD: 每平台 native SDK / 工具
# ══════════════════════════════════════════════════════════════════════════

[build.android]
jdk_min      = "17"
install_root = "artifacts/tools/android-sdk"

[build.android.ndk]
# 实际安装走 sdkmanager（`--install ndk;<version>`），sdkmanager 对照 Google
# repository manifest 自校验下载——无需仓库层 sha256。下面 url/sha256 仅供未来
# 直接下载路径使用（当前 install 路径不读）。路径类值（install_root 等）一律相对**仓库根**。
version = "30.0.16248370"
release = "r30"                         # Google release 别名（URL 用它）
url     = "https://dl.google.com/android/repository/android-ndk-r30-{os}.zip"
sha256  = ""                            # Google 只发 sha1；in-repo install 用 sdkmanager 自校验

[build.android.sdk]
platform           = "android-37.0"     # compileSdk；API 37 只有 .0 有 4K 页模拟器镜像（.1/.2 仅 ps16k），且包名必须带 .0
build_tools        = "37.0.0"             # AGP 9.4 最低 36.0.0
cmdline_tools_url  = "https://dl.google.com/android/repository/commandlinetools-{os}-16111833_latest.zip"
# cmdline-tools 每个 host 一个 zip → 每个 host 一个 sha256（build 16111833 = 23.0）。
# 自 build 16111833 起 Mac 包按 CPU 拆分，{os} = mac_arm64 / mac_x86_64 / linux（旧的单一 mac 包已 404）。
cmdline_tools_sha256_mac_arm64  = "58da8f215781cc0208743e88b65ae259780c55e7eb40e50373d377cf369232d6"
cmdline_tools_sha256_mac_x86_64 = "7e601c04e7173754b3d051a87bb4c3a8243c65a9d7bfa9356ed6499fb8953fa3"
cmdline_tools_sha256_linux      = "0877a1d048fe4a24efe2eff536ca4223f7adeb58648bb81909d33c446918cfa8"
gradle             = "9.7.1"            # AGP 9.4 需要 Gradle ≥ 9.6；与 platform/gradle/wrapper 同版本；`test app android run` 用到 emulator tier 时下载
gradle_sha256      = "acd53f1edaf02f1a8ff99879f8a34b302661a057d9b063ae9e35b552f804d20a"   # OS 无关 zip（services.gradle.org 官方 .sha256）
system_image_tag   = "google_apis_playstore;{abi}"   # AVD system image；{abi} = 宿主架构（Apple silicon / arm64 → arm64-v8a，x64 → x86_64：模拟器只能跑本机架构的镜像）
avd_name           = "z42_pixel6_api37"
avd_device         = "pixel_6"

[build.ios]
xcode_min          = "16.0"             # 真比较（`xtask setup` / `setup check` 低于即 warning）；16 = swift-tools 6.0 / Swift 6 语言模式的下限。CI 用 macos-26 镜像默认 Xcode（26.x）
extra_rust_targets = ["aarch64-apple-darwin"]   # `swift test` host slice (跑 unit tests，不是部署 target)

[build.wasm]
wasm_pack_min   = "0.12"
wasm_tools_min  = "1.0"     # Bytecode Alliance wasm-tools CLI (validate + print); CI: cargo install wasm-tools --locked
# rust target wasm32-unknown-unknown 在 [platform.wasm].rust_targets

# ══════════════════════════════════════════════════════════════════════════
# PLATFORM: z42 产物的运行时支持承诺
# ══════════════════════════════════════════════════════════════════════════
#
# Tier 约定（rust platform-support 风格）：
#   tier1 — CI 全 stage 跑（build + test）；release 阻塞项
#   tier2 — CI 编译过；release "supported"，不一定全测
#   tier3 — best-effort；社区维护
#
# 每块带 `→ <文件>` 注释 = drift-check 对账目标。

[platform.android]
min_api      = 23                       # → build.gradle.kts minSdk
target_api   = 37                       # → build.gradle.kts compileSdk
rust_targets = ["aarch64-linux-android", "x86_64-linux-android"]
abis         = ["arm64-v8a", "x86_64"]                         # gradle 命名（cargo ndk -t 用这套）；32-bit ABI 已退场
tier         = "tier2"

[platform.ios]
min_ios      = "16.0"                   # → Package.swift .iOS(.v16); IPHONEOS_DEPLOYMENT_TARGET for cargo builds
min_macos    = "13.0"                   # → Package.swift .macOS(.v13)
rust_targets = ["aarch64-apple-ios", "aarch64-apple-ios-sim"]
tier         = "tier2"

[platform.wasm]
rust_targets     = ["wasm32-unknown-unknown"]
browser_baseline = "chromium-stable, firefox-stable, safari>=15"
tier             = "tier2"

[platform.linux]
# 实测值，不是愿望值：Linux 包在 ubuntu-latest（glibc 2.39）上构建，产物的**硬**版本需求是 GLIBC_2.34
# （__libc_start_main / pthread_* / dl* 在 2.34 换了符号版本）。还会出现 GLIBC_2.39（pidfd_spawnp /
# pidfd_getpid），但那是 Rust std 的弱引用（verneed flag 0x02 WEAK），旧 glibc 上照样加载。
# → 打包的结构门（scripts/package/xtask_package_layout.z42 :: _plGlibc）对账。
# 要真降到 2.31，得换更老的构建环境（容器 / cargo-zigbuild 指定 glibc），不是改这一行。
# 按架构分开：linux-arm64 的产物在 CI（ubuntu-24.04-arm）上实测对 GLIBC_2.39 有**硬**需求。
min_glibc       = "2.34"   # linux-x64
min_glibc_arm64 = "2.39"   # linux-arm64
rust_targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
tier         = "tier1"

[platform.macos]
min_version  = "13.0"
rust_targets = ["aarch64-apple-darwin"]    # arm64 only; Intel (x86_64-apple-darwin) dropped
tier         = "tier1"

[platform.windows]
min_version  = "10.0"
rust_targets = ["x86_64-pc-windows-msvc"]    # MSVC toolchain (from VS Build Tools / Visual Studio)
tier         = "tier1"

# ══════════════════════════════════════════════════════════════════════════
# WORKLOAD: workload 枚举
# ══════════════════════════════════════════════════════════════════════════
#
# 「有哪些 workload」的单一真相源——xtask 的 `test app` / `package *` / `setup --os`
# 参数校验、release 索引的 workload 清单都从这里读，不在代码里另抄名单。
# desktop = 宿主 workload（复用宿主 runtime：无 appbuilder、无独立 runtime 包）；
# 其余为跨平台 workload（= `setup --os` 的参数域）。
# release 索引里另有一个 `test` 伪 workload（测试 bundle 的归档名），它不是平台、不进本表。
[workload]
members = ["desktop", "ios", "android", "wasm"]

# ══════════════════════════════════════════════════════════════════════════
# RID: 目标 RID 登记（xtask `_ridToCargo` / `_ridCategory` / release 归档矩阵的唯一来源）
# ══════════════════════════════════════════════════════════════════════════
#
# 加一个 RID = 这里加一段，xtask 各处（打包分发、release 索引、--archive 汇总）自动跟上；
# 不在表里的 RID 一律按 unknown 处理。字段：
#   triple   — cargo --target 三元组
#   category — desktop（SDK + 桌面 runtime + 宿主 workload）| ios | android | wasm
#              （跨平台类别名与 [workload].members / [build.*] 一致）
#   primary  — 平台 workload 归档的主 RID：同一平台的 tooling 包各 ABI 内容相同，归档只由
#              主 RID 出（`_relPrimaryWorkload`），两个主 RID 会在 release 汇总同名相撞。
# triple ↔ [platform.*].rust_targets 双向对账（`xtask check versions`）：platform 由 rid 推出
# （category != desktop 时 = category；desktop RID = 名字首段，如 linux-x64 → linux）。
# 反向要求 platform 的每个 rust_target 都有 RID 登记——新增 target 不登记则 CI 编得出、xtask 打不出包。
# ⚠️ .github/workflows/release.yml 的 matrix 是本表的另一份投影（GitHub 无法直接读 toml），
# 两处须同步改；对账门只覆盖 toml 侧。

[rid.linux-x64]
triple   = "x86_64-unknown-linux-gnu"
category = "desktop"

[rid.linux-arm64]
triple   = "aarch64-unknown-linux-gnu"
category = "desktop"

[rid.macos-arm64]
triple   = "aarch64-apple-darwin"
category = "desktop"

[rid.windows-x64]
triple   = "x86_64-pc-windows-msvc"
category = "desktop"

[rid.ios-arm64]
triple   = "aarch64-apple-ios"
category = "ios"
primary  = true

[rid.iossim-arm64]
triple   = "aarch64-apple-ios-sim"
category = "ios"

[rid.android-arm64]
triple   = "aarch64-linux-android"
category = "android"
primary  = true

[rid.android-x64]
triple   = "x86_64-linux-android"
category = "android"

[rid.browser-wasm]
triple   = "wasm32-unknown-unknown"
category = "wasm"
primary  = true
