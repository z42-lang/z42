# 站点根（mdBook）——三本书的分流索引，只有一页。
#
# 三本书各自是独立的 mdBook，构建到本站的子目录：
#   /            docs/book      ← 本文件
#   /learn/      docs/learn
#   /reference/  docs/reference
#   /internals/  docs/internals
# 见 .github/workflows/deploy-book.yml。
#
# 本地渲染：cargo install mdbook 后，在本目录跑  mdbook serve --open

[book]
title = "z42 文档"
authors = ["z42"]
language = "zh"
src = "src"

[output.html]
default-theme = "rust"
preferred-dark-theme = "ayu"
smart-punctuation = true
# 只有一页，侧边目录没有意义
additional-css = ["theme/no-sidebar.css"]
